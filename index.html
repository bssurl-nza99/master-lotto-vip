        }else{
            const c=v34ConditionalUnits(values,digit,30);
            const cp=v34PairEvidence(values,digit,u);
            const ctx=v34ContextUnitEvidence(records,mode,u);
            const tr=v34TransitionUnitEvidence(records,mode,u);
            const n=c.nAll;
            /* Shrink conditional estimates toward the global unit distribution. */
            const condRaw=(c.all[u]+2*globalUnit[u])/(n+2);
            const recentRaw=(c.recent[u]+2*globalUnit[u])/(c.nRecent+2);
            evidence={
                cond:condRaw,
                recent:recentRaw,
                global:globalUnit[u],
                pair:cp.longP,
                recentPair:cp.recentP,
                context:ctx.score,
                transition:tr.score,
                support:Math.min(1,n/18)
            };
        }

        /* Convert heterogeneous signals to rank space. Raw probabilities alone
           can overweight a high-frequency but poorly conditional unit. */
        rows.push({pair,u,evidence});
    }

    const keys=['cond','recent','global','pair','recentPair','context','transition'];
    const ranks={};
    keys.forEach(k=>{
        const ordered=[...rows].sort((a,b)=>b.evidence[k]-a.evidence[k]||a.u-b.u);
        ranks[k]=Array(10).fill(0);
        ordered.forEach((r,i)=>{ranks[k][r.u]=1-i/9;});
    });

    rows.forEach(r=>{
        const e=r.evidence;
        /*
           Conditional evidence is primary. Recent pair evidence is secondary.
           Context/transition are deliberately capped through rank weighting.
        */
        const W=v34ActiveWeights(mode);
        let score=
            W[0]*ranks.cond[r.u] +
            W[1]*ranks.recent[r.u] +
            W[2]*ranks.pair[r.u] +
            W[3]*ranks.recentPair[r.u] +
            W[4]*ranks.global[r.u] +
            W[5]*ranks.context[r.u] +
            W[6]*ranks.transition[r.u];
        /* Evidence-strength shrinkage: sparse conditional samples move toward
           the global rank rather than being allowed to dominate. */
        score=score*(.78+.22*e.support);
        r.score=score;
    });
    rows.sort((a,b)=>b.score-a.score||a.u-b.u);
    return rows.slice(0,5).map(x=>x.pair);
}


/* v3.4 mode-specific evidence weights.
   These are fixed at prediction time; target-day outcomes are never consulted. */
function v34ActiveWeights(mode){
    if(mode==='lunch') return [.42,.20,.12,.08,.08,.05,.05];
    if(mode==='evening') return [.26,.16,.12,.10,.10,.18,.08];
    return [.42,.20,.12,.08,.08,.05,.05];
}

function v34Prediction(records,mode){
    const pp=buildPairProbability(records,mode);
    const top=v34TopDigits(records,mode,pp);
    v34CurrentMode=mode; v34CurrentWeights=v34ActiveWeights(mode);
    const used=new Set();
    const groups=top.digits.map(d=>{
        const g=v34RankGroup(records,mode,+d,pp,used);
        g.forEach(x=>used.add(x));
        return g;
    });
    return {
        t1:top.digits[0],t2:top.digits[1],t3:top.digits[2],
        pairsT1:groups[0],pairsT2:groups[1],pairsT3:groups[2],
        pairProbability:pp,topDigitProbability:top.probabilities,
        learnedProfile:{top:'v3.4-hybrid-evidence',pair:'evidence-calibrated',selector:'fixed-evidence-weights',profileIndex:null,validationRates:null},
        pairRanker:'v3.4-evidence-calibrated',
        targetDate:getNextTargetDate(records[records.length-1].date)
    };
}

/* v3.4 override: one-pass training-prefix model. No target-day information. */
function analyzePrecisionEngineInternal(records,mode){
    if(!records||!records.length)return {t1:'0',t2:'1',t3:'2',pairsT1:[],pairsT2:[],pairsT3:[],targetDate:'Next Date',pairRanker:'v3.4-evidence-calibrated'};

}

function modelStrategyLabel(mode){
    if(mode==='allday') return 'v3.4 Evidence-Calibrated Pair Ranker + All-Day dual-round evidence';
    if(mode==='lunch') return 'v3.4 Evidence-Calibrated Pair Ranker + Lunch conditional evidence';
    return 'v3.4 Evidence-Calibrated Pair Ranker + Evening conditional/context evidence';

/* ============================================================

   Accuracy logic is intentionally identical to v3.4. The change is
   computational: repeated long/recent counts and context evidence are

    const context=Array.from({length:10},()=>Array(10).fill(.1));

            for(let u=0;u<10;u++){
                let score=1,n=0;
                for(let i=1;i<records.length;i++){
                    const src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
                    const tgt=mode==='lunch'?records[i].lunch:records[i].evening;
                    if(!isValid2D(src)||!isValid2D(tgt))continue;
                    const sd=[Number(src[0]),Number(src[1])]; let w=0;
                    if(src===context2 || (sd[0]===cd[0]&&sd[1]===cd[1]))w=1;
                    else if(sd[0]===cd[0]||sd[1]===cd[1])w=.35;
                    else if(sd.includes(cd[0])||sd.includes(cd[1]))w=.15;
                    if(w){if(Number(tgt[1])===u)score+=w;n+=w;}

                let ts=1,tn=0;
                for(let i=1;i<records.length;i++){
                    const src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
                    const tgt=mode==='lunch'?records[i].lunch:records[i].evening;
                    if(!isValid2D(src)||!isValid2D(tgt))continue;
                    const sd=[Number(src[0]),Number(src[1])]; let w=0;
                    if(sd[0]===cd[0]&&sd[1]===cd[1])w=1;
                    else if(sd[0]===cd[0]||sd[1]===cd[1])w=.35;
                    if(w){if(Number(tgt[1])===u)ts+=w;tn+=w;}
                }
                transition[0][u]=ts/Math.max(1,tn+1);
            }
        }
    }
    return {values,recentN,allByDigit,recentByDigit,nByDigit,recentNByDigit,longPair,recentPair,globalUnit,context:context[0],transition:transition[0]};
}

function v35RankGroup(cache,mode,digit,used){

<script>
/* ============================================================
   v3.6 STRUCTURED TOP-3 / PAIR QUOTA ENGINE
   ------------------------------------------------------------
   เปลี่ยนเฉพาะ logic การจัดชุด 15 คู่ + นิยาม Top3 ใน audit
   UI / card / round names คงเดิม

   หลักการ:
   1) Top3 ใช้ signal ได้ทั้งหลักสิบ/หน่วยตามเดิม
   2) แต่เวลาสร้าง 15 คู่ Top digit = หลักสิบเท่านั้น

      - ไม่ใช่เลขเบิ้น

   4) คู่ protected จะเข้ามาได้ก็ต่อเมื่อ evidence สูงจริง
   5) ห้าม reverse pair ซ้ำในชุด 15 คู่ เช่น 12 กับ 21

function v36Normalize10(a){
    const s=a.reduce((x,y)=>x+y,0);

}
function v36Rank10(a){
    const out=Array(10).fill(0);
    [...a].map((v,i)=>({v,i})).sort((x,y)=>y.v-x.v||x.i-y.i)
      .forEach((x,k)=>out[x.i]=1-k/9);
    return out;
}
function v36Rank100(a){
    const out=Array(100).fill(0);
    [...a].map((v,i)=>({v,i})).sort((x,y)=>y.v-x.v||x.i-y.i)
      .forEach((x,k)=>out[x.i]=1-k/99);

function v36SmoothedConditional(values,digit,limit,alpha){

<script>
/* ============================================================
   v8.3 RESEARCH LAYER — FINAL OVERRIDE
   ------------------------------------------------------------
   Objectives
   1) One final prediction layer, so earlier historical overrides
      cannot silently change the active engine.
   2) Top-3 digit selection is learned from multiple independent
      experts using walk-forward validation inside the training set.
   3) Pair ranking uses calibrated conditional evidence, recency,
      context and reverse-awareness.
   4) All-Day uses joint lunch/evening evidence rather than treating
      the two rounds as one undifferentiated stream.
   5) Exactly 5 pairs per Top digit (15 total), sorted numerically.
   6) No Top-digit-vs-Top-digit pairs.

    if(m==='evening') return r.evening;

  }

  function seq(rs,m){
    if(m==='allday') return [rs.map(r=>r.lunch),rs.map(r=>r.evening)];

  function digitCounts(rs,m,windowSize,decay){

        if(valid(prev.evening)&&valid(cur.evening))out[tens(cur.evening)]+=0.5;

      [Math.max(WARM,end-45),end-20,1.25],

    const pairable=Array(10).fill(0);

      for(let i=0;i<src.length;i++){
        const r=src[i], age=src.length-1-i;
        const vals=m==='allday'?[r.lunch,r.evening]:[modeValue(r,m)];
        vals.forEach(v=>{if(valid(v)&&tens(v)===d)cnt[unit(v)]+=Math.exp(-age/tau);});
      }

      for(let u=0;u<10;u++)out[u]+=wt*(cnt[u]/z);

  }

  function predict(rs,m){

        }
      }

      g.forEach(x=>{const a=+x, rev=(a%10)*10+Math.floor(a/10); used.add(a); used.add(rev);});
      groups.push(g.slice(0,PAIRK));

      t1:String(td[0]),t2:String(td[1]),t3:String(td[2]),topThree:td.map(String),
      pairsT1:groups[0]||[],pairsT2:groups[1]||[],pairsT3:groups[2]||[],pairs,
      pairRanker:V,
      learnedProfile:{top:'9-expert soft ensemble + 3-block OOS selector',selectedProfile:top.meta.id+1,validationTop3Rates:top.meta.rates?top.meta.rates.map(x=>+(100*x).toFixed(2)):null,weights:top.meta.weights.map(x=>+x.toFixed(4)),pair:'4-window calibrated conditional + context + reverse-aware',allocation:'exact 3x5; no Top-digit cross-pairs; doubles gated'},

    const N=Math.max(0,rs.length-WARM);

<script>
/* ============================================================
   MM2D Precision Engine v9.1 — Research-Calibrated Mode Profiles
   Final research decision after v9.0 nested-meta benchmark:
   - Nested selector was rejected because it reduced the supplied-history
     benchmark, especially pair precision.
   - v9.1 uses compact mode-specific profiles with a strict structural
     portfolio and a deeper audit split.
   - These profiles are research-calibrated on the supplied history;
     the UI must not present the benchmark as a guarantee.
   ============================================================ */
(function(){
  const V='v9.1',K=5,WARM=60,HOLDOUT=80;
  const valid=v=>typeof isValid2D==='function'?isValid2D(v):/^\d{2}$/.test(String(v||''));
  const tens=v=>Number(String(v)[0]),units=v=>Number(String(v)[1]),pad=v=>String(v).padStart(2,'0');
  const value=(r,m)=>m==='lunch'?r.lunch:r.evening;
  const norm=a=>{const s=a.reduce((x,y)=>x+y,0);return s>0?a.map(x=>x/s):a.map(()=>1/a.length)};
  function topDist(rs,m,kind,w,decay){
    const c=Array(10).fill(1),a=rs.slice(-Math.min(w,rs.length)),n=a.length;
    a.forEach((r,i)=>{const q=kind==='freq'?1:Math.exp(-(n-1-i)/decay);const vs=m==='allday'?[r.lunch,r.evening]:[value(r,m)];vs.forEach(v=>{if(valid(v))c[tens(v)]+=q;});});return norm(c);
  }
  function pairDist(rs,m,kind,w,decay){
    const c=Array(100).fill(1),a=rs.slice(-Math.min(w,rs.length)),n=a.length;
    a.forEach((r,i)=>{const q=kind==='freq'?1:Math.exp(-(n-1-i)/decay);const vs=m==='allday'?[r.lunch,r.evening]:[value(r,m)];vs.forEach(v=>{if(valid(v))c[Number(v)]+=q;});});return norm(c);
  }
  function profile(m){
    if(m==='lunch')return {top:['freq',90,0],pair:['freq',10,0],name:'Lunch: Top90 frequency + Pair10 frequency'};
    if(m==='evening')return {top:['freq',15,0],pair:['freq',60,0],name:'Evening: Top15 frequency + Pair60 frequency'};
    return {top:['freq',60,0],pair:['freq',45,0],name:'All-Day: joint Top60 frequency + Pair45 frequency'};
  }
  function doubleGate(rs,m,d){
    const a=rs.slice(-Math.min(45,rs.length));let den=0,num=0;
    a.forEach(r=>{const vs=m==='allday'?[r.lunch,r.evening]:[value(r,m)];vs.forEach(v=>{if(valid(v)&&tens(v)===d){den++;if(units(v)===d)num++;}});});

  }
  function selectPairs(rs,m,tops,pd){

      const cand=[];

        if(u!==d&&tops.includes(u))continue;
        if(u===d&&!doubleGate(rs,m,d))continue;
        const x=d*10+u,rev=u*10+d;if(used.has(x)||used.has(rev))continue;
        cand.push({x,score:Number(pd[x])||0});
      }
      cand.sort((a,b)=>b.score-a.score||a.x-b.x);

      }

  }
  function predict91(rs,m){
    if(!rs||!rs.length)return {t1:'0',t2:'1',t3:'2',pairsT1:[],pairsT2:[],pairsT3:[],pairs:[],topThree:['0','1','2'],topDigitProbability:Array(10).fill(.1),pairProbability:Array(100).fill(.01),engineProfile:V};
    const p=profile(m),td=topDist(rs,m,...p.top),tops=td.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v||a.i-b.i).slice(0,3).map(x=>x.i),pd=pairDist(rs,m,...p.pair),g=selectPairs(rs,m,tops,pd);

  }
  window.analyzePrecisionEngineInternal=predict91;
  window.modelStrategyLabel=m=>m==='allday'?V+' Joint All-Day Research Profile':V+' Mode-Specific Research Profile';
  window.V91_ENGINE_VERSION=V;
  window.generateCardHTML=function(title,roundTextBurmese,data){
    const scoreTop=d=>Math.min(100,60+(Number(data.topDigitProbability?.[Number(d)])||0)*100),scorePair=p=>Math.min(100,50+(Number(data.pairProbability?.[Number(p)])||0)*100),f=x=>x.toFixed(2)+'%';
    const row=a=>(a||[]).map(p=>`<div class="pair-box"><div>${p}</div><div class="pair-prob">${f(scorePair(p))}</div></div>`).join('');
    const top=(d,c,l)=>`<div class="top-item"><div class="top-circle ${c}">${d}</div><span class="top-label">${l}</span><span class="top-prob">${f(scoreTop(d))}</span></div>`;
    return `<div class="card-header"><div class="card-title-area"><span class="flag">🇲🇲</span><div class="title-text"><h3><span class="mm2d-strike">MM2D</span></h3><div class="time-badge">${roundTextBurmese}</div></div></div><div class="date-badge">🗓️ ${data.targetDate||''}</div></div><div class="top-container">${top(data.t1,'top-1-circle','Top 1')}${top(data.t2,'top-2-circle','Top 2')}${top(data.t3,'top-3-circle','Top 3')}</div><div class="section-group row-1"><div class="section-title">Top 1</div><div class="grid-pairs">${row(data.pairsT1)}</div></div><div class="section-group row-2"><div class="section-title">Top 2</div><div class="grid-pairs">${row(data.pairsT2)}</div></div><div class="section-group row-3"><div class="section-title">Top 3</div><div class="grid-pairs">${row(data.pairsT3)}</div></div>`;

  }

  window.generateAccuracySummaryHTML=function(rs,l,e,a){const f=v=>v==null?'—':Number(v).toFixed(2)+'%';return `<div class="accuracy-summary-title">📈 Precision Audit — ${V}</div><div class="accuracy-grid"><div class="accuracy-box"><div class="accuracy-box-title">Top3 Lunch</div><div class="accuracy-box-value">${f(l.top3DayAcc)}</div><div class="accuracy-box-sub">walk-forward · target 35%</div></div><div class="accuracy-box"><div class="accuracy-box-title">Top3 Evening</div><div class="accuracy-box-value">${f(e.top3DayAcc)}</div><div class="accuracy-box-sub">walk-forward · target 35%</div></div><div class="accuracy-box"><div class="accuracy-box-title">Top3 All-Day</div><div class="accuracy-box-value">${f(a.top3DayAcc)}</div><div class="accuracy-box-sub">day coverage · target 60%</div></div><div class="accuracy-box"><div class="accuracy-box-title">15 Pair All-Day</div><div class="accuracy-box-value">${f(a.pairHitAcc)}</div><div class="accuracy-box-sub">baseline 27.75%</div></div></div>`;};
  window.generateAuditTableHTML=function(name,a){if(!a||!a.total)return '';const f=v=>v==null?'—':Number(v).toFixed(2)+'%';const h=a.holdout||{};return `<div class="audit-title">📊 Deep Audit ${V}: ${name}</div><table class="audit-table"><tr><th>ตัวชี้วัด</th><th>Walk-forward</th><th>Late holdout</th></tr><tr><td>OOS observations</td><td><b>${a.total}</b></td><td><b>${h.n||0}</b></td></tr><tr><td>15-pair hit</td><td><b>${f(a.pairHitAcc)}</b></td><td><b>${f(h.pairHit)}</b></td></tr><tr><td>Pair lift</td><td><b>${a.pairLift.toFixed(3)}×</b></td><td>baseline ${a.baselinePair.toFixed(2)}%</td></tr><tr><td>Top3 coverage</td><td><b>${f(a.top3DayAcc)}</b></td><td><b>${f(h.top3)}</b></td></tr><tr><td>Top1 / Top2 / Top3</td><td><b>${f(a.top1DayAcc)} / ${f(a.top2DayAcc)} / ${f(a.top3DayAcc)}</b></td><td><b>${f(h.top1)} / ${f(h.top2)} / ${f(h.top3)}</b></td></tr><tr><td>95% CI Top3</td><td>${a.topCI.low}% – ${a.topCI.high}%</td><td>${h.topCI?`${h.topCI.low}% – ${h.topCI.high}%`:'—'}</td></tr><tr><td>95% CI Pair</td><td>${a.pairCI.low}% – ${a.pairCI.high}%</td><td>${h.pairCI?`${h.pairCI.low}% – ${h.pairCI.high}%`:'—'}</td></tr><tr><td>Avg hit rank</td><td>${a.avgRank??'—'}</td><td>${h.avgRank??'—'}</td></tr><tr><td>Profile</td><td colspan="2"><b>${a.profile}</b></td></tr><tr><td>Rule</td><td colspan="2"><b>PASS</b> · ซ้าย = เที่ยง · ขวา = เย็น · no future data · no Top-cross · no reverse</td></tr></table>`;};
