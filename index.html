    // -------------------------
    // Input normalization / mapping

    function normalizeTitle(text) {
        return String(text || '')
            .replace(/^\uFEFF/, '')
            .replace(/หวย/g, '')
            .replace(/[|｜]/g, ' ')
            .replace(/[\u00A0\u200B\u200C\u200D]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();
    }

    function mapRawNameToInternalKey(rawTitle) {
        const clean = normalizeTitle(rawTitle);
        if (!clean) return null;

        // 1) Exact canonical-name match has absolute priority.
        for (const key in CARD_CATALOG) {
            if (normalizeTitle(CARD_CATALOG[key].name) === clean) return key;
        }

        // Common spelling aliases. Keep this list explicit so one title cannot
        // silently fall through into the previous lottery's state.
        const aliases = {
            'ประชาชนลาว': 'prachachon_lao',
            'ประชาชน ลาว': 'prachachon_lao',
            'นิคเคอิ ปกติ เช้า': 'nikkei_normal_am',
            'นิคเคอิ ปกติ บ่าย': 'nikkei_normal_pm',
            'นิคเคอิ เช้า': 'nikkei_normal_am',
            'นิคเคอิ บ่าย': 'nikkei_normal_pm',
            'นิกเคอิ ปกติ เช้า': 'nikkei_normal_am',
            'นิกเคอิ ปกติ บ่าย': 'nikkei_normal_pm',
            'นิกเคอิ เช้า': 'nikkei_normal_am',
            'นิกเคอิ บ่าย': 'nikkei_normal_pm'
        };
        if (aliases[clean]) return aliases[clean];

        const has = (s) => clean.includes(s);
        const vip = has('vip');

        if (has('หุ้นไทย') || has('ไทย')) {
            if (has('รัฐบาล')) return 'thai_gov';
            if (has('เช้า')) return 'thai_am';
            if (has('เที่ยง')) return 'thai_noon';
            if (has('บ่าย')) return 'thai_pm';
            if (has('เย็น')) return 'thai_eve';
            if (has('ทั้งวัน')) return 'thai_allday';
        }

        if (has('นิคเคอิ') || has('นิกเคอิ')) {
            if (has('เช้า')) return vip ? 'nikkei_vip_am' : 'nikkei_normal_am';
            if (has('บ่าย') || has('เที่ยง')) return vip ? 'nikkei_vip_pm' : 'nikkei_normal_pm';
            return vip ? 'nikkei_vip_pm' : 'nikkei_normal_pm';
        }

        if (has('ประชาชน') && has('ลาว')) return 'prachachon_lao';

        if (has('ลาว')) {
            if (has('ประตูชัย')) return 'lao_pratoochai';
            if (has('สันติภาพ')) return 'lao_santiphap';
            if (has('สามัคคี')) return vip ? 'lao_samakkhi_vip' : 'lao_samakkhi';
            if (has('สตาร์')) return vip ? 'lao_star_vip' : 'lao_star';
            if (has('เช้า')) return 'lao_am';
            if (has('กาชาด')) return 'lao_kachad';
            if (has('extra')) return 'lao_extra';
            if (has('ทีวี')) return 'lao_tv';
            if (has('อาเซียน')) return 'lao_asean';
            if (has('hd')) return 'lao_hd';
            if (has('พิเศษ')) return 'lao_phiset';
            if (has('พัฒนา') || has('พัท')) return 'lao_phatthanakan';
            if (vip) return 'lao_vip';
            return null;
        }

        if (has('ฮานอย')) {
            if (has('เช้า')) return 'hanoi_am';
            if (has('สามัคคี')) return 'hanoi_samakkhi';
            if (has('ดึก')) return 'hanoi_night';
            if (has('สตาร์')) return 'hanoi_star';
            if (vip) return 'hanoi_vip';
            if (has('อาเซียน')) return 'hanoi_asean';
            if (has('ทีวี')) return 'hanoi_tv';
            if (has('extra')) return 'hanoi_extra';
            if (has('เฉพาะกิจ')) return 'hanoi_chaphakid';
            if (has('พัฒนา')) return 'hanoi_phatthana';
            if (has('hd')) return 'hanoi_hd';
            if (has('พิเศษ')) return 'hanoi_phiset';
            if (has('กาชาด')) return 'hanoi_kachad';
            if (has('4d')) return 'hanoi_4d';
            return 'hanoi_normal';
        }

        if (has('จีน')) {
            if (has('เช้า')) return vip ? 'china_vip_am' : 'china_normal_am';

    // -------------------------
    // Date helpers

    function isLotteryHoliday(internalKey, dateObj) {
        const dayOfWeek = dateObj.getDay();
        const catalogItem = CARD_CATALOG[internalKey];
        if (!catalogItem) return (dayOfWeek === 0 || dayOfWeek === 6);
        return !catalogItem.drawDays.includes(dayOfWeek);
    }

    function getNextTargetDate(topDateStr, internalKey) {
        if (!topDateStr) return "18 ก.ย. 69";
        const cleanStr = String(topDateStr).replace('🗓', '').replace('📅', '').trim();
        const parts = cleanStr.replace(/\./g, '').split(/\s+/);
        if (parts.length >= 3) {
            const day = parseInt(parts[0], 10);
            let year = parseInt(parts[2], 10);
            if (!Number.isFinite(day) || !Number.isFinite(year)) return cleanStr;
            if (year < 100) year += 2500;
            if (year < 2500) year += 543;
            const monthMap = { 'มค':0,'กพ':1,'มีค':2,'เมย':3,'พค':4,'มิย':5,'กค':6,'สค':7,'กย':8,'ตค':9,'พย':10,'ธค':11 };
            const monthStr = parts[1] ? parts[1].replace(/\./g, '').trim() : 'กย';
            const mIndex = monthMap[monthStr] !== undefined ? monthMap[monthStr] : 8;
            const targetDateObj = new Date(year - 543, mIndex, day);
            do { targetDateObj.setDate(targetDateObj.getDate() + 1); } while (isLotteryHoliday(internalKey, targetDateObj));
            const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${targetDateObj.getDate()} ${thaiMonths[targetDateObj.getMonth()]} ${(targetDateObj.getFullYear()+543).toString().slice(-2)}`;
        }
        return cleanStr;
    }

    function evaluatePrediction(target,prediction){

    function scoreStrategyOnHistory(chron,strategy){

    }

      if(!scored.length)return{strategy:cloneStrategy(STRATEGY_POOL[0]),method:'stable-default',candidates:[]};
      scored.sort((a,b)=>b.score.composite-a.score.composite||b.score.digitRate-a.score.digitRate||b.score.pairRate-a.score.pairRate||a.strategy.id.localeCompare(b.strategy.id));

    function buildOOSAudit(records){

    function summarizePairRates(audit,pairs){return(pairs||[]).map(pair=>{const tests=audit.pairTestsByPair[pair]||0,hits=audit.pairHitByPair[pair]||0;return{pair,tests,hits,rate:pctNum(hits,tests)};});}

    // -------------------------
    // Robust block parser
    // -------------------------
    function isTopLine(line) { return /^\d{3}$/.test(line); }
    function isBottomLine(line) { return /^\d{2}$/.test(line); }
    function isHeaderLine(line) { return line.includes('|') || line.includes('｜'); }

    function parseLotteryBlocks(rawText) {
        const normalizedText = String(rawText || '').replace(/\r\n?/g,'\n').replace(/\uFEFF/g,'');
        const lines = normalizedText.split('\n').map(l => l.trim());
        const blocks = [];
        const unrecognizedHeaders = [];
        const malformedBlocks = [];
        let currentBlock = null;

        function closeBlock() {
            if (!currentBlock) return;
            blocks.push(currentBlock);
            currentBlock = null;
        }

        for (let i=0; i<lines.length; i++) {
            const line = lines[i];
            if (!line) continue;

            if (line.includes('งดออกผล')) {
                if (currentBlock) currentBlock.notes.push(`งดออกผล (บรรทัด ${i+1})`);
                continue;
            }

            if (isHeaderLine(line)) {
                closeBlock();
                const parts = line.split(/[|｜]/);
                const rawName = parts[0].trim();
                const key = mapRawNameToInternalKey(rawName);
                if (!key) {
                    if (!unrecognizedHeaders.includes(rawName)) unrecognizedHeaders.push(rawName);
                    currentBlock = { key:null, rawName, date:parts[1] ? parts[1].trim() : '', records:[], startLine:i+1, notes:['ไม่รู้จักหัวข้อ จึงกันข้อมูลบล็อกนี้ออกจากทุกหวย'] };
                } else {
                    currentBlock = { key, rawName, date:parts[1] ? parts[1].trim() : '', records:[], startLine:i+1, notes:[] };
                }
                continue;
            }

            if (isTopLine(line)) {
                if (!currentBlock) continue;
                if (currentBlock.pendingTop !== undefined) {
                    currentBlock.notes.push(`เลข 3 หลัก ${currentBlock.pendingTop} ไม่มีเลข 2 หลักคู่กัน (บรรทัด ${i+1})`);
                }
                currentBlock.pendingTop = line;
                continue;
            }

            if (isBottomLine(line)) {
                if (!currentBlock) continue;
                if (currentBlock.pendingTop === undefined) {
                    currentBlock.notes.push(`พบเลข 2 หลัก ${line} โดยไม่มีเลข 3 หลักก่อนหน้า (บรรทัด ${i+1})`);
                    continue;
                }
                currentBlock.records.push({ date:currentBlock.date, top:currentBlock.pendingTop, bottom:line, sourceLine:i+1 });
                delete currentBlock.pendingTop;
                continue;
            }

            // Any other text inside a known block is retained as a diagnostic,
            // but NEVER changes the active lottery.
            if (currentBlock) currentBlock.notes.push(`ข้ามข้อความไม่ใช่ผลลัพธ์: "${line}" (บรรทัด ${i+1})`);
        }
        closeBlock();

        // Finalize pending top warnings and build clean groups.
        const groups = {};
        const blockDiagnostics = [];
        for (const block of blocks) {
            if (block.pendingTop !== undefined) block.notes.push(`เลข 3 หลัก ${block.pendingTop} ไม่มีเลข 2 หลักคู่กัน (ท้ายบล็อก)`);
            if (!block.key) {
                blockDiagnostics.push(block);
                continue;
            }
            if (!groups[block.key]) groups[block.key] = [];
            groups[block.key].push(...block.records);
            blockDiagnostics.push(block);
        }

        // Valid source history is 25–30 rounds.
        // 25/26/27/28/29/30 are all valid; only outside this range is flagged.
        const integrity = [];
        for (const key of Object.keys(groups)) {
            const count = groups[key].length;
            const catalog = CARD_CATALOG[key];
            let status = 'ok';
            if (count < ENGINE_CONFIG.MIN_VALID_RECORDS) status = 'insufficient';
            else if (count > ENGINE_CONFIG.MAX_VALID_RECORDS) status = 'excess';
            integrity.push({
                key,

        // how many other lotteries are pasted around them.

    function makeFingerprint(records) {

        let hash = 2166136261;
        for (let i=0; i<canonical.length; i++) {

            hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(16).toUpperCase().padStart(8,'0');

    function buildIntegrityHTML(parsed) {
      const rows=parsed.integrity.map(x=>{
        if(x.derived){
          return `<li>✓ <b>${escapeHTML(x.name)}</b> — ${x.count} งวด <span class="small-note">ชุดสังเคราะห์ · DATA-ID ${x.fingerprint}</span></li>`;
        }

      const main=bad.length
        ? `<div class="warning-box"><b>⚠️ ตรวจสอบความสมบูรณ์ของข้อมูล</b><ul class="integrity-list">${rows}</ul><div class="small-note">ระบบรองรับข้อมูลย้อนหลัง ${ENGINE_CONFIG.MIN_VALID_RECORDS}–${ENGINE_CONFIG.MAX_VALID_RECORDS} งวดต่อประเภท และจะใช้จำนวนงวดที่มีจริงในการทำ Walk-Forward Audit</div></div>`
        : `<div class="ok-box"><b>✓ Data Integrity ผ่าน</b><ul class="integrity-list">${rows}</ul><div class="small-note">ข้อมูลย้อนหลัง ${ENGINE_CONFIG.MIN_VALID_RECORDS}–${ENGINE_CONFIG.MAX_VALID_RECORDS} งวดถือว่าถูกต้องทั้งหมด ระบบใช้จำนวนงวดที่มีจริงในการทำ Walk-Forward Audit</div></div>`;

    }
    function escapeHTML(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    function renderPairCells(stats){return(stats||[]).map(x=>`<div class="pair-box"><span>${escapeHTML(x.pair)}</span><span class="pair-percent">${x.rate==null?'—':x.rate.toFixed(1)+'%'}</span></div>`).join('');}
    function generateCardHTML(canonicalName,data,flagIcon){
      const r1=data.audit.top1Acc==null?'—':data.audit.top1Acc.toFixed(1)+'%',r2=data.audit.top2Acc==null?'—':data.audit.top2Acc.toFixed(1)+'%';
      return `<div class="card-header"><div class="card-title-area"><span class="flag">${flagIcon}</span><div class="title-text"><h3>${escapeHTML(canonicalName)}</h3></div></div><div class="date-badge">🗓️ ${escapeHTML(data.targetDate)}</div></div><div class="top-container"><div class="top-item"><div class="top-circle top-1-circle">${data.t1}</div><span class="top-label">เด่น</span><span class="top-percent">${r1}</span></div><div class="top-item"><div class="top-circle top-2-circle">${data.t2}</div><span class="top-label">รอง</span><span class="top-percent">${r2}</span></div></div><div class="section-group row-1"><div class="section-title">ชุดเด่น</div><div class="grid-pairs">${renderPairCells(data.pairStatsT1)}</div></div><div class="section-group row-2"><div class="section-title">ชุดรอง</div><div class="grid-pairs">${renderPairCells(data.pairStatsT2)}</div></div>`;
    }
    function generateAuditTableHTML(roundName,audit){
      const m=auditToTableModel(audit);return `<div class="audit-title">📊 OOS Audit จากข้อมูลจริง (${escapeHTML(roundName)}) · ทดสอบ ${m.total} งวด · ไม่มีการใช้ข้อมูลงวดเป้าหมาย/อนาคต</div><table class="audit-table"><tr><th>ประเภท</th><th>ผลงาน (เข้า/หลุด)</th><th>สูงสุดต่อเนื่อง</th><th>OOS Accuracy</th><th>ภาพรวม</th></tr><tr><td><b>เลขเด่น</b></td><td>เข้า ${m.digitHits} / หลุด ${m.digitMisses}</td><td><span style="color:#27ae60;">เข้า ${m.digitMaxWin}</span> / <span style="color:#c0392b;">หลุด ${m.digitMaxLoss}</span></td><td><b>${m.digitAcc}</b></td><td rowspan="2" style="background:#f4efe4;font-weight:700;color:#3d312a;font-size:11px;vertical-align:middle;">60/40<br>${m.composite==null?'—':m.composite.toFixed(2)+'%'}</td></tr><tr><td><b>เลขเจาะ</b></td><td>เข้า ${m.pairHits} / หลุด ${m.pairMisses}</td><td><span style="color:#27ae60;">เข้า ${m.pairMaxWin}</span> / <span style="color:#c0392b;">หลุด ${m.pairMaxLoss}</span></td><td><b>${m.pairAcc}</b></td></tr></table><div class="small-note">Pair = exact ordered match · เปอร์เซ็นต์คู่เลขนับเฉพาะคู่ที่ถูกเสนอจริงใน OOS · ไม่ใช่การรับประกันผล</div>`;
    }
    function generateGlobalAuditHTML(g,results,rawRecordCount){
      const rows=results.map(x=>{const a=x.audit;return `<tr><td style="text-align:left">${escapeHTML(x.name)}</td><td>${a.tests}</td><td>${a.digitHits}/${a.tests}</td><td>${a.digitAcc==null?'—':a.digitAcc.toFixed(2)+'%'}</td><td>${a.pairHits}/${a.tests}</td><td>${a.pairAcc==null?'—':a.pairAcc.toFixed(2)+'%'}</td><td>${a.composite==null?'—':a.composite.toFixed(2)+'%'}</td></tr>`}).join('');
      return `<div class="audit-section" style="margin-top:18px;"><div class="audit-title">🌐 Global OOS Audit — รวมทุกประเภทที่ประมวลผล</div><div class="small-note">ประเภทตรรกะ ${g.logicalProcessedCount}/67 · งวดดิบ ${rawRecordCount} · OOS tests ${g.totalTests} · หุ้นไทยทั้งวันเป็นชุดสังเคราะห์จาก 4 รอบ จึงอาจทับซ้อนกับข้อมูลดิบรายรอบ</div><table class="audit-table"><tr><th>เลขเด่น</th><th>เลขเจาะ</th><th>ภาพรวม 60/40</th><th>Top1</th><th>Top2</th></tr><tr><td><b>${g.digitRate==null?'—':g.digitRate.toFixed(2)+'%'}</b><br>${g.totalDigitHits}/${g.totalTests}</td><td><b>${g.pairRate==null?'—':g.pairRate.toFixed(2)+'%'}</b><br>${g.totalPairHits}/${g.totalTests}</td><td><b>${g.composite==null?'—':g.composite.toFixed(2)+'%'}</b></td><td>${g.totalTop1Hits}/${g.totalTests}</td><td>${g.totalTop2Hits}/${g.totalTests}</td></tr></table><div style="overflow:auto;margin-top:10px"><table class="audit-table"><tr><th style="text-align:left">ประเภท</th><th>OOS</th><th>เด่น เข้า</th><th>เด่น %</th><th>เจาะ เข้า</th><th>เจาะ %</th><th>60/40</th></tr>${rows}</table></div><div class="small-note">Global percentage = hits ÷ tests จาก OOS ledger จริง ไม่ใช่ค่าเฉลี่ยของเปอร์เซ็นต์รายประเภท</div></div>`;
    }

    function captureCard(wrapperId, filenamePrefix) {
        const wrapperElement = document.getElementById(wrapperId);
        const btnCapture = wrapperElement.querySelector('.btn-capture');
        btnCapture.style.display = 'none';
        html2canvas(wrapperElement,{scale:3,useCORS:true,backgroundColor:'#fbf8f2'}).then(canvas=>{ btnCapture.style.display='flex'; const link=document.createElement('a'); link.download=`${filenamePrefix}_${Date.now()}.png`; link.href=canvas.toDataURL('image/png'); link.click(); }).catch(()=>{ btnCapture.style.display='flex'; alert('เกิดข้อผิดพลาดในการบันทึกภาพ'); });
    }

    function processAllLotteries(){
      const rawText=document.getElementById('dataInput').value.trim();if(!rawText){alert('กรุณากรอกข้อมูลสถิติก่อนทำการประมวลผล');return;}
      const parsed=parseLotteryBlocks(rawText),groups=parsed.groups,container=document.getElementById('resultContainer');container.innerHTML=buildIntegrityHTML(parsed);container.style.display='block';
      const thaiSubKeys=['thai_am','thai_noon','thai_pm','thai_eve'],combined=[];thaiSubKeys.forEach(k=>{if(groups[k]?.length)combined.push(...groups[k]);});
      if(combined.length){
        groups.thai_allday=combined;
        const sourceCounts=thaiSubKeys.map(k=>groups[k]?.length||0).filter(Boolean);
        const item={key:'thai_allday',name:CARD_CATALOG.thai_allday.name,count:combined.length,sourceCounts,status:'ok',fingerprint:makeFingerprint(combined),derived:true};
        const old=parsed.integrity.find(x=>x.key==='thai_allday');
        if(old)Object.assign(old,item);else parsed.integrity.push(item);
      }
      container.innerHTML=buildIntegrityHTML(parsed);const keys=Object.keys(groups);if(!keys.length){if(!parsed.unrecognizedHeaders.length)alert('ไม่พบรูปแบบข้อมูลสถิติที่ถูกต้อง กรุณาตรวจสอบหัวข้อและรูปแบบเลข 3 หลัก/2 หลัก');return;}
      const results=[];let i=0;
      keys.forEach(key=>{const cat=CARD_CATALOG[key];if(!cat)return;const records=groups[key].filter(r=>validTop(r)&&validBottom(r));if(!records.length)return;const data=analyzePrecisionEngine(records,key);data.audit.ledger.forEach(row=>row.type=key);const wrap=`wrapCard_${i}`,safe=cat.name.replace(/[^\u0E00-\u0E7F\w-]+/g,'_');results.push({key,name:cat.name,records,...data});container.innerHTML+=`<div class="card-wrapper" id="${wrap}"><button class="btn-capture" onclick="captureCard('${wrap}','${escapeHTML(safe)}')">📷 แคปภาพ</button><div class="card">${generateCardHTML(cat.name,data,cat.flag)}</div></div><div class="audit-section">${generateAuditTableHTML(cat.flag+cat.name,data.audit)}</div>`;i++;});
      const global=buildGlobalAudit(results),rawCount=results.reduce((s,x)=>s+x.records.length,0);container.innerHTML+=generateGlobalAuditHTML(global,results,rawCount);const src=results.map(x=>`${x.key}:${makeFingerprint(x.records)}`).sort().join('|');const gf=makeFingerprint([{date:src,top:'000',bottom:'00'}]);container.innerHTML+=`<div class="small-note" style="margin-top:10px;text-align:center">GLOBAL DATA-ID ${gf} · Engine v3.8 · OOS audit-first · ไม่รับประกันผล</div>`;
    }

</script>
