<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE VOID - สงคราม 1 บาท</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030305; color: #fff; font-family: monospace; }
        .glow-red { box-shadow: 0 0 40px rgba(255, 0, 0, 0.4); }
        .glass { background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.4; } }
        .void-bg { animation: pulse-slow 5s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between items-center p-4 select-none relative overflow-x-hidden">

    <!-- พื้นหลัง -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-950/20 via-black to-black void-bg pointer-events-none"></div>

    <!-- ส่วนหัว -->
    <header class="relative z-10 text-center space-y-1 mt-4">
        <h1 class="text-3xl font-black tracking-widest text-red-600 drop-shadow-[0_0_15px_rgba(255,0,0,0.6)]">THE VOID</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest">เริ่มต้นความไร้สาระแค่ 1 บาท</p>
    </header>

    <!-- ส่วนกลาง: บัลลังก์ปัจจุบัน -->
    <main class="relative z-10 flex flex-col items-center justify-center space-y-5 text-center my-auto w-full max-w-sm">
        
        <!-- การ์ดแสดงราชาปัจจุบัน -->
        <div class="glass w-full rounded-3xl p-5 space-y-3 border border-red-500/30 shadow-xl relative overflow-hidden">
            <div id="price-badge" class="absolute top-3 right-3 bg-red-600/20 text-red-400 text-[9px] px-2 py-0.5 rounded-full border border-red-500/30">ราคา: 1 THB</div>
            <div class="text-[11px] text-red-400 font-bold uppercase tracking-wider text-left">👑 ผู้ครองบัลลังก์ปัจจุบัน</div>
            
            <div class="flex flex-col items-center space-y-2 pt-2">
                <div class="w-20 h-20 rounded-full bg-neutral-900 border-2 border-red-500 overflow-hidden shadow-[0_0_20px_rgba(255,0,0,0.5)] flex items-center justify-center">
                    <span class="text-3xl">🕳️</span>
                </div>
                <div>
                    <h2 id="king-name" class="text-lg font-black text-white">ยังไม่มีใครเปิดประเดิม</h2>
                    <a id="king-link" href="#" target="_blank" class="text-xs text-cyan-400 underline hidden">🔗 ช่องทางโปรโมทส่วนตัว</a>
                </div>
            </div>
        </div>

        <!-- ปุ่มกด -->
        <button onclick="conquerForOneBaht()" class="w-44 h-44 rounded-full bg-gradient-to-b from-red-600 to-red-950 text-white font-black text-lg tracking-wider glow-red border-4 border-red-500 active:scale-95 transition transform flex flex-col items-center justify-center space-y-1 cursor-pointer">
            <span>ยึดบัลลังก์</span>
            <span id="btn-price" class="text-xs font-normal text-red-200">1 THB เท่านั้น!</span>
        </button>

        <p class="text-[10px] text-gray-500 max-w-xs leading-relaxed">
            *จ่ายแค่บาทเดียวก็ขึ้นครองโลกได้ ลองกดทดสอบดูความลื่นไหลของระบบได้เลยครับ*
        </p>
    </main>

    <!-- ส่วนท้าย: ทำเนียบผู้กล้า -->
    <footer class="relative z-10 w-full max-w-sm glass rounded-2xl p-3 text-center space-y-2 mb-2">
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">📜 ทำเนียบความไร้สาระล่าสุด</div>
        <div id="hall-of-fame" class="text-xs text-gray-400 italic">
            ยังไม่มีประวัติการบันทึก
        </div>
    </footer>

    <!-- จาวาสคริปต์จำลองระบบ 1 บาท -->
    <script>
        let currentPrice = 1;

        function conquerForOneBaht() {
            document.getElementById('king-name').innerText = "ท่านผู้กล้า (จ่าย 1 บาทประเดิม)";
            document.getElementById('hall-of-fame').innerText = `🔥 มีคนจ่าย ${currentPrice} บาท ยึดบัลลังก์สำเร็จ!`;
            
            // เพิ่มราคาเป็นเท่าตัวในรอบถัดไปจำลองความเดือด
            currentPrice *= 2;
            document.getElementById('price-badge').innerText = `ราคา: ${currentPrice} THB`;
            document.getElementById('btn-price').innerText = `${currentPrice} THB`;

            alert(`🎉 จ่าย ${currentPrice / 2} บาทสำเร็จ! คุณขึ้นครองบัลลังก์แล้ว รอบต่อไปราคาจะขยับเป็น ${currentPrice} บาท!`);
        }
    </script>
</body>
</html>
