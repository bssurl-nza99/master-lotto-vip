<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Research Desk v21 Smart Engine — Exponential Decay & Positional Matrix</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#17212b;--muted:#667085;--line:#e3e7ed;--accent:#176b5b;--noon:#1d4ed8;--eve:#7c3aed;--gold:#a86612;--red:#b42318;--green:#087443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
.wrap{max-width:1250px;margin:auto;padding:22px 16px 42px}
header{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:16px 20px;border-radius:16px;border:1px solid var(--line);margin-bottom:16px}
.title{font-size:21px;font-weight:800}.sub{color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:#fff;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px #10182805;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 6px}
textarea{width:100%;height:280px;resize:vertical;border:1px solid #ccd3dd;border-radius:10px;padding:12px;font:13px/1.6 monospace;background:#fcfcfd}
button{font:inherit;border-radius:99px;padding:10px 16px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--ink);font-weight:700}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button:hover{opacity:.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:11px}
.metric b{font-size:20px;display:block;line-height:1.2}
.metric span{font-size:12px;color:var(--muted)}
.grid-3col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.session-box{border:1px solid var(--line);border-radius:12px;padding:14px;background:#f8fafc}
.session-box.noon{border-top:4px solid var(--noon)}
.session-box.eve{border-top:4px solid var(--eve)}
.session-box.all{border-top:4px solid var(--gold)}
.session-title{font-size:15px;font-weight:800;margin-bottom:8px}
.session-title.noon{color:var(--noon)}.session-title.eve{color:var(--eve)}.session-title.all{color:var(--gold)}
.tag-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-weight:800;font-size:14px;font-family:monospace}
.tag.main{border-color:#38bdf8;color:#0284c7;background:#f0f9ff;font-size:16px}
.tag.tens{border-color:#bfdbfe;color:#1e40af}
.tag.ones{border-color:#fbcfe8;color:#be185d}
.pair-sec{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.pair-sec-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pair-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pair-item{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:4px;padding:6px 2px;text-align:center;font-weight:800;font-family:monospace;font-size:13px}
.tablewrap{overflow:auto;max-height:380px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#f8fafc;color:#475467}
.hit{color:var(--green);font-weight:750}.miss{color:var(--red);font-weight:750}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media(max-width:900px){.layout,.grid-3col{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

  <div class="pill">v21 Production Engine</div>
</header>
