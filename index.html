<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บ้าน ทรัพย์นำโชค - ระบบคำนวณหวยอัจฉริยะระดับ VIP</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #12141a;
            --panel-border: #1e222d;
            --gold: #c5a059;
            --gold-light: #dfc285;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-green: rgba(46, 204, 113, 0.15);
            --border-green: #2ecc71;
            --accent-gold: rgba(197, 160, 89, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--gold);
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        header p {
            color: var(--text-muted);
            font-size: 11px;
        }

        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .control-panel label {
            display: block;
            color: var(--gold-light);
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #08090c;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: 1px solid var(--gold);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8.6px 18px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        .btn-process {
            background: var(--gold);
            color: #000;
        }

        .btn-process:hover {
            background: var(--gold-light);
        }

        .btn-clear {
            background: #1e222d;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
        }

        .btn-clear:hover {
            background: #2a2f3d;
            color: var(--text-main);
        }

        /* Results Layout */
        #results-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .category-section {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 15px;
        }

        .category-title {
            color: var(--gold);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 15px;
        }

        @media(max-width: 1100px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Output Card Style */
        .output-card {
            background: #08090c;
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .output-card .date {
            color: var(--gold-light);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .output-card .cat-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .output-card .main-digit {
            font-size: 22px;
            color: #2ecc71;
            font-weight: bold;
            margin: 8px 0;
        }

        .output-card .divider {
            color: var(--text-muted);
            margin: 6px 0;
            letter-spacing: -1px;
        }

        .output-card .pairs {
            font-size: 12px;
            margin: 4px 0;
            letter-spacing: 0.5px;
        }

        .output-card .triad {
            font-size: 12px;
            color: var(--gold-light);
            margin: 8px 0;
        }

        .output-card .footer-id {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 10px;
        }

        .output-card .footer-house {
            color: var(--gold);
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Tables Styling */
        .tables-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-x: auto;
        }

        .table-box {
            background: #08090c;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px;
        }

        .table-title {
            color: var(--gold-light);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 5px 8px;
            text-align: center;
            border-bottom: 1px solid var(--panel-border);
            font-size: 11px;
        }

        th {
            background: #161922;
            color: var(--gold);
            font-weight: 600;
        }

        td {
            color: var(--text-main);
        }

        /* Highlights */
        .rank-1 {
            background-color: var(--accent-green) !important;
            border: 1px solid var(--border-green);
            color: #2ecc71;
            font-weight: bold;
        }

        .rank-2 {
            background-color: var(--accent-gold) !important;
            color: var(--gold-light);
            font-weight: bold;
        }

        .rank-3 {
            background: rgba(255,255,255,0.03);
        }

        .badge-hit {
            color: #2ecc71;
            font-weight: bold;
        }

        .badge-miss {
            color: #e74c3c;
        }

        .window-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .window-btn {
            background: #161922;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }

        .window-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>บ้าน ทรัพย์นำโชค</h1>
        <p>ระบบคำนวณสถิติหวยและหุ้นอัจฉริยะ (Pure Mathematical & Walk-Forward Analysis)</p>
    </header>

    <div class="control-panel">
        <label for="input-data">กรอกข้อมูลสถิติหวย (แยกแต่ละประเภทด้วยการเว้น 1 บรรทัด):</label>
        <textarea id="input-data" placeholder="ตัวอย่าง:

ลาวพัฒนา | 15 ต.ค. 69

        <div class="btn-group">
            <button class="btn-process" onclick="processLotteryData()">ประมวลผล</button>
            <button class="btn-clear" onclick="clearAllData()">ล้างสถิติ</button>
        </div>
    </div>

    <div id="results-container">
        <div class="no-data">ยังไม่มีข้อมูลการประมวลผล กรุณากรอกสถิติและกดปุ่ม "ประมวลผล"</div>
    </div>
</div>

<script>
    const THAI_MONTHS = {
        "ม.ค.": 1, "ก.พ.": 2, "มี.ค.": 3, "เม.ย.": 4, "พ.ค.": 5, "มิ.ย.": 6,
        "ก.ค.": 7, "ส.ค.": 8, "ก.ย.": 9, "ต.ค.": 10, "พ.ย.": 11, "ธ.ค.": 12
    };

    function getFlag(category) {
        if (category.includes("จีน")) return "🇨🇳";
        if (category.includes("ลาว")) return "🇱🇦";
        if (category.includes("ฮั่งเส็ง")) return "🇭🇰";
        if (category.includes("นิเคอิ") || category.includes("นิคเคอิ")) return "🇯🇵";
        if (category.includes("ดาวโจนส์")) return "🇺🇸";
        if (category.includes("รัสเซีย")) return "🇷🇺";
        if (category.includes("เยอรมัน")) return "🇩🇪";
        if (category.includes("อังกฤษ")) return "🇬🇧";
        if (category.includes("ไต้หวัน") || category.includes("ได้หวัน")) return "🇹🇼";
        if (category.includes("เกาหลี")) return "🇰🇷";
        if (category.includes("สิงคโปร์")) return "🇸🇬";
        if (category.includes("มาเลย์")) return "🇲🇾";
        if (category.includes("ไทย")) return "🇹🇭";
        return "🌐";
    }

    function parseThaiDate(dateStr) {
        const pattern = /(\d{1,2})\s+([ก-ฮa-zA-Z\.]+)\s+(\d{2,4})/;
        const match = dateStr.match(pattern);
        if (!match) return null;
        const day = parseInt(match[1]);
        const month = THAI_MONTHS[match[2]] || 1;
        let year = parseInt(match[3]);
        if (year < 100) year += 2500;
        return new Date(year - 543, month - 1, day);
    }

    function formatNextDate(lastDateStr) {
        const dateObj = parseThaiDate(lastDateStr);
        if (!dateObj) return "วันถัดไป";
        dateObj.setDate(dateObj.getDate() + 1);
        
        const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        const d = dateObj.getDate();
        const m = months[dateObj.getMonth()];
        const y = (dateObj.getFullYear() + 543) % 100;
        return `${d} ${m} ${y}`;
    }

    class LotteryRecord {
        constructor(category, rawDate, top3d, bottom2d, isCancelled = false, note = "") {
            this.category = category.trim();
            this.rawDate = rawDate.trim();
            this.parsedDate = parseThaiDate(rawDate);
            this.top3d = top3d ? top3d.padStart(3, '0') : null;
            this.bottom2d = bottom2d ? bottom2d.padStart(2, '0') : null;
            this.isCancelled = isCancelled;
            this.note = note;
        }

        getScoringDigits() {
            if (this.isCancelled || !this.top3d || !this.bottom2d) return new Set();
            return new Set([
                this.top3d[1], this.top3d[2], // สิบ, หน่วย บน
                this.bottom2d[0], this.bottom2d[1] // สิบ, หน่วย ล่าง
            ]);
        }
    }

    function parseRawText(text) {
        const blocks = text.split(/\n\s*\n/);
        let records = [];

        blocks.forEach(block => {
            const lines = block.split("\n").map(l => l.trim()).filter(l => l);
            let currentCat = "";
            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                if (line.includes("|")) {
                    const parts = line.split("|");
                    currentCat = parts[0].trim();
                    const rawDate = parts[1].trim();
                    
                    if (i + 1 < lines.length) {
                        const next1 = lines[i + 1];
                        if (next1.includes("งดออกผล") || next1.includes("หยุด") || next1.includes("ปิด")) {
                            records.push(new LotteryRecord(currentCat, rawDate, null, null, true, next1));
                            i += 2;
                            continue;
                        }
                        if (next1.length >= 2 && /^\d+$/.test(next1) && i + 2 < lines.length && /^\d+$/.test(lines[i+2])) {
                            records.push(new LotteryRecord(currentCat, rawDate, next1, lines[i+2], false));
                            i += 3;
                            continue;
                        }
                    }
                }
                i++;
            }
        });
        return records;
    }

    function calculateFormulas(rec) {
        if (rec.isCancelled || !rec.top3d || !rec.bottom2d) return {};
        const r_hun = parseInt(rec.top3d[0]);
        const r_sib = parseInt(rec.top3d[1]);
        const r_หน่วย = parseInt(rec.top3d[2]);
        const b_sib = parseInt(rec.bottom2d[0]);
        const b_หน่วย = parseInt(rec.bottom2d[1]);

        const f1 = (r_หน่วย + b_หน่วย) % 10;
        const f2 = (r_sib + b_sib) % 10;
        const f3 = (r_sib + r_hun) % 10;
        const f4 = (r_hun + r_sib + r_หน่วย) % 10;
        const f5 = (r_hun + r_sib + r_หน่วย + b_sib + b_หน่วย) % 10;

        return {
            "1. หน่วยบน + หน่วยล่าง": [f1, (f1 + 1) % 10],
            "2. สิบบน + สิบล่าง": [f2, (f2 + 1) % 10],
            "3. สิบบน + ร้อยบน": [f3, (f3 + 1) % 10],
            "4. ผลรวม 3 ตัวบน": [f4, (f4 + 1) % 10],
            "5. ผลรวม 5 หลัก": [f5, (f5 + 1) % 10]
        };
    }

    function processLotteryData() {
        const text = document.getElementById("input-data").value;
        const records = parseRawText(text);
        const container = document.getElementById("results-container");
        container.innerHTML = "";

        if (records.length === 0) {
            container.innerHTML = '<div class="no-data">ไม่พบข้อมูลหรือรูปแบบไม่ถูกต้อง กรุณาตรวจสอบข้อมูลอีกครั้ง</div>';
            return;
        }

        const categories = [...new Set(records.map(r => r.category))];

        categories.forEach(cat => {
            const catRecords = records.filter(r => r.category === cat)
                .sort((a, b) => (a.parsedDate || 0) - (b.parsedDate || 0));

            const validRecords = catRecords.filter(r => !r.isCancelled);
            if (validRecords.length === 0) return;

            const latestRec = catRecords[catRecords.length - 1];
            const flag = getFlag(cat);
            const nextDateStr = formatNextDate(latestRec.rawDate);

            // --- Frequency Calculation across Windows ---
            const windows = [3, 5, 10, 15, 20, 25, 30];
            
            // --- Formula Backtesting ---
            const formulaNames = [
                "1. หน่วยบน + หน่วยล่าง",
                "2. สิบบน + สิบล่าง",
                "3. สิบบน + ร้อยบน",
                "4. ผลรวม 3 ตัวบน",
                "5. ผลรวม 5 หลัก"
            ];

            let formulaStats = {};
            formulaNames.forEach(fn => {
                formulaStats[fn] = {
                    windows: {},
                    latestPred: [0, 1]
                };
                windows.forEach(w => {
                    formulaStats[fn].windows[w] = { hits: 0, misses: 0, streakType: null, streakCount: 0, maxHits: 0, maxMisses: 0 };
                });
            });

            // Backtest loop
            for (let i = 0; i < validRecords.length - 1; i++) {
                const cur = validRecords[i];
                const next = validRecords[i + 1];
                const preds = calculateFormulas(cur);
                const allowed = next.getScoringDigits();

                windows.forEach(w => {
                    if (i >= validRecords.length - 1 - w) {
                        formulaNames.forEach(fn => {
                            const [p1, p2] = preds[fn] || [0, 1];
                            const isHit = allowed.has(String(p1)) || allowed.has(String(p2));
                            const st = formulaStats[fn].windows[w];
                            if (isHit) {
                                st.hits++;
                                if (st.streakType === 'HIT') st.streakCount++;
                                else { st.streakType = 'HIT'; st.streakCount = 1; }
                                st.maxHits = Math.max(st.maxHits, st.streakCount);
                            } else {
                                st.misses++;
                                if (st.streakType === 'MISS') st.streakCount++;
                                else { st.streakType = 'MISS'; st.streakCount = 1; }
                                st.maxMisses = Math.max(st.maxMisses, st.streakCount);
                            }
                        });
                    }
                });
            }

            // Latest prediction
            const latestPreds = calculateFormulas(latestRec);
            formulaNames.forEach(fn => {
                if (latestPreds[fn]) formulaStats[fn].latestPred = latestPreds[fn];
            });

            // Find best formula based on win rate in window 10
            let bestFormulaName = formulaNames[0];
            let maxWinRate = -1;
            formulaNames.forEach(fn => {
                const st = formulaStats[fn].windows[10];
                const total = st.hits + st.misses;
                const rate = total > 0 ? (st.hits / total) * 100 : 0;
                if (rate > maxWinRate) {
                    maxWinRate = rate;
                    bestFormulaName = fn;
                }
            });

            const bestPred = formulaStats[bestFormulaName].latestPred;
            const mainDigit = bestPred[0];
            
            // Generate 6 Pairs & 3 Triads based on main digit and frequency
            let pairs = [];
            for (let n = 0; n <= 9; n++) {
                if (n !== mainDigit) {
                    pairs.push(`${Math.min(mainDigit, n)}${Math.max(mainDigit, n)}`.padStart(2, '0'));
                }
            }
            pairs = pairs.slice(0, 6);
            if(pairs.length < 6) pairs = ["01", "12", "23", "34", "45", "56"];

            const triad1 = `${mainDigit}${(mainDigit+1)%10}${(mainDigit+2)%10}`;
            const triad2 = `${(mainDigit+3)%10}${(mainDigit+4)%10}${(mainDigit+5)%10}`;
            const triad3 = `${(mainDigit+6)%10}${(mainDigit+7)%10}${(mainDigit+8)%10}`;

            // --- HTML Rendering ---
            const section = document.createElement("div");
            section.className = "category-section";

            let html = `
                <div class="category-title">${flag} ${cat}</div>
                <div class="grid-layout">
                    <!-- Output Card -->
                    <div class="output-card">
                        <div class="date">📅 ${nextDateStr}</div>
                        <div class="cat-name">${flag} ${cat}</div>
                        <div class="divider">───────</div>
                        <div class="main-digit">✨ ${mainDigit}</div>
                        <div class="divider">───────</div>
                        <div class="pairs">${pairs[0]} — ${pairs[1]} — ${pairs[2]}</div>
                        <div class="pairs">${pairs[3]} — ${pairs[4]} — ${pairs[5]}</div>
                        <div class="divider">────────</div>
                        <div class="triad">${triad1} — ${triad2} — ${triad3}</div>
                        <div class="footer-id">📮 ID : cpu80</div>
                        <div class="footer-house">🪷 บ้าน ทรัพย์นำโชค 🪷</div>
                    </div>

                    <!-- Tables Section -->
                    <div class="tables-wrapper">
                        <!-- Frequency Table 0-9 -->
                        <div class="table-box">
                            <div class="table-title">ตารางความถี่ 0-9 (แยกตำแหน่ง)</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>ตำแหน่ง</th>
                                        ${[...Array(10).keys()].map(n => `<th>${n}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderFrequencyRows(validRecords)}
                                </tbody>
                            </table>
                        </div>

                        <!-- Formula Performance Table -->
                        <div class="table-box">
                            <div class="table-title">ตารางประสิทธิภาพ 5 สูตรคำนวณหลัก (Window: 10 งวด)</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>อันดับ / สูตร</th>
                                        <th>เข้า</th>
                                        <th>หลุด</th>
                                        <th>%</th>
                                        <th>เข้าติดต่อสูงสุด</th>
                                        <th>หลุดติดต่อสูงสุด</th>
                                        <th>สถานะปัจจุบัน</th>
                                        <th>เด่นรอบถัดไป</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderFormulaRows(formulaStats, formulaNames, 10)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            section.innerHTML = html;
            container.appendChild(section);
        });
    }

    function renderFrequencyRows(records) {
        const positions = ['ร้อยบน', 'สิบบน', 'หน่วยบน', 'สิบล่าง', 'หน่วยล่าง'];
        let counts = {
            'ร้อยบน': Array(10).fill(0),
            'สิบบน': Array(10).fill(0),
            'หน่วยบน': Array(10).fill(0),
            'สิบล่าง': Array(10).fill(0),
            'หน่วยล่าง': Array(10).fill(0)
        };

        records.forEach(r => {
            if (r.top3d && r.bottom2d) {
                counts['ร้อยบน'][parseInt(r.top3d[0])]++;
                counts['สิบบน'][parseInt(r.top3d[1])]++;
                counts['หน่วยบน'][parseInt(r.top3d[2])]++;
                counts['สิบล่าง'][parseInt(r.bottom2d[0])]++;
                counts['หน่วยล่าง'][parseInt(r.bottom2d[1])]++;
            }
        });

        return positions.map(pos => {
            const arr = counts[pos];
            const maxVal = Math.max(...arr);
            const sortedVals = [...new Set(arr)].sort((a,b) => b - a);

            return `
                <tr>
                    <td style="text-align: left; font-weight: bold; color: var(--gold-light);">${pos}</td>
                    ${arr.map(val => {
                        let rankClass = "";
                        if (val === sortedVals[0] && val > 0) rankClass = "rank-1";
                        else if (val === sortedVals[1] && val > 0) rankClass = "rank-2";
                        else if (val === sortedVals[2] && val > 0) rankClass = "rank-3";
                        return `<td class="${rankClass}">${val}</td>`;
                    }).join('')}
                </tr>
            `;
        }).join('');
    }

    function renderFormulaRows(stats, names, windowSize) {
        // Sort formulas by win rate
        const evaluated = names.map(fn => {
            const st = stats[fn].windows[windowSize];
            const total = st.hits + st.misses;
            const rate = total > 0 ? (st.hits / total) * 100 : 0;
            return { name: fn, st, rate };
        }).sort((a, b) => b.rate - a.rate);

        return evaluated.map((item, idx) => {
            const { name, st, rate } = item;
            const pred = stats[name].latestPred;
            let rankClass = "";
            if (idx === 0) rankClass = "rank-1";
            else if (idx === 1) rankClass = "rank-2";
            else if (idx === 2) rankClass = "rank-3";

            const streakText = st.streakType ? `${st.streakType === 'HIT' ? 'เข้า' : 'หลุด'} ${st.streakCount} รอบ` : '-';

            return `
                <tr class="${rankClass}">
                    <td style="text-align: left;">#${idx + 1} ${name}</td>
                    <td class="badge-hit">${st.hits}</td>
                    <td class="badge-miss">${st.misses}</td>
                    <td><b>${rate.toFixed(1)}%</b></td>
                    <td>${st.maxHits} รอบ</td>
                    <td>${st.maxMisses} รอบ</td>
                    <td>${streakText}</td>
                    <td><b style="color: var(--gold);">[${pred[0]} - ${pred[1]}]</b></td>
                </tr>
            `;
        }).join('');
    }

    function clearAllData() {
        document.getElementById("input-data").value = "";
        document.getElementById("results-container").innerHTML = '<div class="no-data">ยังไม่มีข้อมูลการประมวลผล กรุณากรอกสถิติและกดปุ่ม "ประมวลผล"</div>';
    }
</script>
