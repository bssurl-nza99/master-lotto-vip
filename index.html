<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างการ์ดวิเคราะห์หวยมินิมอล</title>
    <!-- html2canvas สำหรับแปลงการ์ด HTML เป็น รูปภาพ PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
        .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h2 { color: #1e3a8a; margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; font-size: 22px; }
        
        .setting-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .setting-row div { flex: 1; min-width: 200px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; color: #4b5563; }
        textarea, input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        textarea { height: 140px; font-family: monospace; resize: vertical; }

        .btn-group { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-process { background-color: #2563eb; color: white; }
        .btn-process:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #ef4444; color: white; }
        .btn-clear:hover { background-color: #dc2626; }

        /* ================= CARD DESIGN (ถอดแบบจากรูปเป๊ะๆ) ================= */
        .cards-list { display: flex; flex-direction: column; gap: 30px; margin-top: 25px; }
        
        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .lotto-card-ui {
            width: 580px;
            background-color: #fffdf7;
            border-radius: 28px;
            padding: 28px 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            border: 1px solid #f3ebd8;
            position: relative;
            color: #2c2c2c;
        }

        /* Card Header */
        .card-header-ui { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .flag-icon { font-size: 38px; line-height: 1; }
        .date-text { font-size: 15px; color: #8c8577; font-weight: 500; margin-bottom: 2px; }
        .lotto-title { font-size: 26px; font-weight: 700; color: #222; margin: 0; line-height: 1.2; }
        .brand-badge {
            background-color: #fff8e8;
            border: 1px solid #f3e5c8;
            color: #b8860b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Top Digits Section */
        .main-digits-row { display: flex; justify-content: center; gap: 18px; margin-bottom: 22px; }
        .digit-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #eae5d9;
            border-radius: 40px;
            padding: 6px 24px 6px 8px;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .circle-num {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
        }
        .circle-gold { background: linear-gradient(135deg, #caba55 0%, #b89314 100%); }
        .circle-silver { background: linear-gradient(135deg, #a3aab3 0%, #838a94 100%); }
        .pill-label { font-size: 15px; font-weight: 600; color: #555; }

        /* Pair Boxes Section (10 Pairs Grid) */
        .pairs-container-ui {
            background-color: #fffcf4;
            border: 1px solid #f5ede0;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pairs-row { display: flex; justify-content: space-between; gap: 10px; }
        .pair-box {
            flex: 1;
            background: #ffffff;
            border: 1.5px solid #e8e2d5;
            border-radius: 25px;
            padding: 10px 0;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.015);
        }

        /* Action bar for each card */
        .card-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-download { background-color: #10b981; color: white; }
        .btn-download:hover { background-color: #059669; }
        .btn-copy-text { background-color: #4b5563; color: white; }
        .btn-copy-text:hover { background-color: #374151; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 ระบบสร้างการ์ดสรุปเลขเด่น 2 ตัว (มินิมอล)</h2>
    
    <div class="setting-row">
        <div>
            <label for="customDate">📅 วันที่บนหน้าการ์ด:</label>
            <input type="text" id="customDate">
        </div>
        <div>
            <label for="customBrand">✦ ชื่อแบรนด์มุมขวาบน:</label>
            <input type="text" id="customBrand" value="บ้านเงินกอง">
        </div>
    </div>

    <div class="form-group">
        <label for="rawInput">วางข้อความสถิติหวย (Raw Text):</label>
        <textarea id="rawInput" placeholder="วางข้อความสถิติตามรูปแบบเดิมที่นี่..."></textarea>
    </div>
    
    <div class="btn-group">
        <button class="btn-process" onclick="processData()">⚡ ประมวลผล & สร้างการ์ด visual</button>
        <button class="btn-clear" onclick="clearAll()">🔄 ล้างข้อมูล</button>
    </div>

    <div id="cardsList" class="cards-list">
        <div style="color: #9ca3af; text-align: center; padding: 40px;">ยังไม่มีการ์ดสรุปผล กรุณาวางสถิติหวยแล้วกด "ประมวลผล"</div>
    </div>
</div>

<script>
// ตั้งค่าวันที่เริ่มต้นเป็นวันปัจจุบัน
document.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const yearShort = (today.getFullYear() + 543).toString().slice(-2);
    document.getElementById('customDate').value = `${today.getDate()} ${thaiMonths[today.getMonth()]} ${yearShort}`;
});

function getLottoIcon(name) {
    if (name.includes("ลาว")) return "🇱🇦";
    if (name.includes("ฮานอย")) return "🇻🇳";
    if (name.includes("มาเลย์")) return "🇲🇾";
    if (name.includes("ไทย") || name.includes("หุ้นไทย")) return "🇹🇭";
    if (name.includes("นิเคอิ")) return "🇯🇵";
    if (name.includes("จีน")) return "🇨🇳";
    if (name.includes("ฮั่งเส็ง")) return "🇭🇰";
    if (name.includes("ไต้หวัน")) return "🇹🇼";
    if (name.includes("เกาหลี")) return "🇰🇷";
    if (name.includes("สิงคโปร์")) return "🇸🇬";
    if (name.includes("หุ้น")) return "📈";
    return "🎲";
}

function parseLotteryRawText(text) {
    const lines = text.split('\n');
    const dataset = {};
    let i = 0;
    while (i < lines.length) {
        const line = lines[i].trim();
        if (line.includes('|')) {
            const parts = line.split('|');
            const lottoName = parts[0].trim();
            const dateStr = parts[1] ? parts[1].trim() : '';
            const top3 = lines[i+1] ? lines[i+1].trim() : '';
            const bot2 = lines[i+2] ? lines[i+2].trim() : '';
            if (/^\d{3}$/.test(top3) && /^\d{2}$/.test(bot2)) {
                if (!dataset[lottoName]) dataset[lottoName] = [];
                dataset[lottoName].push({ date: dateStr, digits: (top3 + bot2).split('').map(Number) });
            }
            i += 3;
        } else { i++; }
    }
    return dataset;
}

function calculateTop2Digits(history) {
    const scores = Array(10).fill(0.0);
    const decay = 0.85;
    
    history.forEach((draw, idx) => {
        const w = Math.pow(decay, idx);
        draw.digits.forEach(d => { scores[d] += w; });
    });

    const lastSeen = {};
    history.forEach((draw, idx) => {
        draw.digits.forEach(d => { if (lastSeen[d] === undefined) lastSeen[d] = idx; });
    });

    for (let d = 0; d < 10; d++) {
        const gap = lastSeen[d] !== undefined ? lastSeen[d] : history.length;
        if (gap >= 2 && gap <= 6) scores[d] += 1.5;
    }

    const sorted = scores.map((score, digit) => ({ digit, score })).sort((a, b) => b.score - a.score);
    return {
        topDigits: [sorted[0].digit, sorted[1].digit],
        others: sorted.slice(2).map(item => item.digit)
    };
}

let cardDataStore = [];

function processData() {
    const rawText = document.getElementById('rawInput').value.trim();
    if (!rawText) {
        alert('กรุณาวางข้อความสถิติหวยก่อนกดประมวลผล');
        return;
    }

    const parsedData = parseLotteryRawText(rawText);
    const container = document.getElementById('cardsList');
    container.innerHTML = '';
    cardDataStore = [];

    const lottoNames = Object.keys(parsedData);
    if (lottoNames.length === 0) {
        container.innerHTML = '<div style="color:red; text-align:center;">ไม่พบรูปแบบข้อมูลสถิติที่ถูกต้อง</div>';
        return;
    }

    const displayDate = document.getElementById('customDate').value.trim() || "11 ก.ย. 69";
    const brandName = document.getElementById('customBrand').value.trim() || "บ้านเงินกอง";

    lottoNames.forEach((lottoName, index) => {
        const history = parsedData[lottoName];
        if (history.length < 3) return;

        const { topDigits, others } = calculateTop2Digits(history);
        const dMain = topDigits[0]; // เด่น
        const dSub = topDigits[1];  // รอง

        // คัดเลือกเลขรอง 5 ตัวเพื่อสร้างเลขเจาะ 5 คู่ต่อแถว
        const partners = others.filter(x => x !== dMain && x !== dSub).slice(0, 5).sort((a, b) => a - b);

        // สร้างเลขเจาะแถวที่ 1 (เด่น) 5 คู่ เรียงจากน้อยไปมาก
        const row1Pairs = partners.map(p => `${dMain}${p}`).sort((a,b) => parseInt(a) - parseInt(b));
        // สร้างเลขเจาะแถวที่ 2 (รอง) 5 คู่ เรียงจากน้อยไปมาก
        const row2Pairs = partners.map(p => `${dSub}${p}`).sort((a,b) => parseInt(a) - parseInt(b));

        const flag = getLottoIcon(lottoName);

        // บันทึกข้อมูลไว้ก๊อปปี้แบบข้อความ
        cardDataStore.push({
            name: lottoName,
            text: `📅 ${displayDate}\n${flag} ${lottoName}\n\nเด่น ${dMain} | รอง ${dSub}\n─────────────────\n${row1Pairs.join(' — ')}\n${row2Pairs.join(' — ')}\n\n✦ ${brandName} ✦`
        });

        // สร้าง DOM โครงสร้าง Visual Card ตามภาพเป๊ะๆ
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.innerHTML = `
            <div class="lotto-card-ui" id="card_ui_${index}">
                <div class="card-header-ui">
                    <div class="header-left">
                        <div class="flag-icon">${flag}</div>
                        <div>
                            <div class="date-text">${displayDate}</div>
                            <h3 class="lotto-title">${lottoName}</h3>
                        </div>
                    </div>
                    <div class="brand-badge">✦ ${brandName} ✦</div>
                </div>

                <div class="main-digits-row">
                    <div class="digit-pill">
                        <div class="circle-num circle-gold">${dMain}</div>
                        <div class="pill-label">เด่น</div>
                    </div>
                    <div class="digit-pill">
                        <div class="circle-num circle-silver">${dSub}</div>
                        <div class="pill-label">รอง</div>
                    </div>
                </div>

                <div class="pairs-container-ui">
                    <div class="pairs-row">
                        ${row1Pairs.map(p => `<div class="pair-box">${p}</div>`).join('')}
                    </div>
                    <div class="pairs-row">
                        ${row2Pairs.map(p => `<div class="pair-box">${p}</div>`).join('')}
                    </div>
                </div>
            </div>

            <div class="card-actions">
                <button class="btn-download" onclick="downloadCardImage(${index}, '${lottoName}')">🖼️ บันทึกรูปภาพ (PNG)</button>
                <button class="btn-copy-text" onclick="copyCardText(${index})">📋 คัดลอกข้อความ</button>
            </div>
        `;
        container.appendChild(wrapper);
    });
}

// ฟังก์ชันแปลง HTML Card เป็นรูปภาพ PNG แล้วดาวน์โหลดลงคอม/มือถือ
function downloadCardImage(index, name) {
    const cardElement = document.getElementById(`card_ui_${index}`);
    html2canvas(cardElement, {
        scale: 3, // เพิ่มความคมชัดระดับ HD
        backgroundColor: null
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `การ์ดหวย_${name}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}

function copyCardText(index) {
    const text = cardDataStore[index].text;
    navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกข้อความการ์ดนี้เรียบร้อยแล้ว!');
    });
}

function clearAll() {
    document.getElementById('rawInput').value = '';
    document.getElementById('cardsList').innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 40px;">ยังไม่มีการ์ดสรุปผล กรุณาวางสถิติหวยแล้วกด "ประมวลผล"</div>';
    cardDataStore = [];
}
</script>

</body>
</html>
