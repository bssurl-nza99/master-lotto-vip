/* ============================================================
   v3.5 EVIDENCE-CALIBRATED PAIR ENGINE + FAST AUDIT CACHE
   ------------------------------------------------------------
   จุดประสงค์ของรุ่นนี้:
   1) ใช้ Full Audit v3.3 เป็น baseline จริง ไม่แต่งเปอร์เซ็นต์
   2) รักษา Top 3 architecture เดิม แต่ปรับ "Top 3 -> 15 pairs"
   3) ทุก score ใช้ข้อมูล training prefix เท่านั้น
   4) ไม่ทำ nested meta-selector ระหว่าง backtest เพื่อลดเวลา
   5) ใช้ empirical conditional probability + shrinkage
      เพื่อไม่ให้คู่ที่มี sample น้อยชนะเพียงเพราะ noise
   6) All Day แยก evidence ของ Lunch/Evening แล้วรวมกัน
   7) Top digit ที่แสดงยังคงเป็น Top 3 เดิม และคู่ทุกคู่ใช้ digit
      นั้นเป็นหลักสิบตามข้อกำหนดของระบบ
   ============================================================ */

function v34SafeNormalize(arr){
    const s=arr.reduce((a,b)=>a+b,0);
    return s>0 ? arr.map(x=>x/s) : arr.map(()=>1/arr.length);
}

function v34CountsToProb(counts, alpha){
    const a=counts.map(x=>x+alpha);
    return v34SafeNormalize(a);
}

/* Empirical P(unit | tens=digit), with Bayesian shrinkage toward global units. */
function v34ConditionalUnits(values, digit, recentN){
    const d=Number(digit);
    const all=Array(10).fill(0), recent=Array(10).fill(0);
    let nAll=0, nRecent=0;
    values.forEach(v=>{
        if(!isValid2D(v) || Number(v[0])!==d) return;
        all[Number(v[1])]++; nAll++;
    });
    values.slice(-recentN).forEach(v=>{
        if(!isValid2D(v) || Number(v[0])!==d) return;
        recent[Number(v[1])]++; nRecent++;
    });
    return {all,recent,nAll,nRecent};
}

function v34GlobalUnitProb(values){
    const c=Array(10).fill(0);
    values.forEach(v=>{if(isValid2D(v)) c[Number(v[1])]++;});
    return v34CountsToProb(c,1.0);
}

function v34PairEvidence(values, digit, unit){
    const p=Number(digit)*10+Number(unit);
    const longC=Array(100).fill(0), recentC=Array(100).fill(0);
    values.forEach(v=>{if(isValid2D(v)) longC[parseInt(v,10)]++;});
    values.slice(-30).forEach(v=>{if(isValid2D(v)) recentC[parseInt(v,10)]++;});
    const longN=Math.max(1,values.length), recentN=Math.max(1,Math.min(30,values.length));
    const longP=(longC[p]+1)/(longN+100);
    const recentP=(recentC[p]+1)/(recentN+100);
    let rec=0.2;
    for(let i=0;i<values.length;i++){
        if(isValid2D(values[i]) && parseInt(values[i],10)===p) rec+=Math.pow(.955,values.length-1-i);
    }
    return {longP,recentP,recency:rec};
}

/*
   Context evidence is deliberately modest. Exact context samples are sparse,
   so partial context similarity is used only as a secondary signal.
*/
function v34ContextUnitEvidence(records, mode, unit){
    if(mode==='allday') return {score:.1,n:0};
    if(records.length<2) return {score:.1,n:0};
    const cur=records[records.length-1];
    const context=mode==='lunch'?cur.evening:cur.lunch;
    if(!isValid2D(context)) return {score:.1,n:0};
    const cd=[Number(context[0]),Number(context[1])];
    let score=1, n=0;
    for(let i=1;i<records.length;i++){
        const src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
        const tgt=mode==='lunch'?records[i].lunch:records[i].evening;
        if(!isValid2D(src)||!isValid2D(tgt)) continue;
        const sd=[Number(src[0]),Number(src[1])];
        let w=0;
        if(src===context) w=1;
        else if(sd[0]===cd[0]&&sd[1]===cd[1]) w=1;
        else if(sd[0]===cd[0]||sd[1]===cd[1]) w=.35;
        else if(sd.includes(cd[0])||sd.includes(cd[1])) w=.15;
        if(w){ if(Number(tgt[1])===Number(unit)) score+=w; n+=w; }
    }
    return {score:score/Math.max(1,n+1),n};
}

function v34TransitionUnitEvidence(records, mode, unit){
    if(mode==='allday' || records.length<2) return {score:.1,n:0};
    const cur=records[records.length-1];
    const context=mode==='lunch'?cur.evening:cur.lunch;
    if(!isValid2D(context)) return {score:.1,n:0};
    const cd=[Number(context[0]),Number(context[1])];
    let score=1,n=0;
    for(let i=1;i<records.length;i++){
        const src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
        const tgt=mode==='lunch'?records[i].lunch:records[i].evening;
        if(!isValid2D(src)||!isValid2D(tgt)) continue;
        const sd=[Number(src[0]),Number(src[1])];
        let w=0;
        if(sd[0]===cd[0]&&sd[1]===cd[1]) w=1;
        else if(sd[0]===cd[0]||sd[1]===cd[1]) w=.35;
        if(w){ if(Number(tgt[1])===Number(unit)) score+=w; n+=w; }
    }
    return {score:score/Math.max(1,n+1),n};
}

function v34TopDigits(records, mode, pp){
    /* Keep v2.8/v3.3's pairability-aware top-digit definition for comparability. */
    const bundles=v28BuildBundles(records,mode,pp);
    return v28TopSelector(records,mode,pp,'hybrid',bundles);
}

function v34RankGroup(records, mode, digit, pp, used){
    const values=mode==='allday'?getValues(records,'allday'):getValues(records,mode);
    const globalUnit=v34GlobalUnitProb(values);
    const rows=[];
    for(let u=0;u<10;u++){
        const pair=`${Number(digit)}${u}`;
        if(used.has(pair)) continue;

        let evidence;
        if(mode==='allday'){
            const vl=getValues(records,'lunch'), ve=getValues(records,'evening');
            const el=v34ConditionalUnits(vl,digit,30), ee=v34ConditionalUnits(ve,digit,30);
            const gl=v34GlobalUnitProb(vl), ge=v34GlobalUnitProb(ve);
            const lp=v34PairEvidence(vl,digit,u), ep=v34PairEvidence(ve,digit,u);
            const allN=el.nAll+ee.nAll;
            /* P(unit|digit) from both rounds, weighted by available evidence. */
            const condAll=(el.all[u]+ee.all[u]+1.0)/(allN+10);
            const condRecent=(el.recent[u]+ee.recent[u]+1.0)/(el.nRecent+ee.nRecent+10);
            const unitBase=(gl[u]+ge[u])/2;
            const pairLong=(lp.longP+ep.longP)/2;
            const pairRecent=(lp.recentP+ep.recentP)/2;
            evidence={
                cond:condAll,
                recent:condRecent,
                global:unitBase,
                pair:pairLong,
                recentPair:pairRecent,
                context:.1,
                transition:.1,
                support:Math.min(1,allN/24)
            };
        }else{
            const c=v34ConditionalUnits(values,digit,30);
            const cp=v34PairEvidence(values,digit,u);
            const ctx=v34ContextUnitEvidence(records,mode,u);
            const tr=v34TransitionUnitEvidence(records,mode,u);
            const n=c.nAll;
            /* Shrink conditional estimates toward the global unit distribution. */
            const condRaw=(c.all[u]+2*globalUnit[u])/(n+2);
            const recentRaw=(c.recent[u]+2*globalUnit[u])/(c.nRecent+2);
            evidence={
                cond:condRaw,
                recent:recentRaw,
                global:globalUnit[u],
                pair:cp.longP,
                recentPair:cp.recentP,
                context:ctx.score,
                transition:tr.score,
                support:Math.min(1,n/18)
            };
        }

        /* Convert heterogeneous signals to rank space. Raw probabilities alone
           can overweight a high-frequency but poorly conditional unit. */
        rows.push({pair,u,evidence});
    }

    const keys=['cond','recent','global','pair','recentPair','context','transition'];
    const ranks={};
    keys.forEach(k=>{
        const ordered=[...rows].sort((a,b)=>b.evidence[k]-a.evidence[k]||a.u-b.u);
        ranks[k]=Array(10).fill(0);
        ordered.forEach((r,i)=>{ranks[k][r.u]=1-i/9;});
    });

    rows.forEach(r=>{
        const e=r.evidence;
        /*
           Conditional evidence is primary. Recent pair evidence is secondary.
           Context/transition are deliberately capped through rank weighting.
        */
        const W=v34ActiveWeights(mode);
        let score=
            W[0]*ranks.cond[r.u] +
            W[1]*ranks.recent[r.u] +
            W[2]*ranks.pair[r.u] +
            W[3]*ranks.recentPair[r.u] +
            W[4]*ranks.global[r.u] +
            W[5]*ranks.context[r.u] +
            W[6]*ranks.transition[r.u];
        /* Evidence-strength shrinkage: sparse conditional samples move toward
           the global rank rather than being allowed to dominate. */
        score=score*(.78+.22*e.support);
        r.score=score;
    });
    rows.sort((a,b)=>b.score-a.score||a.u-b.u);
    return rows.slice(0,5).map(x=>x.pair);
}


/* v3.4 mode-specific evidence weights.
   These are fixed at prediction time; target-day outcomes are never consulted. */
function v34ActiveWeights(mode){
    if(mode==='lunch') return [.42,.20,.12,.08,.08,.05,.05];
    if(mode==='evening') return [.26,.16,.12,.10,.10,.18,.08];
    return [.42,.20,.12,.08,.08,.05,.05];
}

function v34Prediction(records,mode){
    const pp=buildPairProbability(records,mode);
    const top=v34TopDigits(records,mode,pp);
    v34CurrentMode=mode; v34CurrentWeights=v34ActiveWeights(mode);
    const used=new Set();
    const groups=top.digits.map(d=>{
        const g=v34RankGroup(records,mode,+d,pp,used);
        g.forEach(x=>used.add(x));
        return g;
    });
    return {
        t1:top.digits[0],t2:top.digits[1],t3:top.digits[2],
        pairsT1:groups[0],pairsT2:groups[1],pairsT3:groups[2],
        pairProbability:pp,topDigitProbability:top.probabilities,
        learnedProfile:{top:'v3.4-hybrid-evidence',pair:'evidence-calibrated',selector:'fixed-evidence-weights',profileIndex:null,validationRates:null},
        pairRanker:'v3.4-evidence-calibrated',
        targetDate:getNextTargetDate(records[records.length-1].date)
    };
}

/* v3.4 override: one-pass training-prefix model. No target-day information. */
function analyzePrecisionEngineInternal(records,mode){
    if(!records||!records.length)return {t1:'0',t2:'1',t3:'2',pairsT1:[],pairsT2:[],pairsT3:[],targetDate:'Next Date',pairRanker:'v3.4-evidence-calibrated'};
    return v34Prediction(records,mode);
}

function modelStrategyLabel(mode){
    if(mode==='allday') return 'v3.4 Evidence-Calibrated Pair Ranker + All-Day dual-round evidence';
    if(mode==='lunch') return 'v3.4 Evidence-Calibrated Pair Ranker + Lunch conditional evidence';
    return 'v3.4 Evidence-Calibrated Pair Ranker + Evening conditional/context evidence';
}


/* ============================================================
   v3.5 FAST AUDIT CACHE
   ------------------------------------------------------------
   Accuracy logic is intentionally identical to v3.4. The change is
   computational: repeated long/recent counts and context evidence are
   precomputed once per training prefix instead of once per candidate unit.
   This must not alter the prediction set; it only reduces redundant work.
   ============================================================ */
function v35BuildCache(records,mode){
    const values=mode==='allday'?getValues(records,'allday'):getValues(records,mode);
    const recentN=Math.min(30,values.length);
    const allByDigit=Array.from({length:10},()=>Array(10).fill(0));
    const recentByDigit=Array.from({length:10},()=>Array(10).fill(0));
    const nByDigit=Array(10).fill(0), recentNByDigit=Array(10).fill(0);
    const longPair=Array(100).fill(0), recentPair=Array(100).fill(0);
    values.forEach(v=>{
        if(!isValid2D(v))return;
        const p=parseInt(v,10),d=Number(v[0]),u=Number(v[1]);
        longPair[p]++; allByDigit[d][u]++; nByDigit[d]++;
    });
    values.slice(-recentN).forEach(v=>{
        if(!isValid2D(v))return;
        const p=parseInt(v,10),d=Number(v[0]),u=Number(v[1]);
        recentPair[p]++; recentByDigit[d][u]++; recentNByDigit[d]++;
    });
    const globalUnit= v34GlobalUnitProb(values);
    const context=Array.from({length:10},()=>Array(10).fill(.1));
    const transition=Array.from({length:10},()=>Array(10).fill(.1));
    if(mode!=='allday' && records.length>=2){
        const cur=records[records.length-1];
        const context2=mode==='lunch'?cur.evening:cur.lunch;
        if(isValid2D(context2)){
            const cd=[Number(context2[0]),Number(context2[1])];
            for(let u=0;u<10;u++){
                let score=1,n=0;
                for(let i=1;i<records.length;i++){
                    const src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
                    const tgt=mode==='lunch'?records[i].lunch:records[i].evening;
                    if(!isValid2D(src)||!isValid2D(tgt))continue;
                    const sd=[Number(src[0]),Number(src[1])]; let w=0;
                    if(src===context2 || (sd[0]===cd[0]&&sd[1]===cd[1]))w=1;
                    else if(sd[0]===cd[0]||sd[1]===cd[1])w=.35;
                    else if(sd.includes(cd[0])||sd.includes(cd[1]))w=.15;
                    if(w){if(Number(tgt[1])===u)score+=w;n+=w;}

<script>
/* ============================================================
   v3.6 STRUCTURED TOP-3 / PAIR QUOTA ENGINE
   ------------------------------------------------------------
   เปลี่ยนเฉพาะ logic การจัดชุด 15 คู่ + นิยาม Top3 ใน audit

   หลักการ:
   1) Top3 ใช้ signal ได้ทั้งหลักสิบ/หน่วยตามเดิม
   2) แต่เวลาสร้าง 15 คู่ Top digit = หลักสิบเท่านั้น
   3) 5 คู่/Top digit ต้องให้ "core partner" ก่อน

      - ไม่ใช่ unit ที่เป็น Top3 ตัวอื่น
   4) คู่ protected จะเข้ามาได้ก็ต่อเมื่อ evidence สูงจริง
   5) ห้าม reverse pair ซ้ำในชุด 15 คู่ เช่น 12 กับ 21
   6) ใช้ empirical conditional P(unit | tens) + recency + pair/context

function v36Normalize10(a){

function v36SmoothedConditional(values,digit,limit,alpha){

    const c=Array(10).fill(alpha);

    src.forEach(v=>{
        if(!isValid2D(v)||Number(v[0])!==digit)return;

function v36Normalize100(a){

    const values=getValues(records,mode);
    const recent=values.slice(-30);
    const medium=values.slice(-60);
    const cAll=v36SmoothedConditional(values,digit,null,.75);
    const c60=v36SmoothedConditional(values,digit,60,.85);

    const g=v34GlobalUnitProb(values);
    const gRank=v36Rank10(g);

            .15*recRank +

function v36SelectPairs(records,mode,topDigits){
    const usedPairs=new Set();

        const rows=v36ConditionalEvidence(records,mode,Number(d),topDigits);
        rows.sort((a,b)=>b.score-a.score||a.unit-b.unit);
        allRows.push(rows);

    function add(r){
        if(!isAllowed(r))return false;

    // Per group: first secure the non-protected core.
    allRows.forEach((rows,gi)=>{
        const core=rows.filter(r=>!r.protected && isAllowed(r));
        const protectedRows=rows.filter(r=>r.protected && isAllowed(r));

        // Baseline core pool. Normally >= 5, but reverse blocking can reduce it.
        core.slice(0,5).forEach(r=>{if(group.length<target&&add(r))group.push(r);});

        }

        // Last-resort fill: no fabricated scores; choose highest evidence remaining.
        if(group.length<target){
            rows.forEach(r=>{if(group.length<target&&add(r))group.push(r);});
        }

    // Keep the existing Top3 signal definition: both positions can contribute.
    // The crucial change is that audit/15-pair construction treats these digits

    return v34TopDigits(records,mode,pairProbability);

function analyzePrecisionEngineInternal(records,mode){
    if(!records||!records.length)

    if(mode==='allday')return 'v3.6 Structured Conditional Pair Quota + All-Day dual-round evidence';
