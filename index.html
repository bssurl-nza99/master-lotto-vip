<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V55.07 IRON‑LAW FULL 200+ ROW</title>
<style>
:root {
  --bg-main: linear-gradient(135deg, #fcfbfa 0%, #f4efe6 100%);
  --panel-bg: rgba(255,255,255,0.98);
  --gold: #d4af37;
  --text-dark: #322c23;
  --green: #2e7d32;
  --red: #c62828;
}
* {box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
body {margin:0;background:var(--bg-main);font-family:'Prompt',sans-serif;color:var(--text-dark);padding:12px;}
.container {max-width:720px;margin:0 auto;}
.panel {background:var(--panel-bg);border:1px solid rgba(212,175,55,0.3);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 10px 30px rgba(120,90,40,0.12);}
textarea {width:100%;min-height:280px;padding:10px;border:1px solid #e2d8c4;border-radius:10px;font-family:monospace;font-size:0.55rem;}
button {padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:6px 4px;}
.btn-run {background:linear-gradient(135deg,#c49828,#8c6511);color:white;}
.btn-clear {background:#fff;border:1px solid #d4af37;color:#8c6511;}
table {width:100%;border-collapse:collapse;font-size:0.5rem;overflow-x:auto;display:block;}
th,td {border:1px solid #f0e6d6;padding:7px;text-align:center;white-space:nowrap;}
th {background:#faf5eb;color:#78590f;}
.hit {background:#e8f5e9;color:#2e7d32;font-weight:700;}
.miss {background:#ffebee;color:#c62828;font-weight:700;}
.alert {padding:10px;border-radius:10px;background:#fff3e0;color:#e65100;margin:10px 0;}
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>✅ V55.07 IRON‑LAW FULL (รองรับ 200+ บรรทัด)</h2>
    <p>รูปแบบที่อ่านได้: ชื่อหวย | วันที่ → บรรทัดถัดไป = Top → บรรทัดถัดไป = Bottom</p>
    <textarea id="inputStat" placeholder="วางสถิติทั้งหมดที่นี่ได้เลย"></textarea>
    <br>
    <button class="btn-run" id="runFull">⚡ รัน Backtest เต็มระบบ</button>
    <button class="btn-clear" id="clearAll">🗑️ ล้างทั้งหมด</button>
  </div>
  <div class="panel">
    <h3>📋 Audit + ตัวนับบรรทัด</h3>
    <div id="auditResult"></div>
  </div>
  <div class="panel">
    <h3>📊 ตาราง Backtest แยกประเภทหวย</h3>
    <div id="backtestTable"></div>
  </div>
</div>
<script>
// ========== IRON‑LAW LOCKED ==========
const IRON_LAW = {
  lead1Pairs: 5,
  lead2Pairs: 10
};

// ========== PARSE THAI MONTH ==========
function parseThaiMonth(txt) {
  const map = {'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
  return map[txt.trim()] ?? null;
}

// ========== CLEAN + PARSE 200+ ROWS ==========
function parseFullText(rawText) {
  const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const records = [];
  let index = 0;
  while(index < lines.length) {
    const headerMatch = lines[index].match(/^(.+?)\|\s*(\d{1,2})\s+([มกพธยัค].{2,3})\s+(\d{2})/i);
    if(headerMatch) {
      const lotteryType = headerMatch[1].trim().toUpperCase();
      const day = Number(headerMatch[2]);
      const month = parseThaiMonth(headerMatch[3]);
      const yearThai = Number(headerMatch[4]);
      index++;
      const topStr = lines[index]?.replace(/\s/g,'') ?? '';
      index++;
      const bottomStr = lines[index]?.replace(/\s/g,'') ?? '';
      if(month && yearThai && topStr && bottomStr) {
        records.push({
          lotteryType, day, month, yearThai,
          top: topStr.padStart(2,'0'),
          bottom: bottomStr.padStart(2,'0')
        });
      }
      index++;
    } else {
      index++;
    }
  }
  records.sort((a,b)=>{
    const dateA = new Date(a.yearThai-543, a.month-1, a.day);
    const dateB = new Date(b.yearThai-543, b.month-1, b.day);
    return dateA - dateB;
  });
  return {totalLines:lines.length, validRecords:records, invalidCount:lines.length - records.length*3};
}

// ========== IRON‑LAW VALIDATOR ==========
function ironLawValidator(leadDigits, generatedPairs) {
  const leadCount = leadDigits.length;
  const requiredPairs = leadCount === 1 ? IRON_LAW.lead1Pairs : leadCount === 2 ? IRON_LAW.lead2Pairs : null;
  if(requiredPairs === null) return {ok:false, msg:"❌ เลขเด่นต้องเป็น 1 หรือ 2 ตัว"};
  if(generatedPairs.length !== requiredPairs) return {ok:false, msg:`❌ จำนวนคู่เจาะต้องเป็น ${requiredPairs}`};
  const sorted = [...generatedPairs].sort((a,b)=>Number(a)-Number(b));
  if(JSON.stringify(generatedPairs) !== JSON.stringify(sorted)) return {ok:false, msg:"❌ คู่เจาะต้องเรียงจากน้อยไปมาก"};
  return {ok:true, msg:"✅ ผ่านกฎเหล็ก"};
}

// ========== LEAD SELECTION (BASELINE ORIGINAL) ==========
function selectLeadBaseline(historyList) {
  if(historyList.length < 5) return {leadDigits:[], pairs:[]};
  const freq = {};
  historyList.forEach(numStr=>{
    const tens = Math.floor(Number(numStr)/10) %10;
    freq[tens] = (freq[tens] ?? 0)+1;
  });
  const sortedTens = Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>Number(x[0]));
  const leadDigits = sortedTens.slice(0,2);
  let pairs = [];
  for(const lead of leadDigits) {
    for(let u=0;u<=9;u++) pairs.push(`${lead}${u}`);
  }
  const required = leadDigits.length ===1 ?5:10;
  pairs = pairs.slice(0,required).sort((a,b)=>Number(a)-Number(b));
  return {leadDigits, pairs};
}

// ========== HIT CHECK (ตรรกะเดิมที่กำหนดไว้) ==========
function checkHit(leadDigits, pairs, actualTop, actualBottom) {
  const topDigits = [Number(actualTop[0]), Number(actualTop[1])];
  const bottomDigits = [Number(actualBottom[0]), Number(actualBottom[1])];
  const crossHitTop = leadDigits.includes(topDigits[0]) && leadDigits.includes(topDigits[1]);
  const crossHitBottom = leadDigits.includes(bottomDigits[0]) && leadDigits.includes(bottomDigits[1]);
  const pairHit = pairs.some(p=>p === actualTop || p === actualBottom);
  return crossHitTop || crossHitBottom || pairHit;
}

// ========== WALK‑FORWARD BACKTEST ==========
function runBacktest(validRecords) {
  const grouped = {};
  validRecords.forEach(r=>{grouped[r.lotteryType] = grouped[r.lotteryType] ?? []; grouped[r.lotteryType].push(r);});
  const summary = [];
  for(const [type, records] of Object.entries(grouped)) {
    let hit=0, miss=0;
    for(let i=5;i<records.length;i++) {
      const history = records.slice(0,i).map(r=>r.top);
      const current = records[i];
      const {leadDigits, pairs} = selectLeadBaseline(history);
      const audit = ironLawValidator(leadDigits, pairs);
      if(!audit.ok) continue;
      if(checkHit(leadDigits, pairs, current.top, current.bottom)) hit++;
      else miss++;
    }
    const total = hit+miss;
    const hitRate = total>0 ? (hit/total*100).toFixed(2) : "0.00";
    summary.push({type, hit, miss, total, hitRate});
  }
  return summary;
}

// ========== RENDER ==========
function renderAudit(result) {
  document.getElementById('auditResult').innerHTML = `
    <div class="alert">
      ✅ จำนวนบรรทัดทั้งหมด: ${result.totalLines}<br>
      ✅ รายการหวยที่ถูกต้อง: ${result.validRecords.length}<br>
      ⚠️ รายการที่อ่านไม่สำเร็จ: ${result.invalidCount}
    </div>
  `;
}

function renderTable(summary) {
  let html = `<table><tr><th>ประเภทหวย</th><th>Hit</th><th>Miss</th><th>ทดสอบ</th><th>Hit‑Rate %</th></tr>`;
  summary.forEach(row=>{
    const cls = Number(row.hitRate)>=60 ? 'hit' : Number(row.hitRate)<50 ? 'miss' : '';
    html += `<tr><td>${row.type}</td><td class="hit">${row.hit}</td><td class="miss">${row.miss}</td><td>${row.total}</td><td class="${cls}">${row.hitRate}%</td></tr>`;
  });
  html += `</table>`;
  document.getElementById('backtestTable').innerHTML = html;
}

// ========== EVENT ==========
document.getElementById('runFull').addEventListener('click', ()=>{
  const raw = document.getElementById('inputStat').value;
  const parsed = parseFullText(raw);
  renderAudit(parsed);
  const summary = runBacktest(parsed.validRecords);
  renderTable(summary);
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  document.getElementById('inputStat').value = '';
  document.getElementById('auditResult').innerHTML = '';
  document.getElementById('backtestTable').innerHTML = '';
});
</script>
</body>
</html>
