<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านเงินทอง — REAL COSMIC EDITION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Prompt:wght@200;300;400;500&family=JetBrains+Mono:wght@200;300;400;500&display=swap');

    * {
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    /* -------------------------------------------------------------
       REAL PHOTOREALISTIC BLACK HOLE BACKGROUND
    ------------------------------------------------------------- */
    body {
      background-color: #030207;
      /* ใช้ภาพหลุมดำความละเอียดสูงแบบเดียวกับต้นฉบับ */
      background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Overlay แสงเงาบางๆ เพื่อให้ตัวอักษรอ่านง่าย แต่เห็นหลุมดำชัดเจน */
    .space-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(0, 0, 0, 0.2) 0%, rgba(3, 2, 7, 0.75) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Ultra Crystal Transparent Glass (กระจกใสแจ๋วเห็นหลุมดำ) */
    .ultra-glass {
      background: rgba(10, 10, 20, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    }

    .flag-pill {
      background: rgba(15, 15, 30, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .flag-pill:hover, .flag-pill.active {
      background: rgba(236, 72, 153, 0.25);
      border-color: rgba(249, 115, 22, 0.6);
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
    }
  </style>
</head>
<body class="max-w-md mx-auto p-3 pb-10 relative">

  <!-- OVERLAY & CANVAS LAYER -->
  <div class="space-overlay"></div>
  <canvas id="meteorCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-10"></canvas>

  <!-- CONTENT CONTAINER -->
  <div class="relative z-20">

    <!-- HEADER -->
    <header class="ultra-glass rounded-2xl p-3 mb-4 flex items-center justify-between sticky top-2">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400">
          <i class="fa-solid fa-atom text-xs"></i>
        </div>
        <div>
          <h1 class="text-xs font-light tracking-widest text-white uppercase">บ้านเงินทอง</h1>
          <p class="text-[7px] font-mono-tech text-orange-300/80">COSMIC SYSTEM</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 text-[8px] font-mono-tech text-orange-400 bg-black/50 px-2.5 py-1 rounded-full border border-orange-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-orange-400 animate-ping"></span> ONLINE
      </div>
    </header>

    <!-- INTERNATIONAL MARKETS (16 FLAGS) -->
    <section class="ultra-glass rounded-2xl p-3.5 mb-4">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-globe text-[11px] text-orange-400"></i>
          <h2 class="text-xs font-light tracking-wide text-white">ตลาดหวยนานาชาติ</h2>
        </div>
        <span class="text-[7px] font-mono-tech text-slate-300">16 MARKETS</span>
      </div>

      <!-- 16 Flags Grid -->
      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="selectMarket('รัฐบาลไทย', 'th')" class="flag-pill active p-1.5 rounded-xl flex items-center gap-1.5" id="flag-th">
          <span class="fi fi-th text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ไทย</span>
        </button>
        <button onclick="selectMarket('ฮานอย', 'vn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-vn">
          <span class="fi fi-vn text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ฮานอย</span>
        </button>
        <button onclick="selectMarket('ลาว', 'la')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-la">
          <span class="fi fi-la text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ลาว</span>
        </button>
        <button onclick="selectMarket('มาเลเซีย', 'my')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-my">
          <span class="fi fi-my text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">มาเลย์</span>
        </button>

        <button onclick="selectMarket('ดาวโจนส์', 'us')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-us">
          <span class="fi fi-us text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ดาวโจนส์</span>
        </button>
        <button onclick="selectMarket('นิเคอิ', 'jp')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-jp">
          <span class="fi fi-jp text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">นิเคอิ</span>
        </button>
        <button onclick="selectMarket('จีน', 'cn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-cn">
          <span class="fi fi-cn text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">จีน</span>
        </button>
        <button onclick="selectMarket('ฮั่งเส็ง', 'hk')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-hk">
          <span class="fi fi-hk text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ฮั่งเส็ง</span>
        </button>

        <button onclick="selectMarket('ไต้หวัน', 'tw')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-tw">
          <span class="fi fi-tw text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">ไต้หวัน</span>
        </button>
        <button onclick="selectMarket('เกาหลี', 'kr')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-kr">
          <span class="fi fi-kr text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">เกาหลี</span>
        </button>
        <button onclick="selectMarket('สิงคโปร์', 'sg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-sg">
          <span class="fi fi-sg text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">สิงคโปร์</span>
        </button>
        <button onclick="selectMarket('อินเดีย', 'in')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-in">
          <span class="fi fi-in text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">อินเดีย</span>
        </button>

        <button onclick="selectMarket('อียิปต์', 'eg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-eg">
          <span class="fi fi-eg text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">อียิปต์</span>
        </button>
        <button onclick="selectMarket('รัสเซีย', 'ru')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-ru">
          <span class="fi fi-ru text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">รัสเซีย</span>
        </button>
        <button onclick="selectMarket('เยอรมัน', 'de')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-de">
          <span class="fi fi-de text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">เยอรมัน</span>
        </button>
        <button onclick="selectMarket('อังกฤษ', 'gb')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-gb">
          <span class="fi fi-gb text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-100 font-light truncate">อังกฤษ</span>
        </button>
      </div>

      <!-- Selected Market Sub-Items -->
      <div class="mt-3 p-2.5 rounded-xl bg-black/40 border border-orange-500/20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-[10px] font-light text-orange-300" id="market-title">รัฐบาลไทย</span>
          <span class="text-[7px] font-mono-tech text-slate-400" id="market-count">4 SUB-ITEMS</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5" id="market-items-container"></div>
      </div>
    </section>

  </div>

  <script>
    // Market Data
    const marketData = {
      'รัฐบาลไทย': ['รัฐบาลไทย', 'ออมสิน', 'ธ.ก.ส.', 'หุ้นไทย 4 รอบ'],
      'ฮานอย': ['ฮานอยเฉพาะกิจ', 'ฮานอยพิเศษ', 'ฮานอยปกติ', 'ฮานอย VIP', 'ฮานอยพัฒนา'],
      'ลาว': ['ลาวพัฒนา', 'ลาว VIP', 'ลาวสตาร์', 'ลาวสามัคคี', 'ลาว EXTRA'],
      'มาเลเซีย': ['มาเลย์ Magnum', 'Damacai 1+3D', 'Toto 4D', 'Sabah 88'],
      'ดาวโจนส์': ['ดาวโจนส์ VIP', 'ดาวโจนส์ Star', 'ดาวโจนส์ ปกติ'],
      'นิเคอิ': ['นิเคอิ เช้า', 'นิเคอิ บ่าย', 'นิเคอิ VIP'],
      'จีน': ['จีน เช้า', 'จีน บ่าย', 'จีน VIP'],
      'ฮั่งเส็ง': ['ฮั่งเส็ง เช้า', 'ฮั่งเส็ง บ่าย', 'ฮั่งเส็ง VIP'],
      'ไต้หวัน': ['ไต้หวัน ปกติ', 'ไต้หวัน VIP'],
      'เกาหลี': ['เกาหลี ปกติ', 'เกาหลี VIP'],
      'สิงคโปร์': ['สิงคโปร์ ปกติ', 'สิงคโปร์ VIP'],
      'อินเดีย': ['อินเดีย Bombay', 'อินเดีย VIP'],
      'อียิปต์': ['อียิปต์ ปกติ', 'อียิปต์ VIP'],
      'รัสเซีย': ['รัสเซีย ปกติ', 'รัสเซีย VIP'],
      'เยอรมัน': ['เยอรมัน ปกติ', 'เยอรมัน VIP'],
      'อังกฤษ': ['อังกฤษ ปกติ', 'อังกฤษ VIP']
    };

    function selectMarket(name, code) {
      document.querySelectorAll('.flag-pill').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`flag-${code}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('market-title').innerText = name;
      const items = marketData[name] || ['หวยปกติ', 'หวย VIP'];
      document.getElementById('market-count').innerText = `${items.length} SUB-ITEMS`;

      const container = document.getElementById('market-items-container');
      container.innerHTML = items.map(item => `
        <div class="bg-black/40 border border-white/10 p-2 rounded-lg flex items-center justify-between">
          <span class="text-[9px] text-slate-200 font-light truncate">${item}</span>
          <span class="text-[7px] font-mono-tech text-orange-400 bg-orange-950/50 px-1.5 py-0.5 rounded">LIVE</span>
        </div>
      `).join('');
    }
    selectMarket('รัฐบาลไทย', 'th');

    // -------------------------------------------------------------
    // REALISTIC TWINKLING STARS & SHOOTING STARS (ดาวตก)
    // -------------------------------------------------------------
    const canvas = document.getElementById('meteorCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Stars Array
    const stars = Array.from({ length: 80 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    // Shooting Stars Array (ดาวตก)
    const meteors = [];

    function createMeteor() {
      if (Math.random() < 0.03 && meteors.length < 3) {
        meteors.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.4),
          length: Math.random() * 80 + 40,
          speed: Math.random() * 10 + 6,
          angle: 0.75, // เฉียงลงขวา
          alpha: 1
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Twinkling Stars
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. Draw Shooting Stars (ดาวตก)
      createMeteor();
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        const endX = m.x - Math.cos(m.angle) * m.length;
        const endY = m.y - Math.sin(m.angle) * m.length;

        const grad = ctx.createLinearGradient(m.x, m.y, endX, endY);
        grad.addColorStop(0, `rgba(255, 255, 255, ${m.alpha})`);
        grad.addColorStop(0.3, `rgba(249, 115, 22, ${m.alpha * 0.8})`);
        grad.addColorStop(1, 'transparent');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        m.x += Math.cos(m.angle) * m.speed;
        m.y += Math.sin(m.angle) * m.speed;
        m.alpha -= 0.015;

        if (m.alpha <= 0 || m.x > canvas.width || m.y > canvas.height) {
          meteors.splice(i, 1);
        }
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
