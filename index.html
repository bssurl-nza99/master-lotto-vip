<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar 2D Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #d9534f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; }
        textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: 0.2s;
        }
        .btn-process { background-color: #28a745; color: white; }
        .btn-process:hover { background-color: #218838; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .btn-clear:hover { background-color: #e0a800; }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-reset:hover { background-color: #c82333; }

        /* การ์ดแสดงผล */
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 20px;
            margin-top: 30px;
            border: 1px solid #eee;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .card-title-area { display: flex; align-items: center; gap: 10px; }
        .flag { font-size: 28px; }
        .title-text h3 { margin: 0; font-size: 20px; color: #222; }
        .title-text span { font-size: 13px; color: #666; background: #f1f1f1; padding: 2px 8px; border-radius: 6px; }
        .date-badge { font-weight: 600; color: #555; background: #fff3cd; padding: 5px 12px; border-radius: 20px; font-size: 14px; }

        /* เลขเด่น Top 1-3 */
        .top-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .top-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .top-1 { background: linear-gradient(135deg, #f39c12, #d35400); }
        .top-2 { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
        .top-3 { background: linear-gradient(135deg, #3498db, #2980b9); }
        .top-label { font-size: 12px; margin-top: 5px; font-weight: 600; color: #666; }

        /* เลขเจาะ 10 คู่ */
        .grid-pairs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .pair-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            text-align: center;
            padding: 12px 0;
            font-size: 18px;
            font-weight: 600;
            transition: 0.2s;
        }
        /* สีเน้นตามอันดับ */
        .highlight-1 { background-color: #fffdf0; border-color: #f39c12; color: #d35400; }
        .highlight-2 { background-color: #f4f6f7; border-color: #95a5a6; color: #2c3e50; }
        .highlight-3 { background-color: #fcf3cf; border-color: #f1c40f; color: #b7950b; }
        .normal { background-color: #fff; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇲🇲 ระบบคำนวณหวยพม่า 2D</h2>
    
    <div class="form-group">
        <label for="roundSelect">เลือกช่วงเวลาออกผลรางวัล:</label>
        <select id="roundSelect">
            <option value="12:01 PM">รอบเที่ยง (12:01 PM)</option>
            <option value="04:30 PM">รอบเย็น (04:30 PM)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dataInput">วางข้อมูลสถิติ (รูปแบบ: วัน เดือน ปี : รอบเที่ยง -- รอบเย็น):</label>
        <textarea id="dataInput" placeholder="วางข้อมูลสถิติทั้งหมดที่นี่..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-process" onclick="processData()">ประมวลผล</button>
        <button class="btn-clear" onclick="clearInput()">ล้างข้อมูล</button>
        <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>

    <!-- ส่วนแสดงผลการ์ด -->
    <div id="resultCard" style="display: none;">
        <div class="card">
            <div class="card-header">
                <div class="card-title-area">
                    <span class="flag">🇲🇲</span>
                    <div class="title-text">
                        <h3 id="cardTitle">Myanmar 2D</h3>
                        <span id="cardRound">12:01 PM</span>
                    </div>
                </div>
                <div class="date-badge" id="cardDate">16 ก.ย. 69</div>
            </div>

            <!-- เลขเด่น Top 1, 2, 3 -->
            <div class="top-container">
                <div class="top-item">
                    <div class="top-circle top-1" id="top1">?</div>
                    <span class="top-label">Top 1</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-2" id="top2">?</div>
                    <span class="top-label">Top 2</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-3" id="top3">?</div>
                    <span class="top-label">Top 3</span>
                </div>
            </div>

            <!-- เลขเจาะ 10 คู่ -->
            <div class="grid-pairs" id="pairGrid">
                <!-- แทรกตัวเลขด้วย JavaScript -->
            </div>
        </div>
    </div>
</div>

<script>
    function clearInput() {
        document.getElementById('dataInput').value = '';
    }

    function resetAll() {
        document.getElementById('dataInput').value = '';
        document.getElementById('resultCard').style.display = 'none';
    }

    function processData() {
        const rawText = document.getElementById('dataInput').value.trim();
        const round = document.getElementById('roundSelect').value;

        if (!rawText) {
            alert('กรุณากรอกข้อมูลสถิติก่อนทำการประมวลผล');
            return;
        }

        // จำลองการดึงเลขตามรอบที่เลือกจากข้อมูลที่ผู้ใช้ใส่
        const lines = rawText.split('\n');
        let numbers = [];

        lines.forEach(line => {
            if (line.includes('--')) {
                let parts = line.split(':');
                if (parts.length >= 2) {
                    let dateStr = parts[0].replace('🗓', '').trim();
                    let results = parts[1].split('--');
                    let targetNum = (round === '12:01 PM') ? results[0].trim() : results[1].trim();
                    if (targetNum && targetNum.length === 2) {
                        numbers.push(targetNum);
                    }
                }
            }
        });

        if (numbers.length === 0) {
            alert('ไม่พบรูปแบบข้อมูลที่ถูกต้อง กรุณาตรวจสอบรูปแบบข้อความ');
            return;
        }

        // วิเคราะห์ความถี่ตัวเลขเพื่อหา Top 1, 2, 3
        let freq = {};
        numbers.forEach(num => {
            let d1 = num[0];
            let d2 = num[1];
            freq[d1] = (freq[d1] || 0) + 1;
            freq[d2] = (freq[d2] || 0) + 1;
        });

        let sortedDigits = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
        let t1 = sortedDigits[0] || '9';
        let t2 = sortedDigits[1] || '6';
        let t3 = sortedDigits[2] || '3';

        // แสดงผลเลขเด่น
        document.getElementById('top1').innerText = t1;
        document.getElementById('top2').innerText = t2;
        document.getElementById('top3').innerText = t3;

        // สร้างเลขเจาะ 10 คู่ (อ้างอิงจากเลข Top และสถิติ)
        let pairs = [
            t1 + t2, t1 + t3, t2 + t1, t3 + t1, t1 + '0',
            t2 + '5', t3 + '7', t1 + '8', t2 + '2', t3 + '1'
        ];

        // เติมข้อมูลลงในการ์ด
        let today = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        document.getElementById('cardDate').innerText = today;
        document.getElementById('cardRound').innerText = round;
        document.getElementById('cardTitle').innerText = "Myanmar 2D";

        let gridHTML = '';
        pairs.forEach((p, index) => {
            let styleClass = 'normal';
            if (index === 0 || index === 5) styleClass = 'highlight-1';
            else if (index === 1 || index === 6) styleClass = 'highlight-2';
            else if (index === 2 || index === 7) styleClass = 'highlight-3';

            gridHTML += `<div class="pair-box ${styleClass}">${p}</div>`;
        });

        document.getElementById('pairGrid').innerHTML = gridHTML;
        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
