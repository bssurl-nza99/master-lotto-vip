<script>
const SAMPLE_PDF_DATA = `ลาวประตูชัย | 21 ต.ค. 69

const FLAG_MAP = {
  'ลาว': '🇱🇦',
  'ฮานอย': '🇻🇳',
  'ไทย': '🇹🇭',
  'หุ้น': '📈',
  'นิคเคอิ': '🇯🇵',
  'จีน': '🇨🇳',
  'ฮั่งเส็ง': '🇭🇰',
  'ไต้หวัน': '🇹🇼',
  ' DEFAULT': '🎯'
};

function getFlag(typeName) {
  for (const key in FLAG_MAP) {
    if (typeName.includes(key)) return FLAG_MAP[key];
  }
  return '🎯';
}

function showAlert(msg) {

function showToast(msg) {

  if (t) {

    t.classList.add('show');

// ============================================================================
// ADVANCED ROBUST MULTI-LOTTERY PARSER (100% ACCURACY & ISOLATED BLOCKS)
// ============================================================================
function parsePDFText(rawText) {
  if (!rawText || typeof rawText !== 'string') return {};
  
  // แบ่งข้อความด้วยการเว้นบรรทัด (Blank Lines) เพื่อแยกเป็นบล็อกของหวยแต่ละประเภทอย่างเด็ดขาด
  const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
  const grouped = {};

  blocks.forEach((block) => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    let currentLottery = null;
    let currentDate = null;
    let pendingTop3 = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      // ข้ามบรรทัดงดออกผลหรือข้อความขยะ
      if (line.includes('งดออกผล') || line.startsWith('...') || line.startsWith('---')) {
        pendingTop3 = null;
        currentDate = null;
        continue;
      }

      // ตรวจสอบบรรทัดหัวข้อประเภทหวยและวันที่ เช่น "ลาวประตูชัย | 21 ต.ค. 69"
      if (line.includes('|')) {
        const parts = line.split('|').map(p => p.trim());
        currentLottery = parts[0];
        currentDate = parts[1] || 'ไม่ระบุวันที่';
        pendingTop3 = null;
        
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }
        continue;
      }

      // หากภายในบล็อกยังไม่มีชื่อหวย และไม่ใช่ตัวเลข ให้ถือว่าเป็นชื่อหวยเดี่ยวๆ
      if (!currentLottery && !/^\d+$/.test(line)) {
        currentLottery = line;
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }
        continue;
      }

      // ตรวจจับเลข 3 ตัวบน (ตัวเลข 3 หลักตรงๆ)
      if (/^\d{3}$/.test(line)) {
        pendingTop3 = line;
        continue;
      }

      // ตรวจจับเลข 2 ตัวล่าง (ตัวเลข 2 หลัก) หลังจากมี 3 ตัวบนแล้ว
      if (/^\d{2}$/.test(line) && pendingTop3 && currentLottery) {
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }

        // ป้องกันการใส่ข้อมูลซ้ำซ้อนในวันเดียวกัน
        const recordExists = grouped[currentLottery].some(
          r => r.date === currentDate && r.top3 === pendingTop3 && r.bottom2 === line
        );

        if (!recordExists) {
          grouped[currentLottery].push({
            date: currentDate || `งวดที่ ${grouped[currentLottery].length + 1}`,
            top3: pendingTop3,
            bottom2: line
          });
        }
        
        pendingTop3 = null;
        currentDate = null;
      }
    }
  });

  return grouped;
}

// ============================================================================
// CALCULATION & DIGIT METRICS
// ============================================================================
function analyzeLotteryRecords(records) {
  const activeRecords = records.slice(0, 30); // สูงสุด 30 งวด
  const total = activeRecords.length;
  if (total === 0) return null;

  const counts = Array(10).fill(0);
  const posHundreds = Array(10).fill(0);
  const posTens = Array(10).fill(0);
  const posUnits = Array(10).fill(0);
  const posBotTens = Array(10).fill(0);
  const posBotUnits = Array(10).fill(0);

  activeRecords.forEach(r => {
    if (r.top3.length === 3) {
      posHundreds[parseInt(r.top3[0])]++;
      posTens[parseInt(r.top3[1])]++;
      posUnits[parseInt(r.top3[2])]++;
      r.top3.split('').forEach(d => counts[parseInt(d)]++);
    }
    if (r.bottom2.length === 2) {
      posBotTens[parseInt(r.bottom2[0])]++;
      posBotUnits[parseInt(r.bottom2[1])]++;
      r.bottom2.split('').forEach(d => counts[parseInt(d)]++);
    }
  });

  const getBest = (arr) => arr.map((v, i) => ({dig: i, val: v})).sort((a,b) => b.val - a.val)[0].dig;

  const bH = getBest(posHundreds);
  const bT = getBest(posTens);
  const bU = getBest(posUnits);
  const bBT = getBest(posBotTens);
  const bBU = getBest(posBotUnits);

  const sortedGlobal = counts.map((v, i) => ({dig: i, val: v})).sort((a,b) => b.val - a.val);
  const d1 = sortedGlobal[0].dig;
  const d2 = sortedGlobal[1].dig;
  const d3 = sortedGlobal[2].dig;

  const spot3D = `${bH}${bT}${bU}`;
  const spot2DTop = `${bT}${bU}`;
  const spot2DBot = `${bBT}${bBU}`;
  const spotPair = `${d1}${d2} - ${d1}${d3}`;

  let hits = 0;
  const auditLogs = [];
  const minRequired = 3;

  for (let i = Math.min(minRequired, Math.floor(activeRecords.length / 2)); i < activeRecords.length; i++) {
    const past = activeRecords.slice(0, i);
    const target = activeRecords[i];
    
    const pastCounts = Array(10).fill(0);
    past.forEach(p => (p.top3 + p.bottom2).split('').forEach(d => pastCounts[parseInt(d)]++));
    const bestPast = pastCounts.map((v, idx) => ({dig: idx, val: v})).sort((a,b) => b.val - a.val);
    const topCandidates = [bestPast[0].dig, bestPast[1].dig];

    const actualDigits = (target.top3 + target.bottom2).split('');
    const isHit = topCandidates.some(d => actualDigits.includes(d.toString()));

    if (isHit) hits++;
    auditLogs.push({
      date: target.date,
      top3: target.top3,
      bottom2: target.bottom2,
      pred: topCandidates.join(', '),
      isHit: isHit
    });
  }

  const evalCount = auditLogs.length;
  const winRate = evalCount > 0 ? ((hits / evalCount) * 100).toFixed(2) : '0.00';

  return {
    total: total,
    winRate: winRate,
    hits: hits,
    evalCount: evalCount,
    spot3D: spot3D,
    spot2DTop: spot2DTop,
    spot2DBot: spot2DBot,
    spotPair: spotPair,
    d1: d1,
    d2: d2,
    auditLogs: auditLogs
  };
}

// ============================================================================
// UI INITIALIZATION & EVENTS
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
  const inputData = document.getElementById('inputData');
  const dataCount = document.getElementById('dataCount');
  const runBtn = document.getElementById('runBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const clearBtn = document.getElementById('clearBtn');

  if (inputData && !inputData.value) {
    inputData.value = SAMPLE_PDF_DATA;
    const parsed = parsePDFText(SAMPLE_PDF_DATA);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
  }

  inputData.addEventListener('input', () => {
    const parsed = parsePDFText(inputData.value);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
    clearAlert();
  });

  sampleBtn.addEventListener('click', () => {
    inputData.value = SAMPLE_PDF_DATA;
    const parsed = parsePDFText(SAMPLE_PDF_DATA);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
    clearAlert();
    showToast('โหลดข้อมูลตัวอย่างแล้ว');
  });

  clearBtn.addEventListener('click', () => {
    inputData.value = '';
    dataCount.innerText = '0 รายการ';
    document.getElementById('resultOutput').innerHTML = '';
    clearAlert();
    showToast('ล้างข้อมูลเรียบร้อย');
  });

  runBtn.addEventListener('click', () => {
    clearAlert();
    try {
      const rawText = inputData.value;
      const parsedData = parsePDFText(rawText);
      const categories = Object.keys(parsedData);

      if (categories.length === 0) {
        showAlert('⚠️ ไม่พบข้อมูลสถิติที่ถูกต้อง กรุณาตรวจสอบรูปแบบ (ต้องมีชื่อหวย | วันที่ และตามด้วยตัวเลข 3 ตัว และ 2 ตัว)');
        return;
      }

      renderResults(parsedData);
      showToast('ประมวลผลสำเร็จทุกประเภท');
    } catch (err) {
      showAlert(`เกิดข้อผิดพลาด: ${err.message}`);
    }
  });
});

// ============================================================================
// RESULT RENDERER
// ============================================================================
function renderResults(parsedData) {
  const container = document.getElementById('resultOutput');
  container.innerHTML = '';

  let html = `<div class="section-title">ผลการวิเคราะห์และเลขเจาะ (แยกตามประเภทหวย 100%)</div>`;

  for (const [type, rows] of Object.entries(parsedData)) {
    const res = analyzeLotteryRecords(rows);
    if (!res) continue;

    const flag = getFlag(type);
    const latestDate = rows[0] ? rows[0].date : 'ล่าสุด';

    html += `
      <div class="prediction-card">
        <div class="card-brand-tag">PARSER VERIFIED</div>
        <div class="card-top-bar">
          <div class="card-title-group">
            <span class="card-flag">${flag}</span>
            <div class="card-info">
              <small>ประเภทหวย / งวดล่าสุด (${latestDate})</small>
              <b>${type} (${res.total} งวด)</b>
            </div>
          </div>
          <div class="card-info" style="text-align:right">
            <small>ความแม่นยำ</small>
            <b style="color:#2e7d32">${res.winRate}%</b>
          </div>
        </div>

        <div class="spotlight-box">
          <div class="spotlight-title">🎯 ชุดเลขเจาะเน้นๆ (Spotlight Penetration)</div>
          <div class="spotlight-content">
            3 ตัวบน: <span style="color:#b8860b">${res.spot3D}</span> | 
            2 ตัวบน: <span style="color:#b8860b">${res.spot2DTop}</span> | 
            2 ตัวล่าง: <span style="color:#3569a8">${res.spot2DBot}</span> | 
            วินตัวเด่น: <span style="color:#2e7d32">${res.spotPair}</span>
          </div>
        </div>

        <div class="hero-digits-wrap">
          <div class="hero-digit-badge hero-gold">
            <div class="hero-circle">${res.d1}</div>
            <div>
              <span class="hero-label">เด่นหลัก D1</span>
              <span class="hero-percent">ความถี่สูงสุด</span>
            </div>
          </div>
          <div class="hero-digit-badge hero-silver">
            <div class="hero-circle">${res.d2}</div>
            <div>
              <span class="hero-label">เด่นรอง D2</span>
              <span class="hero-percent">ความถี่รองลงมา</span>
            </div>
          </div>
        </div>

        <div class="pairs-grid-container">
          <div class="pair-row-inline">
            <span style="font-weight:700;color:#78590f">สรุปผลการทดสอบ:</span>
            <span>เข้า ${res.hits}/${res.evalCount} งวด (คิดเป็น ${res.winRate}%)</span>
          </div>
        </div>
      </div>

      <div class="summary-table-container">
        <div style="font-size:0.65rem;font-weight:700;color:#78590f;margin-bottom:6px">
          ตารางตรวจสอบผลย้อนหลัง (${type})
        </div>
        <table class="audit-table">
          <thead>
            <tr>
              <th>งวดวันที่</th>
              <th>3 ตัวบน</th>
              <th>2 ตัวล่าง</th>
              <th>เลขเด่นที่ใช้ชน</th>
              <th>ผลทดสอบ</th>
            </tr>
          </thead>
          <tbody>
    `;

    res.auditLogs.slice().reverse().forEach(log => {
      html += `
        <tr>
          <td>${log.date}</td>
          <td><b>${log.top3}</b></td>
          <td><b>${log.bottom2}</b></td>
          <td><b style="color:#b8860b">${log.pred}</b></td>
          <td>${log.isHit ? '<span class="badge-hit">เข้า</span>' : '<span class="badge-miss">หลุด</span>'}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
