<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Smart Predictor - VIP Luxury Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #0b0f19;
            --card-bg: #131c2e;
            --border-gold: #d4af37;
            --border-subtle: rgba(212, 175, 55, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-gold: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 24px;
            color: var(--border-gold);
            font-weight: 600;
            letter-spacing: 1px;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--border-gold);
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: #070a12;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--border-gold);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-process {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
        }

        .btn-process:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-clear {
            background-color: #1f2937;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }

        .btn-clear:hover {
            background-color: #374151;
            color: var(--text-main);
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #1a233a;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--border-gold);
            color: #000;
            font-weight: 600;
            border-color: var(--border-gold);
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media(max-width: 900px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }

        .prediction-card {
            background: #070a12;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .prediction-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .main-digit {
            font-size: 48px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-gold);
            font-weight: 700;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .pairs-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .pair-badge {
            background: #131c2e;
            border: 1px solid var(--border-gold);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
        }

        .stat-item {
            background: #131c2e;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid var(--border-gold);
        }

        .table-container {
            background: #070a12;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 15px;
            overflow-x: auto;
            max-height: 450px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }

        th {
            color: var(--border-gold);
            font-weight: 600;
            background: #131c2e;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .badge-win {
            color: var(--success-color);
            font-weight: 600;
        }

        .badge-loss {
            color: var(--danger-color);
            font-weight: 600;
        }

        .placeholder-text {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI LOTTERY SMART PREDICTOR (VIP EDITION)</h1>
        <p>ระบบวิเคราะห์และคัดกรองตัวเลขความแม่นยำสูง ป้องกัน Overfit และซื่อตรงต่อข้อมูล 100%</p>
    </header>

    <div class="panel">
        <label for="rawInput">กรอกหรือวางข้อมูลสถิติหวยทุกประเภทที่นี่:</label>
        <textarea id="rawInput" placeholder="ตัวอย่าง:
ลาวพัฒนา | 12 พ.ย. 69
836
98
ฮานอยปกติ | 11 พ.ย. 69
129
79"></textarea>
        
        <div class="button-group">
            <button class="btn-process" onclick="processData()">ประมวลผลระบบอัจฉริยะ</button>
            <button class="btn-clear" onclick="clearData()">ล้างข้อมูล</button>
        </div>
    </div>

    <div id="outputSection" style="display: none;">
        <div class="panel">
            <label>เลือกประเภทหวยที่ต้องการตรวจสอบ:</label>
            <div id="tabsContainer" class="tabs-container"></div>

            <div class="results-grid">
                <div>
                    <div class="prediction-card">
                        <h3>เลขเด่นตัวเดียว (วิ่ง บน-ล่าง)</h3>
                        <div id="bestDigit" class="main-digit">-</div>
                        <p style="font-size: 12px; color: var(--text-muted);">3 คู่เจาะเน้นๆ (ไป-กลับ บน-ล่าง)</p>
                        <div id="pairsBox" class="pairs-box">
                            <span class="pair-badge">--</span>
                            <span class="pair-badge">--</span>
                            <span class="pair-badge">--</span>
                        </div>
                    </div>
                    <div class="stats-summary" id="statsSummary"></div>
                </div>

                <div>
                    <div class="table-container">
                        <table id="auditTable">
                            <thead>
                                <tr>
                                    <th>วันที่ออกผล</th>
                                    <th>ผลจริง (บน/ล่าง)</th>
                                    <th>เลขที่ระบบทาย</th>
                                    <th>ผลลัพธ์</th>
                                    <th>ตำแหน่งที่เข้า</th>
                                </tr>
                            </thead>
                            <tbody id="auditTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let parsedLotteries = {};
    let currentCategory = '';

    function clearData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('outputSection').style.display = 'none';
        parsedLotteries = {};
    }

    function processData() {
        const rawText = document.getElementById('rawInput').value.trim();
        if (!rawText) {
            alert('กรุณากรอกข้อมูลสถิติก่อนกดประมวลผล');
            return;
        }

        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        parsedLotteries = {};
        
        let currentName = '';
        let currentDate = '';
        let step = 0; // 0: name/date, 1: top3, 2: bottom2

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            
            // ข้ามบรรทัดงดออกผล
            if (line.includes('งดออกผล')) {
                step = 0;
                continue;
            }

            if (line.includes('|')) {
                let parts = line.split('|').map(p => p.trim());
                currentName = parts[0];
                currentDate = parts[1];
                step = 1;
            } else if (step === 1) {
                currentTop = line;
                step = 2;
            } else if (step === 2) {
                currentBottom = line;
                
                if (!parsedLotteries[currentName]) {
                    parsedLotteries[currentName] = [];
                }
                
                parsedLotteries[currentName].push({
                    date: currentDate,
                    top: currentTop,
                    bottom: currentBottom
                });
                step = 0;
            }
        }

        const categories = Object.keys(parsedLotteries);
        if (categories.length === 0) {
            alert('ไม่พบรูปแบบข้อมูลที่ถูกต้อง กรุณาตรวจสอบรูปแบบ (ชื่อหวย | วันที่)');
            return;
        }

        renderTabs(categories);
        switchCategory(categories[0]);
        document.getElementById('outputSection').style.display = 'block';
    }

    function renderTabs(categories) {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = `${cat} (${parsedLotteries[cat].length} งวด)`;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                switchCategory(cat);
            };
            container.appendChild(btn);
        });
    }

    function switchCategory(categoryName) {
        currentCategory = categoryName;
        const data = parsedLotteries[categoryName]; // เรียงจากอดีตมาปัจจุบันเพื่อเทสต์
        // สมมติข้อมูลเรียงจากใหม่ไปเก่า ให้กลับด้านเพื่อเทสต์ Walk-Forward ย้อนหลังจากอดีต
        const sortedData = [...data].reverse();

        let wins = 0;
        let losses = 0;
        let currentWinStreak = 0;
        let maxWinStreak = 0;
        let currentLossStreak = 0;
        let maxLossStreak = 0;
        let lastStatus = 'หลุด';

        let auditRows = [];

        // จำลอง Walk-Forward Backtesting แบบซื่อตรง
        for (let i = 5; i < sortedData.length; i++) {
            let historySlice = sortedData.slice(0, i);
            let targetItem = sortedData[i];

            // AI Logic: หาเลขเด่นจากความถี่และ Momentum ย้อนหลัง
            let digitCounts = {};
            historySlice.forEach(item => {
                (item.top + item.bottom).split('').forEach(d => {
                    digitCounts[d] = (digitCounts[d] || 0) + 1;
                });
            });

            let sortedDigits = Object.keys(digitCounts).sort((a,b) => digitCounts[b] - digitCounts[a]);
            let bestDigit = sortedDigits[0] || '0';
            let p1 = sortedDigits[1] || '1';
            let p2 = sortedDigits[2] || '2';
            let p3 = sortedDigits[3] || '3';

            let pairs = [`${bestDigit}${p1}`, `${bestDigit}${p2}`, `${bestDigit}${p3}`];

            // ตรวจสอบผล (กติกา: ถ้าเลขเด่นหรือคู่เจาะ ไปลงที่หลักสิบหรือหน่วย บน/ล่าง ถือว่าเข้า 100%)
            let targetStr = targetItem.top + targetItem.bottom;
            let tensUnits = [
                targetItem.top[1], targetItem.top[2], // สิบ, หน่วย บน
                targetItem.bottom[0], targetItem.bottom[1] // สิบ, หน่วย ล่าง
            ];

            let isWin = false;
            let matchedPos = '-';

            if (tensUnits.includes(bestDigit)) {
                isWin = true;
                matchedPos = 'เลขเด่นลงหลักสิบ/หน่วย';
            } else {
                for (let pair of pairs) {
                    let rPair = pair[1] + pair[0];
                    if (tensUnits.includes(pair[0]) && tensUnits.includes(pair[1])) {
                        isWin = true;
                        matchedPos = `คู่เจาะ ${pair}`;
                        break;
                    }
                }
            }

            if (isWin) {
                wins++;
                currentWinStreak++;
                currentLossStreak = 0;
                if (currentWinStreak > maxWinStreak) maxWinStreak = currentWinStreak;
                lastStatus = 'เข้า';
            } else {
                losses++;
                currentLossStreak++;
                currentWinStreak = 0;
                if (currentLossStreak > maxLossStreak) maxLossStreak = currentLossStreak;
                lastStatus = 'หลุด';
            }

            auditRows.unshift({
                date: targetItem.date,
                actual: `${targetItem.top} / ${targetItem.bottom}`,
                prediction: `เด่น: ${bestDigit} | เจาะ: ${pairs.join(', ')}`,
                status: isWin,
                pos: matchedPos
            });
        }

        // ทำนายงวดล่าสุด (อนาคต) จากข้อมูลทั้งหมด
        let fullHistory = sortedData;
        let fCounts = {};
        fullHistory.forEach(item => {
            (item.top + item.bottom).split('').forEach(d => {
                fCounts[d] = (fCounts[d] || 0) + 1;
            });
        });
        let fSorted = Object.keys(fCounts).sort((a,b) => fCounts[b] - fCounts[a]);
        let nextBest = fSorted[0] || '0';
        let nextPairs = [`${nextBest}${fSorted[1]||1}`, `${nextBest}${fSorted[2]||2}`, `${nextBest}${fSorted[3]||3}`];

        document.getElementById('bestDigit').innerText = nextBest;
        const pairsBox = document.getElementById('pairsBox');
        pairsBox.innerHTML = nextPairs.map(p => `<span class="pair-badge">${p}</span>`).join('');

        let totalTests = wins + losses;
        let accuracy = totalTests > 0 ? ((wins / totalTests) * 100).toFixed(1) : '0.0';

        document.getElementById('statsSummary').innerHTML = `
            <div class="stat-item">ความแม่นยำย้อนหลัง: <b>${accuracy}%</b></div>
            <div class="stat-item">สถานะปัจจุบัน: <b style="color: ${lastStatus === 'เข้า' ? 'var(--success-color)' : 'var(--danger-color)'}">${lastStatus}</b></div>
            <div class="stat-item">เข้าติดต่อกันสูงสุด: <b>${maxWinStreak} งวด</b></div>
            <div class="stat-item">หลุดติดต่อกันสูงสุด: <b>${maxLossStreak} งวด</b></div>
        `;

        const tbody = document.getElementById('auditTableBody');
        tbody.innerHTML = '';
        auditRows.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.date}</td>
                <td>${row.actual}</td>
                <td>${row.prediction}</td>
                <td><span class="${row.status ? 'badge-win' : 'badge-loss'}">${row.status ? 'เข้า (WIN)' : 'หลุด (LOSS)'}</span></td>
                <td>${row.pos}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
