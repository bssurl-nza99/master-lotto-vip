<script>

/* ============================================================
   MYANMAR 2D REAL STATISTICAL ENGINE
   ============================================================

   DATA MODEL
   -----------
   1 day = 2 draws
   Lunch   = 1 two-digit result
   Evening = 1 two-digit result

   NO:
   - upper/lower
   - three-digit
   - fake accuracy
   - forced percentage
   - naturalWeightHit
   - future leakage

   YES:
   - real pair probability
   - recent / medium / long history
   - cross-round relationship
   - pair frequency
   - digit frequency
   - walk-forward backtest
   - confidence interval
   - real streaks
   ============================================================ */


/* ============================================================
   BASIC
   ============================================================ */

function clearInput() {
    document.getElementById('dataInput').value = '';
}

function resetAll() {
    document.getElementById('dataInput').value = '';
    document.getElementById('resultContainer').style.display = 'none';
}


function isValid2D(value) {
    return /^\d{2}$/.test(String(value || ''));
}


function normalize2D(value) {

    if (value === null || value === undefined) {
        return null;
    }

    let s = String(value).trim();

    if (/^\d$/.test(s)) {
        s = '0' + s;
    }

    return /^\d{2}$/.test(s) ? s : null;
}


function getDigits(value) {

    const v = normalize2D(value);

    if (!v) return [];

    return [
        Number(v[0]),
        Number(v[1])
    ];
}


/* ============================================================
   DATE
   ============================================================ */

function parseDate(dateText) {

    if (!dateText) return null;

    const monthMap = {

        'มค': 1,
        'มกราคม': 1,

        'กพ': 2,
        'กุมภาพันธ์': 2,

        'มีค': 3,
        'มีนาคม': 3,

        'เมย': 4,
        'เมษายน': 4,

        'พค': 5,
        'พฤษภาคม': 5,

        'มิย': 6,
        'มิถุนายน': 6,

        'กค': 7,
        'กรกฎาคม': 7,

        'สค': 8,
        'สิงหาคม': 8,

        'กย': 9,
        'กันยายน': 9,

        'ตค': 10,
        'ตุลาคม': 10,

        'พย': 11,
        'พฤศจิกายน': 11,

        'ธค': 12,
        'ธันวาคม': 12
    };


    let s = String(dateText)
        .replace(/🗓/g, '')
        .replace(/\./g, '')
        .replace(/,/g, '')
        .replace(/\s+/g, ' ')
        .trim();


    const parts = s.split(' ');

    if (parts.length < 3) {
        return null;
    }


    const day = parseInt(parts[0], 10);

    let monthText = parts[1];

    const month =
        monthMap[monthText] ||
        monthMap[monthText.replace(/\./g, '')];


    let year = parseInt(parts[2], 10);


    if (
        !Number.isInteger(day) ||
        !month ||
        !Number.isInteger(year)
    ) {
        return null;
    }


    /*
       68 = พ.ศ. 2568
       69 = พ.ศ. 2569
    */

    if (year < 100) {
        year = 2500 + year - 543;
    }
    else if (year > 2400) {
        year -= 543;
    }


    const d =
        new Date(
            year,
            month - 1,
            day
        );


    if (
        d.getFullYear() !== year ||
        d.getMonth() !== month - 1 ||
        d.getDate() !== day
    ) {
        return null;
    }


    return d;
}


function getNextTargetDate(lastDateText) {

    const d =
        parseDate(lastDateText);


    if (!d) {
        return "Next Date";
    }


    d.setDate(
        d.getDate() + 1
    );


    const dd =
        String(d.getDate()).padStart(2, '0');

    const mm =
        String(d.getMonth() + 1).padStart(2, '0');

    const yyyy =
        d.getFullYear();


    return `${dd}/${mm}/${yyyy}`;
}


/* ============================================================
   INPUT PARSER
   ============================================================ */

function parseRecords(rawText) {

    const lines =
        String(rawText || '')
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);


    const records = [];


    lines.forEach(line => {

        if (!line.includes('--')) {
            return;
        }


        const colon =
            line.indexOf(':');


        if (colon < 0) {
            return;
        }


        const dateText =
            line
                .substring(0, colon)
                .replace('🗓', '')
                .trim();


        const resultText =
            line.substring(colon + 1);


        const parts =
            resultText
                .split('--')
                .map(x => x.trim());


        const lunch =
            normalize2D(parts[0]);

        const evening =
            normalize2D(parts[1]);


        if (
            !lunch ||
            !evening
        ) {
            return;
        }


        records.push({

            date: dateText,

            lunch,

            evening
        });

    });


    /*
       เรียงตามวันที่ถ้ามีวันที่อ่านได้
    */

    records.sort((a, b) => {

        const da = parseDate(a.date);
        const db = parseDate(b.date);

        if (!da || !db) return 0;

        return da - db;
    });


    return records;
}


/* ============================================================
   HISTORICAL VALUES
   ============================================================ */

function getValues(records, mode, limit = null) {

    let values = [];


    if (mode === 'lunch') {

        values =
            records
                .map(r => r.lunch)
                .filter(isValid2D);

    }

    else if (mode === 'evening') {

        values =
            records
                .map(r => r.evening)
                .filter(isValid2D);

    }

    else {

        /*
           All Day = ทุกผลจริง
        */

        records.forEach(r => {

            if (isValid2D(r.lunch)) {
                values.push(r.lunch);
            }

            if (isValid2D(r.evening)) {
                values.push(r.evening);
            }

        });

    }


    if (
        limit !== null &&
        values.length > limit
    ) {
        values =
            values.slice(
                values.length - limit
            );
    }


    return values;
}


/* ============================================================
   DISTRIBUTION HELPERS
   ============================================================ */

function normalizedPairDistribution(values, alpha = 1) {

    const counts =
        Array(100).fill(alpha);


    values.forEach(value => {

        if (!isValid2D(value)) {
            return;
        }

        counts[
            parseInt(value, 10)
        ]++;

    });


    const total =
        counts.reduce(
            (a, b) => a + b,
            0
        );


    return counts.map(
        x => x / total
    );
}


/* ============================================================
   CONTEXT DISTRIBUTION
   ============================================================

   Lunch:
       previous day's Evening
          ↓
       next Lunch

   Evening:
       previous day's Lunch
          ↓
       next Evening

   Important:
   ไม่ใช้ข้อมูลอนาคต
   ============================================================ */

function getContextDistribution(records, mode) {

    const counts =
        Array(100).fill(1);


    let denominator = 100;


    if (records.length < 2) {

        return counts.map(
            x => x / denominator
        );
    }


    let context;


    if (mode === 'lunch') {

        context =
            records[records.length - 1]
                .evening;

    }

    else if (mode === 'evening') {

        context =
            records[records.length - 1]
                .lunch;

    }

    else {

        return counts.map(
            x => x / denominator
        );
    }


    if (!isValid2D(context)) {

        return counts.map(
            x => x / denominator
        );
    }


    for (
        let i = 1;
        i < records.length;
        i++
    ) {

        let source;
        let target;


        if (mode === 'lunch') {

            source =
                records[i - 1].evening;

            target =
                records[i].lunch;

        }

        else {

            source =
                records[i - 1].lunch;

            target =
                records[i].evening;
        }


        if (
            source === context &&
            isValid2D(target)
        ) {

            counts[
                parseInt(target, 10)
            ]++;

            denominator++;
        }
    }


    return counts.map(
        x => x / denominator
    );
}


/* ============================================================
   CONTEXT DIGIT DISTRIBUTION
   ============================================================ */

function getContextDigitDistribution(records, mode) {

    const counts =
        Array(100).fill(1);


    let denominator = 100;


    if (records.length < 2) {

        return counts.map(
            x => x / denominator
        );
    }


    let context;


    if (mode === 'lunch') {

        context =
            records[
                records.length - 1
            ].evening;

    }

    else if (mode === 'evening') {

        context =
            records[
                records.length - 1
            ].lunch;

    }

    else {

        return counts.map(
            x => x / denominator
        );
    }


    const contextDigits =
        new Set(
            getDigits(context)
        );


    for (
        let i = 1;
        i < records.length;
        i++
    ) {

        let source;
        let target;


        if (mode === 'lunch') {

            source =
                records[i - 1].evening;

            target =
                records[i].lunch;

        }

        else {

            source =
                records[i - 1].lunch;

            target =
                records[i].evening;
        }


        if (
            !isValid2D(source) ||
            !isValid2D(target)
        ) {
            continue;
        }


        const sourceDigits =
            getDigits(source);


        const overlap =
            sourceDigits.some(
                d => contextDigits.has(d)
            );


        if (overlap) {

            counts[
                parseInt(target, 10)
            ]++;

            denominator++;
        }
    }


    return counts.map(
        x => x / denominator
    );
}


/* ============================================================
   DIGIT MARGINAL DISTRIBUTION
   ============================================================ */

function getDigitMarginalDistribution(values) {

    const counts =
        Array(10).fill(1);


    values.forEach(value => {

        if (!isValid2D(value)) {
            return;
        }


        const ds =
            getDigits(value);


        ds.forEach(d => {

            counts[d]++;

        });

    });


    const total =
        counts.reduce(
            (a, b) => a + b,
            0
        );


    return counts.map(
        x => x / total
    );
}


/* ============================================================
   PAIR MODEL
   ============================================================

   Fixed weights

   Long term       25%
   Medium term     25%
   Recent          25%
   Context         15%
   Context digits  10%

   น้ำหนักไม่ถูกปรับจากผลที่จะทำนาย
   จึงไม่เกิด future leakage
   ============================================================ */

function buildPairProbability(records, mode) {

    /*
       All Day:
       สร้าง model ของ Lunch + Evening
       แล้วเฉลี่ย
    */

    if (mode === 'allday') {

        const lunch =
            buildPairProbability(
                records,
                'lunch'
            );

        const evening =
            buildPairProbability(
                records,
                'evening'
            );


        return lunch.map(
            (x, i) =>
                (x + evening[i]) / 2
        );
    }


    const allValues =
        getValues(
            records,
            mode
        );


    const mediumValues =
        getValues(
            records,
            mode,
            120
        );


    const recentValues =
        getValues(
            records,
            mode,
            30
        );


    const longDist =
        normalizedPairDistribution(
            allValues,
            1
        );


    const mediumDist =
        normalizedPairDistribution(
            mediumValues,
            1
        );


    const recentDist =
        normalizedPairDistribution(
            recentValues,
            1
        );


    const contextDist =
        getContextDistribution(
            records,
            mode
        );


    const contextDigitDist =
        getContextDigitDistribution(
            records,
            mode
        );


    const result =
        Array(100).fill(0);


    for (
        let p = 0;
        p < 100;
        p++
    ) {

        result[p] =

            longDist[p] * 0.25 +

            mediumDist[p] * 0.25 +

            recentDist[p] * 0.25 +

            contextDist[p] * 0.15 +

            contextDigitDist[p] * 0.10;
    }


    /*
       Normalize อีกครั้ง
    */

    const total =
        result.reduce(
            (a, b) => a + b,
            0
        );


    return result.map(
        x => x / total
    );
}


/* ============================================================
   TOP 3 DIGITS
   ============================================================

   เลขเด่นไม่ได้ดูแค่ frequency อย่างเดียว

   เราดู probability ของ 00–99 ก่อน
   แล้วค่อยรวม probability ของคู่ที่มี digit นั้น

   ทำให้ Top 3 กับชุดคู่สอดคล้องกัน
   ============================================================ */

function getTopThreeDigits(pairProbability) {

    const digitProbability =
        Array(10).fill(0);


    for (
        let p = 0;
        p < 100;
        p++
    ) {

        const probability =
            pairProbability[p];


        const tens =
            Math.floor(p / 10);

        const units =
            p % 10;


        digitProbability[tens] +=
            probability;


        /*
           ถ้าเบิ้ล
           อย่านับซ้ำ probability
        */

        if (units !== tens) {

            digitProbability[units] +=
                probability;
        }

    }


    return {

        digits:
            digitProbability
                .map(
                    (score, digit) => ({
                        digit,
                        score
                    })
                )
                .sort(
                    (a, b) => {

                        if (
                            b.score !==
                            a.score
                        ) {
                            return (
                                b.score -
                                a.score
                            );
                        }

                        return (
                            a.digit -
                            b.digit
                        );
                    }
                )
                .slice(0, 3)
                .map(
                    x =>
                        String(x.digit)
                ),

        probabilities:
            digitProbability
    };
}


/* ============================================================
   PAIR SELECTION
   ============================================================

   Top 1 = 5 pairs
   Top 2 = 5 pairs
   Top 3 = 5 pairs

   รวม 15 คู่

   คู่ต้องมี Top digit อยู่ในหลักสิบหรือหลักหน่วย
   ============================================================ */

function getPairsForDigit(
    digit,
    pairProbability,
    usedPairs
) {

    const d =
        Number(digit);


    const candidates = [];


    for (
        let p = 0;
        p < 100;
        p++
    ) {

        const tens =
            Math.floor(p / 10);

        const units =
            p % 10;


        if (
            tens !== d &&
            units !== d
        ) {
            continue;
        }


        const pair =
            String(p).padStart(
                2,
                '0'
            );


        if (
            usedPairs.has(pair)
        ) {
            continue;
        }


        candidates.push({

            pair,

            probability:
                pairProbability[p]
        });

    }


    candidates.sort(
        (a, b) => {

            if (
                b.probability !==
                a.probability
            ) {
                return (
                    b.probability -
                    a.probability
                );
            }

            return (
                parseInt(a.pair) -
                parseInt(b.pair)
            );
        }
    );


    return candidates
        .slice(0, 5)
        .map(x => x.pair);
}


/* ============================================================
   MAIN PREDICTION
   ============================================================ */

function analyzePrecisionEngineInternal(
    records,
    mode
) {

    if (
        !records ||
        records.length === 0
    ) {

        return {

            t1: '0',
            t2: '1',
            t3: '2',

            pairsT1: [],
            pairsT2: [],
            pairsT3: [],

            targetDate:
                "Next Date"
        };
    }


    const pairProbability =
        buildPairProbability(
            records,
            mode
        );


    const top =
        getTopThreeDigits(
            pairProbability
        );


    const topDigits =
        top.digits;


    const usedPairs =
        new Set();


    const pairsT1 =
        getPairsForDigit(
            topDigits[0],
            pairProbability,
            usedPairs
        );


    pairsT1.forEach(
        p => usedPairs.add(p)
    );


    const pairsT2 =
        getPairsForDigit(
            topDigits[1],
            pairProbability,
            usedPairs
        );


    pairsT2.forEach(
        p => usedPairs.add(p)
    );


    const pairsT3 =
        getPairsForDigit(
            topDigits[2],
            pairProbability,
            usedPairs
        );


    pairsT3.forEach(
        p => usedPairs.add(p)
    );


    /*
       กันกรณี pair ไม่ครบ
    */

    const allPairs =
        [
            ...pairsT1,
            ...pairsT2,
            ...pairsT3
        ];


    return {

        t1:
            topDigits[0],

        t2:
            topDigits[1],

        t3:
            topDigits[2],


        pairsT1,

        pairsT2,

        pairsT3,


        targetDate:
            getNextTargetDate(
                records[
                    records.length - 1
                ].date
            ),


        /*
           เก็บไว้ใช้ Audit
        */

        pairProbability,

        topDigitProbability:
            top.probabilities
    };
}


/* ============================================================
   REAL HIT TEST
   ============================================================ */

function getAllPredictionPairs(
    prediction
) {

    return [

        ...prediction.pairsT1,

        ...prediction.pairsT2,

        ...prediction.pairsT3

    ];
}


function pairHit(
    prediction,
    actual
) {

    if (
        !isValid2D(actual)
    ) {
        return false;
    }


    return getAllPredictionPairs(
        prediction
    ).includes(actual);
}


function topDigitHit(
    prediction,
    actual
) {

    if (
        !isValid2D(actual)
    ) {
        return false;
    }


    const top = new Set([

        prediction.t1,

        prediction.t2,

        prediction.t3

    ]);


    return getDigits(actual)
        .some(
            d =>
                top.has(
                    String(d)
                )
        );
}


/* ============================================================
   WILSON 95% CI
   ============================================================ */

function getWilson95(
    hits,
    total
) {

    if (
        total <= 0
    ) {

        return {
            rate: null,
            low: null,
            high: null
        };
    }


    const z = 1.96;

    const p =
        hits / total;


    const denominator =
        1 +
        (
            z * z / total
        );


    const center =
        (
            p +
            (
                z * z /
                (2 * total)
            )
        ) /
        denominator;


    const margin =
        (
            z *
            Math.sqrt(

                (
                    p *
                    (1 - p) /
                    total
                )

                +

                (
                    z * z /
                    (
                        4 *
                        total *
                        total
                    )
                )
            )
        ) /
        denominator;


    return {

        rate:
            p * 100,

        low:
            Math.max(
                0,
                (center - margin) * 100
            ),

        high:
            Math.min(
                100,
                (center + margin) * 100
            )
    };
}


/* ============================================================
   WALK-FORWARD BACKTEST
   ============================================================

   สำคัญที่สุด

   ถ้ากำลังทดสอบวันที่ 100:

       ใช้ข้อมูลวันที่ 1–99

   ห้ามแตะวันที่ 100 ก่อนสร้าง prediction

   ============================================================ */

function runBacktestAudit(
    records,
    mode
) {

    /*
       ต้องมี history พอสมควร
       เพื่อให้ long / medium / recent model
       ทำงานได้
    */

    const MIN_HISTORY = 60;


    if (
        records.length <=
        MIN_HISTORY
    ) {

        return {

            total: 0,

            hits: 0,

            misses: 0,

            topHits: 0,

            topMisses: 0,

            pairHitAcc: null,

            topHitAcc: null,

            pairCI: null,

            topCI: null,

            maxWinStreak: 0,

            maxLoseStreak: 0
        };
    }


    let total = 0;

    let pairHits = 0;

    let topHits = 0;


    let currentWin = 0;

    let currentLose = 0;

    let maxWin = 0;

    let maxLose = 0;


    /*
       All Day:
       1 วัน = 2 observations

       Lunch + Evening
    */


    for (
        let i = MIN_HISTORY;
        i < records.length;
        i++
    ) {

        const training =
            records.slice(
                0,
                i
            );


        const prediction =
            analyzePrecisionEngineInternal(
                training,
                mode
            );


        const actualRecord =
            records[i];


        let actuals = [];


        if (mode === 'lunch') {

            actuals = [
                actualRecord.lunch
            ];

        }

        else if (
            mode === 'evening'
        ) {

            actuals = [
                actualRecord.evening
            ];

        }

        else {

            actuals = [

                actualRecord.lunch,

                actualRecord.evening

            ];
        }


        actuals.forEach(
            actual => {

                total++;


                const isPair =
                    pairHit(
                        prediction,
                        actual
                    );


                const isTop =
                    topDigitHit(
                        prediction,
                        actual
                    );


                if (isPair) {

                    pairHits++;

                    currentWin++;

                    currentLose = 0;

                    maxWin =
                        Math.max(
                            maxWin,
                            currentWin
                        );

                }

                else {

                    currentLose++;

                    currentWin = 0;

                    maxLose =
                        Math.max(
                            maxLose,
                            currentLose
                        );
                }


                if (isTop) {

                    topHits++;
                }

            }
        );
    }


    const pairCI =
        getWilson95(
            pairHits,
            total
        );


    const topCI =
        getWilson95(
            topHits,
            total
        );


    return {

        total,

        hits:
            pairHits,

        misses:
            total -
            pairHits,


        topHits,

        topMisses:
            total -
            topHits,


        pairHitAcc:
            pairCI.rate === null
                ? null
                : pairCI.rate.toFixed(2),


        topHitAcc:
            topCI.rate === null
                ? null
                : topCI.rate.toFixed(2),


        pairCI: {

            low:
                pairCI.low.toFixed(2),

            high:
                pairCI.high.toFixed(2)
        },


        topCI: {

            low:
                topCI.low.toFixed(2),

            high:
                topCI.high.toFixed(2)
        },


        maxWinStreak:
            maxWin,

        maxLoseStreak:
            maxLose
    };
}


/* ============================================================
   AUDIT HTML
   ============================================================ */

function generateAuditTableHTML(
    roundName,
    audit
) {

    if (
        !audit.total
    ) {

        return `

            <div class="audit-title">
                📊 ตารางตรวจสอบประสิทธิภาพสูงสุด:
                ${roundName}
            </div>

            <div class="audit-grid">

                <div class="audit-card">

                    <div class="audit-card-title">
                        Pair Hit Accuracy
                    </div>

                    <div class="audit-card-value">
                        —
                    </div>

                </div>


                <div class="audit-card">

                    <div class="audit-card-title">

                    </div>

                    </td>

            </table>
        `;
    }


    /*
       Random reference

       15 คู่จาก 100 คู่ = 15%

       Top 3 digit any-position
       = 53.33%
    */

    const pairRate =
        parseFloat(
            audit.pairHitAcc
        );


    const topRate =
        parseFloat(
            audit.topHitAcc
        );


    const pairDelta =
        (
            pairRate -
            15
        ).toFixed(2);


    const topDelta =
        (
            topRate -
            53.333333
        ).toFixed(2);


    function statusByCI(
        low,
        high
    ) {

        const width =
            parseFloat(high) -
            parseFloat(low);


        if (
            width > 20
        ) {
            return "ตัวอย่าง/ความไม่แน่นอนสูง";
        }


        if (
            width > 12
        ) {
            return "ความไม่แน่นอนปานกลาง";
        }


        return "ช่วงประมาณการแคบลง";
    }


    return `

        </div>


        <table class="audit-table">

            <tr>

                    ตัวชี้วัดเชิงสถิติ
                </th>

                    ค่าสถิติที่ตรวจพบ
                </th>

                <th>
                    สถานะ
                </th>

            </tr>


            <tr>

                <td>
                    จำนวน Observation ที่ทดสอบจริง
                </td>

                </td>

            </tr>


            <tr>

                <td>
                    Pair 95% Confidence Interval
                </td>

                <td>
                    <b>
                        ${audit.pairCI.low}%
                        –
                        ${audit.pairCI.high}%
                    </b>
                </td>

                <td>
                    ${statusByCI(
                        audit.pairCI.low,
                        audit.pairCI.high

            </tr>


            <tr>

                <td>

                    </b>
                </td>

                </td>

            </tr>


            <tr>

                <td>

                </td>

                <td>
                    <b>

                        –

                    </b>
                </td>

                <td>

                    )}
                </td>

            </tr>


            <tr>

                <td>

                    15 คู่
                </td>

                    </b>
                </td>

                <td>

                </td>

            </tr>


            <tr>

                </td>

            <tr>

/* ============================================================
   CAPTURE
   ============================================================ */

function captureCard(
    wrapperId,
    filenamePrefix
) {

    const wrapperElement =
        document.getElementById(
            wrapperId
        );


    const btnCapture =
        wrapperElement.querySelector(
            '.btn-capture'
        );


    btnCapture.style.display =
        'none';


    html2canvas(
        wrapperElement,
        {

            scale: 3,

            useCORS: true,

            backgroundColor:
                '#f0f2f5'
        }
    )
    .then(canvas => {

        btnCapture.style.display =
            'flex';


        const link =
            document.createElement(
                'a'
            );


        link.download =
            `${filenamePrefix}_${Date.now()}.png`;


        link.href =
            canvas.toDataURL(
                'image/png'
            );


        link.click();

    })
    .catch(err => {

        btnCapture.style.display =
            'flex';


        alert(
            'เกิดข้อผิดพลาดในการบันทึกภาพ'
        );


        console.error(err);
    });
}
