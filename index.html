<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE VOID - The Most Expensive Nothing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
        }
        .glow-red {
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
        .void-bg {
            animation: pulse-slow 6s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col justify-between items-center p-6 select-none overflow-hidden relative">

    <!-- พื้นหลังความว่างเปล่า -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-neutral-900 via-black to-black void-bg pointer-events-none"></div>

    <!-- ส่วนหัว: บอกสถานะความไร้สาระ -->
    <header class="relative z-10 text-center space-y-1 mt-4">
        <h1 class="text-3xl font-black tracking-widest text-red-600">THE VOID</h1>
        <p class="text-[11px] text-gray-500 uppercase tracking-widest">ความว่างเปล่าที่แพงที่สุดในจักรวาล</p>
    </header>

    <!-- ส่วนกลาง: หัวใจสำคัญของความบ้า -->
    <main class="relative z-10 flex flex-col items-center justify-center space-y-6 text-center my-auto">
        <div class="space-y-2">
            <p id="status-text" class="text-xs text-gray-400">ผู้ครอบครองความว่างเปล่าล่าสุด:</p>
            <div id="latest-owner" class="text-lg font-bold text-red-400 border border-red-900/50 bg-red-950/20 px-6 py-2 rounded-full inline-block">
                ยังไม่มีใครหน้ามืดตามัว
            </div>
        </div>

        <!-- ปุ่มสีแดงอันทรงพลัง -->
        <button onclick="buyTheVoid()" class="w-48 h-48 rounded-full bg-gradient-to-b from-red-600 to-red-900 text-white font-black text-xl tracking-wider glow-red border-4 border-red-500 active:scale-95 transition transform flex flex-col items-center justify-center space-y-1 cursor-pointer">
            <span>ครอบครอง</span>
            <span class="text-xs font-normal text-red-200">99 THB</span>
        </button>

        <p class="text-[10px] text-gray-600 max-w-xs leading-relaxed">
            *คำเตือน: การซื้อนี้ไม่มีประโยชน์อันใดทั้งสิ้น นอกจากประกาศให้โลกรู้ว่าคุณว่างและรวยแค่ไหน*
        </p>
    </main>

    <!-- ส่วนท้าย: ทำเนียบคนรวยไร้สาระ -->
    <footer class="relative z-10 w-full max-w-sm bg-neutral-900/60 border border-neutral-800 rounded-2xl p-3 text-center space-y-1 mb-2">
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ทำเนียบความว่างเปล่าล่าสุด</div>
        <div id="hall-of-fame" class="text-xs text-gray-300 truncate">
            -
        </div>
    </footer>

    <!-- จาวาสคริปต์จำลองความพินาศ -->
    <script>
        let currentOwner = "ยังไม่มีใครหน้ามืดตามัว";

        function buyTheVoid() {
            const name = prompt("คุณชื่ออะไร? (ประกาศให้โลกรู้ความไร้สาระของคุณ):");
            if (!name || name.trim() === "") return;

            // จำลองการจ่ายเงินสำเร็จแบบกวนๆ
            alert("ยินดีด้วย! คุณเสียเงิน 99 บาทให้ความว่างเปล่าสำเร็จแล้ว 🚀");

            currentOwner = name.trim();
            document.getElementById('latest-owner').innerText = currentOwner;
            document.getElementById('hall-of-fame').innerText = `👑 ${currentOwner} ครอบครองความว่างเปล่านี้เรียบร้อย`;
        }
    </script>
</body>
</html>
