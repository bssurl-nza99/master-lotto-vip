        body { font-family: 'Prompt', sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 15px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; color: #444; font-size: 14px; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Prompt', sans-serif; font-size: 14px; }

        .btn-process:hover { background-color: #7f0000; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .summary-box { background: linear-gradient(145deg, #ffebee, #ffcdd2); border-radius: 16px; padding: 20px; margin-top: 25px; border: 1px solid #ef9a9a; }
        .summary-box h3 { margin-top: 0; color: #b71c1c; font-size: 18px; border-bottom: 2px dashed #ef9a9a; padding-bottom: 10px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .stat-card { background: #fff; padding: 14px; border-radius: 12px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid #ef9a9a; }
        .stat-card .val { font-size: 18px; font-weight: 700; color: #c62828; margin-top: 4px; }
        .stat-card .sub { font-size: 12px; color: #555; }
        
        .card-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
        @media (max-width: 768px) { .card-container { grid-template-columns: 1fr; } }
        
        .card { background: linear-gradient(145deg, #fdfbf7, #f7f3ea); border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); padding: 18px; border: 1px solid #e8e1d1; }
        .card-header { text-align: center; border-bottom: 2px dashed #ded6c2; padding-bottom: 10px; margin-bottom: 15px; }
        .flag { font-size: 24px; }
        .title-text h3 { margin: 5px 0 0 0; font-size: 16px; color: #222; }
        .time-badge { font-size: 11px; color: #b45309; background: #fef3c7; padding: 2px 8px; border-radius: 6px; font-weight: 600; border: 1px solid #fde68a; display: inline-block; margin-top: 4px; }
        
        .top-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .top-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .top-circle { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .top-1-circle { background: linear-gradient(135deg, #c62828, #e53935); }
        .top-2-circle { background: linear-gradient(135deg, #455a64, #607d8b); }
        .top-3-circle { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .top-label { font-size: 10px; font-weight: 600; color: #555; }
        
        .section-group { margin-top: 10px; background: #ffffff; padding: 10px; border-radius: 12px; border: 1px solid #e8e1d1; }
        .section-title { font-size: 11px; font-weight: 600; margin-bottom: 6px; color: #444; }
        .grid-pairs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .pair-box { border-radius: 6px; text-align: center; padding: 6px 0; font-size: 13px; font-weight: 600; border: 1px solid #fde047; background-color: #fffde7; color: #7f6000; }
        
        .log-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; background: #fff; border-radius: 10px; overflow: hidden; }
        .log-table th, .log-table td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #eee; }
        .log-table th { background: #f1f5f9; color: #333; font-weight: 600; }
        .hit-badge { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .miss-badge { background: #f8d7da; color: #721c24; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    </style>

<script>
    // อัลกอริทึมเพิ่มน้ำหนักความแม่นยำสูง (High-Precision Matrix)
    function analyzeVIPEngine(historyList) {
        let freq = {};
        for(let i=0; i<=9; i++) freq[i] = 0;

        // ให้น้ำหนักงวดล่าสุดมากกว่าเพื่อความแม่นยำสูง
        historyList.slice(-10).forEach((num, index) => {
            if (num && num.length === 2) {
                let weight = (index + 1) * 1.5;
                freq[num[0]] = (freq[num[0]] || 0) + weight;
                freq[num[1]] = (freq[num[1]] || 0) + weight;
            }
        });

        let sortedDigits = Object.keys(freq).sort((a,b) => freq[b] - freq[a]);
        let t1 = sortedDigits[0] || '1';
        let t2 = sortedDigits[1] || '2';
        let t3 = sortedDigits[2] || '3';

        function generatePairs(digit) {
            let pairs = [];
            // สร้างชุดเจาะเน้นๆ 5 ตัวตรงเพื่อลดความกว้างและเพิ่มอัตราการเข้าเป้า
            for(let i = 0; i < 5; i++) {
                let targetDigit = (parseInt(digit) + i) % 10;
                pairs.push(digit + targetDigit);
            }
            return pairs;
        }

        return {
            t1, t2, t3,
            pairsT1: generatePairs(t1),
            pairsT2: generatePairs(t2),
            pairsT3: generatePairs(t3)
        };
    }

    function checkHitVIP(predData, targetNum) {
        if (!targetNum || targetNum.length !== 2) return false;
        let allPairs = [...predData.pairsT1, ...predData.pairsT2];
        let rev = targetNum[1] + targetNum[0];
        return allPairs.includes(targetNum) || allPairs.includes(rev);
    }

    function runBacktest() {
        const rawText = document.getElementById('dataInput').value.trim();
        if (!rawText) { alert('กรุณากรอกข้อมูลสถิติ'); return; }

        const lines = rawText.split('\n');
        let records = [];

        lines.forEach(line => {
            if (line.includes('--')) {
                let parts = line.split(':');
                if (parts.length >= 2) {
                    let datePart = parts[0].replace('🗓', '').trim();
                    let results = parts[1].split('--');
                    let lunch = results[0] ? results[0].trim() : '';
                    let evening = results[1] ? results[1].trim() : '';
                    if (lunch.length === 2 && evening.length === 2) {
                        records.push({ date: datePart, lunch: lunch, evening: evening });
                    }
                }
            }
        });

        if (records.length === 0) { alert('ไม่พบข้อมูลสถิติที่ถูกต้อง'); return; }

        let lunchHistory = [];
        let eveningHistory = [];
        let allDayHistory = [];

        let stats = {
            lunch: { hits: 0, misses: 0, currentStreak: 0, maxDrawdown: 0 },
            evening: { hits: 0, misses: 0, currentStreak: 0, maxDrawdown: 0 },
            allday: { hits: 0, misses: 0, currentStreak: 0, maxDrawdown: 0 }
        };

        let logRowsHTML = '';
        let lastLunchPred = null;
        let lastEveningPred = null;
        let lastAllDayPred = null;
        let lastDateStr = '';

        records.forEach((rec, idx) => {
            let predLunch = analyzeVIPEngine(lunchHistory);
            let predEvening = analyzeVIPEngine(eveningHistory);
            let predAllDay = analyzeVIPEngine(allDayHistory);

            let hitLunch = checkHitVIP(predLunch, rec.lunch);
            let hitEvening = checkHitVIP(predEvening, rec.evening);
            let hitAllDay = checkHitVIP(predAllDay, rec.lunch) || checkHitVIP(predAllDay, rec.evening);

            if (idx >= 3) {
                if (hitLunch) { stats.lunch.hits++; stats.lunch.currentStreak = 0; }
                else { stats.lunch.misses++; stats.lunch.currentStreak++; if (stats.lunch.currentStreak > stats.lunch.maxDrawdown) stats.lunch.maxDrawdown = stats.lunch.currentStreak; }

                if (hitEvening) { stats.evening.hits++; stats.evening.currentStreak = 0; }
                else { stats.evening.misses++; stats.evening.currentStreak++; if (stats.evening.currentStreak > stats.evening.maxDrawdown) stats.evening.maxDrawdown = stats.evening.currentStreak; }

                if (hitAllDay) { stats.allday.hits++; stats.allday.currentStreak = 0; }
                else { stats.allday.misses++; stats.allday.currentStreak++; if (stats.allday.currentStreak > stats.allday.maxDrawdown) stats.allday.maxDrawdown = stats.allday.currentStreak; }
            }

            logRowsHTML += `<tr>
                <td><b>${rec.date}</b></td>
                <td>เที่ยง: <b style="color:#b71c1c">${rec.lunch}</b> / เย็น: <b style="color:#1565c0">${rec.evening}</b></td>
                <td>${idx >= 3 ? (hitLunch ? '<span class="hit-badge">เข้า</span>' : '<span class="miss-badge">หลุด</span>') : '-'}</td>
                <td>${idx >= 3 ? (hitEvening ? '<span class="hit-badge">เข้า</span>' : '<span class="miss-badge">หลุด</span>') : '-'}</td>
                <td>${idx >= 3 ? (hitAllDay ? '<span class="hit-badge">เข้า</span>' : '<span class="miss-badge">หลุด</span>') : '-'}</td>
            </tr>`;

            lunchHistory.push(rec.lunch);
            eveningHistory.push(rec.evening);
            allDayHistory.push(rec.lunch);
            allDayHistory.push(rec.evening);

            if (idx === records.length - 1) {
                lastLunchPred = predLunch;
                lastEveningPred = predEvening;
                lastAllDayPred = predAllDay;
                lastDateStr = rec.date;
            }
        });

        let totalTestRounds = records.length - 3;

        document.getElementById('summarySection').innerHTML = `
            <h3>📊 ผลการตรวจสอบความแม่นยำสูง (VIP Engine Audit Summary)</h3>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="sub">รอบเที่ยง (နေ့ခင်း)</div>
                    <div class="val">${stats.lunch.hits} / ${totalTestRounds} รอบ</div>
                    <div class="sub" style="color:#b71c1c; margin-top:4px;">หลุดติดต่อกันสูงสุด: <b>${stats.lunch.maxDrawdown} รอบ</b></div>
                </div>
                <div class="stat-card">
                    <div class="sub">รอบเย็น (ညနေ)</div>
                    <div class="val">${stats.evening.hits} / ${totalTestRounds} รอบ</div>
                    <div class="sub" style="color:#b71c1c; margin-top:4px;">หลุดติดต่อกันสูงสุด: <b>${stats.evening.maxDrawdown} รอบ</b></div>
                </div>
                <div class="stat-card">
                    <div class="sub">ชุดทั้งวัน (တစ်နေ့လုံး)</div>
                    <div class="val">${stats.allday.hits} / ${totalTestRounds} วัน</div>
                    <div class="sub" style="color:#b71c1c; margin-top:4px;">หลุดติดต่อกันสูงสุด: <b>${stats.allday.maxDrawdown} วัน</b></div>
                </div>
            </div>
        `;

        let renderCardContent = (title, burmeseTitle, data) => {
            let renderRow = (pairs) => {
                let html = '';
                pairs.forEach(p => { html += `<div class="pair-box">${p}</div>`; });
                return html;
            };

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="flag">🇲🇲</span>
                        <div class="title-text">
                            <h3>${title}</h3>
                            <div class="time-badge">${burmeseTitle} (${lastDateStr})</div>
                        </div>
                    </div>
                    
                    <div class="top-container">
                        <div class="top-item">
                            <div class="top-circle top-1-circle">${data.t1}</div>
                            <span class="top-label">Top 1</span>
                        </div>
                        <div class="top-item">
                            <div class="top-circle top-2-circle">${data.t2}</div>
                            <span class="top-label">Top 2</span>
                        </div>
                        <div class="top-item">
                            <div class="top-circle top-3-circle">${data.t3}</div>
                            <span class="top-label">Top 3</span>
                        </div>
                    </div>

                    <div class="section-group">
                        <div class="section-title">แนวทาง Top 1</div>
                        <div class="grid-pairs">${renderRow(data.pairsT1)}</div>
                    </div>
                    <div class="section-group" style="margin-top:8px;">
                        <div class="section-title">แนวทาง Top 2</div>
                        <div class="grid-pairs">${renderRow(data.pairsT2)}</div>
                    </div>
                </div>
            `;
        };

        document.getElementById('cardsContainer').innerHTML = 
            renderCardContent('รอบเที่ยง', 'နေ့ခင်းပွဲ', lastLunchPred) +
            renderCardContent('รอบเย็น', 'ညနေပွဲ', lastEveningPred) +
            renderCardContent('ชุดทั้งวัน', 'တစ်နေ့လုံး', lastAllDayPred);

        document.getElementById('logTableBody').innerHTML = logRowsHTML;
        document.getElementById('resultContainer').style.display = 'block';
    }

    window.onload = function() {
        runBacktest();
    };
</script>
