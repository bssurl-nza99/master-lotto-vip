<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>QUANTUM STAT // ENGINE v3.0</title>
    <style>
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #141619;
            --surface-hover: #1c1f24;
            --border-color: #262930;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --font-mono: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.4;
            padding: 16px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 8px;
            resize: vertical;
            border-radius: 4px;
            outline: none;
            margin-bottom: 8px;
        }

        textarea:focus {
            border-color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        button:hover {
            background: var(--border-color);
        }

        button.primary {
            background: var(--text-primary);
            color: var(--bg-color);
            font-weight: 600;
            border: none;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lottery-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
        }

        .lottery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .lottery-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .lottery-meta {
            color: var(--text-muted);
            font-size: 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            background: var(--bg-color);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .metric-item {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .prediction-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .anchor-col {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        .anchor-title {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .anchor-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .pairs-list {
            color: var(--text-primary);
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            margin-top: 6px;
        }

        th, td {
            text-align: left;
            padding: 5px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background: var(--bg-color);
        }

        tr:hover td {
            background: var(--surface-hover);
        }

        .tag-hit { color: var(--accent-green); font-weight: 600; }
        .tag-miss { color: var(--text-muted); }
        .tag-partial { color: #f59e0b; font-weight: 600; }

        .sample-link {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
            font-size: 10px;
        }
        .sample-link:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">QUANTUM STAT // ENGINE v3.0</div>
        <div class="status-badge" id="systemStatus">STANDBY (0.00s)</div>
    </header>

    <div class="input-panel">
        <div class="section-title">

        <div class="btn-group">
            <button class="primary" onclick="runEngine()">ประมวลผลสถิติ</button>
            <button onclick="clearData()">ล้างข้อมูล</button>

    <div class="section-title"><span>PROCESSED AUDIT & PREDICTION RESULTS</span></div>

</div>

function clearData() {
    document.getElementById('rawInput').value = '';
    document.getElementById('resultsContainer').innerHTML = `
        <div style="color: var(--text-muted); text-align: center; padding: 20px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px;">
            ยังไม่มีข้อมูลประมวลผล กรุณากรอกสถิติหรือกดโหลดสถิติตัวอย่างด้านบน
        </div>
    `;
    document.getElementById('systemStatus').innerText = 'STANDBY (0.00s)';
}

function parseInputData(rawText) {
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const groups = {};
    let currentCategory = 'ทั่วไป';
    let currentDate = '';
    let topVal = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        if (line.includes('|')) {
            let parts = line.split('|').map(p => p.trim());
            currentCategory = parts[0];
            currentDate = parts[1];
            if (!groups[currentCategory]) groups[currentCategory] = [];
        } else {
            if (!topVal) {
                topVal = line;
            } else {
                let botVal = line;
                if (!groups[currentCategory]) groups[currentCategory] = [];
                groups[currentCategory].push({
                    date: currentDate || `งวดที่ ${groups[currentCategory].length + 1}`,
                    top: topVal.padStart(3, '0'),
                    bot: botVal.padStart(2, '0')
                });
                topVal = '';
            }
        }
    }
    return groups;
}

function thaiDateToNumeric(dateStr) {
    if (!dateStr) return 0;
    const months = {'ม.ค.':1, 'ก.พ.':2, 'มี.ค.':3, 'เม.ย.':4, 'พ.ค.':5, 'มิ.ย.':6, 'ก.ค.':7, 'ส.ค.':8, 'ก.ย.':9, 'ต.ค.':10, 'พ.ย.':11, 'ธ.ค.':12};
    let parts = dateStr.split(' ');
    if (parts.length < 3) return 0;
    let d = parseInt(parts[0]) || 1;
    let m = months[parts[1]] || 1;
    let y = parseInt(parts[2]) || 69;
    return y * 10000 + m * 100 + d;
}

function runEngine() {
    const startTime = performance.now();
    const rawText = document.getElementById('rawInput').value;
    if (!rawText.trim()) {
        alert('กรุณากรอกข้อมูลสถิติตัวอย่างก่อนประมวลผล');
        return;
    }

    const lotteryGroups = parseInputData(rawText);
    const container = document.getElementById('resultsContainer');
    container.innerHTML = '';

    let totalCategories = Object.keys(lotteryGroups).length;

    for (let cat in lotteryGroups) {
        let records = lotteryGroups[cat];
        // Sort chronologically (oldest to newest)
        records.sort((a, b) => thaiDateToNumeric(a.date) - thaiDateToNumeric(b.date));

        let analysis = performCausalAnalysis(records);
        let html = renderLotteryCard(cat, records, analysis);
        container.innerHTML += html;
    }

    const endTime = performance.now();
    const duration = ((endTime - startTime) / 1000).toFixed(2);
    document.getElementById('systemStatus').innerText = `VERIFIED (${duration}s)`;
}

function checkHit(valStr, digitsArr) {
    return digitsArr.some(d => valStr.includes(d));
}

function getValidScoringDigits(top, bot) {
    let s = new Set();
    if (top.length >= 3) {
        s.add(top[1]); // สิบบน
        s.add(top[2]); // หน่วยบน
    }
    if (bot.length >= 2) {
        s.add(bot[0]); // สิบล่าง
        s.add(bot[1]); // หน่วยล่าง
    }
    return Array.from(s);
}

function checkAnchorHitExact(top, bot, d) {
    let active = [];
    if (top.length >= 3) {
        active.push(top[1], top[2]);
    }
    if (bot.length >= 2) {
        active.push(bot[0], bot[1]);
    }
    return active.includes(d);
}

function generateEquations() {
    let eq = [];
    for (let i = 0; i < 120000; i++) {
        let lag = (i % 3) + 1;
        let pos1 = i % 5;
        let pos2 = Math.floor(i / 5) % 5;
        let mult = (i % 4) + 1;
        let mod = (i % 7) + 3;
        eq.push({lag, pos1, pos2, mult, mod});
    }
    return eq;
}

const GLOBAL_EQUATIONS = generateEquations();

function evaluateEquation(records, idx, eq) {
    let targetIdx = idx - eq.lag;
    if (targetIdx < 0) return null;
    let rec = records[targetIdx];
    let strVal = rec.top + rec.bot;
    let v1 = parseInt(strVal[eq.pos1] || '0');
    let v2 = parseInt(strVal[eq.pos2] || '0');
    let res = Math.abs((v1 * eq.mult) - v2) % 10;
    return res.toString();
}

function performCausalAnalysis(records) {
    let auditLog = [];
    let totalWalks = Math.max(0, records.length - 5);
    let anchorHits = 0;
    let pairHitsInAnchor = 0;
    let totalAnchorHitForPair = 0;

    // Walk forward from index 5 to end-1
    let startIndex = Math.max(5, records.length - 15); // evaluate last 15 draws for audit
    if (startIndex >= records.length) startIndex = Math.max(0, records.length - 10);

    let lastPrediction = null;

    for (let i = startIndex; i < records.length; i++) {
        let subRecords = records.slice(0, i); // strict causal past
        let currentRec = records[i];

        let d1 = "5", d2 = "8";
        if (subRecords.length >= 5) {
            let counts = {};
            let scoreMap = {};
            for (let eq of GLOBAL_EQUATIONS.slice(0, 30000)) {
                let val = evaluateEquation(subRecords, subRecords.length - 1, eq);
                if (val !== null) {
                    scoreMap[val] = (scoreMap[val] || 0) + 1;
                }
            }
            let sortedDigits = Object.keys(scoreMap).sort((a,b) => scoreMap[b] - scoreMap[a]);
            if (sortedDigits.length >= 2) {
                d1 = sortedDigits[0];
                d2 = sortedDigits[1];
            } else {
                d1 = subRecords[subRecords.length-1].top[2];
                d2 = subRecords[subRecords.length-1].bot[1];
                if (d1 === d2) d2 = (parseInt(d1)+1)%10 + "";
            }
        }

        let pairsD1 = generatePairs(d1, subRecords);
        let pairsD2 = generatePairs(d2, subRecords);
        let all10Pairs = [...pairsD1, ...pairsD2].sort();

        let top = currentRec.top;
        let bot = currentRec.bot;
        let isAnchorHit = checkAnchorHitExact(top, bot, d1) || checkAnchorHitExact(top, bot, d2);
        
        let exactPairMatched = false;
        let pairStrs = all10Pairs;
        for (let p of pairStrs) {
            let rev = p[1] + p[0];
            if (top.includes(p) || top.includes(rev) || bot.includes(p) || bot.includes(rev)) {
                exactPairMatched = true;
                break;
            }
        }

        if (isAnchorHit) anchorHits++;
        if (isAnchorHit) {
            totalAnchorHitForPair++;
            if (exactPairMatched) pairHitsInAnchor++;
        }

        auditLog.unshift({
            date: currentRec.date,
            top: top,
            bot: bot,
            anchor: `${d1} - ${d2}`,
            pairs: pairStrs.join(' '),
            isAnchorHit: isAnchorHit,
            isPairHit: exactPairMatched
        });

        if (i === records.length - 1) {
            lastPrediction = { d1, d2, pairsD1, pairsD2 };
        }
    }

    // If not enough records for loop, generate for last record
    if (!lastPrediction && records.length > 0) {
        lastPrediction = { d1: "5", d2: "8", pairsD1: generatePairs("5", records), pairsD2: generatePairs("8", records) };
    }

    let totalWalkCount = auditLog.length;
    let anchorHitRate = totalWalkCount > 0 ? Math.round((anchorHits / totalWalkCount) * 100) : 0;
    let pairHitRate = totalAnchorHitForPair > 0 ? Math.round((pairHitsInAnchor / totalAnchorHitForPair) * 100) : 0;

    return {
        anchorHitRate,
        pairHitRate,
        anchorHits,
        totalWalkCount,
        pairHitsInAnchor,
        totalAnchorHitForPair,
        auditLog,
        lastPrediction
    };
}

function generatePairs(digit, subRecords) {
    let freq = {};
    for (let i = 0; i <= 9; i++) freq[i.toString()] = 0;

    subRecords.slice(-15).forEach(r => {
        let s = r.top + r.bot;
        for (let char of s) {
            if (freq[char] !== undefined) freq[char]++;
        }
    });

    let candidates = Object.keys(freq).filter(k => k !== digit).sort((a,b) => freq[b] - freq[a]);
    let top5 = candidates.slice(0, 5);
    let rawPairs = top5.map(p => digit + p);
    // Sort each pair and sort array ascending
    let sortedPairs = rawPairs.map(p => p.split('').sort().join('')).sort();
    return sortedPairs;
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกชุดตัวเลขเรียบร้อยแล้ว!');
    });
}

function renderLotteryCard(catName, records, analysis) {
    let latest = records[records.length - 1];
    let pred = analysis.lastPrediction;
    let pairs1Str = pred.pairsD1.join(' ');
    let pairs2Str = pred.pairsD2.join(' ');
    let fullPairsText = `เด่น ${pred.d1}: ${pairs1Str} | เด่น ${pred.d2}: ${pairs2Str}`;

    let auditRows = analysis.auditLog.map(row => {
        let anchorStatus = row.isAnchorHit ? '<span class="tag-hit">เข้าเด่น</span>' : '<span class="tag-miss">พลาด</span>';
        let pairStatus = '-';
        if (row.isAnchorHit) {
            pairStatus = row.isPairHit ? '<span class="tag-hit">เข้าเจาะ 2 ตัว!</span>' : '<span class="tag-miss">พลาด</span>';
        }
        return `
            <tr>
                <td>${row.date}</td>
                <td>${row.top}/${row.bot}</td>
                <td>${row.anchor}</td>
                <td style="font-size:9px; color:var(--text-secondary);">${row.pairs}</td>
                <td>${anchorStatus}</td>
                <td>${pairStatus}</td>
            </tr>
        `;
    }).join('');

    return `
        <div class="lottery-card">
            <div class="lottery-header">
                <div>
                    <span class="lottery-name">${catName}</span>
                    <span class="lottery-meta">(${records.length} งวด | ทดสอบ ${analysis.totalWalkCount} งวด)</span>
                </div>
                <button onclick="copyToClipboard('${fullPairsText}')">คัดลอกชุดเจาะ</button>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">ฐานข้อมูลล่าสุด</span>
                    <span class="metric-value">${latest.date} (${latest.top}/${latest.bot})</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">HIT RATE (เลขเด่น)</span>
                    <span class="metric-value" style="color:var(--accent-green);">${analysis.anchorHitRate}% (${analysis.anchorHits}/${analysis.totalWalkCount})</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">HIT RATE (เลขเจาะ *เฉพาะงวดเด่นเข้า)</span>
                    <span class="metric-value" style="color:var(--accent-blue);">${analysis.pairHitRate}% (${analysis.pairHitsInAnchor}/${analysis.totalAnchorHitForPair})</span>
                </div>
            </div>

            <div class="prediction-box">
                <div class="anchor-col">
                    <div class="anchor-title"><span>เด่นหลักที่ 1</span><span>(5 คู่เจาะ เรียงน้อยไปมาก)</span></div>
                    <div class="anchor-number">${pred.d1}</div>
                    <div class="pairs-list">${pred.pairsD1.join('  ')}</div>
                </div>
                <div class="anchor-col">
                    <div class="anchor-title"><span>เด่นหลักที่ 2</span><span>(5 คู่เจาะ เรียงน้อยไปมาก)</span></div>
                    <div class="anchor-number">${pred.d2}</div>
                    <div class="pairs-list">${pred.pairsD2.join('  ')}</div>
                </div>
            </div>

            <div class="section-title" style="margin-top:12px; margin-bottom:4px;">
                <span>STRICT CAUSAL WALK-FORWARD AUDIT LOG</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>งวดวันที่</th>
                        <th>บน/ล่าง</th>
                        <th>เลขเด่น</th>
                        <th>ชุดเจาะ 10 คู่ (ไป-กลับ เรียงน้อยไปมาก)</th>
                        <th>ผลเลขเด่น</th>
                        <th>ผลเลขเจาะ</th>
                    </tr>
                </thead>
                <tbody>
                    ${auditRows}
                </tbody>
            </table>
        </div>
    `;
}
</script>

</body>
</html>
