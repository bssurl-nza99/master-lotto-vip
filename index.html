<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านเงินทอง - QUANTUM AI CORE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Flag Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap');

    :root {
      --cyan-glow: rgba(56, 189, 248, 0.6);
      --gold-glow: rgba(245, 158, 11, 0.5);
    }

    * {
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: #020408;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ultra-Thin High-End HUD Glass */
    .hud-glass {
      background: rgba(6, 14, 26, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 
                  inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .hud-glass-gold {
      background: rgba(20, 16, 8, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    /* Micro Pill for Flags */
    .flag-capsule {
      background: rgba(10, 22, 40, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.12);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flag-capsule:hover, .flag-capsule.active {
      background: rgba(14, 165, 233, 0.15);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }

    /* Hologram Tech Lines */
    .scan-line {
      background: linear-gradient(180deg, rgba(56,189,248,0) 0%, rgba(56,189,248,0.15) 50%, rgba(56,189,248,0) 100%);
      animation: scan 4s ease-in-out infinite;
    }

    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="max-w-md mx-auto p-3 pb-20 relative text-slate-200">

  <!-- TOP MINIMAL HIGH-END HEADER -->
  <header class="hud-glass rounded-2xl p-2.5 mb-3 flex items-center justify-between sticky top-2 z-50">
    <div class="flex items-center gap-2.5">
      <div class="relative w-8 h-8 rounded-xl bg-black/60 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shadow-[0_0_12px_rgba(56,189,248,0.25)]">
        <i class="fa-solid fa-atom text-xs animate-spin" style="animation-duration: 8s;"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-xs font-semibold text-white tracking-wide">บ้านเงินทอง</h1>
          <span class="text-[8px] font-mono-tech text-amber-400 bg-amber-950/40 px-1.5 py-0.2 rounded border border-amber-500/30">PRO</span>
        </div>
        <p class="text-[8px] font-mono-tech text-slate-400 tracking-wider">QUANTUM AI • ARCHITECTURE v9.4</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 text-[8px] font-mono-tech text-cyan-400 bg-cyan-950/40 px-2 py-0.5 rounded-full border border-cyan-500/20">
        <span class="w-1 h-1 rounded-full bg-cyan-400 animate-ping"></span> LIVE
      </div>
    </div>
  </header>

  <!-- 3D HIGH-END COMPACT HOLOGRAM CORE -->
  <section class="relative w-full h-[290px] rounded-2xl overflow-hidden hud-glass mb-3 flex items-center justify-center">
    
    <!-- Ambient Scanline Effect -->
    <div class="absolute inset-0 scan-line pointer-events-none"></div>

    <!-- Interactive 3D Canvas (Rotatable Brain + Laser Circuit Beams + Microchip) -->
    <canvas id="quantumBrainCanvas" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-0"></canvas>

    <!-- FLOATING HIGH-END MINIMAL HUD OVERLAYS -->
    
    <!-- Top-Left Micro Metric -->
    <div class="absolute top-2.5 left-2.5 hud-glass p-2 rounded-xl pointer-events-none backdrop-blur-md">
      <div class="text-[7px] font-mono-tech text-slate-400 tracking-wider">NEURAL LOAD</div>
      <div class="text-[10px] font-mono-tech text-cyan-400 font-medium">98.2<span class="text-[8px] text-slate-500">%</span></div>
    </div>

    <!-- Top-Right Micro Metric -->
    <div class="absolute top-2.5 right-2.5 hud-glass p-2 rounded-xl pointer-events-none text-right backdrop-blur-md">
      <div class="text-[7px] font-mono-tech text-slate-400 tracking-wider">PRECISION</div>
      <div class="text-[10px] font-mono-tech text-amber-400 font-medium">99.85<span class="text-[8px] text-slate-500">%</span></div>
    </div>

    <!-- Bottom-Left Status Pill -->
    <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 hud-glass px-2.5 py-1 rounded-full pointer-events-none">
      <i class="fa-solid fa-microchip text-[9px] text-cyan-400"></i>
      <span class="text-[8px] font-mono-tech text-slate-300">CORE: SYNAPSE-X</span>
    </div>

    <!-- Bottom-Right Hint -->
    <div class="absolute bottom-2.5 right-2.5 text-[7px] font-mono-tech text-slate-500 pointer-events-none">
      <i class="fa-solid fa-hand-pointer text-[8px] animate-bounce mr-0.5"></i> TOUCH TO ROTATE
    </div>
  </section>

  <!-- INTERNATIONAL MARKETS (16 FLAGS - HIGH-END COMPACT DESIGN) -->
  <section class="hud-glass rounded-2xl p-3 mb-3">
    <div class="flex justify-between items-center mb-2.5">
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-globe text-xs text-cyan-400"></i>
        <h2 class="text-xs font-medium text-white">ตลาดหวยนานาชาติ</h2>
      </div>
      <span class="text-[8px] font-mono-tech text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded-full border border-slate-800">16 MARKETS</span>
    </div>

    <!-- 16 Flag Capsules Grid -->
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="selectMarket('รัฐบาลไทย', 'th')" class="flag-capsule active p-1.5 rounded-xl flex items-center gap-1.5" id="flag-th">
        <span class="fi fi-th text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ไทย</span>
      </button>
      <button onclick="selectMarket('ฮานอย', 'vn')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-vn">
        <span class="fi fi-vn text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ฮานอย</span>
      </button>
      <button onclick="selectMarket('ลาว', 'la')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-la">
        <span class="fi fi-la text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ลาว</span>
      </button>
      <button onclick="selectMarket('มาเลเซีย', 'my')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-my">
        <span class="fi fi-my text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">มาเลย์</span>
      </button>

      <button onclick="selectMarket('ดาวโจนส์', 'us')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-us">
        <span class="fi fi-us text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ดาวโจนส์</span>
      </button>
      <button onclick="selectMarket('นิเคอิ', 'jp')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-jp">
        <span class="fi fi-jp text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">นิเคอิ</span>
      </button>
      <button onclick="selectMarket('จีน', 'cn')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-cn">
        <span class="fi fi-cn text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">จีน</span>
      </button>
      <button onclick="selectMarket('ฮั่งเส็ง', 'hk')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-hk">
        <span class="fi fi-hk text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ฮั่งเส็ง</span>
      </button>

      <button onclick="selectMarket('ไต้หวัน', 'tw')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-tw">
        <span class="fi fi-tw text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">ไต้หวัน</span>
      </button>
      <button onclick="selectMarket('เกาหลี', 'kr')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-kr">
        <span class="fi fi-kr text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">เกาหลี</span>
      </button>
      <button onclick="selectMarket('สิงคโปร์', 'sg')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-sg">
        <span class="fi fi-sg text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">สิงคโปร์</span>
      </button>
      <button onclick="selectMarket('อินเดีย', 'in')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-in">
        <span class="fi fi-in text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">อินเดีย</span>
      </button>

      <button onclick="selectMarket('อียิปต์', 'eg')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-eg">
        <span class="fi fi-eg text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">อียิปต์</span>
      </button>
      <button onclick="selectMarket('รัสเซีย', 'ru')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-ru">
        <span class="fi fi-ru text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">รัสเซีย</span>
      </button>
      <button onclick="selectMarket('เยอรมัน', 'de')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-de">
        <span class="fi fi-de text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">เยอรมัน</span>
      </button>
      <button onclick="selectMarket('อังกฤษ', 'gb')" class="flag-capsule p-1.5 rounded-xl flex items-center gap-1.5" id="flag-gb">
        <span class="fi fi-gb text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-200 font-normal truncate">อังกฤษ</span>
      </button>
    </div>

    <!-- Selected Market Details Glass Box -->
    <div class="mt-2.5 hud-glass-gold p-2.5 rounded-xl">
      <div class="flex justify-between items-center mb-2">
        <div class="text-[10px] font-medium text-amber-300 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-amber-400 text-[9px]"></i>
          <span id="market-title">รัฐบาลไทย</span>
        </div>
        <span class="text-[8px] font-mono-tech text-slate-400" id="market-count">4 SUB-MARKETS</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5" id="market-items-container"></div>
    </div>
  </section>

  <!-- COMPACT BOTTOM DOCK (HIGH-END MINIMAL) -->
  <nav class="fixed bottom-2 left-3 right-3 max-w-md mx-auto hud-glass px-4 py-2 flex justify-around items-center z-50 rounded-2xl">
    <button class="flex flex-col items-center gap-0.5 text-cyan-400">
      <i class="fa-solid fa-compass text-xs"></i>
      <span class="text-[8px] font-mono-tech">CORE</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white transition-colors">
      <i class="fa-solid fa-chart-simple text-xs"></i>
      <span class="text-[8px] font-mono-tech">AUDIT</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white transition-colors">
      <i class="fa-solid fa-layer-group text-xs"></i>
      <span class="text-[8px] font-mono-tech">MATRIX</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-white transition-colors">
      <i class="fa-solid fa-gear text-xs"></i>
      <span class="text-[8px] font-mono-tech">CONFIG</span>
    </button>
  </nav>

  <!-- JAVASCRIPT LOGIC & 3D RENDER ENGINE -->
  <script>
    const marketData = {
      'รัฐบาลไทย': ['รัฐบาลไทย', 'ออมสิน', 'ธ.ก.ส.', 'หุ้นไทย 4 รอบ'],
      'ฮานอย': ['ฮานอยเฉพาะกิจ', 'ฮานอยพิเศษ', 'ฮานอยปกติ', 'ฮานอย VIP', 'ฮานอยพัฒนา'],
      'ลาว': ['ลาวพัฒนา', 'ลาว VIP', 'ลาวสตาร์', 'ลาวสามัคคี', 'ลาว EXTRA'],
      'มาเลเซีย': ['มาเลย์ Magnum', 'Damacai 1+3D', 'Toto 4D', 'Sabah 88'],
      'ดาวโจนส์': ['ดาวโจนส์ VIP', 'ดาวโจนส์ Star', 'ดาวโจนส์ ปกติ'],
      'นิเคอิ': ['นิเคอิ เช้า', 'นิเคอิ บ่าย', 'นิเคอิ VIP'],
      'จีน': ['จีน เช้า', 'จีน บ่าย', 'จีน VIP'],
      'ฮั่งเส็ง': ['ฮั่งเส็ง เช้า', 'ฮั่งเส็ง บ่าย', 'ฮั่งเส็ง VIP'],
      'ไต้หวัน': ['ไต้หวัน ปกติ', 'ไต้หวัน VIP'],
      'เกาหลี': ['เกาหลี ปกติ', 'เกาหลี VIP'],
      'สิงคโปร์': ['สิงคโปร์ ปกติ', 'สิงคโปร์ VIP'],
      'อินเดีย': ['อินเดีย Bombay', 'อินเดีย VIP'],
      'อียิปต์': ['อียิปต์ ปกติ', 'อียิปต์ VIP'],
      'รัสเซีย': ['รัสเซีย ปกติ', 'รัสเซีย VIP'],
      'เยอรมัน': ['เยอรมัน ปกติ', 'เยอรมัน VIP'],
      'อังกฤษ': ['อังกฤษ ปกติ', 'อังกฤษ VIP']
    };

    function selectMarket(name, code) {
      document.querySelectorAll('.flag-capsule').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`flag-${code}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('market-title').innerText = name;
      const items = marketData[name] || ['หวยปกติ', 'หวย VIP'];
      document.getElementById('market-count').innerText = `${items.length} SUB-MARKETS`;

      const container = document.getElementById('market-items-container');
      container.innerHTML = items.map(item => `
        <div class="bg-black/40 border border-slate-800/80 p-1.5 rounded-lg flex items-center justify-between">
          <span class="text-[9px] text-slate-200 font-normal truncate">${item}</span>
          <span class="text-[7px] font-mono-tech text-amber-400 bg-amber-950/60 px-1 py-0.2 rounded border border-amber-800/50">SYNCED</span>
        </div>
      `).join('');
    }

    selectMarket('รัฐบาลไทย', 'th');

    // =========================================================
    // HIGH-END 3D HOLOGRAM ENGINE (INTERACTIVE BRAIN + LASER BEAMS)
    // =========================================================
    const canvas = document.getElementById('quantumBrainCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Generate Brain Hemisphere Coordinates
    const nodes = [];
    const nodeCount = 220;

    for (let i = 0; i < nodeCount; i++) {
      const isLeft = Math.random() > 0.5;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const radius = 34 + Math.random() * 8;

      let x = radius * Math.sin(phi) * Math.cos(theta);
      let y = radius * Math.sin(phi) * Math.sin(theta);
      let z = radius * Math.cos(phi);

      x += isLeft ? -11 : 11;
      y *= 0.75; // Organic brain compression

      nodes.push({ x, y, z, origX: x, origY: y, origZ: z });
    }

    // Laser Beams
    const laserBeams = [];
    for (let i = 0; i < 25; i++) {
      laserBeams.push({
        x: (Math.random() - 0.5) * 80,
        y: 110,
        speed: Math.random() * 1.8 + 0.8,
        length: Math.random() * 20 + 8,
        alpha: Math.random() * 0.7 + 0.2
      });
    }

    let rotX = 0;
    let rotY = 0;
    let targetRotY = 0;
    let isDragging = false;
    let lastMouseX = 0;

    // Interactive Drag Controls
    canvas.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; });
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const delta = e.clientX - lastMouseX;
        targetRotY += delta * 0.01;
        lastMouseX = e.clientX;
      }
    });
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('touchstart', (e) => { isDragging = true; lastMouseX = e.touches[0].clientX; });
    canvas.addEventListener('touchmove', (e) => {
      if (isDragging) {
        const delta = e.touches[0].clientX - lastMouseX;
        targetRotY += delta * 0.01;
        lastMouseX = e.touches[0].clientX;
      }
    });
    window.addEventListener('touchend', () => isDragging = false);

    function render3D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 15;

      // Auto-rotation when not dragging
      if (!isDragging) {
        targetRotY += 0.005;
      }
      rotY += (targetRotY - rotY) * 0.1;

      // --- 1. CHIP BASE (AI CORE) ---
      const chipY = cy + 90;
      ctx.save();
      ctx.translate(cx, chipY);

      // Microchip Glow Platform
      ctx.fillStyle = 'rgba(6, 182, 212, 0.12)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
      ctx.lineWidth = 1;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.rect(-50, -14, 100, 28);
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.font = 'bold 8px "JetBrains Mono"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('BAN NGEN THONG AI', 0, -1);
      ctx.font = '6px "JetBrains Mono"';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('QUANTUM CHIP', 0, 8);
      ctx.restore();

      // --- 2. UPWARD LASER DATA BEAMS ---
      laserBeams.forEach(b => {
        b.y -= b.speed;
        if (b.y < cy - 20) b.y = chipY - 10;

        const bx = cx + b.x * 0.5;
        ctx.strokeStyle = `rgba(56, 189, 248, ${b.alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx, b.y);
        ctx.lineTo(bx, b.y - b.length);
        ctx.stroke();
      });

      // --- 3. 3D HOLOGRAM BRAIN ---
      const projected = [];
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);

      nodes.forEach(node => {
        const rx = node.origX * cosY - node.origZ * sinY;
        const rz = node.origX * sinY + node.origZ * cosY;
        const ry = node.origY;

        const perspective = 180 / (180 + rz);
        const px = cx + rx * perspective;
        const py = cy + ry * perspective;

        projected.push({ x: px, y: py, scale: perspective, z: rz });
      });

      // Draw Synaptic Connections
      ctx.lineWidth = 0.5;
      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const dx = projected[i].x - projected[j].x;
          const dy = projected[i].y - projected[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 18) {
            const alpha = (1 - dist / 18) * 0.4;
            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(projected[i].x, projected[i].y);
            ctx.lineTo(projected[j].x, projected[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw Synapse Nodes
      projected.forEach(p => {
        const radius = Math.max(0.6, 1.8 * p.scale);
        ctx.fillStyle = p.z > 0 ? '#38bdf8' : '#0284c7';
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(render3D);
    }

    render3D();
  </script>
</body>
</html>
