<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar 2D Luxury VIP Classic</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #1b5e20; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; color: #444; font-size: 14px; }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            height: 130px;
            resize: vertical;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
        }
        .btn-process { background-color: #1b5e20; color: white; }
        .btn-process:hover { background-color: #0d3811; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .btn-reset { background-color: #c62828; color: white; }

        .card {
            background: linear-gradient(145deg, #fdfbf7, #f7f3ea);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            padding: 24px;
            margin-top: 25px;
            border: 1px solid #e8e1d1;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ded6c2;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .card-title-area { display: flex; align-items: center; gap: 12px; }
        .flag { font-size: 28px; }
        .title-text h3 { margin: 0; font-size: 18px; color: #222; }
        
        .time-badge {
            font-size: 12px;
            color: #854d0e;
            background: #fef9c3;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid #fef08a;
            display: inline-block;
            margin-top: 4px;
            white-space: nowrap;
        }
        .date-badge { 
            font-weight: 600; 
            color: #333; 
            background: #fff; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            border: 1px solid #e2e8f0;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .top-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .top-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .top-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .top-1-circle { background: linear-gradient(135deg, #e65100, #f57c00); }
        .top-2-circle { background: linear-gradient(135deg, #607d8b, #78909c); }
        .top-3-circle { background: linear-gradient(135deg, #0d47a1, #1976d2); }
        .top-label { font-size: 11px; font-weight: 600; color: #555; }

        .section-group {
            margin-top: 14px;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #e8e1d1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        .grid-pairs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .pair-box {
            border-radius: 8px;
            text-align: center;
            padding: 8px 0;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid;
        }
        
        .row-1 .pair-box { background-color: #fffbf0; border-color: #fde047; color: #a16207; }
        .row-2 .pair-box { background-color: #f8fafc; border-color: #cbd5e1; color: #334155; }
        .row-3 .pair-box { background-color: #fffbf0; border-color: #fde047; color: #a16207; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇲🇲 ระบบประมวลผลหวยพม่า 2D (Classic Luxury VIP)</h2>
    
    <div class="form-group">
        <label for="dataInput">วางข้อมูลสถิติ (ข้อมูลประวัติทั้งหมด):</label>
        <textarea id="dataInput" placeholder="วางข้อมูลสถิติที่นี่..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-process" onclick="processAllCards()">ประมวลผลความแม่นยำสูง</button>
        <button class="btn-clear" onclick="clearInput()">ล้างข้อมูล</button>
        <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>

    <div id="resultContainer" style="display: none;">
        <div class="card" id="cardLunch"></div>
        <div class="card" id="cardEvening"></div>
        <div class="card" id="cardAllDay"></div>
    </div>
</div>

<script>
    function clearInput() { document.getElementById('dataInput').value = ''; }
    function resetAll() {
        document.getElementById('dataInput').value = '';
        document.getElementById('resultContainer').style.display = 'none';
    }

    // อัพเกรดตรรกะคำนวณด้วยสูตรคณิตศาสตร์เชิงตำแหน่ง (Positional & Modular Arithmetic Engine)
    function analyzeAdvancedMathEngine(records, mode) {
        // mode: 'lunch', 'evening', 'allday'
        let lastRecord = records.length > 0 ? records[records.length - 1] : { lunch: '57', evening: '31', date: 'วันนี้' };
        
        let t1 = '0', t2 = '1', t3 = '2';

        if (mode === 'lunch') {
            // สูตรสำหรับรอบเที่ยง: นำผลรวมของเลขรอบเที่ยงวันก่อนหน้า มาหาหลักหน่วยเป็นตัวแรก +1, +1
            let l = lastRecord.lunch;
            let sumVal = parseInt(l[0]) + parseInt(l[1]);
            let base1 = sumVal % 10;
            let base2 = (base1 + 1) % 10;
            let base3 = (base1 + 2) % 10;
            t1 = base1.toString();
            t2 = base2.toString();
            t3 = base3.toString();
        } else if (mode === 'evening') {
            // สูตรสำหรับรอบเย็น: นำหลักหน่วยของรอบเย็นวันก่อนหน้า ลบออกจาก 10 (ฐาน 10) หรือบวกผลสิบเที่ยงกับสิบเย็น
            let evUnit = parseInt(lastRecord.evening[1]);
            let base1 = (10 - evUnit) % 10;
            let base2 = (base1 + 1) % 10;
            let base3 = (base1 + 2) % 10;
            t1 = base1.toString();
            t2 = base2.toString();
            t3 = base3.toString();
        } else {
            // สูตรชุดทั้งวัน: ผสานผลสิบเที่ยง + หลักสิบเย็น
            let d1 = parseInt(lastRecord.lunch[0]);
            let d2 = parseInt(lastRecord.evening[0]);
            let sumVal = d1 + d2;
            let base1 = sumVal % 10;
            let base2 = (base1 + 1) % 10;
            let base3 = (base1 + 2) % 10;
            t1 = base1.toString();
            t2 = base2.toString();
            t3 = base3.toString();
        }

        function generateExactPairs(digit) {
            let pairs = [];
            let dInt = parseInt(digit);
            // สร้างเลขเจาะ 5 คู่ตามแพทเทิร์นความสัมพันธ์เชิงสถิติ
            for (let i = 0; i < 5; i++) {
                let partner = (dInt + i * 2) % 10;
                let pStr = digit + partner.toString();
                let revStr = partner.toString() + digit;
                if (!pairs.includes(pStr) && !pairs.includes(revStr)) {
                    pairs.push(pStr);
                }
            }
            if (pairs.length < 5) {
                for (let i = 0; i <= 9; i++) {
                    let pStr = digit + i.toString();
                    if (!pairs.includes(pStr) && pairs.length < 5) pairs.push(pStr);
                }
            }
            return pairs.sort();
        }

        let countOccurrences = (target, list) => {
            let count = 0;
            list.forEach(r => { 
                if (r.lunch.includes(target) || r.evening.includes(target)) count++; 
            });
            return count;
        };

        return {
            t1, t2, t3,
            c1: countOccurrences(t1, records),
            c2: countOccurrences(t2, records),
            c3: countOccurrences(t3, records),
            pairsT1: generateExactPairs(t1),
            pairsT2: generateExactPairs(t2),
            pairsT3: generateExactPairs(t3),
            targetDate: lastRecord.date
        };
    }

    function generateCardHTML(title, roundTextBurmese, data) {
        let renderRow = (pairs) => {
            let html = '';
            pairs.forEach(p => { html += `<div class="pair-box">${p}</div>`; });
            return html;
        };

        return `
            <div class="card-header">
                <div class="card-title-area">
                    <span class="flag">🇲🇲</span>
                    <div class="title-text">
                        <h3>${title}</h3>
                        <div class="time-badge">${roundTextBurmese}</div>
                    </div>
                </div>
                <div class="date-badge">อิงสถิติ: ${data.targetDate}</div>
            </div>
            
            <div class="top-container">
                <div class="top-item">
                    <div class="top-circle top-1-circle">${data.t1}</div>
                    <span class="top-label">Top 1</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-2-circle">${data.t2}</div>
                    <span class="top-label">Top 2</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-3-circle">${data.t3}</div>
                    <span class="top-label">Top 3</span>
                </div>
            </div>

            <div class="section-group row-1">
                <div class="section-title">Top 1 (${data.c1})</div>
                <div class="grid-pairs">${renderRow(data.pairsT1)}</div>
            </div>

            <div class="section-group row-2">
                <div class="section-title">Top 2 (${data.c2})</div>
                <div class="grid-pairs">${renderRow(data.pairsT2)}</div>
            </div>

            <div class="section-group row-3">
                <div class="section-title">Top 3 (${data.c3})</div>
                <div class="grid-pairs">${renderRow(data.pairsT3)}</div>
            </div>
        `;
    }

    function processAllCards() {
        const rawText = document.getElementById('dataInput').value.trim();
        if (!rawText) { alert('กรุณากรอกข้อมูลสถิติก่อนทำการประมวลผล'); return; }

        const lines = rawText.split('\n');
        let records = [];

        lines.forEach(line => {
            if (line.includes('--')) {
                let parts = line.split(':');
                if (parts.length >= 2) {
                    let datePart = parts[0].replace('🗓', '').trim();
                    let results = parts[1].split('--');
                    let lunchNum = results[0] ? results[0].trim() : '';
                    let eveningNum = results[1] ? results[1].trim() : '';

                    if (lunchNum.length === 2 && eveningNum.length === 2) { 
                        records.push({ date: datePart, lunch: lunchNum, evening: eveningNum });
                    }
                }
            }
        });

        if (records.length === 0) { alert('รูปแบบข้อมูลไม่ถูกต้อง กรุณาตรวจสอบรูปแบบสถิติ'); return; }

        let lunchData = analyzeAdvancedMathEngine(records, 'lunch');
        let eveningData = analyzeAdvancedMathEngine(records, 'evening');
        let allDayData = analyzeAdvancedMathEngine(records, 'allday');

        document.getElementById('cardLunch').innerHTML = generateCardHTML("Myanmar 2D", "နေ့လည် (12:01 PM)", lunchData);
        document.getElementById('cardEvening').innerHTML = generateCardHTML("Myanmar 2D", "ညနေ (4:30 PM)", eveningData);
        document.getElementById('cardAllDay').innerHTML = generateCardHTML("Myanmar 2D", "ชุดทั้งวัน (All Day)", allDayData);

        document.getElementById('resultContainer').style.display = 'block';
    }
</script>

</body>
</html>
