<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านเงินทอง — NEURAL ARCHITECTURE</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Prompt:wght@200;300;400;500&family=JetBrains+Mono:wght@200;300;400;500&display=swap');

    * {
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: #030508;
      color: #cbd5e1;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Dark Luxury Glass */
    .luxury-glass {
      background: rgba(8, 12, 20, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    /* Subtle Border Highlight */
    .luxury-border-gold {
      border: 1px solid rgba(212, 175, 55, 0.2);
      background: rgba(15, 12, 5, 0.4);
    }

    /* Flag Capsule Minimal */
    .flag-pill {
      background: rgba(10, 16, 26, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flag-pill:hover, .flag-pill.active {
      background: rgba(14, 165, 233, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      transform: translateY(-1px);
    }

    /* Grid Background Overlay */
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="max-w-md mx-auto p-3 pb-24 relative bg-grid-pattern">

  <!-- TOP MINIMAL LUXURY HEADER BAR -->
  <header class="luxury-glass rounded-2xl p-2.5 mb-3 flex items-center justify-between sticky top-2 z-50">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-slate-950/80 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
        <i class="fa-solid fa-cube text-xs"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-xs font-light tracking-widest text-white uppercase">บ้านเงินทอง</h1>
          <span class="text-[7px] font-mono-tech text-amber-400/90 border border-amber-500/20 px-1 rounded bg-amber-950/30">STUDIO</span>
        </div>
        <p class="text-[7px] font-mono-tech text-slate-500 tracking-wider">SYNAPSE AI ENGINE • V9.0</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 text-[8px] font-mono-tech text-cyan-400/80 bg-slate-950/60 px-2 py-0.5 rounded-full border border-slate-800">
      <span class="w-1 h-1 rounded-full bg-cyan-400 animate-pulse"></span> SYSTEM READY
    </div>
  </header>

  <!-- CINEMATIC 3D HOLOGRAM BRAIN & AI CHIP SECTION -->
  <section class="relative w-full h-[320px] rounded-2xl overflow-hidden luxury-glass mb-3 flex items-center justify-center">
    
    <!-- 3D Canvas Engine -->
    <canvas id="cinematicBrainCanvas" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-0"></canvas>

    <!-- FLOATING HUD METRICS (LUXURY MINIMAL) -->
    <div class="absolute top-3 left-3 p-2 rounded-xl bg-black/40 border border-white/5 pointer-events-none backdrop-blur-md">
      <div class="text-[6px] font-mono-tech text-slate-500 tracking-widest">QUANTUM MATRIX</div>
      <div class="text-[10px] font-mono-tech text-slate-200">99.98<span class="text-[7px] text-cyan-400">% ACCURACY</span></div>
    </div>

    <div class="absolute top-3 right-3 p-2 rounded-xl bg-black/40 border border-white/5 pointer-events-none text-right backdrop-blur-md">
      <div class="text-[6px] font-mono-tech text-slate-500 tracking-widest">LATENCY</div>
      <div class="text-[10px] font-mono-tech text-emerald-400">1.2ms</div>
    </div>

    <div class="absolute bottom-3 left-3 text-[7px] font-mono-tech text-slate-500 pointer-events-none flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-cyan-400/80"></span> INTERACTIVE 3D MODEL
    </div>
  </section>

  <!-- INTERNATIONAL MARKETS (16 FLAGS) -->
  <section class="luxury-glass rounded-2xl p-3 mb-3">
    <div class="flex justify-between items-center mb-2.5">
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-globe text-[10px] text-cyan-400/80"></i>
        <h2 class="text-xs font-light tracking-wide text-white">ตลาดหวยนานาชาติ</h2>
      </div>
      <span class="text-[7px] font-mono-tech text-slate-500 uppercase tracking-widest">16 MARKETS</span>
    </div>

    <!-- 16 Flags Grid -->
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="selectMarket('รัฐบาลไทย', 'th')" class="flag-pill active p-1.5 rounded-xl flex items-center gap-1.5" id="flag-th">
        <span class="fi fi-th text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ไทย</span>
      </button>
      <button onclick="selectMarket('ฮานอย', 'vn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-vn">
        <span class="fi fi-vn text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ฮานอย</span>
      </button>
      <button onclick="selectMarket('ลาว', 'la')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-la">
        <span class="fi fi-la text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ลาว</span>
      </button>
      <button onclick="selectMarket('มาเลเซีย', 'my')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-my">
        <span class="fi fi-my text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">มาเลย์</span>
      </button>

      <button onclick="selectMarket('ดาวโจนส์', 'us')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-us">
        <span class="fi fi-us text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ดาวโจนส์</span>
      </button>
      <button onclick="selectMarket('นิเคอิ', 'jp')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-jp">
        <span class="fi fi-jp text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">นิเคอิ</span>
      </button>
      <button onclick="selectMarket('จีน', 'cn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-cn">
        <span class="fi fi-cn text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">จีน</span>
      </button>
      <button onclick="selectMarket('ฮั่งเส็ง', 'hk')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-hk">
        <span class="fi fi-hk text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ฮั่งเส็ง</span>
      </button>

      <button onclick="selectMarket('ไต้หวัน', 'tw')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-tw">
        <span class="fi fi-tw text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">ไต้หวัน</span>
      </button>
      <button onclick="selectMarket('เกาหลี', 'kr')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-kr">
        <span class="fi fi-kr text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">เกาหลี</span>
      </button>
      <button onclick="selectMarket('สิงคโปร์', 'sg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-sg">
        <span class="fi fi-sg text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">สิงคโปร์</span>
      </button>
      <button onclick="selectMarket('อินเดีย', 'in')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-in">
        <span class="fi fi-in text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">อินเดีย</span>
      </button>

      <button onclick="selectMarket('อียิปต์', 'eg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-eg">
        <span class="fi fi-eg text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">อียิปต์</span>
      </button>
      <button onclick="selectMarket('รัสเซีย', 'ru')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-ru">
        <span class="fi fi-ru text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">รัสเซีย</span>
      </button>
      <button onclick="selectMarket('เยอรมัน', 'de')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-de">
        <span class="fi fi-de text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">เยอรมัน</span>
      </button>
      <button onclick="selectMarket('อังกฤษ', 'gb')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-gb">
        <span class="fi fi-gb text-xs rounded-sm shrink-0"></span>
        <span class="text-[9px] text-slate-300 font-light truncate">อังกฤษ</span>
      </button>
    </div>

    <!-- Selected Market Box -->
    <div class="mt-2.5 luxury-border-gold p-2.5 rounded-xl">
      <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] font-light text-amber-200 tracking-wide" id="market-title">รัฐบาลไทย</span>
        <span class="text-[7px] font-mono-tech text-slate-500" id="market-count">4 SUB-ITEMS</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5" id="market-items-container"></div>
    </div>
  </section>

  <!-- FIXED LUXURY BOTTOM DOCK -->
  <nav class="fixed bottom-3 left-3 right-3 max-w-md mx-auto luxury-glass px-5 py-2.5 flex justify-around items-center z-50 rounded-2xl border border-white/10">
    <button class="text-cyan-400 flex flex-col items-center gap-0.5">
      <i class="fa-solid fa-atom text-xs"></i>
      <span class="text-[7px] font-mono-tech tracking-wider">CORE</span>
    </button>
    <button class="text-slate-500 hover:text-slate-200 flex flex-col items-center gap-0.5 transition-colors">
      <i class="fa-solid fa-chart-line text-xs"></i>
      <span class="text-[7px] font-mono-tech tracking-wider">AUDIT</span>
    </button>
    <button class="text-slate-500 hover:text-slate-200 flex flex-col items-center gap-0.5 transition-colors">
      <i class="fa-solid fa-sliders text-xs"></i>
      <span class="text-[7px] font-mono-tech tracking-wider">CONFIG</span>
    </button>
  </nav>

  <script>
    const marketData = {
      'รัฐบาลไทย': ['รัฐบาลไทย', 'ออมสิน', 'ธ.ก.ส.', 'หุ้นไทย 4 รอบ'],
      'ฮานอย': ['ฮานอยเฉพาะกิจ', 'ฮานอยพิเศษ', 'ฮานอยปกติ', 'ฮานอย VIP', 'ฮานอยพัฒนา'],
      'ลาว': ['ลาวพัฒนา', 'ลาว VIP', 'ลาวสตาร์', 'ลาวสามัคคี', 'ลาว EXTRA'],
      'มาเลเซีย': ['มาเลย์ Magnum', 'Damacai 1+3D', 'Toto 4D', 'Sabah 88'],
      'ดาวโจนส์': ['ดาวโจนส์ VIP', 'ดาวโจนส์ Star', 'ดาวโจนส์ ปกติ'],
      'นิเคอิ': ['นิเคอิ เช้า', 'นิเคอิ บ่าย', 'นิเคอิ VIP'],
      'จีน': ['จีน เช้า', 'จีน บ่าย', 'จีน VIP'],
      'ฮั่งเส็ง': ['ฮั่งเส็ง เช้า', 'ฮั่งเส็ง บ่าย', 'ฮั่งเส็ง VIP'],
      'ไต้หวัน': ['ไต้หวัน ปกติ', 'ไต้หวัน VIP'],
      'เกาหลี': ['เกาหลี ปกติ', 'เกาหลี VIP'],
      'สิงคโปร์': ['สิงคโปร์ ปกติ', 'สิงคโปร์ VIP'],
      'อินเดีย': ['อินเดีย Bombay', 'อินเดีย VIP'],
      'อียิปต์': ['อียิปต์ ปกติ', 'อียิปต์ VIP'],
      'รัสเซีย': ['รัสเซีย ปกติ', 'รัสเซีย VIP'],
      'เยอรมัน': ['เยอรมัน ปกติ', 'เยอรมัน VIP'],
      'อังกฤษ': ['อังกฤษ ปกติ', 'อังกฤษ VIP']
    };

    function selectMarket(name, code) {
      document.querySelectorAll('.flag-pill').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`flag-${code}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('market-title').innerText = name;
      const items = marketData[name] || ['หวยปกติ', 'หวย VIP'];
      document.getElementById('market-count').innerText = `${items.length} SUB-ITEMS`;

      const container = document.getElementById('market-items-container');
      container.innerHTML = items.map(item => `
        <div class="bg-black/40 border border-white/5 p-1.5 rounded-lg flex items-center justify-between">
          <span class="text-[9px] text-slate-300 font-light truncate">${item}</span>
          <span class="text-[7px] font-mono-tech text-amber-400/80 bg-amber-950/40 px-1 py-0.2 rounded">LIVE</span>
        </div>
      `).join('');
    }

    selectMarket('รัฐบาลไทย', 'th');

    // -------------------------------------------------------------
    // CINEMATIC 3D BRAIN & DATA STREAM ANIMATION
    // -------------------------------------------------------------
    const canvas = document.getElementById('cinematicBrainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Brain Coordinates Generator
    const brainNodes = [];
    const count = 230;

    for (let i = 0; i < count; i++) {
      const isLeft = Math.random() > 0.5;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const r = 36 + Math.random() * 8;

      let x = r * Math.sin(phi) * Math.cos(theta);
      let y = r * Math.sin(phi) * Math.sin(theta);
      let z = r * Math.cos(phi);

      x += isLeft ? -10 : 10;
      y *= 0.75;

      brainNodes.push({ x, y, z, origX: x, origY: y, origZ: z });
    }

    // Energy Light Beams
    const beams = [];
    for (let i = 0; i < 20; i++) {
      beams.push({
        x: (Math.random() - 0.5) * 70,
        y: 120,
        speed: Math.random() * 1.5 + 0.8,
        length: Math.random() * 18 + 8,
        alpha: Math.random() * 0.6 + 0.1
      });
    }

    let angleY = 0;
    let targetAngleY = 0;
    let isDragging = false;
    let startX = 0;

    canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        targetAngleY += (e.clientX - startX) * 0.008;
        startX = e.clientX;
      }
    });
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].clientX; });
    canvas.addEventListener('touchmove', (e) => {
      if (isDragging) {
        targetAngleY += (e.touches[0].clientX - startX) * 0.008;
        startX = e.touches[0].clientX;
      }
    });
    window.addEventListener('touchend', () => isDragging = false);

    function renderCinematic() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 10;

      if (!isDragging) targetAngleY += 0.004;
      angleY += (targetAngleY - angleY) * 0.1;

      // Chip Base
      const chipY = cy + 95;
      ctx.save();
      ctx.translate(cx, chipY);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.rect(-45, -12, 90, 24);
      ctx.fill();
      ctx.stroke();

      ctx.font = '7px "JetBrains Mono"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('BAN NGEN THONG AI', 0, -1);
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('NEURAL ARCHITECTURE', 0, 7);
      ctx.restore();

      // Energy Beams
      beams.forEach(b => {
        b.y -= b.speed;
        if (b.y < cy - 20) b.y = chipY - 8;

        const bx = cx + b.x * 0.5;
        ctx.strokeStyle = `rgba(56, 189, 248, ${b.alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx, b.y);
        ctx.lineTo(bx, b.y - b.length);
        ctx.stroke();
      });

      // 3D Rotating Brain
      const projected = [];
      const cos = Math.cos(angleY);
      const sin = Math.sin(angleY);

      brainNodes.forEach(node => {
        const rx = node.origX * cos - node.origZ * sin;
        const rz = node.origX * sin + node.origZ * cos;
        const ry = node.origY;

        const scale = 180 / (180 + rz);
        const px = cx + rx * scale;
        const py = cy + ry * scale;

        projected.push({ x: px, y: py, scale: scale, rz: rz });
      });

      // Lines
      ctx.lineWidth = 0.5;
      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const dx = projected[i].x - projected[j].x;
          const dy = projected[i].y - projected[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 18) {
            const alpha = (1 - dist / 18) * 0.35;
            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(projected[i].x, projected[i].y);
            ctx.lineTo(projected[j].x, projected[j].y);
            ctx.stroke();
          }
        }
      }

      // Nodes
      projected.forEach(p => {
        const r = Math.max(0.6, 1.6 * p.scale);
        ctx.fillStyle = p.rz > 0 ? '#38bdf8' : '#0284c7';
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(renderCinematic);
    }

    renderCinematic();
  </script>
</body>
</html>
