const $=id=>document.getElementById(id); const decode=s=>decodeURIComponent(escape(atob(s)));
function stable(v,seen=new WeakSet()){if(v===null||typeof v!=='object')return v;if(seen.has(v))return '[Circular]';seen.add(v);if(Array.isArray(v))return v.map(x=>stable(x,seen));const o={};Object.keys(v).sort().forEach(k=>{if(['routeCtx','records','historicalRecords','latestRawRound'].includes(k))return;const x=stable(v[k],seen);if(x!==undefined)o[k]=x});return o}
function diff(a,b,path='root',out=[]){if(out.length>=80)return out;if(Object.is(a,b))return out;if(typeof a!==typeof b||a===null||b===null){out.push(path+': '+JSON.stringify(a)+' !== '+JSON.stringify(b));return out}if(Array.isArray(a)!==Array.isArray(b)){out.push(path+': array/object mismatch');return out}if(Array.isArray(a)){if(a.length!==b.length)out.push(path+'.length: '+a.length+' !== '+b.length);for(let i=0;i<Math.min(a.length,b.length);i++)diff(a[i],b[i],path+'['+i+']',out);return out}const keys=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of [...keys].sort()){if(!(k in a))out.push(path+'.'+k+': missing OLD');else if(!(k in b))out.push(path+'.'+k+': missing NEW');else diff(a[k],b[k],path+'.'+k,out)}return out}
function makeFrame(id,html){return new Promise(resolve=>{const f=$(id);f.onload=()=>resolve(f);f.srcdoc=html})}
function snapshot(w){if(typeof w.__EQUIV_SNAPSHOT__==='function')return w.__EQUIV_SNAPSHOT__();return {pred:w.currentPredictionDataMap||{},aud:w.currentAuditDataMap||{}}}
async function runFrame(id,html,label,input,storage,fillId,phaseId,metaId){
  const f=await makeFrame(id,html),w=f.contentWindow; try{for(const [k,v] of Object.entries(storage))w.localStorage.setItem(k,v)}catch(e){}
  const ta=w.document.getElementById('bulkInput');if(!ta)throw new Error(label+' ไม่มี bulkInput');ta.value=input;
  const t0=performance.now();let timer; const tick=()=>{try{const p=w.document.getElementById('processingPercent'),s=w.document.getElementById('processingStage'),st=w.document.getElementById('processingStatus');const n=parseFloat(p?.textContent)||0;$(fillId).style.width=Math.max(0,Math.min(100,n))+'%';$(phaseId).textContent=(s?.textContent||'กำลังทำงาน')+' · '+(st?.textContent||'');$(metaId).textContent='กำลังทำงาน · '+((performance.now()-t0)/1000).toFixed(1)+' วินาที';}catch(e){};timer=setTimeout(tick,250)};tick();
  await w.runEngine(); clearTimeout(timer); const ms=performance.now()-t0; $(fillId).style.width='100%'; $(phaseId).textContent='เสร็จสิ้น'; $(metaId).textContent='เสร็จใน '+ms.toFixed(0)+' ms · หวย '+Object.keys(snapshot(w).pred||{}).length+' รายการ'; await new Promise(r=>setTimeout(r,50)); return {snap:snapshot(w),ms};
}
$('go').onclick=async()=>{const input=$('input').value.trim();if(!input){$('status').innerHTML='<span class="bad">กรุณาวางข้อมูลทดสอบก่อน</span>';return}$('go').disabled=true;$('status').textContent='กำลังเตรียม Golden Reference…';$('result').innerHTML='';try{const storage={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k)storage[k]=localStorage.getItem(k)}
const old=await runFrame('old',decode(OLD_B64),'OLD',input,storage,'oldFill','oldPhase','oldMeta');$('status').textContent='OLD เสร็จ — กำลังรัน NEW…';
const newr=await runFrame('new',decode(NEW_B64),'NEW',input,storage,'newFill','newPhase','newMeta');$('status').textContent='กำลังเปรียบเทียบผล…';
const errors=diff(stable(old.snap),stable(newr.snap));if(!errors.length){$('status').innerHTML='<span class="ok">✓ EQUIVALENCE PASS — ผลที่ตรวจเท่ากัน</span>';$('result').innerHTML='<div class="card"><b>PASS</b><div class="small">เทียบ Prediction Map + Audit Map หลังตัดเฉพาะข้อมูล runtime/reference ที่ไม่ใช่ผลคำนวณ</div><div class="small mono">OLD: '+old.ms.toFixed(0)+' ms · NEW: '+newr.ms.toFixed(0)+' ms</div></div>'}else{$('status').innerHTML='<span class="bad">✗ EQUIVALENCE FAIL — พบความต่าง</span>';$('result').innerHTML='<div class="card"><b>จุดต่างที่พบ ('+errors.length+')</b><pre>'+errors.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('\n')+'</pre></div>'}}catch(e){$('status').innerHTML='<span class="bad">⚠ ตรวจไม่สำเร็จ: '+String(e).replace(/</g,'&lt;')+'</span>'}finally{$('go').disabled=false}};
</script></body></html>
