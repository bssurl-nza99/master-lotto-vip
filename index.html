<script>

/* ============================================================
   MYANMAR 2D REAL STATISTICAL ENGINE v8.1
   ============================================================

   DATA MODEL
   -----------
   1 day = 2 draws
   Lunch   = 1 two-digit result
   Evening = 1 two-digit result

   NO:
   - upper/lower
   - three-digit
   - fake accuracy
   - forced percentage
   - naturalWeightHit
   - future leakage

   YES:
   - real pair probability
   - recent / medium / long history
   - cross-round relationship
   - pair frequency
   - digit frequency
   - walk-forward backtest
   - confidence interval
   - real streaks
   ============================================================ */


/* ============================================================
   BASIC
   ============================================================ */

function clearInput() {
    document.getElementById('dataInput').value = '';
}

function resetAll() {
    document.getElementById('dataInput').value = '';
    document.getElementById('resultContainer').style.display = 'none';
}


function isValid2D(value) {
    return /^\d{2}$/.test(String(value || ''));
}


function normalize2D(value) {

    if (value === null || value === undefined) {
        return null;
    }

    let s = String(value).trim();

    if (/^\d$/.test(s)) {
        s = '0' + s;
    }

    return /^\d{2}$/.test(s) ? s : null;
}


function getDigits(value) {

    const v = normalize2D(value);

    if (!v) return [];

    return [
        Number(v[0]),
        Number(v[1])
    ];
}


/* ============================================================
   DATE
   ============================================================ */

function parseDate(dateText) {

    if (!dateText) return null;

    const monthMap = {

        'มค': 1,
        'มกราคม': 1,

        'กพ': 2,
        'กุมภาพันธ์': 2,

        'มีค': 3,
        'มีนาคม': 3,

        'เมย': 4,
        'เมษายน': 4,

        'พค': 5,
        'พฤษภาคม': 5,

        'มิย': 6,
        'มิถุนายน': 6,

        'กค': 7,
        'กรกฎาคม': 7,

        'สค': 8,
        'สิงหาคม': 8,

        'กย': 9,
        'กันยายน': 9,

        'ตค': 10,
        'ตุลาคม': 10,

        'พย': 11,
        'พฤศจิกายน': 11,

        'ธค': 12,
        'ธันวาคม': 12
    };


    let s = String(dateText)
        .replace(/🗓/g, '')
        .replace(/\./g, '')
        .replace(/,/g, '')
        .replace(/\s+/g, ' ')
        .trim();


    const parts = s.split(' ');

    if (parts.length < 3) {
        return null;
    }


    const day = parseInt(parts[0], 10);

    let monthText = parts[1];

    const month =
        monthMap[monthText] ||
        monthMap[monthText.replace(/\./g, '')];


    let year = parseInt(parts[2], 10);


    if (
        !Number.isInteger(day) ||
        !month ||
        !Number.isInteger(year)
    ) {
        return null;
    }


    /*
       68 = พ.ศ. 2568
       69 = พ.ศ. 2569
    */

    if (year < 100) {
        year = 2500 + year - 543;
    }
    else if (year > 2400) {
        year -= 543;
    }


    const d =
        new Date(
            year,
            month - 1,
            day
        );


    if (
        d.getFullYear() !== year ||
        d.getMonth() !== month - 1 ||
        d.getDate() !== day
    ) {
        return null;
    }


    return d;
}


function getNextTargetDate(lastDateText) {

    const d =
        parseDate(lastDateText);


    if (!d) {
        return "Next Date";
    }


    d.setDate(
        d.getDate() + 1
    );


    const dd =
        String(d.getDate()).padStart(2, '0');

    const mm =
        String(d.getMonth() + 1).padStart(2, '0');

    const yyyy =
        d.getFullYear();


    return `${dd}/${mm}/${yyyy}`;
}


/* ============================================================
   INPUT PARSER
   ============================================================ */

function parseRecords(rawText) {

    const lines =
        String(rawText || '')
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);


    const records = [];


    lines.forEach(line => {

        if (!line.includes('--')) {
            return;
        }


        const colon =
            line.indexOf(':');


        if (colon < 0) {
            return;
        }


        const dateText =
            line
                .substring(0, colon)
                .replace('🗓', '')
                .trim();


        const resultText =
            line.substring(colon + 1);


        const parts =
            resultText
                .split('--')
                .map(x => x.trim());


        const lunch =
            normalize2D(parts[0]);

        const evening =
            normalize2D(parts[1]);


        if (
            !lunch ||
            !evening
        ) {
            return;
        }


        records.push({

            date: dateText,

            lunch,

            evening
        });

    });


    /*
       เรียงตามวันที่ถ้ามีวันที่อ่านได้
    */

    records.sort((a, b) => {

        const da = parseDate(a.date);
        const db = parseDate(b.date);

        if (!da || !db) return 0;

        return da - db;
    });


    return records;
}


/* ============================================================
   HISTORICAL VALUES
   ============================================================ */

function getValues(records, mode, limit = null) {

    let values = [];


    if (mode === 'lunch') {

        values =
            records
                .map(r => r.lunch)
                .filter(isValid2D);

    }

    else if (mode === 'evening') {

        values =
            records
                .map(r => r.evening)
                .filter(isValid2D);

    }

    else {

        /*
           All Day = ทุกผลจริง
        */

        records.forEach(r => {

            if (isValid2D(r.lunch)) {
                values.push(r.lunch);
            }

            if (isValid2D(r.evening)) {
                values.push(r.evening);
            }

        });

    }


    if (
        limit !== null &&
        values.length > limit
    ) {
        values =
            values.slice(
                values.length - limit
            );
    }


    return values;
}


/* ============================================================
   DISTRIBUTION HELPERS
   ============================================================ */

function normalizedPairDistribution(values, alpha = 1) {

    const counts =
        Array(100).fill(alpha);


    values.forEach(value => {

        if (!isValid2D(value)) {
            return;
        }

        counts[
            parseInt(value, 10)
        ]++;

    });


    const total =
        counts.reduce(
            (a, b) => a + b,
            0
        );


    return counts.map(
        x => x / total
    );
}


/* ============================================================
   CONTEXT DISTRIBUTION
   ============================================================

   Lunch:
       previous day's Evening
          ↓
       next Lunch

   Evening:
       previous day's Lunch
          ↓
       next Evening

   Important:
   ไม่ใช้ข้อมูลอนาคต
   ============================================================ */

function getContextDistribution(records, mode) {

    const counts =
        Array(100).fill(1);


    let denominator = 100;


    if (records.length < 2) {

        return counts.map(
            x => x / denominator
        );
    }


    let context;


    if (mode === 'lunch') {

        context =
            records[records.length - 1]
                .evening;

    }

    else if (mode === 'evening') {

        context =
            records[records.length - 1]
                .lunch;

    }

    else {

        return counts.map(
            x => x / denominator
        );
    }


    if (!isValid2D(context)) {

        return counts.map(
            x => x / denominator
        );
    }


    for (
        let i = 1;
        i < records.length;
        i++
    ) {

        let source;
        let target;


        if (mode === 'lunch') {

            source =
                records[i - 1].evening;

            target =
                records[i].lunch;

        }

        else {

            source =
                records[i - 1].lunch;

            target =
                records[i].evening;
        }


        if (
            source === context &&
            isValid2D(target)
        ) {

            counts[
                parseInt(target, 10)
            ]++;

            denominator++;
        }
    }


    return counts.map(
        x => x / denominator
    );
}


/* ============================================================
   CONTEXT DIGIT DISTRIBUTION
   ============================================================ */

function getContextDigitDistribution(records, mode) {

    const counts =
        Array(100).fill(1);


    let denominator = 100;


    if (records.length < 2) {

        return counts.map(
            x => x / denominator
        );
    }


    let context;


    if (mode === 'lunch') {

        context =
            records[
                records.length - 1
            ].evening;

    }

    else if (mode === 'evening') {

        context =
            records[
                records.length - 1
            ].lunch;

    }

    else {

        return counts.map(
            x => x / denominator
        );
    }


    const contextDigits =
        new Set(
            getDigits(context)
        );


    for (
        let i = 1;
        i < records.length;
        i++
    ) {

        let source;
        let target;


        if (mode === 'lunch') {

            source =
                records[i - 1].evening;

            target =
                records[i].lunch;

        }

        else {

            source =
                records[i - 1].lunch;

            target =
                records[i].evening;
        }


        if (
            !isValid2D(source) ||
            !isValid2D(target)
        ) {
            continue;
        }


        const sourceDigits =
            getDigits(source);


        const overlap =
            sourceDigits.some(
                d => contextDigits.has(d)
            );


        if (overlap) {

            counts[
                parseInt(target, 10)
            ]++;

            denominator++;
        }
    }


    return counts.map(
        x => x / denominator
    );
}


/* ============================================================
   DIGIT MARGINAL DISTRIBUTION
   ============================================================ */

function getDigitMarginalDistribution(values) {

    const counts =
        Array(10).fill(1);


    values.forEach(value => {

        if (!isValid2D(value)) {
            return;
        }


        const ds =
            getDigits(value);


        ds.forEach(d => {

            counts[d]++;

        });

    });


    const total =
        counts.reduce(
            (a, b) => a + b,
            0
        );


    return counts.map(
        x => x / total
    );
}


/* ============================================================
   PAIR MODEL
   ============================================================

   Fixed weights

   Long term       25%
   Medium term     25%
   Recent          25%
   Context         15%
   Context digits  10%

   น้ำหนักไม่ถูกปรับจากผลที่จะทำนาย
   จึงไม่เกิด future leakage
   ============================================================ */

function _normalize100(arr) {
    const total = arr.reduce((a,b)=>a+b,0) || 1;
    return arr.map(x=>x/total);
}

function _pairFreq(values, windowSize, alpha=0.5) {
    const vals = values.slice(-windowSize);
    const c = Array(100).fill(alpha);
    vals.forEach(v=>{
        if(isValid2D(v)) c[parseInt(v,10)]++;
    });
    return _normalize100(c);
}

function _transitionPair(records, mode, sourceType, alpha=0.5) {
    const c=Array(100).fill(alpha);
    let source = null;
    if(mode==='lunch') source=records.at(-1)?.evening;
    else source=records.at(-1)?.lunch;
    if(!isValid2D(source)) return _normalize100(c);
    for(let i=1;i<records.length;i++){
        let src,tgt;
        if(sourceType==='cross'){
            src=mode==='lunch'?records[i-1].evening:records[i-1].lunch;
        }else{
            src=mode==='lunch'?records[i-1].lunch:records[i-1].evening;
        }
        tgt=mode==='lunch'?records[i].lunch:records[i].evening;
        if(src===source && isValid2D(tgt)) c[parseInt(tgt,10)]++;
    }
    return _normalize100(c);
}

function _orbitSupport(records, mode) {
    const out=Array(100).fill(0);
    const last=mode==='lunch'?records.at(-1)?.lunch:records.at(-1)?.evening;
    const cross=mode==='lunch'?records.at(-1)?.evening:records.at(-1)?.lunch;
    const seeds=[...getDigits(last),...getDigits(cross)];
    for(let p=0;p<100;p++){
        const t=Math.floor(p/10), u=p%10;
        let score=0;
        seeds.forEach(d=>{
            const dt=(t-d+10)%10, du=(u-d+10)%10;
            if([1,2,8,9].includes(dt)) score+=1;
            if([1,2,8,9].includes(du)) score+=0.7;
            if(dt===0) score+=0.45;
            if(du===0) score+=0.30;
        });
        out[p]=score;
    }
    return _normalize100(out.map(x=>x+0.05));
}

function _arithmeticSupport(records, mode) {
    const out=Array(100).fill(0);
    const a=mode==='lunch'?records.at(-1)?.evening:records.at(-1)?.lunch;
    const b=mode==='lunch'?records.at(-1)?.lunch:records.at(-1)?.evening;
    const seeds=[...getDigits(a),...getDigits(b)];
    for(let p=0;p<100;p++){
        const t=Math.floor(p/10),u=p%10;
        let z=0;
        seeds.forEach(d=>{
            const transforms=[d+1,d-1,d+2,d-2,10-d, d*2, d+3,d-3].map(x=>((x%10)+10)%10);
            if(transforms.includes(t)) z+=0.6;
            if(transforms.includes(u)) z+=0.4;
        });
        const sum=(t+u)%10, diff=(t-u+10)%10;
        if(seeds.includes(sum)) z+=0.5;
        if(seeds.includes(diff)) z+=0.35;
        out[p]=z;
    }
    return _normalize100(out.map(x=>x+0.05));
}

function buildPairProbability(records, mode) {
    if(mode==='allday'){
        const l=buildPairProbability(records,'lunch');
        const e=buildPairProbability(records,'evening');
        const joint=l.map((x,i)=>1-(1-x)*(1-e[i]));
        return _normalize100(joint);
    }
    const values=getValues(records,mode);
    const recent=_pairFreq(values,20,0.5);
    const medium=_pairFreq(values,60,0.5);
    const long=_pairFreq(values,Math.max(90,values.length),0.5);
    const cross=_transitionPair(records,mode,'cross',0.5);
    const same=_transitionPair(records,mode,'same',0.5);
    const orbit=_orbitSupport(records,mode);
    const arithmetic=_arithmeticSupport(records,mode);

    const score=Array(100).fill(0);
    for(let p=0;p<100;p++){
        const t=Math.floor(p/10),u=p%10;
        /* pair evidence is primary; support networks are secondary */
        score[p]=
            recent[p]*0.25 +
            medium[p]*0.16 +
            long[p]*0.14 +
            cross[p]*0.18 +
            same[p]*0.10 +
            orbit[p]*0.10 +
            arithmetic[p]*0.07;
        /* keep exact-pair evidence ahead of raw digit frequency */
        score[p]+= (t===u ? 0.002 : 0);
    }
    return _normalize100(score);
}


/* ============================================================
   TOP 3 DIGITS
   ============================================================

   เลขเด่นไม่ได้ดูแค่ frequency อย่างเดียว

   เราดู probability ของ 00–99 ก่อน
   แล้วค่อยรวม probability ของคู่ที่มี digit นั้น

   ทำให้ Top 3 กับชุดคู่สอดคล้องกัน
   ============================================================ */

function getTopThreeDigits(pairProbability) {
    /* Top digits are ALWAYS tens digits. */
    const digitProbability=Array(10).fill(0);
    for(let p=0;p<100;p++) digitProbability[Math.floor(p/10)] += pairProbability[p];
    return {
        digits: digitProbability.map((score,digit)=>({digit,score}))
            .sort((a,b)=>b.score-a.score || a.digit-b.digit)
            .slice(0,3).map(x=>String(x.digit)),
        probabilities: digitProbability
    };
}


/* ============================================================
   PAIR SELECTION
   ============================================================

   Top 1 = 5 pairs
   Top 2 = 5 pairs
   Top 3 = 5 pairs

   รวม 15 คู่

   คู่ต้องมี Top digit อยู่ในหลักสิบหรือหลักหน่วย
   ============================================================ */

function getPairsForDigit(digit,pairProbability,usedPairs) {
    const d=Number(digit);
    const candidates=[];
    /* Every displayed pair is dX: Top digit is the tens digit. */
    for(let u=0;u<10;u++){
        const p=d*10+u;
        const pair=String(p).padStart(2,'0');
        if(!usedPairs.has(pair)) candidates.push({pair,probability:pairProbability[p]});
    }
    candidates.sort((a,b)=>b.probability-a.probability || parseInt(a.pair)-parseInt(b.pair));
    return candidates.slice(0,5).map(x=>x.pair);
}


/* ============================================================
   MAIN PREDICTION
   ============================================================ */

function analyzePrecisionEngineInternal(
    records,
    mode
) {

    if (
        !records ||
        records.length === 0
    ) {

        return {

            t1: '0',
            t2: '1',
            t3: '2',

            pairsT1: [],
            pairsT2: [],
            pairsT3: [],

            targetDate:
                "Next Date"
        };
    }


    const pairProbability =
        buildPairProbability(
            records,
            mode
        );


    const top =
        getTopThreeDigits(
            pairProbability
        );


    const topDigits =
        top.digits;


    const usedPairs =
        new Set();


    const pairsT1 =
        getPairsForDigit(
            topDigits[0],
            pairProbability,
            usedPairs
        );


    pairsT1.forEach(
        p => usedPairs.add(p)
    );


    const pairsT2 =
        getPairsForDigit(
            topDigits[1],
            pairProbability,
            usedPairs
        );


    pairsT2.forEach(
        p => usedPairs.add(p)
    );


    const pairsT3 =
        getPairsForDigit(
            topDigits[2],
            pairProbability,
            usedPairs
        );


    pairsT3.forEach(
        p => usedPairs.add(p)
    );


    /*
       กันกรณี pair ไม่ครบ
    */

    const allPairs =
        [
            ...pairsT1,
            ...pairsT2,
            ...pairsT3
        ];


    return {

        t1:
            topDigits[0],

        t2:
            topDigits[1],

        t3:
            topDigits[2],


        pairsT1,

        pairsT2,

        pairsT3,


        targetDate:
            getNextTargetDate(
                records[
                    records.length - 1
                ].date
            ),


        /*
           เก็บไว้ใช้ Audit
        */

        pairProbability,

        topDigitProbability:
            top.probabilities
    };
}


/* ============================================================
   REAL HIT TEST
   ============================================================ */

function getAllPredictionPairs(
    prediction
) {

    return [

        ...prediction.pairsT1,

        ...prediction.pairsT2,

        ...prediction.pairsT3

    ];
}


function pairHit(
    prediction,
    actual
) {

    if (
        !isValid2D(actual)
    ) {
        return false;
    }


    return getAllPredictionPairs(
        prediction
    ).includes(actual);
}


function topDigitHit(
    prediction,
    actual
) {

    if (
        !isValid2D(actual)
    ) {
        return false;
    }


    const top = new Set([

        prediction.t1,

        prediction.t2,

        prediction.t3

    ]);


    return getDigits(actual)
        .some(
            d =>
                top.has(
                    String(d)
                )
        );
}


/* ============================================================
   WILSON 95% CI
   ============================================================ */

function getWilson95(
    hits,
    total
) {

    if (
        total <= 0
    ) {

        return {
            rate: null,
            low: null,
            high: null
        };
    }


    const z = 1.96;

    const p =
        hits / total;


    const denominator =
        1 +
        (
            z * z / total
        );


    const center =
        (
            p +
            (
                z * z /
                (2 * total)
            )
        ) /
        denominator;


    const margin =
        (
            z *
            Math.sqrt(

                (
                    p *
                    (1 - p) /
                    total
                )

                +

                (
                    z * z /
                    (
                        4 *
                        total *
                        total
                    )
                )
            )
        ) /
        denominator;


    return {

        rate:
            p * 100,

        low:
            Math.max(
                0,
                (center - margin) * 100
            ),

        high:
            Math.min(
                100,
                (center + margin) * 100
            )
    };
}


/* ============================================================
   WALK-FORWARD BACKTEST
   ============================================================

   สำคัญที่สุด

   ถ้ากำลังทดสอบวันที่ 100:

       ใช้ข้อมูลวันที่ 1–99

   ห้ามแตะวันที่ 100 ก่อนสร้าง prediction

   ============================================================ */

function runBacktestAudit(
    records,
    mode
) {

    /*
       ต้องมี history พอสมควร
       เพื่อให้ long / medium / recent model
       ทำงานได้
    */

    const MIN_HISTORY = 60;


    if (
        records.length <=
        MIN_HISTORY
    ) {

        return {

            total: 0,

            hits: 0,

            misses: 0,

            topHits: 0,

            topMisses: 0,

            pairHitAcc: null,

            topHitAcc: null,

            pairCI: null,

            topCI: null,

            maxWinStreak: 0,

            maxLoseStreak: 0
        };
    }


    let total = 0;

    let pairHits = 0;

    let topHits = 0;


    let currentWin = 0;

    let currentLose = 0;

    let maxWin = 0;

    let maxLose = 0;


    /*
       All Day:
       1 วัน = 2 observations

       Lunch + Evening
    */


    for (
        let i = MIN_HISTORY;
        i < records.length;
        i++
    ) {

        const training =
            records.slice(
                0,
                i
            );


        const prediction =
            analyzePrecisionEngineInternal(
                training,
                mode
            );


        const actualRecord =
            records[i];


        let isPair = false;
        let isTop = false;

        if (mode === 'lunch') {

            isPair = pairHit(
                prediction,
                actualRecord.lunch
            );

            isTop = topDigitHit(
                prediction,
                actualRecord.lunch
            );

        } else if (mode === 'evening') {

            isPair = pairHit(
                prediction,
                actualRecord.evening
            );

            isTop = topDigitHit(
                prediction,
                actualRecord.evening
            );

        } else {

            /* All Day = exactly one test per day.
               A hit occurs if either Lunch or Evening hits. */

            isPair =
                pairHit(
                    prediction,
                    actualRecord.lunch
                ) ||
                pairHit(
                    prediction,
                    actualRecord.evening
                );

            isTop =
                topDigitHit(
                    prediction,
                    actualRecord.lunch
                ) ||
                topDigitHit(
                    prediction,
                    actualRecord.evening
                );
        }

        total++;

        if (isPair) {

            pairHits++;

            currentWin++;

            currentLose = 0;

            maxWin =
                Math.max(
                    maxWin,
                    currentWin
                );

        } else {

            currentLose++;

            currentWin = 0;

            maxLose =
                Math.max(
                    maxLose,
                    currentLose
                );
        }

        if (isTop) {

            topHits++;
        }
    }


    const pairCI =
        getWilson95(
            pairHits,
            total
        );


    const topCI =
        getWilson95(
            topHits,
            total
        );


    return {

        total,

        hits:
            pairHits,

        misses:
            total -
            pairHits,


        topHits,

        topMisses:
            total -
            topHits,


        pairHitAcc:
            pairCI.rate === null
                ? null
                : pairCI.rate.toFixed(2),


        topHitAcc:
            topCI.rate === null
                ? null
                : topCI.rate.toFixed(2),


        pairCI: {

            low:
                pairCI.low.toFixed(2),

            high:
                pairCI.high.toFixed(2)
        },


        topCI: {

            low:
                topCI.low.toFixed(2),

            high:
                topCI.high.toFixed(2)
        },


        maxWinStreak:
            maxWin,

        maxLoseStreak:
            maxLose
    };
}

   ============================================================ */

function captureCard(
    wrapperId,
    filenamePrefix
) {

    const wrapperElement =
        document.getElementById(
            wrapperId
        );


    const btnCapture =
        wrapperElement.querySelector(
            '.btn-capture'
        );


    btnCapture.style.display =
        'none';


    html2canvas(
        wrapperElement,
        {

            scale: 3,

            useCORS: true,

            backgroundColor:
                '#f0f2f5'
        }
    )
    .then(canvas => {

        btnCapture.style.display =
            'flex';


        const link =
            document.createElement(
                'a'
            );


        link.download =
            `${filenamePrefix}_${Date.now()}.png`;


        link.href =
            canvas.toDataURL(
                'image/png'
            );


        link.click();

    })
    .catch(err => {

        btnCapture.style.display =
            'flex';


        alert(
            'เกิดข้อผิดพลาดในการบันทึกภาพ'
        );


        console.error(err);
    });
}
