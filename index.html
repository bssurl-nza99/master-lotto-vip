<script>
const SAMPLE_PDF_DATA = `ลาวประตูชัย | 21 ต.ค. 69
470
62
ลาวประตูชัย | 20 ต.ค. 69
351
19
ลาวประตูชัย | 19 ต.ค. 69

ลาวประตูชัย | 18 ต.ค. 69
362
70
ลาวประตูชัย | 17 ต.ค. 69
822
31`;

const FLAG_MAP = {
  'ลาว': '🇱🇦',
  'ล.': '🇱🇦',
  'ฮานอย': '🇻🇳',
  'ฮ.น': '🇻🇳',
  'ไทย': '🇹🇭',
  'รัฐบาล': '🇹🇭',
  'ดาวโจนส์': '🇺🇸',
  'ฮั่งเส็ง': '🇭🇰',
  'จีน': '🇨🇳',
  'นิคเคอิ': '🇯🇵',
  'ไต้หวัน': '🇹🇼',
  'เกาหลี': '🇰🇷',
  'รัสเซีย': '🇷🇺',
  'เยอรมัน': '🇩🇪',
  'อังกฤษ': '🇬🇧',
  'สิงคโปร์': '🇸🇬',
  'อินเดีย': '🇮🇳',
  'อียิปต์': '🇪🇬',
  'มาเลย์': '🇲🇾',
  'DEFAULT': '🎯'
};

function getFlag(typeName) {
  for (const key in FLAG_MAP) {
    if (typeName.includes(key)) return FLAG_MAP[key];
  }
  return '🎯';
}

function formatDisplayName(rawName) {
  let name = rawName.trim();
  if (name.startsWith('ลาว')) {
    let sub = name.replace('ลาว', '').trim();
    if (sub.toLowerCase() === 'vip') return 'ล. V';
    if (sub.includes('VIP')) sub = sub.replace(/VIP/gi, 'V').trim();
    return sub ? `ล. ${sub}` : 'ล.';
  }
  if (name.startsWith('ฮานอย')) {
    let sub = name.replace('ฮานอย', '').trim();
    if (sub.toLowerCase() === 'vip') return 'ฮ.น V';
    if (sub.includes('VIP')) sub = sub.replace(/VIP/gi, 'V').trim();
    return sub ? `ฮ.น ${sub}` : 'ฮ.น';
  }
  if (name.includes('ดาวโจนส์')) {
    if (name.includes('VIP')) return name.replace(/VIP/gi, 'V');
    if (!name.includes('ปกติ') && !name.includes('V')) return 'ดาวโจนส์ ปกติ';
    return name;
  }
  if (name.includes('รัฐบาลไทย') || name.includes('มาเลย์')) return name;
  name = name.replace(/หนุ้ /g, '').replace(/องักฤษ/g, 'อังกฤษ').replace(/เยอรมนั/g, 'เยอรมัน').replace(/รัสเซยี/g, 'รัสเซีย').replace(/ได้หวัน/g, 'ไต้หวัน').trim();
  if (name.includes('VIP')) {
    return name.replace(/VIP/gi, 'V').trim();
  } else if (!name.includes('ปกติ') && !name.includes('V')) {
    return name.replace('หุ้น', '').trim(); 
  }
  return name;
}

function showAlert(msg) {
  const box = document.getElementById('mobileAlert');
  if (box) {
    box.innerText = msg;
    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearAlert() {
  const box = document.getElementById('mobileAlert');
  if (box) {
    box.classList.remove('show');
    box.innerText = '';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (t) {
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
}

function parsePDFText(rawText) {
  if (!rawText || typeof rawText !== 'string') return {};
  const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
  const grouped = {};

  blocks.forEach((block) => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    let currentLottery = null;
    let currentDate = null;
    let pendingTop3 = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      if (line.includes('งดออกผล') || line.startsWith('...') || line.startsWith('---') || line.includes('.........')) {
        pendingTop3 = null;
        currentDate = null;
        continue;
      }

      if (line.includes('|')) {
        const parts = line.split('|').map(p => p.trim());
        currentLottery = parts[0];
        currentDate = parts[1] || 'ไม่ระบุวันที่';
        pendingTop3 = null;
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];
        continue;
      }

      if (!currentLottery && !/^\d+$/.test(line)) {
        currentLottery = line;
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];
        continue;
      }

      if (/^\d{3}$/.test(line)) {
        pendingTop3 = line;
        continue;
      }

      if (/^\d{2}$/.test(line) && pendingTop3 && currentLottery) {
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];

        const recordExists = grouped[formattedKey].some(
          r => r.date === currentDate && r.top3 === pendingTop3 && r.bottom2 === line
        );

        if (!recordExists) {
          grouped[formattedKey].push({
            date: currentDate || `งวดที่ ${grouped[formattedKey].length + 1}`,
            top3: pendingTop3,
            bottom2: line
          });
        }
        pendingTop3 = null;
        currentDate = null;
      }
    }
  });

  return grouped;
}

// ⏳ ตารางที่ 7: ระยะเว้นช่วง (Gap & Omission Tracker)
function analyzeGapTracker(records) {
  let gapMap = {};
  for(let d=0; d<=9; d++) gapMap[d] = { currentGap: 0, found: false };

  records.forEach((r) => {
    let digits = (r.top3 + r.bottom2).split('');
    for(let d=0; d<=9; d++) {
      let dStr = d.toString();
      if(!gapMap[d].found) {
        if(digits.includes(dStr)) gapMap[d].found = true;
        else gapMap[d].currentGap++;
      }
    }
  });
  return gapMap;
}

// 📈 ตารางที่ 11: วิเคราะห์กระแสความแรง & ความเสถียร
function analyzeTrendMomentum(records) {
  let momentumData = [];

  for(let d=0; d<=9; d++) {
    let dStr = d.toString();
    let shortRange = records.slice(0, 5);
    let shortHits = 0;
    shortRange.forEach(r => { if((r.top3 + r.bottom2).includes(dStr)) shortHits++; });

    let midRange = records.slice(5, 10);
    let midHits = 0;
    midRange.forEach(r => { if((r.top3 + r.bottom2).includes(dStr)) midHits++; });

    let longRange = records.slice(10, 20);
    let longHits = 0;
    longRange.forEach(r => { if((r.top3 + r.bottom2).includes(dStr)) longHits++; });

    let totalHits = 0;
    records.forEach(r => { if((r.top3 + r.bottom2).includes(dStr)) totalHits++; });
    let totalRate = records.length > 0 ? (totalHits / records.length) * 100 : 0;

    let shortPct = (shortHits / 5) * 100;
    let midPct = (midHits / 5) * 100;
    let stabilityScore = Math.round((shortPct * 0.4) + (midPct * 0.4) + (totalRate * 0.2));

    let trendLabel = 'เสถียรปกติ';
    if(shortPct >= 60 && midPct >= 40) trendLabel = '🔥 พุ่งแรง (Hot)';
    else if(shortPct === 0 && midPct === 0) trendLabel = '❄️ แผ่ว (Cold)';
    else if(shortPct >= 40) trendLabel = '⚡ กำลังเดิน';

    momentumData.push({
      digit: d,
      shortHits: `${shortHits}/5`,
      midHits: `${midHits}/5`,
      longHits: `${longHits}/10`,
      stabilityIndex: `${stabilityScore}%`,
      trendLabel: trendLabel,
      rawBonus: stabilityScore
    });
  }

  return momentumData;
}

// 📐 ตารางที่ 12 ใหม่: ดัชนีคณิตศาสตร์บริสุทธิ์ (Pure Mathematical Formulas: Markov, Poisson, Modulo, Cycle)
function analyzePureMathematics(records) {
  let mathResults = [];

  for(let d=0; d<=9; d++) {
    let dStr = d.toString();
    
    // 1. Markov Chain Transition Probability (ความน่าจะเป็นเปลี่ยนผ่าน)
    let markovTransitions = 0;
    let totalPrevOccurrences = 0;
    for(let i=0; i<records.length-1; i++) {
      let prevDigits = (records[i+1].top3 + records[i+1].bottom2);
      let currDigits = (records[i].top3 + records[i].bottom2);
      if(prevDigits.includes(dStr)) {
        totalPrevOccurrences++;
        if(currDigits.includes(dStr)) markovTransitions++;
      }
    }
    let markovScore = totalPrevOccurrences > 0 ? Math.round((markovTransitions / totalPrevOccurrences) * 100) : 50;

    // 2. Poisson Distribution Probability (การแจกแจงปัวซอง)
    let totalHits = 0;
    records.forEach(r => { if((r.top3 + r.bottom2).includes(dStr)) totalHits++; });
    let lambda = records.length > 0 ? totalHits / records.length : 0.5;
    let poissonScore = Math.min(100, Math.round(Math.exp(-lambda) * Math.pow(lambda, 1) * 100 * 5) + 30);

    // 3. Modulo & Remainder Pattern Score (เลขคณิตโมดูลาร์)
    let modHits = 0;
    records.forEach(r => {
      let sumVal = parseInt(r.top3[1]) + parseInt(r.top3[2]);
      if(sumVal % 3 === (d % 3)) modHits++;
    });
    let moduloScore = records.length > 0 ? Math.round((modHits / records.length) * 100) : 50;

    // 4. Composite Math Purity Score (คะแนนความบริสุทธิ์รวม)
    let purityScore = Math.round((markovScore * 0.35) + (poissonScore * 0.35) + (moduloScore * 0.30));

    mathResults.push({
      digit: d,
      markov: `${markovScore}%`,
      poisson: `${poissonScore}%`,
      modulo: `${moduloScore}%`,
      purityScore: purityScore
    });
  }

  return mathResults;
}

// 🤝 ตารางที่ 4: คู่สัมพันธ์ Gap-Boosted Buddy Pairs
function analyzeCorrelationPairs(records, gapData) {
  let pairsList = [];
  for(let a=0; a<=9; a++) {
    for(let b=a+1; b<=9; b++) {
      pairsList.push([a, b]);
    }
  }

  let pairResults = pairsList.map(([dA, dB]) => {
    let hits = 0;
    let total = records.length;

    records.forEach(r => {
      let t3 = r.top3;
      let b2 = r.bottom2;
      let validDigits = [t3[1], t3[2], b2[0], b2[1]];
      let hasA = validDigits.includes(dA.toString());
      let hasB = validDigits.includes(dB.toString());
      if (hasA || hasB) hits++;
    });

    let rate = total > 0 ? (hits / total) : 0;
    let gapBoost = 0;
    if(gapData[dA].currentGap >= 1 && gapData[dA].currentGap <= 3) gapBoost += 0.1;
    if(gapData[dB].currentGap >= 1 && gapData[dB].currentGap <= 3) gapBoost += 0.1;

    let finalRate = (rate + gapBoost) * 100;
    return { pair: `${dA} & ${dB}`, hits: hits, total: total, rate: parseFloat(finalRate.toFixed(1)) };
  });

  pairResults.sort((a, b) => b.rate - a.rate);
  return pairResults.slice(0, 5);
}

// 🧬 ตารางที่ 10: ดัชนี DNA Scoreboard & Veto Engine (เชื่อมโยง Momentum และ Pure Math)
function calculateGeniusDnaScores(records) {
  let gapData = analyzeGapTracker(records);
  let buddyPairs = analyzeCorrelationPairs(records, gapData);
  let momentumData = analyzeTrendMomentum(records);
  let mathData = analyzePureMathematics(records);

  let scores = Array(10).fill(0);
  let vetoPenalty = Array(10).fill(0);
  let statusText = Array(10).fill('ปกติ');

  let counts = Array(10).fill(0);
  records.forEach(r => (r.top3 + r.bottom2).split('').forEach(d => counts[parseInt(d)]++));
  let maxCount = Math.max(...counts, 1);
  counts.forEach((c, d) => scores[d] += (c / maxCount) * 30);

  records.forEach(r => {
    let t3 = r.top3, b2 = r.bottom2;
    let validTensUnits = [t3[1], t3[2], b2[0], b2[1]];
    validTensUnits.forEach(d => scores[parseInt(d)] += 2.5);
  });

  for(let d=0; d<=9; d++) {
    if(gapData[d].currentGap === 0) scores[d] += 20;
    else if(gapData[d].currentGap === 1) scores[d] += 15;
    else if(gapData[d].currentGap === 2) scores[d] += 10;
  }

  buddyPairs.forEach(bp => {
    let parts = bp.pair.split(' & ').map(Number);
    scores[parts[0]] += 10;
    scores[parts[1]] += 10;
  });

  // บูสต์พลังจาก Momentum และ Pure Math
  momentumData.forEach(m => { scores[m.digit] += (m.rawBonus * 0.10); });
  mathData.forEach(m => { scores[m.digit] += (m.purityScore * 0.10); });

  for(let d=0; d<=9; d++) {
    if(gapData[d].currentGap >= 6) {
      vetoPenalty[d] += 40;
      statusText[d] = 'สัญญาณหลอก (ค้างนาน)';
    }
    if(counts[d] <= 2 && gapData[d].currentGap === 0) {
      vetoPenalty[d] += 25;
      statusText[d] = 'สัญญาณหลอก (แกว่ง)';
    }
  }

  let finalScores = scores.map((s, d) => {
    let net = Math.max(0, s - vetoPenalty[d]);
    return {
      digit: d,
      rawScore: s,
      vetoPenalty: vetoPenalty[d],
      netScore: net,
      gap: gapData[d].currentGap,
      status: vetoPenalty[d] > 0 ? statusText[d] : 'ผ่านการพิสูจน์ DNA'
    };
  });

  let maxNet = Math.max(...finalScores.map(f => f.netScore), 1);
  finalScores.forEach(f => {
    f.normalizedScore = Math.min(100, Math.round((f.netScore / maxNet) * 100));
  });

  finalScores.sort((a, b) => b.normalizedScore - a.normalizedScore);
  return finalScores;
}

// 🎯 ตารางที่ 9: ชุดเลขวิน 6 ตัวจับคู่จริง Co-Occurrence
function generateCoOccurrenceWinArray(records) {
  let pairCoOccur = {};
  records.forEach(r => {
    let top2 = r.top3.slice(-2);
    let bot2 = r.bottom2;
    [top2, bot2].forEach(p => {
      if(p.length === 2) {
        let x = parseInt(p[0]), y = parseInt(p[1]);
        let key = x < y ? `${x}-${y}` : `${y}-${x}`;
        pairCoOccur[key] = (pairCoOccur[key] || 0) + 1;
      }
    });
  });

  let coScores = Array(10).fill(0);
  for(let key in pairCoOccur) {
    let parts = key.split('-').map(Number);
    let score = pairCoOccur[key];
    coScores[parts[0]] += score;
    coScores[parts[1]] += score;
  }

  let rankedDigits = coScores.map((val, idx) => ({digit: idx, score: val})).sort((a,b) => b.score - a.score);
  let winDigits = rankedDigits.slice(0, 6).map(item => item.digit).sort((a,b) => a - b);

  let hits = 0;
  let total = records.length;
  records.forEach(r => {
    let top2 = r.top3.slice(-2);
    let bot2 = r.bottom2;
    let tMatch = winDigits.includes(parseInt(top2[0])) && winDigits.includes(parseInt(top2[1]));
    let bMatch = winDigits.includes(parseInt(bot2[0])) && winDigits.includes(parseInt(bot2[1]));
    if(tMatch || bMatch) hits++;
  });

  let winCoverageRate = total > 0 ? ((hits / total) * 100).toFixed(1) : '0.0';
  return { winDigits, hits, total, winCoverageRate };
}

// 🧮 ตารางที่ 2: ความถี่รวม 0-9
function analyzeOverallFrequency(records) {
  let counts = Array(10).fill(0);
  let winStreaks = Array(10).fill(0);
  let maxWins = Array(10).fill(0);
  let maxLosses = Array(10).fill(0);
  let tempLoss = Array(10).fill(0);
  let lastStat = Array(10).fill(null);

  const chron = [...records].reverse();
  chron.forEach(r => {
    let digits = (r.top3 + r.bottom2).split('');
    for(let d=0; d<=9; d++) {
      counts[d]++;
      if(digits.includes(d.toString())) {
        winStreaks[d]++;
        tempLoss[d] = 0;
        if(winStreaks[d] > maxWins[d]) maxWins[d] = winStreaks[d];
        lastStat[d] = 'เข้า';
      } else {
        tempLoss[d]++;
        winStreaks[d] = 0;
        if(tempLoss[d] > maxLosses[d]) maxLosses[d] = tempLoss[d];
        lastStat[d] = 'หลุด';
      }
    }
  });

  return counts.map((_, d) => ({
    digit: d,
    hits: counts[d],
    maxWin: maxWins[d],
    maxLoss: maxLosses[d],
    status: lastStat[d]
  }));
}

// 📊 ตารางที่ 3: สถิติแยกรายหลัก (ร้อย, สิบ, หน่วย)
function analyzePositionBreakdown(records) {
  let pos = {};
  for(let d=0; d<=9; d++) {
    pos[d] = {
      hundreds: { hits: 0, maxWin: 0 },
      tens: { hits: 0, maxWin: 0 },
      units: { hits: 0, maxWin: 0 }
    };
  }

  records.forEach(r => {
    let t3 = r.top3, b2 = r.bottom2;
    let h = t3[0], t = t3[1], u = t3[2];
    let bTens = b2[0], bUnits = b2[1];

    for(let d=0; d<=9; d++) {
      let dStr = d.toString();
      if(h === dStr) pos[d].hundreds.hits++;
      if(t === dStr || bTens === dStr) pos[d].tens.hits++;
      if(u === dStr || bUnits === dStr) pos[d].units.hits++;
    }
  });
  return pos;
}

// 📈 ตารางที่ 5: คู่-คี่ & สูง-ต่ำ
function analyzeOddEvenHighLow(records) {
  let evenCount = 0, oddCount = 0, highCount = 0, lowCount = 0;
  let total = records.length;

  records.forEach(r => {
    let top2 = parseInt(r.top3.slice(-2));
    if(top2 % 2 === 0) evenCount++; else oddCount++;
    if(top2 >= 50) highCount++; else lowCount++;
  });

  return {
    evenRate: total > 0 ? ((evenCount / total) * 100).toFixed(1) : '0.0',
    oddRate: total > 0 ? ((oddCount / total) * 100).toFixed(1) : '0.0',
    highRate: total > 0 ? ((highCount / total) * 100).toFixed(1) : '0.0',
    lowRate: total > 0 ? ((lowCount / total) * 100).toFixed(1) : '0.0',
  };
}

// 🧩 ตารางที่ 6: กลุ่มพิเศษ เบิ้ล / หาม / พี่น้อง
function analyzeSpecialPatterns(records) {
  let doubleCount = 0, harmCount = 0, sisterCount = 0;
  let total = records.length;

  records.forEach(r => {
    let t3 = r.top3;
    let top2 = t3.slice(-2);
    if(t3[1] === t3[2]) doubleCount++;
    if(t3[0] === t3[2]) harmCount++;
    let d1 = parseInt(top2[0]), d2 = parseInt(top2[1]);
    if(Math.abs(d1 - d2) === 1 || (d1 === 0 && d2 === 9) || (d1 === 9 && d2 === 0)) sisterCount++;
  });

  return {
    doubleRate: total > 0 ? ((doubleCount / total) * 100).toFixed(1) : '0.0',
    harmRate: total > 0 ? ((harmCount / total) * 100).toFixed(1) : '0.0',
    sisterRate: total > 0 ? ((sisterCount / total) * 100).toFixed(1) : '0.0',
  };
}

// 🔢 ตารางที่ 8: ผลรวมแต้ม Sum Digit Matrix
function analyzeSumMatrix(records) {
  let top2Sums = {}, top3Sums = {};
  records.forEach(r => {
    let t3 = r.top3;
    let sTop3 = t3.split('').reduce((a,b) => a + parseInt(b), 0);
    let sTop2 = parseInt(t3[1]) + parseInt(t3[2]);
    top3Sums[sTop3] = (top3Sums[sTop3] || 0) + 1;
    top2Sums[sTop2] = (top2Sums[sTop2] || 0) + 1;
  });

  let topTop2 = Object.entries(top2Sums).sort((a,b) => b[1]-a[1])[0] || [0,0];
  let topTop3 = Object.entries(top3Sums).sort((a,b) => b[1]-a[1])[0] || [0,0];

  return {
    top2Sum: topTop2[0],
    top3Sum: topTop3[0]
  };
}

// 🎯 ฟังก์ชันสกัดชุดเจาะการ์ด (ตัดเลขเบิ้ล & ตัดคู่ D1-D2 ออกจากโควต้าการ์ด 100%)
function generateOptimizedPairsWithSynergy(d1, d2, activeRecords, winDigits) {
  const pairFreqMap = {};
  activeRecords.forEach(r => {
    const top2 = r.top3.slice(-2);
    const bot2 = r.bottom2;
    [top2, bot2].forEach(p => {
      if (p.length === 2) {
        pairFreqMap[p] = (pairFreqMap[p] || 0) + 1;
        let rev = p.split('').reverse().join('');
        pairFreqMap[rev] = (pairFreqMap[rev] || 0) + 1;
      }
    });
  });

  let getFilteredCandidates = (mainDigit) => {
    let cands = [];
    for (let i = 0; i <= 9; i++) {
      if (i === mainDigit || i === d1 || i === d2) continue;
      let pStr = `${mainDigit}${i}`;
      let baseScore = pairFreqMap[pStr] || 0;
      let inWinArray = winDigits.includes(mainDigit) && winDigits.includes(i);
      let synergyBonus = inWinArray ? 5 : 0;
      cands.push({ pair: pStr, score: baseScore + synergyBonus });
    }
    cands.sort((a, b) => b.score - a.score);
    return cands.slice(0, 5);
  };

  let d1Selected = getFilteredCandidates(d1);
  let d2Selected = getFilteredCandidates(d2);

  let result = [];
  d1Selected.forEach((item, index) => {
    let highlight = index === 0 ? 'top1' : (index === 1 ? 'top2' : (index === 2 ? 'top3' : 'normal'));
    result.push({ pair: item.pair, mainDigit: d1, rank: index + 1, highlight: highlight });
  });

  d2Selected.forEach((item, index) => {
    let highlight = index === 0 ? 'top1' : (index === 1 ? 'top2' : (index === 2 ? 'top3' : 'normal'));
    result.push({ pair: item.pair, mainDigit: d2, rank: index + 1, highlight: highlight });
  });

  result.sort((a, b) => parseInt(a.pair) - parseInt(b.pair));
  return result;
}

function analyzeLotteryRecords(records) {
  const activeRecords = records.slice(0, 30);
  const total = activeRecords.length;
  if (total === 0) return null;

  const masterScores = calculateGeniusDnaScores(activeRecords);
  const d1 = masterScores[0].digit;
  const d2 = masterScores[1].digit;

  const winArrayData = generateCoOccurrenceWinArray(activeRecords);
  const structuredPairs = generateOptimizedPairsWithSynergy(d1, d2, activeRecords, winArrayData.winDigits);
  const displayedPairs = structuredPairs.map(p => p.pair);

  const auditPairs = [...displayedPairs];
  let crossPair1 = `${d1}${d2}`;
  let crossPair2 = `${d2}${d1}`;
  if (!auditPairs.includes(crossPair1)) auditPairs.push(crossPair1);
  if (!auditPairs.includes(crossPair2)) auditPairs.push(crossPair2);

  let digitHits = 0;
  let pairHits = 0;
  const auditLogs = [];

  const chronRecords = [...activeRecords].reverse();
  for (let i = Math.min(1, Math.floor(chronRecords.length / 2)); i < chronRecords.length; i++) {
    const past = chronRecords.slice(0, i);
    const target = chronRecords[i];
    
    const pastMaster = calculateGeniusDnaScores(past);
    const topCandidates = [pastMaster[0].digit, pastMaster[1].digit];

    const actualTop3 = target.top3;
    const actualBottom2 = target.bottom2;
    const actualTop2 = actualTop3.slice(-2);
    const actualBot2 = actualBottom2;
    const actualDigits = (actualTop3 + actualBottom2).split('');

    const isDigitHit = topCandidates.some(d => actualDigits.includes(d.toString()));
    let isPairHit = false;
    if (isDigitHit) {
      digitHits++;
      isPairHit = auditPairs.some(pair => {
        const revPair = pair.split('').reverse().join('');
        return (actualTop2 === pair || actualTop2 === revPair || actualBot2 === pair || actualBot2 === revPair);
      });
      if (isPairHit) pairHits++;
    }

    auditLogs.push({
      date: target.date,
      top3: target.top3,
      bottom2: target.bottom2,
      pred: topCandidates.join(', '),
      isDigitHit: isDigitHit,
      isPairHit: isPairHit
    });
  }

  auditLogs.reverse();

  const gapData = analyzeGapTracker(activeRecords);
  const momentumResults = analyzeTrendMomentum(activeRecords);
  const mathResults = analyzePureMathematics(activeRecords);
  const correlationResults = analyzeCorrelationPairs(activeRecords, gapData);
  const freqResults = analyzeOverallFrequency(activeRecords);
  const posResults = analyzePositionBreakdown(activeRecords);
  const oehlResults = analyzeOddEvenHighLow(activeRecords);
  const specialResults = analyzeSpecialPatterns(activeRecords);
  const sumResults = analyzeSumMatrix(activeRecords);

  const evalCount = auditLogs.length;
  const digitWinRate = evalCount > 0 ? ((digitHits / evalCount) * 100).toFixed(2) : '0.00';
  const pairWinRate = digitHits > 0 ? ((pairHits / digitHits) * 100).toFixed(2) : '0.00';

  const formattedPairs = structuredPairs.map(pItem => ({
    pair: pItem.pair,
    highlightClass: pItem.highlight === 'top1' ? 'highlight-top1' : (pItem.highlight === 'top2' ? 'highlight-top2' : (pItem.highlight === 'top3' ? 'highlight-top3' : '')),
    pct: `${pairWinRate}%`
  }));

  return {
    total, digitWinRate, pairWinRate, digitHits, pairHits, evalCount, d1, d2,
    masterScores, winArrayData, formattedPairs, auditLogs, correlationResults,
    freqResults, posResults, oehlResults, specialResults, sumResults, gapData, momentumResults, mathResults
  };
}
