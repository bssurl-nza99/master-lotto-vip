​<script>
const THAI_MONTHS = {
"ม.ค.": 1, "ก.พ.": 2, "มี.ค.": 3, "เม.ย.": 4, "พ.ค.": 5, "มิ.ย.": 6,
"ก.ค.": 7, "ส.ค.": 8, "ก.ย.": 9, "ต.ค.": 10, "พ.ย.": 11, "ธ.ค.": 12
};
​function getFlag(category) {
if (category.includes("จีน")) return "🇨🇳";
if (category.includes("ลาว")) return "🇱🇦";
if (category.includes("ฮั่งเส็ง")) return "🇭🇰";
if (category.includes("นิเคอิ") || category.includes("นิคเคอิ")) return "🇯🇵";
if (category.includes("ดาวโจนส์")) return "🇺🇸";
if (category.includes("รัสเซีย")) return "🇷🇺";
if (category.includes("เยอรมัน")) return "🇩🇪";
if (category.includes("อังกฤษ")) return "🇬🇧";
if (category.includes("ไต้หวัน") || category.includes("ได้หวัน")) return "🇹🇼";
if (category.includes("เกาหลี")) return "🇰🇷";
if (category.includes("สิงคโปร์")) return "🇸🇬";
if (category.includes("มาเลย์")) return "🇲🇾";
if (category.includes("ไทย")) return "🇹🇭";
return "🌐";
}
​function parseThaiDate(dateStr) {
const pattern = /(\d{1,2})\s+([ก-ฮa-zA-Z.]+)\s+(\d{2,4})/;
const match = dateStr.match(pattern);
if (!match) return null;
const day = parseInt(match[1]);
const month = THAI_MONTHS[match[2]] || 1;
let year = parseInt(match[3]);
if (year < 100) year += 2500;
return new Date(year - 543, month - 1, day);
}
​function formatNextDate(lastDateStr) {
const dateObj = parseThaiDate(lastDateStr);
if (!dateObj) return "วันถัดไป";
dateObj.setDate(dateObj.getDate() + 1);
​const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const d = dateObj.getDate();
const m = months[dateObj.getMonth()];
const y = (dateObj.getFullYear() + 543) % 100;
return ${d} ${m} ${y};
}
​class LotteryRecord {
constructor(category, rawDate, top3d, bottom2d, isCancelled = false, note = "") {
this.category = category.trim();
this.rawDate = rawDate.trim();
this.parsedDate = parseThaiDate(rawDate);
this.top3d = top3d ? top3d.padStart(3, '0') : null;
this.bottom2d = bottom2d ? bottom2d.padStart(2, '0') : null;
this.isCancelled = isCancelled;
this.note = note;
}
​getScoringDigits() {
if (this.isCancelled || !this.top3d || !this.bottom2d) return new Set();
return new Set([
this.top3d[1], this.top3d[2], // สิบ, หน่วย บน (ไม่เอาหลักร้อย)
this.bottom2d[0], this.bottom2d[1] // สิบ, หน่วย ล่าง
]);
}
}
​function parseRawText(text) {
const blocks = text.split(/\n\s*\n/);
let records = [];
​blocks.forEach(block => {
const lines = block.split("\n").map(l => l.trim()).filter(l => l);
let currentCat = "";
let i = 0;
while (i < lines.length) {
const line = lines[i];
if (line.includes("|")) {
const parts = line.split("|");
currentCat = parts[0].trim();
const rawDate = parts[1].trim();
​if (i + 1 < lines.length) {
const next1 = lines[i + 1];
if (next1.includes("งดออกผล") || next1.includes("หยุด") || next1.includes("ปิด")) {
records.push(new LotteryRecord(currentCat, rawDate, null, null, true, next1));
i += 2;
continue;
}
if (next1.length >= 2 && /^\d+/.test(next1) && i + 2 < lines.length && /^\d+/.test(lines[i+2])) {
records.push(new LotteryRecord(currentCat, rawDate, next1, lines[i+2], false));
i += 3;
continue;
}
}
}
i++;
}
});
return records;
}
​// --- 5 UNIVERSAL FORMULAS (WITH +1 ADDITION AS ORIGINAL) ---
function calculateFormulas(rec) {
if (rec.isCancelled || !rec.top3d || !rec.bottom2d) return {};
const r_hun = parseInt(rec.top3d[0]);
const r_sib = parseInt(rec.top3d[1]);
const r_หน่วย = parseInt(rec.top3d[2]);
const b_sib = parseInt(rec.bottom2d[0]);
const b_หน่วย = parseInt(rec.bottom2d[1]);
​const f1 = (r_หน่วย + b_หน่วย) % 10;
const f2 = (r_sib + b_sib) % 10;
const f3 = (r_sib + r_hun) % 10;
const f4 = (r_hun + r_sib + r_หน่วย) % 10;
const f5 = (r_hun + r_sib + r_หน่วย + b_sib + b_หน่วย) % 10;
​return {
"1. หน่วยบน + หน่วยล่าง": [f1, (f1 + 1) % 10],
"2. สิบบน + สิบล่าง": [f2, (f2 + 1) % 10],
"3. สิบบน + ร้อยบน": [f3, (f3 + 1) % 10],
"4. ผลรวม 3 ตัวบน": [f4, (f4 + 1) % 10],
"5. ผลรวม 5 หลัก": [f5, (f5 + 1) % 10]
};
}
​function processLotteryData() {
const text = document.getElementById("input-data").value;
const records = parseRawText(text);
const container = document.getElementById("results-container");
container.innerHTML = "";
​if (records.length === 0) {
container.innerHTML = '<div class="no-data">ไม่พบข้อมูลสถิติที่ถูกต้อง กรุณาตรวจสอบการกรอกข้อมูลอีกครั้ง</div>';
return;
}
​const categories = [...new Set(records.map(r => r.category))];
​categories.forEach(cat => {
const catRecords = records.filter(r => r.category === cat)
.sort((a, b) => (a.parsedDate || 0) - (b.parsedDate || 0));
​const validRecords = catRecords.filter(r => !r.isCancelled);
if (validRecords.length === 0) return;
​const latestRec = catRecords[catRecords.length - 1];
const flag = getFlag(cat);
const nextDateStr = formatNextDate(latestRec.rawDate);
​// --- 5 Original Universal Formulas ---
const formulaNames = [
"1. หน่วยบน + หน่วยล่าง",
"2. สิบบน + สิบล่าง",
"3. สิบบน + ร้อยบน",
"4. ผลรวม 3 ตัวบน",
"5. ผลรวม 5 หลัก"
];
​let formulaStats = {};
formulaNames.forEach(fn => {
formulaStats[fn] = { hits: 0, misses: 0, streakType: null, streakCount: 0, maxHits: 0, maxMisses: 0, latestPred: [0, 1] };
});
​// Walk-forward backtest loop
for (let i = 0; i < validRecords.length - 1; i++) {
const cur = validRecords[i];
const next = validRecords[i + 1];
const preds = calculateFormulas(cur);
const allowed = next.getScoringDigits();
​formulaNames.forEach(fn => {
const [p1, p2] = preds[fn] || [0, 1];
const isHit = allowed.has(String(p1)) || allowed.has(String(p2));
const st = formulaStats[fn];
​if (isHit) {
st.hits++;
if (st.streakType === 'HIT') st.streakCount++;
else { st.streakType = 'HIT'; st.streakCount = 1; }
st.maxHits = Math.max(st.maxHits, st.streakCount);
} else {
st.misses++;
if (st.streakType === 'MISS') st.streakCount++;
else { st.streakType = 'MISS'; st.streakCount = 1; }
st.maxMisses = Math.max(st.maxMisses, st.streakCount);
}
});
}
​// Calculate prediction for next draw
const latestPreds = calculateFormulas(latestRec);
formulaNames.forEach(fn => {
if (latestPreds[fn]) formulaStats[fn].latestPred = latestPreds[fn];
});
​// Find best formula based on win rate
let bestFormulaName = formulaNames[0];
let maxWinRate = -1;
formulaNames.forEach(fn => {
const st = formulaStats[fn];
const total = st.hits + st.misses;
const rate = total > 0 ? (st.hits / total) * 100 : 0;
if (rate > maxWinRate) {
maxWinRate = rate;
bestFormulaName = fn;
}
});
​const bestPred = formulaStats[bestFormulaName].latestPred;
const mainDigit = bestPred[0];
​// Build 6 Pairs (ordered low to high)
let pairs = [];
for (let n = 0; n <= 9; n++) {
if (n !== mainDigit) {
const d1 = Math.min(mainDigit, n);
const d2 = Math.max(mainDigit, n);
pairs.push(${d1}${d2});
}
}
pairs = pairs.slice(0, 6);
​const triad1 = ${mainDigit}${(mainDigit+1)%10}${(mainDigit+2)%10};
const triad2 = ${(mainDigit+3)%10}${(mainDigit+4)%10}${(mainDigit+5)%10};
const triad3 = ${(mainDigit+6)%10}${(mainDigit+7)%10}${(mainDigit+8)%10};
​// Evaluate Compensatory Sets (Top 5)
const compensatorySets = evaluateCompensatorySets(validRecords);
​// Create Section DOM
const section = document.createElement("div");
section.className = "category-section";
​section.innerHTML = `
<div class="category-title">${flag} ${cat}</div>
<div class="grid-layout">
<!-- Output Card -->
<div class="output-card">
<div class="date">📅 {nextDateStr}</div>
<div class="cat-name">{flag} ${cat}</div>
<div class="divider">───────</div>
<div class="main-digit">✨ {mainDigit}</div>
<div class="divider">───────</div>
<div class="pairs">{pairs[0]} — ${pairs[1]} — {pairs[2]}</div>
<div class="pairs">{pairs[3]} — ${pairs[4]} — {pairs[5]}</div>
<div class="divider">────────</div>
<div class="triad">{triad1} — ${triad2} — ${triad3}</div>
<div class="footer-id">📮 ID : cpu80</div>
<div class="footer-house">🪷 บ้าน ทรัพย์นำโชค 🪷</div>
</div>
​<!-- Data Tables -->
<div class="tables-wrapper">
<!-- Frequency 0-9 Table -->
<div class="table-box">
<div class="table-title">ตารางความถี่ 0-9 (แยกตำแหน่งอิสระ)</div>
<table>
<thead>
<tr>
<th>ตำแหน่ง</th>
${[...Array(10).keys()].map(n => <th>${n}</th>).join('')}
</tr>
</thead>
<tbody>
${renderFrequencyRows(validRecords)}
</tbody>
</table>
</div>
​<!-- Odd/Even & High/Low Table -->
<div class="table-box">
<div class="table-title">ตารางสถิติ คู่-คี่ / สูง-ต่ำ</div>
<table>
<thead>
<tr>
<th>ตำแหน่ง</th>
<th>คู่ (0,2,4,6,8)</th>
<th>คี่ (1,3,5,7,9)</th>
<th>ต่ำ (0-4)</th>
<th>สูง (5-9)</th>
</tr>
</thead>
<tbody>
${renderPatternRows(validRecords)}
</tbody>
</table>
</div>
​<!-- Formula Performance Table (Original 5 Formulas with +1) -->
<div class="table-box">
<div class="table-title">ตารางประสิทธิภาพ 5 สูตรหลัก (จัดอันดับตาม % เข้าจริง)</div>
<table>
<thead>
<tr>
<th>อันดับ / สูตร</th>
<th>เข้า</th>
<th>หลุด</th>
<th>% เข้าจริง</th>
<th>เข้าติดกันสูงสุด</th>
<th>หลุดติดกันสูงสุด</th>
<th>สถานะปัจจุบัน</th>
<th>เด่นรอบถัดไป</th>
</tr>
</thead>
<tbody>
${renderFormulaRows(formulaStats, formulaNames)}
</tbody>
</table>
</div>
​<!-- Compensatory Network Table (Added) -->
<div class="table-box">
<div class="table-title">ตารางระบบตาข่ายเลขเด่นชดเชยสมดุล (Compensatory Network - Top 5)</div>
<table>
<thead>
<tr>
<th>อันดับ</th>
<th>ชุดเลขชดเชย (3 ตัว)</th>
<th>งวดที่เข้า</th>
<th>งวดที่หลุด</th>
<th>% ชดเชยสำเร็จ</th>
<th>เข้าติดกันสูงสุด</th>
<th>หลุดติดกันสูงสุด</th>
<th>สถานะงวดล่าสุด</th>
</tr>
</thead>
<tbody>
${renderCompensatoryRows(compensatorySets)}
</tbody>
</table>
</div>
</div>
</div>
`;
container.appendChild(section);
});
}
​function evaluateCompensatorySets(records) {
let sets = [];
for (let a = 0; a <= 7; a++) {
for (let b = a + 1; b <= 8; b++) {
for (let c = b + 1; c <= 9; c++) {
const setKey = ${a}-${b}-${c};
let hits = 0, misses = 0, streakType = null, streakCount = 0, maxHits = 0, maxMisses = 0;
​for (let i = 0; i < records.length - 1; i++) {
const allowed = records[i + 1].getScoringDigits();
const isHit = allowed.has(String(a)) || allowed.has(String(b)) || allowed.has(String(c));
​if (isHit) {
hits++;
if (streakType === 'HIT') streakCount++;
else { streakType = 'HIT'; streakCount = 1; }
maxHits = Math.max(maxHits, streakCount);
} else {
misses++;
if (streakType === 'MISS') streakCount++;
else { streakType = 'MISS'; streakCount = 1; }
maxMisses = Math.max(maxMisses, streakCount);
}
}
​const total = hits + misses;
const rate = total > 0 ? (hits / total) * 100 : 0;
sets.push({ key: setKey, hits, misses, rate, maxHits, maxMisses, streakType, streakCount });
}
}
}
return sets.sort((a, b) => b.rate - a.rate).slice(0, 5);
}
​function renderCompensatoryRows(sets) {
return sets.map((item, idx) => {
let rankClass = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : "rank-3";
const streakText = item.streakType ? ${item.streakType === 'HIT' ? 'เข้า' : 'หลุด'} ${item.streakCount} รอบ : '-';
return <tr class="${rankClass}"> <td>#${idx + 1}</td> <td><b>[ ${item.key} ]</b></td> <td class="badge-hit">${item.hits}</td> <td class="badge-miss">${item.misses}</td> <td><b>${item.rate.toFixed(1)}%</b></td> <td>${item.maxHits} งวด</td> <td>${item.maxMisses} งวด</td> <td>${streakText}</td> </tr>;
}).join('');
}
​function renderFrequencyRows(records) {
const positions = ['ร้อยบน', 'สิบบน', 'หน่วยบน', 'สิบล่าง', 'หน่วยล่าง'];
let counts = {
'ร้อยบน': Array(10).fill(0),
'สิบบน': Array(10).fill(0),
'หน่วยบน': Array(10).fill(0),
'สิบล่าง': Array(10).fill(0),
'หน่วยล่าง': Array(10).fill(0)
};
​records.forEach(r => {
if (r.top3d && r.bottom2d) {
counts['ร้อยบน'][parseInt(r.top3d[0])]++;
counts['สิบบน'][parseInt(r.top3d[1])]++;
counts['หน่วยบน'][parseInt(r.top3d[2])]++;
counts['สิบล่าง'][parseInt(r.bottom2d[0])]++;
counts['หน่วยล่าง'][parseInt(r.bottom2d[1])]++;
}
});
​return positions.map(pos => {
const arr = counts[pos];
const sortedVals = [...new Set(arr)].sort((a,b) => b - a);
​return <tr> <td style="text-align: left; font-weight: bold; color: var(--gold-light);">${pos}</td> ${arr.map(val => { let rankClass = ""; if (val === sortedVals[0] && val > 0) rankClass = "rank-1"; else if (val === sortedVals[1] && val > 0) rankClass = "rank-2"; else if (val === sortedVals[2] && val > 0) rankClass = "rank-3"; return<td class="${rankClass}">${val}</td>; }).join('')} </tr> ;
}).join('');
}
​function renderPatternRows(records) {
let stats = {
'สิบบน': { even: 0, odd: 0, low: 0, high: 0 },
'หน่วยบน': { even: 0, odd: 0, low: 0, high: 0 },
'สิบล่าง': { even: 0, odd: 0, low: 0, high: 0 },
'หน่วยล่าง': { even: 0, odd: 0, low: 0, high: 0 }
};
​records.forEach(r => {
if (r.top3d && r.bottom2d) {
const digits = {
'สิบบน': parseInt(r.top3d[1]),
'หน่วยบน': parseInt(r.top3d[2]),
'สิบล่าง': parseInt(r.bottom2d[0]),
'หน่วยล่าง': parseInt(r.bottom2d[1])
};
​for (let pos in digits) {
const d = digits[pos];
if (d % 2 === 0) stats[pos].even++; else stats[pos].odd++;
if (d <= 4) stats[pos].low++; else stats[pos].high++;
}
}
});
​return Object.keys(stats).map(pos => {
const s = stats[pos];
return <tr> <td style="text-align: left; font-weight: bold; color: var(--gold-light);">${pos}</td> <td class="${s.even >= s.odd ? 'rank-1' : ''}">${s.even} งวด</td> <td class="${s.odd > s.even ? 'rank-1' : ''}">${s.odd} งวด</td> <td class="${s.low >= s.high ? 'rank-2' : ''}">${s.low} งวด</td> <td class="${s.high > s.low ? 'rank-2' : ''}">${s.high} งวด</td> </tr>;
}).join('');
}
​function renderFormulaRows(stats, names) {
const evaluated = names.map(fn => {
const st = stats[fn];
const total = st.hits + st.misses;
const rate = total > 0 ? (st.hits / total) * 100 : 0;
return { name: fn, st, rate };
}).sort((a, b) => b.rate - a.rate);
​return evaluated.map((item, idx) => {
const { name, st, rate } = item;
const pred = st.latestPred;
let rankClass = "";
if (idx === 0) rankClass = "rank-1";
else if (idx === 1) rankClass = "rank-2";
else if (idx === 2) rankClass = "rank-3";
​const streakText = st.streakType ? ${st.streakType === 'HIT' ? 'เข้า' : 'หลุด'} ${st.streakCount} รอบ : '-';
​return <tr class="${rankClass}"> <td style="text-align: left;">#${idx + 1} ${name}</td> <td class="badge-hit">${st.hits}</td> <td class="badge-miss">${st.misses}</td> <td><b>${rate.toFixed(1)}%</b></td> <td>${st.maxHits} รอบ</td> <td>${st.maxMisses} รอบ</td> <td>${streakText}</td> <td><b style="color: var(--gold);">[${pred[0]} - ${pred[1]}]</b></td> </tr>;
}).join('');
}
​function clearAllData() {
document.getElementById("input-data").value = "";
document.getElementById("results-container").innerHTML = '<div class="no-data">ระบบว่างพร้อมใช้งาน กรุณากรอกข้อมูลและกดปุ่ม "ประมวลผล"</div>';
}
