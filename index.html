<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar 2D Predictor - Pro High Accuracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #d9534f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            height: 120px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: 0.2s;
        }
        .btn-process { background-color: #28a745; color: white; }
        .btn-process:hover { background-color: #218838; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .btn-clear:hover { background-color: #e0a800; }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-reset:hover { background-color: #c82333; }

        /* การ์ดแสดงผล */
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 20px;
            margin-top: 25px;
            border: 1px solid #eee;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .card-title-area { display: flex; align-items: center; gap: 10px; }
        .flag { font-size: 28px; }
        .title-text h3 { margin: 0; font-size: 18px; color: #222; }
        .title-text span { font-size: 12px; color: #666; background: #f1f1f1; padding: 2px 8px; border-radius: 6px; }
        .date-badge { font-weight: 600; color: #555; background: #fff3cd; padding: 5px 12px; border-radius: 20px; font-size: 13px; }

        /* เลขเด่น Top 1, 2, 3 */
        .top-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .top-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .top-1 { background: linear-gradient(135deg, #f39c12, #d35400); }
        .top-2 { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
        .top-3 { background: linear-gradient(135deg, #3498db, #2980b9); }
        .top-label { font-size: 11px; margin-top: 5px; font-weight: 600; color: #666; }

        /* เลขเจาะ 5 คู่ต่อแถว */
        .grid-pairs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .pair-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 600;
        }
        /* สีเน้นตามอันดับ */
        .highlight-1 { background-color: #fffdf0; border-color: #f39c12; color: #d35400; }
        .highlight-2 { background-color: #f4f6f7; border-color: #95a5a6; color: #2c3e50; }
        .highlight-3 { background-color: #fcf3cf; border-color: #f1c40f; color: #b7950b; }
        .normal { background-color: #fff; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇲🇲 ระบบประมวลผลหวยพม่า 2D (High Accuracy)</h2>
    
    <div class="form-group">
        <label for="dataInput">วางข้อมูลสถิติ (ซ้าย = รอบเที่ยง | ขวา = รอบเย็น):</label>
        <textarea id="dataInput" placeholder="วางข้อมูลสถิติทั้งหมดที่นี่..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-process" onclick="processAllCards()">ประมวลผลความแม่นยำสูง</button>
        <button class="btn-clear" onclick="clearInput()">ล้างข้อมูล</button>
        <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>

    <div id="resultContainer" style="display: none;">
        <div class="card" id="cardLunch"></div>
        <div class="card" id="cardEvening"></div>
        <div class="card" id="cardAllDay"></div>
    </div>
</div>

<script>
    function clearInput() {
        document.getElementById('dataInput').value = '';
    }

    function resetAll() {
        document.getElementById('dataInput').value = '';
        document.getElementById('resultContainer').style.display = 'none';
    }

    // อัลกอริทึมเพิ่มความแม่นยำ (ถ่วงน้ำหนักข้อมูลล่าสุด + กรองเลขซ้ำ)
    function analyzeHighAccuracy(numberList) {
        let freq = {};
        let pairFreq = {};

        // ให้น้ำหนักข้อมูลท้ายตาราง (ข้อมูลล่าสุด) มากกว่า เพื่อจับเทรนด์ปัจจุบัน
        numberList.forEach((num, index) => {
            if (num && num.length === 2) {
                let weight = 1 + (index / numberList.length); // ยิ่งบรรทัดล่างสุด (ล่าสุด) น้ำหนักยิ่งมาก
                let d1 = num[0];
                let d2 = num[1];

                freq[d1] = (freq[d1] || 0) + weight;
                freq[d2] = (freq[d2] || 0) + weight;

                // เก็บสถิติการจับคู่จริงจากประวัติ
                pairFreq[num] = (pairFreq[num] || 0) + (weight * 2);
            }
        });

        // หาเลขเด่น Top 3
        let sortedDigits = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
        let t1 = sortedDigits[0] || '0';
        let t2 = sortedDigits[1] || '3';
        let t3 = sortedDigits[2] || '2';

        // สร้างรายการคู่ที่เป็นไปได้จาก Top และประวัติจริง
        let candidatePairs = [];

        // 1. ดึงคู่ที่เคยออกจริงและตรงกับเลขเด่น
        let sortedPairs = Object.keys(pairFreq).sort((a, b) => pairFreq[b] - pairFreq[a]);
        sortedPairs.forEach(p => {
            if ((p[0] === t1 || p[0] === t2 || p[0] === t3 || p[1] === t1 || p[1] === t2 || p[1] === t3)) {
                candidatePairs.push(p);
            }
        });

        // 2. เติมคู่ผสมจาก Top 1, 2, 3 เผื่อไว้กรณีคู่ประวัติศาสตร์ไม่พอ
        let matrix = [
            t1+t2, t2+t1, t1+t3, t3+t1, t2+t3, t3+t2,
            t1+t1, t2+t2, t3+t3, t1+'0', t2+'5', t3+'7', t1+'8', t2+'4', t3+'9'
        ];
        matrix.forEach(p => candidatePairs.push(p));

        // กรองเลขซ้ำ (เช่น ถ้ามี 03 แล้ว จะไม่เอา 30 หรือตัวที่ซ้ำกันกลับหน้าหลัง)
        let uniquePairs = [];
        let seenNormalized = new Set();

        candidatePairs.forEach(p => {
            // จัดเรียงตัวเลขน้อย-มาก หรือใช้ตัวแทน เพื่อตัดเลขกลับกัน (เช่น 03 กับ 30 ถือเป็นคู่เดียวกัน)
            let normalized = p.split('').sort().join('');
            // หรือถ้าต้องการเลขตรงๆ ไม่ให้ซ้ำกันเลยในลูป
            if (!uniquePairs.includes(p) && !uniquePairs.includes(p[1]+p[0]) && uniquePairs.length < 5) {
                uniquePairs.push(p);
            }
        });

        // ถ้ายังไม่ครบ 5 คู่ เติมให้ครบ
        let fallback = [t1+t2, t2+t3, t1+t3, t1+'0', t2+'5'];
        for(let f of fallback) {
            if(uniquePairs.length < 5 && !uniquePairs.includes(f) && !uniquePairs.includes(f[1]+f[0])) {
                uniquePairs.push(f);
            }
        }

        return { t1, t2, t3, pairs: uniquePairs.slice(0, 5) };
    }

    function generateCardHTML(title, roundText, data) {
        let gridHTML = '';
        data.pairs.forEach((p, index) => {
            let styleClass = 'normal';
            if (index === 0) styleClass = 'highlight-1';
            else if (index === 1) styleClass = 'highlight-2';
            else if (index === 2) styleClass = 'highlight-3';

            gridHTML += `<div class="pair-box ${styleClass}">${p}</div>`;
        });

        let today = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });

        return `
            <div class="card-header">
                <div class="card-title-area">
                    <span class="flag">🇲🇲</span>
                    <div class="title-text">
                        <h3>${title}</h3>
                        <span>${roundText}</span>
                    </div>
                </div>
                <div class="date-badge">${today}</div>
            </div>
            <div class="top-container">
                <div class="top-item">
                    <div class="top-circle top-1">${data.t1}</div>
                    <span class="top-label">Top 1</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-2">${data.t2}</div>
                    <span class="top-label">Top 2</span>
                </div>
                <div class="top-item">
                    <div class="top-circle top-3">${data.t3}</div>
                    <span class="top-label">Top 3</span>
                </div>
            </div>
            <div class="grid-pairs">
                ${gridHTML}
            </div>
        `;
    }

    function processAllCards() {
        const rawText = document.getElementById('dataInput').value.trim();
        if (!rawText) {
            alert('กรุณากรอกข้อมูลสถิติก่อนทำการประมวลผล');
            return;
        }

        const lines = rawText.split('\n');
        let lunchNumbers = [];
        let eveningNumbers = [];
        let allDayNumbers = [];

        lines.forEach(line => {
            if (line.includes('--')) {
                let parts = line.split(':');
                if (parts.length >= 2) {
                    let results = parts[1].split('--');
                    let lunchNum = results[0] ? results[0].trim() : '';
                    let eveningNum = results[1] ? results[1].trim() : '';

                    if (lunchNum.length === 2) {
                        lunchNumbers.push(lunchNum);
                        allDayNumbers.push(lunchNum);
                    }
                    if (eveningNum.length === 2) {
                        eveningNumbers.push(eveningNum);
                        allDayNumbers.push(eveningNum);
                    }
                }
            }
        });

        if (lunchNumbers.length === 0 && eveningNumbers.length === 0) {
            alert('ไม่พบรูปแบบข้อมูลที่ถูกต้อง กรุณาตรวจสอบรูปแบบข้อความ');
            return;
        }

        let lunchData = analyzeHighAccuracy(lunchNumbers);
        let eveningData = analyzeHighAccuracy(eveningNumbers);
        let allDayData = analyzeHighAccuracy(allDayNumbers);

        document.getElementById('cardLunch').innerHTML = generateCardHTML("Myanmar 2D", "รอบเที่ยง (12:01 PM)", lunchData);
        document.getElementById('cardEvening').innerHTML = generateCardHTML("Myanmar 2D", "รอบเย็น (04:30 PM)", eveningData);
        document.getElementById('cardAllDay').innerHTML = generateCardHTML("Myanmar 2D", "ชุดทั้งวัน (All Day)", allDayData);

        document.getElementById('resultContainer').style.display = 'block';
    }
</script>

</body>
</html>
