function calculateUltimatePrecisionPrediction(hist,lc){const sc=Array(10).fill(0),pt=Array(10).fill(0).map(()=>Array(10).fill(0.01)),sk=Array(10).fill(0),ls=Array(10).fill(99),mem=getGlobalMemory(),lim=Math.min(hist.length,30);for(let k=0;k<lim;k++){const dr=hist[k],ws=Math.pow(0.94,k);dr.digits.forEach(d=>{if(ls[d]===99)ls[d]=k;});if(k<lim-1){const c=hist[k],n=hist[k+1];if(c.top3&&n.top3)pt[parseInt(c.top3[0])][parseInt(n.top3[0])]+=(4.5*ws);if(c.bot2&&n.bot2){pt[parseInt(c.bot2[1])][parseInt(n.bot2[0])]+=(6.5*ws);pt[parseInt(c.bot2[0])][parseInt(n.bot2[1])]+=(5.0*ws);}}}for(let d=0;d<=9;d++){if(ls[d]>3)sk[d]+=(ls[d]*2.8);}const lb2=hist[0]?hist[0].bot2:"55",ld=lb2.length===2?parseInt(lb2[1]):5,pd=lb2.length===2?parseInt(lb2[0]):5,dd=new Set(),rd=Array(10).fill(0);for(let d=0;d<=9;d++){rd[d]=pt[ld][d]+sk[d];}const sd=rd.map((s,d)=>({d,s})).sort((a,b)=>a.s-b.s);dd.add(sd[0].d);dd.add(sd[1].d);for(let d=0;d<=9;d++){if(dd.has(d)){sc[d]=-999;continue;}sc[d]+=((pt[ld][d]*7.5)+(pt[pd][d]*3.8))+(sk[d]*3.2)+(((mem.correlator[d]||1)*0.5)+((lc[d]||1)*0.5));}const srt=sc.map((score,digit)=>({digit,score})).sort((a,b)=>b.score-a.score),md=srt[0].digit,sub=srt[1].digit,ss1=Math.min(Math.abs(srt[0].score-srt[1].score),10),ss2=Math.min(Math.abs(srt[0].score-srt[2].score),10),ss3=Math.min(Math.abs(srt[1].score-srt[2].score),10),pm={...mem.pairMemory};for(let d=0;d<=9;d++){for(let p=0;p<=9;p++){if(!pm[`${d}${p}`])pm[`${d}${p}`]=0.1;}}for(let idx=0;idx<lim;idx++){const dr=hist[idx],dw=Math.pow(0.90,idx),b2=dr.bot2;if(b2&&b2.length===2)pm[`${b2[0]}${b2[1]}`]=(pm[`${b2[0]}${b2[1]}`]||0.1)+(14.0*dw);}const gfp=(td,ex=new Set())=>{const c=[];for(let d=0;d<=9;d++){if(td===d)continue;const ps=`${td}${d}`,rs=`${d}${td}`;if(ex.has(ps)||ex.has(rs))continue;c.push({pair:ps,score:(pm[ps]||0.1)*6.5+(sc[d]*2.8});}c.sort((a,b)=>b.score-a.score);return c.slice(0,5);},mp1=gfp(md),mpl=mp1.map(i=>i.pair),used=new Set(mpl),mp2=gfp(sub,used),spl=mp2.map(i=>i.pair);if(spl.length<5){for(let d=0;d<=9;d++){if(sub===d)continue;const ps=`${sub}${d}`;if(!spl.includes(ps)&&!mpl.includes(ps)){spl.push(ps);if(spl.length>=5)break;}}}return{mainDigit:md,subDigit:sub,mainDigitPct:(86.0+(ss1*0.4)).toFixed(1),roodRunPct:(83.5+(ss2*0.3)).toFixed(1),subDigitPct:(75.0+(ss3*0.4)).toFixed(1),jeawPct:(88.0+(ss1*0.35)).toFixed(1),overallConfidence:(81.0+Math.min(lim*0.4,15.0)).toFixed(1),mainPairs:mpl.sort((a,b)=>parseInt(a)-parseInt(b)),subPairs:spl.sort((a,b)=>parseInt(a)-parseInt(b)),localPairWeights:pm};}
let cardDataStore=[];
function processData(){const rt=document.getElementById('rawInput').value.trim(),ab=document.getElementById('statusAlert');if(!rt){ab.style.display='flex';ab.innerHTML='⚠️ กรุณาใส่ข้อมูลสถิติก่อนทำการประมวลผล';return;}const pr=parseLotteryRawText(rt),pd=pr.dataset,con=document.getElementById('cardsList'),up=document.getElementById('unifiedSummaryPanel');con.innerHTML='';up.innerHTML='';cardDataStore=[];const ln=Object.keys(pd);if(ln.length===0){ab.style.display='flex';ab.innerHTML='❌ ไม่พบข้อมูลสถิติที่ตรงตามรูปแบบมาตรฐาน';return;}ab.style.display='flex';ab.innerHTML=`✅ ประมวลผลสำเร็จ: พบข้อมูลหวย ${ln.length} รายการ (ตรวจสอบผ่าน ${pr.parsedBlocks} งวด)`;const bn=document.getElementById('customBrand').value.trim()||"บ้านเงินกอง";localStorage.setItem('lotto_brand_name',bn);const lc=Array(10).fill(0),bpm={};let tmp=0,trp=0,tsp=0,tjp=0,tcf=0,vc=0,prt=[];const dd=document.getElementById('customDate').value.trim()||"13 ก.ย. 69";ln.forEach(n=>{const hist=pd[n];if(hist.length<3)return;const res=calculateUltimatePrecisionPrediction(hist,lc);Object.assign(bpm,res.localPairWeights);tmp+=parseFloat(res.mainDigitPct);trp+=parseFloat(res.roodRunPct);tsp+=parseFloat(res.subDigitPct);tjp+=parseFloat(res.jeawPct);tcf+=parseFloat(res.overallConfidence);vc++;prt.push({lottoName:n,result:res,history:hist});});if(vc===0){ab.style.display='flex';ab.innerHTML='⚠️ ข้อมูลสถิติน้อยเกินไป (ต้องมีประวัติอย่างน้อย 3 งวด)';return;}const amp=(tmp/vc).toFixed(1),arp=(trp/vc).toFixed(1),asp=(tsp/vc).toFixed(1),ajp=(tjp/vc).toFixed(1),acf=(tcf/vc).toFixed(1);up.style.display='block';up.innerHTML=`<div class="panel" style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#d4af37;"><h3 class="header-title" style="margin-bottom:8px;"><span>📊 สรุปเปอร์เซ็นต์และประเมินภาพรวม</span><span class="luxury-badge">ภาพรวมทุกหวย (${vc} รายการ) • ปลอดเลขเบิ้ล 100%</span></h3><div class="external-hud" style="max-width:100%;background:#fff;"><div class="hud-row"><div class="hud-label"><span>🔥 เปอร์เซ็นต์เลขเด่น</span></div><div class="progress-bar-container"><div class="progress-bar-fill" style="width:${amp}%;"></div></div><div class="hud-val">${amp}%</div></div><div class="hud-row"><div class="hud-label"><span>🏃 เปอร์เซ็นต์เลขรูด/วิ่ง</span></div><div class="progress-bar-container"><div class="progress-bar-fill support" style="width:${arp}%;"></div></div><div class="hud-val">${arp}%</div></div><div class="hud-row"><div class="hud-label"><span>⚡ เปอร์เซ็นต์เลขรอง</span></div><div class="progress-bar-container"><div class="progress-bar-fill silver" style="width:${asp}%;"></div></div><div class="hud-val">${asp}%</div></div><div class="hud-row"><div class="hud-label"><span>🎯 เปอร์เซ็นต์เลขเจาะเน้นๆ</span></div><div class="progress-bar-container"><div class="progress-bar-fill jeaw" style="width:${ajp}%;"></div></div><div class="hud-val">${ajp}%</div></div><div class="hud-row" style="margin-top:8px;padding-top:6px;border-top:1px dashed #e2e8f0;"><div class="hud-label"><span style="font-weight:700;color:#059669;">🛡️ ความเชื่อมั่นในรอบถัดไป</span></div><div class="progress-bar-container"><div class="progress-bar-fill confidence" style="width:${acf}%;"></div></div><div class="hud-val" style="color:#059669;">${acf}%</div></div></div></div>`;prt.forEach((item,idx)=>{const name=item.lottoName,res=item.result,md=res.mainDigit,sub=res.subDigit,r1=res.mainPairs,r2=res.subPairs,fl=getLottoIcon(name),cdn=cleanLottoDisplayName(name),to=`📅 ${dd}\n${fl} ${cdn}\n\n✨ เด่น ${md} | รอง ${sub}\n───────\nเด่นหลัก: ${r1.join(', ')}\nรองหลัก: ${r2.join(', ')}\n🎯 ความเชื่อมั่นรอบถัดไป: ${acf}%\n\n✦ ${bn} ✦`;cardDataStore.push({name:cdn,text:to});const wr=document.createElement('div');wr.className='card-wrapper';wr.innerHTML=`<div class="lotto-card-ui" id="card_ui_${idx}"><div class="card-header-ui"><div class="header-left"><div class="flag-icon">${fl}</div><div><div class="date-text">${dd}</div><h3 class="lotto-title">${cdn}</h3></div></div><div class="brand-badge">✦ ${bn} ✦</div></div><div class="main-digits-row"><div class="digit-pill"><div class="circle-num circle-gold">${md}</div></div><div class="digit-pill"><div class="circle-num circle-silver">${sub}</div></div></div><div class="pairs-container-ui"><div class="pairs-row"><div class="pair-box rank-gold">${r1[0]}</div><div class="pair-box rank-silver">${r1[1]}</div><div class="pair-box rank-rosegold">${r1[2]}</div><div class="pair-box">${r1[3]}</div><div class="pair-box">${r1[4]}</div></div><div class="pairs-row"><div class="pair-box rank-gold">${r2[0]}</div><div class="pair-box rank-silver">${r2[1]}</div><div class="pair-box rank-rosegold">${r2[2]}</div><div class="pair-box">${r2[3]}</div><div class="pair-box">${r2[4]}</div></div></div></div><div class="card-actions"><button class="btn-act btn-download" onclick="downloadCardImage(${idx},'${cdn}')">🖼️ บันทึกภาพ HD</button><button class="btn-act btn-copy" onclick="copyCardText(${idx})">📋 คัดลอกข้อความ</button></div>`;con.appendChild(wr);});saveGlobalMemory(lc,bpm);
}
function downloadCardImage(idx,name){html2canvas(document.getElementById(`card_ui_${idx}`),{scale:3,backgroundColor:null,logging:false}).then(c=>{const l=document.createElement('a');l.download=`การ์ด_${name}.png`;l.href=c.toDataURL('image/png');l.click();});}
function copyCardText(idx){navigator.clipboard.writeText(cardDataStore[idx].text).then(()=>alert('คัดลอกข้อความเรียบร้อยแล้ว!'));}
</script></body></html>
