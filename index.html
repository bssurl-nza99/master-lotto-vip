<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์สถิติหวย & จัดการ์ดเลขเด่น 2 ตัว</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tohoma', 'Segoe UI', Thonburi, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1e3a8a; margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; }
        textarea, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        textarea { height: 160px; font-family: monospace; resize: vertical; }
        .setting-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .setting-row div { flex: 1; }
        
        .btn-group { margin: 15px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-process { background-color: #27ae60; color: white; }
        .btn-process:hover { background-color: #219150; }
        .btn-copy-all { background-color: #2980b9; color: white; }
        .btn-copy-all:hover { background-color: #1f618d; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-clear:hover { background-color: #c0392b; }

        .card-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .lotto-card { background: #fafafa; border: 1px solid #e1e4e8; border-left: 5px solid #2980b9; border-radius: 8px; padding: 15px; position: relative; }
        .card-text { font-family: monospace, sans-serif; white-space: pre-wrap; font-size: 15px; line-height: 1.5; background: #fff; padding: 12px; border-radius: 6px; border: 1px dashed #ccc; }
        .btn-copy-card { position: absolute; top: 20px; right: 20px; background-color: #34495e; color: white; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 ระบบวิเคราะห์สถิติ & จัดการ์ดเลขเด่น 2 ตัว</h2>
    
    <div class="setting-row">
        <div>
            <label for="customDate">📅 วันที่แสดงในการ์ด:</label>
            <input type="text" id="customDate">
        </div>
        <div>
            <label for="customId">📮 ID ท้ายการ์ด:</label>
            <input type="text" id="customId" value="cpu80">
        </div>
        <div>
            <label for="customAuthor">🪷 ชื่ออาจารย์ ท้ายการ์ด:</label>
            <input type="text" id="customAuthor" value="อ.อาร์ม   ทรัพย์ทวี">
        </div>
    </div>

    <div class="form-group">
        <label for="rawInput">วางข้อความสถิติหวย (Raw Text):</label>
        <textarea id="rawInput" placeholder="วางข้อความสถิติตามรูปแบบเดิมที่นี่..."></textarea>
    </div>
    
    <div class="btn-group">
        <button class="btn-process" onclick="processAndGenerateCards()">⚡ ประมวลผล & สร้างการ์ดข้อความ</button>
        <button class="btn-copy-all" onclick="copyAllCards()">📋 คัดลอกการ์ดทั้งหมด (1-Click)</button>
        <button class="btn-clear" onclick="clearAll()">🔄 ล้างข้อมูล</button>
    </div>

    <h3>📌 รายการการ์ดสรุปข้อความพร้อมก๊อปปี้</h3>
    <div id="cardOutput" class="card-container">
        <div style="color: #888; text-align: center; padding: 30px;">ยังไม่มีข้อมูลการ์ด กรุณาวางข้อความสถิติแล้วกด "ประมวลผล"</div>
    </div>
</div>

<script>
// ตั้งค่าวันที่เริ่มต้นเป็นวันปัจจุบันไทย
document.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const yearShort = (today.getFullYear() + 543).toString().slice(-2);
    document.getElementById('customDate').value = `${today.getDate()} ${thaiMonths[today.getMonth()]} ${yearShort}`;
});

// ไอคอนธงชาติประจำประเภทหวย
function getLottoIcon(name) {
    if (name.includes("ลาว")) return "🇱🇦";
    if (name.includes("ฮานอย")) return "🇻🇳";
    if (name.includes("มาเลย์")) return "🇲🇾";
    if (name.includes("ไทย") || name.includes("รัฐบาล")) return "🇹🇭";
    if (name.includes("นิเคอิ")) return "🇯🇵";
    if (name.includes("จีน")) return "🇨🇳";
    if (name.includes("ฮั่งเส็ง")) return "🇭🇰";
    if (name.includes("ไต้หวัน")) return "🇹🇼";
    if (name.includes("เกาหลี")) return "🇰🇷";
    if (name.includes("สิงคโปร์")) return "🇸🇬";
    if (name.includes("หุ้น")) return "📈";
    return "🎲";
}

// 1. PARSE RAW TEXT
function parseLotteryRawText(text) {
    const lines = text.split('\n');
    const dataset = {};
    let i = 0;
    while (i < lines.length) {
        const line = lines[i].trim();
        if (line.includes('|')) {
            const parts = line.split('|');
            const lottoName = parts[0].trim();
            const dateStr = parts[1] ? parts[1].trim() : '';
            const top3 = lines[i+1] ? lines[i+1].trim() : '';
            const bot2 = lines[i+2] ? lines[i+2].trim() : '';
            if (/^\d{3}$/.test(top3) && /^\d{2}$/.test(bot2)) {
                if (!dataset[lottoName]) dataset[lottoName] = [];
                dataset[lottoName].push({ date: dateStr, digits: (top3 + bot2).split('').map(Number) });
            }
            i += 3;
        } else { i++; }
    }
    return dataset;
}

// 2. ALGORITHM (หาเลขเด่น 2 ตัว สูตรแม่นยำเดิม)
function calculateTop2Digits(history) {
    const scores = Array(10).fill(0.0);
    const decay = 0.85;
    
    // Decay Weighting
    history.forEach((draw, idx) => {
        const w = Math.pow(decay, idx);
        draw.digits.forEach(d => { scores[d] += w; });
    });

    // Gap Weighting
    const lastSeen = {};
    history.forEach((draw, idx) => {
        draw.digits.forEach(d => { if (lastSeen[d] === undefined) lastSeen[d] = idx; });
    });

    for (let d = 0; d < 10; d++) {
        const gap = lastSeen[d] !== undefined ? lastSeen[d] : history.length;
        if (gap >= 2 && gap <= 6) scores[d] += 1.5;
    }

    const sorted = scores.map((score, digit) => ({ digit, score })).sort((a, b) => b.score - a.score);
    return {
        topDigits: [sorted[0].digit, sorted[1].digit],
        others: sorted.slice(2).map(item => item.digit)
    };
}

// 3. BUILD CARD TEXT
function buildCardText(lottoName, history) {
    const { topDigits, others } = calculateTop2Digits(history);
    const d1 = topDigits[0]; // เด่นตัวที่ 1 (แถวบน)
    const d2 = topDigits[1]; // เด่นตัวที่ 2 (แถวล่าง)

    // คัดเฉพาะตัวรองที่ไม่ซ้ำกับ d1 และ d2
    const subCandidates = others.filter(x => x !== d1 && x !== d2);

    // ดึงตัวจับคู่แถวละ 3 ตัว
    const row1Partners = subCandidates.slice(0, 3).sort((a, b) => a - b);
    const row2Partners = subCandidates.slice(3, 6).sort((a, b) => a - b);

    // สร้างเลขเจาะโดยเอาเลขเด่นไว้ข้างหน้า (หลักสิบ)
    const row1Pairs = row1Partners.map(p => `${d1}${p}`);
    const row2Pairs = row2Partners.map(p => `${d2}${p}`);

    // สร้างเลข 3 ตัว 3 ชุด
    const t1 = [d1, row1Partners[0], row1Partners[1]].sort((a,b)=>a-b).join('');
    const t2 = [d1, d2, row1Partners[2] !== undefined ? row1Partners[2] : row2Partners[0]].sort((a,b)=>a-b).join('');
    const t3 = [d2, row2Partners[1] !== undefined ? row2Partners[1] : 5, row2Partners[2] !== undefined ? row2Partners[2] : 7].sort((a,b)=>a-b).join('');

    const displayDate = document.getElementById('customDate').value.trim() || "12 ก.ย. 69";
    const customId = document.getElementById('customId').value.trim() || "cpu80";
    const customAuthor = document.getElementById('customAuthor').value.trim() || "อ.อาร์ม   ทรัพย์ทวี";
    const flag = getLottoIcon(lottoName);

    return `📅 ${displayDate}\n\n${flag} ${lottoName}\n\n✨ ${d1} — ${d2}\n───────\n${row1Pairs[0]} — ${row1Pairs[1]} — ${row1Pairs[2]}\n${row2Pairs[0]} — ${row2Pairs[1]} — ${row2Pairs[2]}\n────────\n${t1} — ${t2} — ${t3}\n\n📮 ID : ${customId}\n\n🪷   ${customAuthor}   🪷`;
}

let generatedCardTexts = [];

function processAndGenerateCards() {
    const rawText = document.getElementById('rawInput').value.trim();
    if (!rawText) {
        alert('กรุณาวางข้อความสถิติหวยก่อนกดประมวลผล');
        return;
    }

    const parsedData = parseLotteryRawText(rawText);
    const container = document.getElementById('cardOutput');
    container.innerHTML = '';
    generatedCardTexts = [];

    const lottoNames = Object.keys(parsedData);
    if (lottoNames.length === 0) {
        container.innerHTML = '<div style="color:red; text-align:center;">ไม่พบรูปแบบข้อมูลสถิติที่ถูกต้อง</div>';
        return;
    }

    lottoNames.forEach((lottoName, index) => {
        const history = parsedData[lottoName];
        if (history.length < 3) return;

        const cardText = buildCardText(lottoName, history);
        generatedCardTexts.push(cardText);

        const cardDiv = document.createElement('div');
        cardDiv.className = 'lotto-card';
        cardDiv.innerHTML = `
            <button class="btn-copy-card" onclick="copySingleCard(${index})">📋 คัดลอกการ์ดนี้</button>
            <div class="card-text" id="card_text_${index}">${cardText}</div>
        `;
        container.appendChild(cardDiv);
    });
}

function copySingleCard(index) {
    const text = generatedCardTexts[index];
    navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกข้อความการ์ดนี้เรียบร้อยแล้ว!');
    });
}

function copyAllCards() {
    if (generatedCardTexts.length === 0) {
        alert('ไม่มีข้อมูลการ์ดให้คัดลอก กรุณากดประมวลผลก่อน');
        return;
    }
    const fullText = generatedCardTexts.join('\n\n=====================\n\n');
    navigator.clipboard.writeText(fullText).then(() => {
        alert(`คัดลอกการ์ดทั้งหมด (${generatedCardTexts.length} รายการ) เรียบร้อยแล้ว!`);
    });
}

function clearAll() {
    document.getElementById('rawInput').value = '';
    document.getElementById('cardOutput').innerHTML = '<div style="color: #888; text-align: center; padding: 30px;">ยังไม่มีข้อมูลการ์ด กรุณาวางข้อความสถิติแล้วกด "ประมวลผล"</div>';
    generatedCardTexts = [];
}
</script>

</body>
</html>
