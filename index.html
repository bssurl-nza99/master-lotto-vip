<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านเงินทอง — COSMIC BLACK HOLE EDITION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Prompt:wght@200;300;400;500&family=JetBrains+Mono:wght@200;300;400;500&display=swap');

    * {
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: #020208;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* -------------------------------------------------------------
       COSMIC BLACK HOLE BACKGROUND (PURE CSS & GLOWS)
    ------------------------------------------------------------- */
    .black-hole-container {
      position: absolute;
      top: -60px;
      right: -80px;
      width: 420px;
      height: 420px;
      pointer-events: none;
      z-index: 0;
    }

    /* Core Singular Center */
    .black-hole-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 130px;
      height: 130px;
      transform: translate(-50%, -50%);
      background: #000000;
      border-radius: 50%;
      box-shadow: 
        0 0 20px 2px #000,
        inset 0 0 15px #000;
      z-index: 3;
    }

    /* Accretion Disk Ring (Orange & Fire Glow) */
    .black-hole-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 120px;
      transform: translate(-50%, -50%) rotate(-28deg);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 140, 0, 0.9) 0%, rgba(236, 72, 153, 0.6) 40%, rgba(147, 51, 234, 0.3) 70%, transparent 80%);
      filter: blur(8px);
      z-index: 2;
      animation: pulseDisk 4s ease-in-out infinite alternate;
    }

    /* Secondary Cosmic Aura (Violet & Blue Nebula) */
    .cosmic-nebula {
      position: absolute;
      top: -100px;
      left: -100px;
      right: -100px;
      height: 600px;
      background: 
        radial-gradient(circle at 85% 15%, rgba(249, 115, 22, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 70% 25%, rgba(168, 85, 247, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 45%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulseDisk {
      0% { opacity: 0.8; transform: translate(-50%, -50%) rotate(-28deg) scale(0.98); }
      100% { opacity: 1; transform: translate(-50%, -50%) rotate(-28deg) scale(1.03); }
    }

    /* Ultra Glassmorphism Card */
    .cosmic-glass {
      background: rgba(10, 10, 22, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
    }

    .flag-pill {
      background: rgba(15, 15, 30, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .flag-pill:hover, .flag-pill.active {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(236, 72, 153, 0.5);
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.25);
    }
  </style>
</head>
<body class="max-w-md mx-auto p-3 pb-24 relative">

  <!-- BACKGROUND BLACK HOLE & NEBULA -->
  <div class="cosmic-nebula"></div>
  
  <div class="black-hole-container">
    <div class="black-hole-core"></div>
    <div class="black-hole-ring"></div>
  </div>

  <!-- STAR PARTICLES CANVAS -->
  <canvas id="spaceCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- CONTENT WRAPPER -->
  <div class="relative z-10">

    <!-- TOP HEADER -->
    <header class="cosmic-glass rounded-2xl p-3 mb-3 flex items-center justify-between sticky top-2">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-purple-950/50 border border-purple-500/40 flex items-center justify-center text-orange-400">
          <i class="fa-solid fa-meteor text-xs"></i>
        </div>
        <div>
          <h1 class="text-xs font-light tracking-widest text-white uppercase">บ้านเงินทอง</h1>
          <p class="text-[7px] font-mono-tech text-purple-300/70">COSMIC QUANTUM ENGINE</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 text-[8px] font-mono-tech text-orange-400 bg-black/60 px-2.5 py-1 rounded-full border border-orange-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-orange-400 animate-ping"></span> ONLINE
      </div>
    </header>

    <!-- AI SYNAPSE CORE SECTION -->
    <section class="relative w-full h-[300px] rounded-2xl overflow-hidden cosmic-glass mb-3 flex items-center justify-center">
      
      <!-- 3D Hologram Brain Engine -->
      <canvas id="cinematicBrainCanvas" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-10"></canvas>

      <div class="absolute top-3 left-3 p-2 rounded-xl bg-black/50 border border-white/10 backdrop-blur-md z-20">
        <div class="text-[6px] font-mono-tech text-purple-300/70 tracking-widest">QUANTUM MATRIX</div>
        <div class="text-[10px] font-mono-tech text-white">99.98<span class="text-[7px] text-orange-400">% ACCURACY</span></div>
      </div>

      <div class="absolute bottom-3 left-3 text-[7px] font-mono-tech text-slate-400 z-20 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span> TOUCH TO ROTATE MODEL
      </div>
    </section>

    <!-- INTERNATIONAL MARKETS (16 FLAGS) -->
    <section class="cosmic-glass rounded-2xl p-3 mb-3">
      <div class="flex justify-between items-center mb-2.5">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-globe text-[10px] text-purple-400"></i>
          <h2 class="text-xs font-light tracking-wide text-white">ตลาดหวยนานาชาติ</h2>
        </div>
        <span class="text-[7px] font-mono-tech text-slate-400">16 MARKETS</span>
      </div>

      <!-- 16 Flags Grid -->
      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="selectMarket('รัฐบาลไทย', 'th')" class="flag-pill active p-1.5 rounded-xl flex items-center gap-1.5" id="flag-th">
          <span class="fi fi-th text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ไทย</span>
        </button>
        <button onclick="selectMarket('ฮานอย', 'vn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-vn">
          <span class="fi fi-vn text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ฮานอย</span>
        </button>
        <button onclick="selectMarket('ลาว', 'la')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-la">
          <span class="fi fi-la text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ลาว</span>
        </button>
        <button onclick="selectMarket('มาเลเซีย', 'my')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-my">
          <span class="fi fi-my text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">มาเลย์</span>
        </button>

        <button onclick="selectMarket('ดาวโจนส์', 'us')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-us">
          <span class="fi fi-us text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ดาวโจนส์</span>
        </button>
        <button onclick="selectMarket('นิเคอิ', 'jp')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-jp">
          <span class="fi fi-jp text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">นิเคอิ</span>
        </button>
        <button onclick="selectMarket('จีน', 'cn')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-cn">
          <span class="fi fi-cn text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">จีน</span>
        </button>
        <button onclick="selectMarket('ฮั่งเส็ง', 'hk')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-hk">
          <span class="fi fi-hk text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ฮั่งเส็ง</span>
        </button>

        <button onclick="selectMarket('ไต้หวัน', 'tw')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-tw">
          <span class="fi fi-tw text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">ไต้หวัน</span>
        </button>
        <button onclick="selectMarket('เกาหลี', 'kr')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-kr">
          <span class="fi fi-kr text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">เกาหลี</span>
        </button>
        <button onclick="selectMarket('สิงคโปร์', 'sg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-sg">
          <span class="fi fi-sg text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">สิงคโปร์</span>
        </button>
        <button onclick="selectMarket('อินเดีย', 'in')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-in">
          <span class="fi fi-in text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">อินเดีย</span>
        </button>

        <button onclick="selectMarket('อียิปต์', 'eg')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-eg">
          <span class="fi fi-eg text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">อียิปต์</span>
        </button>
        <button onclick="selectMarket('รัสเซีย', 'ru')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-ru">
          <span class="fi fi-ru text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">รัสเซีย</span>
        </button>
        <button onclick="selectMarket('เยอรมัน', 'de')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-de">
          <span class="fi fi-de text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">เยอรมัน</span>
        </button>
        <button onclick="selectMarket('อังกฤษ', 'gb')" class="flag-pill p-1.5 rounded-xl flex items-center gap-1.5" id="flag-gb">
          <span class="fi fi-gb text-xs rounded-sm shrink-0"></span>
          <span class="text-[9px] text-slate-200 font-light truncate">อังกฤษ</span>
        </button>
      </div>

      <!-- Selected Market Box -->
      <div class="mt-3 p-2.5 rounded-xl bg-black/40 border border-purple-500/20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-[10px] font-light text-orange-300" id="market-title">รัฐบาลไทย</span>
          <span class="text-[7px] font-mono-tech text-slate-400" id="market-count">4 SUB-ITEMS</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5" id="market-items-container"></div>
      </div>
    </section>

  </div>

  <script>
    // Market Data
    const marketData = {
      'รัฐบาลไทย': ['รัฐบาลไทย', 'ออมสิน', 'ธ.ก.ส.', 'หุ้นไทย 4 รอบ'],
      'ฮานอย': ['ฮานอยเฉพาะกิจ', 'ฮานอยพิเศษ', 'ฮานอยปกติ', 'ฮานอย VIP', 'ฮานอยพัฒนา'],
      'ลาว': ['ลาวพัฒนา', 'ลาว VIP', 'ลาวสตาร์', 'ลาวสามัคคี', 'ลาว EXTRA'],
      'มาเลเซีย': ['มาเลย์ Magnum', 'Damacai 1+3D', 'Toto 4D', 'Sabah 88'],
      'ดาวโจนส์': ['ดาวโจนส์ VIP', 'ดาวโจนส์ Star', 'ดาวโجونส์ ปกติ'],
      'นิเคอิ': ['นิเคอิ เช้า', 'นิเคอิ บ่าย', 'นิเคอิ VIP'],
      'จีน': ['จีน เช้า', 'จีน บ่าย', 'จีน VIP'],
      'ฮั่งเส็ง': ['ฮั่งเส็ง เช้า', 'ฮั่งเส็ง บ่าย', 'ฮั่งเส็ง VIP'],
      'ไต้หวัน': ['ไต้หวัน ปกติ', 'ไต้หวัน VIP'],
      'เกาหลี': ['เกาหลี ปกติ', 'เกาหลี VIP'],
      'สิงคโปร์': ['สิงคโปร์ ปกติ', 'สิงคโปร์ VIP'],
      'อินเดีย': ['อินเดีย Bombay', 'อินเดีย VIP'],
      'อียิปต์': ['อียิปต์ ปกติ', 'อียิปต์ VIP'],
      'รัสเซีย': ['รัสเซีย ปกติ', 'รัสเซีย VIP'],
      'เยอรมัน': ['เยอรมัน ปกติ', 'เยอรมัน VIP'],
      'อังกฤษ': ['อังกฤษ ปกติ', 'อังกฤษ VIP']
    };

    function selectMarket(name, code) {
      document.querySelectorAll('.flag-pill').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`flag-${code}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('market-title').innerText = name;
      const items = marketData[name] || ['หวยปกติ', 'หวย VIP'];
      document.getElementById('market-count').innerText = `${items.length} SUB-ITEMS`;

      const container = document.getElementById('market-items-container');
      container.innerHTML = items.map(item => `
        <div class="bg-black/50 border border-white/5 p-1.5 rounded-lg flex items-center justify-between">
          <span class="text-[9px] text-slate-300 font-light truncate">${item}</span>
          <span class="text-[7px] font-mono-tech text-orange-400 bg-orange-950/40 px-1 py-0.2 rounded">LIVE</span>
        </div>
      `).join('');
    }
    selectMarket('รัฐบาลไทย', 'th');

    // Space Starfield Canvas Particles
    const spaceCanvas = document.getElementById('spaceCanvas');
    const spaceCtx = spaceCanvas.getContext('2d');
    
    function resizeSpace() {
      spaceCanvas.width = window.innerWidth;
      spaceCanvas.height = window.innerHeight;
    }
    resizeSpace();
    window.addEventListener('resize', resizeSpace);

    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.2,
      alpha: Math.random(),
      speed: Math.random() * 0.01 + 0.005
    }));

    function drawSpace() {
      spaceCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        spaceCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
        spaceCtx.beginPath();
        spaceCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        spaceCtx.fill();
      });
      requestAnimationFrame(drawSpace);
    }
    drawSpace();

    // 3D Rotating Brain Simulation
    const brainCanvas = document.getElementById('cinematicBrainCanvas');
    const bCtx = brainCanvas.getContext('2d');

    function resizeBrain() {
      brainCanvas.width = brainCanvas.parentElement.clientWidth;
      brainCanvas.height = brainCanvas.parentElement.clientHeight;
    }
    resizeBrain();

    const nodes = [];
    for (let i = 0; i < 200; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const r = 38 + Math.random() * 6;
      nodes.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta) * 0.8,
        z: r * Math.cos(phi)
      });
    }

    let angleY = 0;
    function renderBrain() {
      bCtx.clearRect(0, 0, brainCanvas.width, brainCanvas.height);
      const cx = brainCanvas.width / 2;
      const cy = brainCanvas.height / 2;
      angleY += 0.005;

      const cos = Math.cos(angleY);
      const sin = Math.sin(angleY);

      const projected = nodes.map(n => {
        const rx = n.x * cos - n.z * sin;
        const rz = n.x * sin + n.z * cos;
        const scale = 180 / (180 + rz);
        return { x: cx + rx * scale, y: cy + n.y * scale, scale };
      });

      bCtx.lineWidth = 0.4;
      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const dx = projected[i].x - projected[j].x;
          const dy = projected[i].y - projected[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 18) {
            bCtx.strokeStyle = `rgba(168, 85, 247, ${ (1 - dist/18) * 0.4 })`;
            bCtx.beginPath();
            bCtx.moveTo(projected[i].x, projected[i].y);
            bCtx.lineTo(projected[j].x, projected[j].y);
            bCtx.stroke();
          }
        }
      }

      projected.forEach(p => {
        bCtx.fillStyle = '#f97316';
        bCtx.beginPath();
        bCtx.arc(p.x, p.y, 1.2 * p.scale, 0, Math.PI * 2);
        bCtx.fill();
      });

      requestAnimationFrame(renderBrain);
    }
    renderBrain();
  </script>
</body>
</html>
