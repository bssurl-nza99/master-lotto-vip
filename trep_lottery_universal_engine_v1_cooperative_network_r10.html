<script id="V1_CLEAN_ENGINE">
/* R10 research-only ablation hooks. Inert unless an audit explicitly sets a Set on window. */
function __moduleAblated(name){return !!(window.__MODULE_ABLATION_DISABLED__ instanceof Set && window.__MODULE_ABLATION_DISABLED__.has(String(name)));}

/* VERSION 1.0 CLEAN BASELINE
   One production entry point: selectCooperative -> __universalBaselineSelect.
   User-defined historical score and card percentage logic are locked and unchanged.
   Separate shadow/research/promotion scripts from prior builds have been removed.
*/
/* MAINTAINER MAP: shared engine and much of the app live in this large block.
   Prefer small, named helpers; avoid broad regex edits or moving code without
   a behavioral snapshot. Keep target data out of all pre-target calculations. */
/* ===== V1 PERFORMANCE TRACE (instrumented audit copy; no formula/logic changes) ===== */
window.__PERFTRACE__ = window.__PERFTRACE__ || (() => {
  const data = new Map();
  const stack = [];
  let enabled = false;
  let lastRunMs = null;
  function rec(name, ms, selfMs) {
    if (!enabled) return;
    let x = data.get(name);
    if (!x) { x = {calls:0,total:0,self:0,max:0,min:Infinity}; data.set(name,x); }
    x.calls++; x.total += ms; x.self += Math.max(0,selfMs||0); if(ms>x.max)x.max=ms; if(ms<x.min)x.min=ms;
  }
  function begin(name){
    if(!enabled)return 0;
    const t=performance.now();
    stack.push({name,t,child:0});
    return t;
  }
  function end(name,t){
    if(!enabled)return;
    const now=performance.now();
    let frame=stack.length?stack.pop():null;
    const elapsed=now-(t||now);
    const selfMs=Math.max(0,elapsed-(frame?.child||0));
    rec(name,elapsed,selfMs);
    if(stack.length)stack[stack.length-1].child+=elapsed;
    if(name==='runEngine'){
      lastRunMs=elapsed;
      /* V1: performance diagnostics remain opt-in; no automatic overlay after runs. */
    }
  }
  function reset(){ data.clear(); stack.length=0; lastRunMs=null; }
  function rows(){ return [...data.entries()].map(([name,x])=>({name,calls:x.calls,total:x.total,self:x.self,avg:x.calls?x.total/x.calls:0,max:x.max,min:x.min===Infinity?0:x.min})).sort((a,b)=>b.total-a.total); }
  function summary(){ const rs=rows(); return {total:lastRunMs,rows:rs}; }
  function fmt(ms){
    if(!Number.isFinite(ms))return '—';
    if(ms<1000)return `${ms.toFixed(0)} ms`;
    const sec=ms/1000;
    if(sec<60)return `${sec.toFixed(2)} วินาที`;
    const m=Math.floor(sec/60),s=sec-m*60;
    return `${m} นาที ${s.toFixed(1)} วินาที`;
  }
  function show(extra){
    const old=document.getElementById('__perftrace_panel'); if(old)old.remove();
    const box=document.createElement('div'); box.id='__perftrace_panel';
    box.style.cssText='position:fixed;z-index:999999;left:8px;right:8px;bottom:8px;max-height:82vh;overflow:auto;background:#101318;color:#f5f5f5;border:1px solid #596273;border-radius:14px;padding:14px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 10px 35px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch';
    const s=summary();
    const engineMs=Number.isFinite(extra?.engineMs)?extra.engineMs:s.total;
    const rs=s.rows;

/* V3.9 FORENSIC REPAIR GATE — conservative empirical learning layer.

   1) Exact lottery type first; no cross-type target leakage.
   2) Candidate evidence is conditional on the digit actually being in the Board.
   3) Shrink small samples toward a neutral 60% prior.
   4) No promotion before sufficient evidence (18 prior candidate tests).

/* V3.40.26 STRICT AUDIT HARNESS
   Non-invasive production guard. It does not change F1-F9, cards, date pickers,
   lottery names/types, or the existing percentage engines. It verifies that every
   OOS decision is causal and exact-type isolated before a build may be considered
   eligible for promotion. */
window.__STRICT_TYPE_OOS_AUDIT__=Object.freeze({
  version:APP_BUILD_VERSION,
  required:{chronological:true,priorOnly:true,noSameRowTarget:true,crossTypePooling:'allowed only for records strictly before target cutoff; same-day/future cross-type rows excluded',conflictGuard:true},
  run(groups){
    const src=groups&&typeof groups==='object'?groups:{};
    const typeNames=Object.keys(src).filter(k=>k!=='__THAI_ALLDAY__'&&Array.isArray(src[k]));
    const failures=[],report=[];
    const key=r=>`${String(r?.name||'')}|${String(r?.timestamp||parseThaiDate(r?.date)||'')}|${String(r?.sequence||'')}`;
    for(const name of typeNames){
      const rs=results(sortRecords(src[name]));
      const seen=new Set(), dup=[];
      for(const r of rs){const k=key(r);if(seen.has(k))dup.push(k);seen.add(k)}
      let tests=0, causal=0, foreign=0, sameRow=0, targetSeenBefore=false;
      for(let i=1;i<rs.length-1;i++){
        if(rs[i+1]?.breakBefore)continue;
        const train=rs.slice(0,i+1), source=train.at(-1), target=rs[i+1];
        tests++;
        if((source?.timestamp||parseThaiDate(source?.date)||0) < (target?.timestamp||parseThaiDate(target?.date)||0))causal++;
        const targetKey=key(target), trainKeys=new Set(train.map(key));
        if(trainKeys.has(targetKey)){sameRow++;targetSeenBefore=true}
        if(train.some(r=>String(r?.name||'')!==name))foreign++;
      }
      const ok=dup.length===0&&tests===causal&&foreign===0&&sameRow===0;
      if(!ok)failures.push({name,duplicateRows:dup.length,tests,causal,foreignRows:foreign,sameRowTarget:sameRow});
      report.push({name,rows:rs.length,tests,pass:ok,duplicateRows:dup.length,causal,foreignRows:foreign,sameRowTarget:sameRow,targetSeenBefore});
    }
    return {version:APP_BUILD_VERSION,types:typeNames.length,pass:failures.length===0&&typeNames.length>0,scope:'Per-type target chronology and duplicate checks; this harness does not itself trace every pooled-selector input. Production cross-type pooling is separately guarded by cutoff and conflict logic.',failures,byType:report};
  }
});

function runCausalOrderProof(){
  const src=typeof __coopOosBundle==='function'?String(__coopOosBundle):'';
  const selectPos=src.indexOf('const sel=await selectCooperative(');
  const revealPos=src.indexOf('const target=[...rs[i+1].n3.slice(1),...rs[i+1].n2].map(Number)');
  const updatePos=Math.max(src.indexOf('__coUpdate('),src.indexOf('__rpUpdate('),src.indexOf('__condUpdate('));
  const beforeReveal=revealPos>=0?src.slice(0,revealPos):'';
  const noOutcomeReadBeforeReveal=!/rs\[i\+1\]\.(?:n3|n2)/.test(beforeReveal);
  const ordered=selectPos>=0&&revealPos>selectPos;
  const memoryAfterReveal=updatePos<0||updatePos>revealPos;
  const pass=!!(src&&ordered&&noOutcomeReadBeforeReveal&&memoryAfterReveal);
  return Object.freeze({pass,selectPos,revealPos,updatePos,noOutcomeReadBeforeReveal,memoryAfterReveal,rule:'select prior rows → reveal target → update research memory'});
}
