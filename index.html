<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANTUM STAT // ENGINE v3.2</title>
    <style>
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #141619;
            --surface-hover: #1c1f24;
            --border-color: #262930;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --font-mono: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.4;
            padding: 12px;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            white-space: nowrap;
        }

        .section-title {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
        }

        .input-panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 8px;
            resize: none;
            border-radius: 4px;
            outline: none;
            margin-bottom: 8px;
        }

        textarea:focus {
            border-color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button {
            background: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button:active {
            opacity: 0.8;
        }

        button.primary {
            background: var(--text-primary);
            color: var(--bg-color);
            font-weight: 600;
            border: none;
            flex: 1;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .lottery-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            width: 100%;
            overflow: hidden;
        }

        .lottery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
            gap: 8px;
        }

        .lottery-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .lottery-meta {
            color: var(--text-muted);
            font-size: 9px;
            white-space: nowrap;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            margin-bottom: 10px;
            background: var(--bg-color);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        @media(min-width: 600px) {
            .metrics-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .prediction-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        @media(min-width: 600px) {
            .prediction-box {
                grid-template-columns: 1fr 1fr;
            }
        }

        .anchor-col {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        .anchor-title {
            font-size: 9px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            white-space: nowrap;
        }

        .anchor-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 2px;
        }

        .pairs-list {
            color: var(--text-primary);
            font-size: 11px;
            letter-spacing: 0.05em;
            word-spacing: 4px;
            white-space: nowrap;
            overflow-x: auto;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            touch-action: pan-x pan-y;
        }

        table {
            width: 100%;
            min-width: 660px;
            border-collapse: collapse;
            font-size: 10px;
            white-space: nowrap;
        }

        th, td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background: var(--surface-color);
            position: sticky;
            top: 0;
        }

        tr:hover td {
            background: var(--surface-hover);
        }

        .tag-hit { color: var(--accent-green); font-weight: 600; }
        .tag-rev { color: var(--accent-amber); font-weight: 600; }
        .tag-miss { color: var(--text-muted); }

        .sample-link {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
            font-size: 10px;
            white-space: nowrap;
        }
        .sample-link:active { opacity: 0.7; }
    </style>
</head>

        </div>

        <div class="btn-group">

            <button onclick="clearData()">ล้างข้อมูล</button>
        </div>

    <div class="section-title"><span>PROCESSED AUDIT & PREDICTION RESULTS</span></div>
    <div id="resultsContainer" class="results-container">

function clearData() {
    document.getElementById('rawInput').value = '';
    document.getElementById('resultsContainer').innerHTML = `
        <div style="color: var(--text-muted); text-align: center; padding: 20px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px;">
            ยังไม่มีข้อมูลประมวลผล กรุณากรอกสถิติหรือกดโหลดสถิติตัวอย่างด้านบน
        </div>
    `;
    document.getElementById('systemStatus').innerText = 'STANDBY (0.00s)';
}

function parseInputData(rawText) {
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const groups = {};
    let currentCategory = 'ทั่วไป';
    let currentDate = '';
    let topVal = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        if (line.includes('|')) {
            let parts = line.split('|').map(p => p.trim());
            currentCategory = parts[0];
            currentDate = parts[1];
            if (!groups[currentCategory]) groups[currentCategory] = [];
        } else {
            if (!topVal) {
                topVal = line;
            } else {
                let botVal = line;
                if (!groups[currentCategory]) groups[currentCategory] = [];
                groups[currentCategory].push({
                    date: currentDate || `งวดที่ ${groups[currentCategory].length + 1}`,
                    top: topVal.padStart(3, '0'),
                    bot: botVal.padStart(2, '0')
                });
                topVal = '';
            }
        }
    }
    return groups;
}

function thaiDateToNumeric(dateStr) {
    if (!dateStr) return 0;
    const months = {'ม.ค.':1, 'ก.พ.':2, 'มี.ค.':3, 'เม.ย.':4, 'พ.ค.':5, 'มิ.ย.':6, 'ก.ค.':7, 'ส.ค.':8, 'ก.ย.':9, 'ต.ค.':10, 'พ.ย.':11, 'ธ.ค.':12};
    let parts = dateStr.split(' ');
    if (parts.length < 3) return 0;
    let d = parseInt(parts[0]) || 1;
    let m = months[parts[1]] || 1;
    let y = parseInt(parts[2]) || 69;
    return y * 10000 + m * 100 + d;
}

function runEngine() {
    const startTime = performance.now();
    const rawText = document.getElementById('rawInput').value;
    if (!rawText.trim()) {
        alert('กรุณากรอกข้อมูลสถิติตัวอย่างก่อนประมวลผล');
        return;
    }

    const lotteryGroups = parseInputData(rawText);
    const container = document.getElementById('resultsContainer');
    container.innerHTML = '';

    for (let cat in lotteryGroups) {
        let records = lotteryGroups[cat];
        records.sort((a, b) => thaiDateToNumeric(a.date) - thaiDateToNumeric(b.date));

        let analysis = performCausalAnalysis(records);
        let html = renderLotteryCard(cat, records, analysis);
        container.innerHTML += html;
    }

    const endTime = performance.now();
    const duration = ((endTime - startTime) / 1000).toFixed(2);
    document.getElementById('systemStatus').innerText = `VERIFIED (${duration}s)`;
}

// กฎเหล็ก: นับเข้าเฉพาะ สิบบน, หน่วยบน, สิบล่าง, หน่วยล่าง เท่านั้น (ไม่นับหลักร้อยบน)
function checkAnchorHitExact(top, bot, d) {
    let active = [];
    if (top.length >= 3) {
        active.push(top[1], top[2]);
    }
    if (bot.length >= 2) {
        active.push(bot[0], bot[1]);
    }
    return active.includes(d);
}

// สร้างสมการเชิงลึกแบบ Multi-Lag & Non-Linear
function generateEquations() {
    let eq = [];
    for (let lag1 = 1; lag1 <= 3; lag1++) {
        for (let lag2 = 1; lag2 <= 3; lag2++) {
            for (let p1 = 0; p1 < 5; p1++) {
                for (let p2 = 0; p2 < 5; p2++) {
                    for (let m1 = 1; m1 <= 4; m1++) {
                        for (let c = 0; c <= 9; c++) {
                            eq.push({ lag1, lag2, p1, p2, m1, c, mode: 0 });
                            eq.push({ lag1, lag2, p1, p2, m1, c, mode: 1 });
                        }
                    }
                }
            }
        }
    }
    return eq;
}

const GLOBAL_EQUATIONS = generateEquations();

function evaluateEquation(records, predictForIdx, eq) {
    let idx1 = predictForIdx - eq.lag1;
    let idx2 = predictForIdx - eq.lag2;
    if (idx1 < 0 || idx2 < 0) return null;

    let s1 = records[idx1].top + records[idx1].bot;
    let s2 = records[idx2].top + records[idx2].bot;

    let v1 = parseInt(s1[eq.p1] || '0');
    let v2 = parseInt(s2[eq.p2] || '0');

    let res = 0;
    if (eq.mode === 0) {
        res = ((v1 * eq.m1) + v2 + eq.c) % 10;
    } else {
        res = (Math.abs((v1 * eq.m1) - v2) + eq.c) % 10;
    }
    return res.toString();
}

// คัดเลือกเลขเด่น 2 ตัวด้วย Adaptive Self-Healing Filter (เห็นเฉพาะอดีต 0..subRecords.length-1)
function selectTopAnchors(subRecords) {
    let n = subRecords.length;
    if (n < 4) {
        let last = subRecords[n - 1];
        let d1 = last ? last.top[2] : "0";
        let d2 = last ? last.bot[1] : "8";
        if (d1 === d2) d2 = ((parseInt(d1) + 1) % 10).toString();
        return [d1, d2];
    }

    let digitScores = {};
    for (let d = 0; d <= 9; d++) digitScores[d.toString()] = 0;

    // ตรวจสอบย้อนหลังสูงสุด 8 งวดล่าสุดในอดีต เพื่อหาสมการที่ "กำลังเดินสด"
    let lookback = Math.min(8, n - 3);
    let eqPool = GLOBAL_EQUATIONS;

    for (let i = 0; i < eqPool.length; i += 3) {
        let eq = eqPool[i];
        let streak = 0;
        let weightSum = 0;
        let lastHit = false;

        for (let k = n - lookback; k < n; k++) {
            let pred = evaluateEquation(subRecords, k, eq);
            if (pred === null) continue;
            let hit = checkAnchorHitExact(subRecords[k].top, subRecords[k].bot, pred);
            let recency = k - (n - lookback) + 1; // งวดยิ่งใกล้ปัจจุบัน น้ำหนักยิ่งสูง

            if (hit) {
                streak++;
                weightSum += Math.pow(recency, 1.5);
                if (k === n - 1) lastHit = true;
            } else {
                streak = 0;
                weightSum -= recency * 0.5;
            }
        }

        // คัดเฉพาะสมการที่ผ่านเกณฑ์ความแม่นยำสดใหม่ (Adaptive Pruning)
        if (weightSum > 8 && (lastHit || streak >= 2)) {
            let nextPred = evaluateEquation(subRecords, n, eq);
            if (nextPred !== null) {
                let bonus = lastHit ? 1.6 : 1.0;
                digitScores[nextPred] += weightSum * (1 + streak * 0.4) * bonus;
            }
        }
    }

    // ผสานแรงส่งตัวเลขไหลจาก 3 งวดล่าสุด (Recent Flow Momentum)
    for (let j = Math.max(0, n - 3); j < n; j++) {
        let activeDigits = [subRecords[j].top[1], subRecords[j].top[2], subRecords[j].bot[0], subRecords[j].bot[1]];
        let flowWeight = (j - (n - 3) + 1) * 15;
        activeDigits.forEach(d => {
            if (digitScores[d] !== undefined) digitScores[d] += flowWeight;
        });
    }

    let sorted = Object.keys(digitScores).sort((a, b) => digitScores[b] - digitScores[a]);
    return [sorted[0], sorted[1]];
}

// กฎเหล็ก: เลขเด่นอยู่หลักสิบเท่านั้น + ตัวเจาะอยู่หลักหน่วยเรียงจากน้อยไปมาก + ตัดเบิ้ล + ตัดวินกันเอง
function generateStrictPairs(anchorDigit, otherAnchorDigit, subRecords) {
    let partnerScores = {};
    for (let i = 0; i <= 9; i++) {
        let k = i.toString();
        // ตัดเลขเบิ้ล (k === anchorDigit) และตัดไม่เอาเลขเด่นมาวินกันเอง (k === otherAnchorDigit)
        if (k !== anchorDigit && k !== otherAnchorDigit) {
            partnerScores[k] = 0;
        }
    }

    // คำนวณคะแนนตัวประกบจากสถิติย้อนหลัง 12 งวดในอดีต
    let recent = subRecords.slice(-12);
    recent.forEach((r, idx) => {
        let weight = idx + 1;
        let twoTop = r.top.slice(1, 3);
        let twoBot = r.bot;
        let activeDigits = [twoTop[0], twoTop[1], twoBot[0], twoBot[1]];

        activeDigits.forEach(d => {
            if (partnerScores[d] !== undefined) {
                partnerScores[d] += weight;
            }
        });

        // ให้โบนัสพิเศษถ้าเคยออกคู่กับเลขเด่นใน 2 ตัวบนหรือ 2 ตัวล่าง
        if (twoTop.includes(anchorDigit)) {
            let partner = twoTop[0] === anchorDigit ? twoTop[1] : twoTop[0];
            if (partnerScores[partner] !== undefined) partnerScores[partner] += weight * 2.5;
        }
        if (twoBot.includes(anchorDigit)) {
            let partner = twoBot[0] === anchorDigit ? twoBot[1] : twoBot[0];
            if (partnerScores[partner] !== undefined) partnerScores[partner] += weight * 2.5;
        }
    });

    // คัดตัวประกบที่ดีที่สุด 5 ตัว แล้วเรียงจากน้อยไปมาก (0 -> 9)
    let top5Partners = Object.keys(partnerScores)
        .sort((a, b) => partnerScores[b] - partnerScores[a])
        .slice(0, 5)
        .sort((a, b) => parseInt(a) - parseInt(b));

    // บังคับให้เลขเด่นอยู่หลักสิบ และตัวประกบอยู่หลักหน่วยเสมอ (เช่น เด่น 8 + 0,2,3,5,7 => 80, 82, 83, 85, 87)
    return top5Partners.map(unitDigit => anchorDigit + unitDigit);
}

function performCausalAnalysis(records) {
    let auditLog = [];
    let anchorHits = 0;
    let pairHitsInAnchor = 0;
    let totalAnchorHitForPair = 0;

    // ใช้ 8 งวดแรกเป็นฐานตั้งต้น ที่เหลือทดสอบ Walk-Forward จริงทั้งหมด
    let startIndex = Math.min(8, Math.max(3, records.length - 1));
    if (records.length <= 4) startIndex = 1;

    for (let i = startIndex; i < records.length; i++) {
        // Strict Causal: เห็นเฉพาะข้อมูลอดีต 0 ถึง i-1 เท่านั้น
        let subRecords = records.slice(0, i);
        let currentRec = records[i];

        let [d1, d2] = selectTopAnchors(subRecords);
        let pairsD1 = generateStrictPairs(d1, d2, subRecords);
        let pairsD2 = generateStrictPairs(d2, d1, subRecords);
        let all10Pairs = [...pairsD1, ...pairsD2];

        let top = currentRec.top;
        let bot = currentRec.bot;
        let twoTop = top.slice(1, 3);
        let twoBot = bot;

        let isAnchorHit = checkAnchorHitExact(top, bot, d1) || checkAnchorHitExact(top, bot, d2);

        let pairHitType = null; // 'DIRECT' หรือ 'REVERSE'
        for (let p of all10Pairs) {
            let rev = p[1] + p[0];
            if (twoTop === p || twoBot === p) {
                pairHitType = 'DIRECT';
                break;
            }
            if (twoTop === rev || twoBot === rev) {
                if (pairHitType !== 'DIRECT') pairHitType = 'REVERSE';
            }
        }

        if (isAnchorHit) {
            anchorHits++;
            totalAnchorHitForPair++;
            if (pairHitType !== null) {
                pairHitsInAnchor++;
            }
        }

        auditLog.unshift({
            date: currentRec.date,
            top: top,
            bot: bot,
            anchor: `${d1} - ${d2}`,
            pairsDisplay: `${pairsD1.join(' ')} | ${pairsD2.join(' ')}`,
            isAnchorHit: isAnchorHit,
            pairHitType: pairHitType
        });
    }

    // คำนวณชุดทำนายสำหรับงวดถัดไปในอนาคต (ใช้ข้อมูลทั้งหมดที่มีถึงปัจจุบัน)
    let [nextD1, nextD2] = selectTopAnchors(records);
    let nextPairsD1 = generateStrictPairs(nextD1, nextD2, records);
    let nextPairsD2 = generateStrictPairs(nextD2, nextD1, records);
    let nextPrediction = {
        d1: nextD1,
        d2: nextD2,
        pairsD1: nextPairsD1,
        pairsD2: nextPairsD2
    };

    let totalWalkCount = auditLog.length;
    let anchorHitRate = totalWalkCount > 0 ? Math.round((anchorHits / totalWalkCount) * 100) : 0;
    let pairHitRate = totalAnchorHitForPair > 0 ? Math.round((pairHitsInAnchor / totalAnchorHitForPair) * 100) : 0;

    return {
        anchorHitRate,
        pairHitRate,
        anchorHits,
        totalWalkCount,
        pairHitsInAnchor,
        totalAnchorHitForPair,
        auditLog,
        nextPrediction
    };
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกชุดเจาะเรียบร้อยแล้ว');
    });
}

function renderLotteryCard(catName, records, analysis) {
    let latest = records[records.length - 1];
    let pred = analysis.nextPrediction;
    let pairs1Str = pred.pairsD1.join(' ');
    let pairs2Str = pred.pairsD2.join(' ');
    let fullPairsText = `${catName} | เด่น ${pred.d1}: ${pairs1Str} | เด่น ${pred.d2}: ${pairs2Str}`;

    let auditRows = analysis.auditLog.map(row => {
        let anchorStatus = row.isAnchorHit ? '<span class="tag-hit">เข้าเด่น</span>' : '<span class="tag-miss">พลาด</span>';
        let pairStatus = '-';
        if (row.isAnchorHit) {
            if (row.pairHitType === 'DIRECT') {
                pairStatus = '<span class="tag-hit">เข้าเจาะตรง</span>';
            } else if (row.pairHitType === 'REVERSE') {
                pairStatus = '<span class="tag-rev">เข้าเจาะกลับ</span>';
            } else {
                pairStatus = '<span class="tag-miss">พลาด</span>';
            }
        }
        return `
            <tr>
                <td>${row.date}</td>
                <td>${row.top}/${row.bot}</td>
                <td>${row.anchor}</td>
                <td style="color:var(--text-secondary);">${row.pairsDisplay}</td>
                <td>${anchorStatus}</td>
                <td>${pairStatus}</td>
            </tr>
        `;
    }).join('');

    return `
        <div class="lottery-card">
            <div class="lottery-header">
                <div>
                    <span class="lottery-name">${catName}</span>
                    <div class="lottery-meta">ฐานข้อมูล ${records.length} งวด | ทดสอบ Walk-Forward ${analysis.totalWalkCount} งวด</div>
                </div>
                <button onclick="copyToClipboard('${fullPairsText}')">คัดลอก</button>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">งวดล่าสุดในระบบ</span>
                    <span class="metric-value">${latest.date} (${latest.top}/${latest.bot})</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">HIT RATE (เลขเด่น)</span>
                    <span class="metric-value" style="color:var(--accent-green);">${analysis.anchorHitRate}% (${analysis.anchorHits}/${analysis.totalWalkCount})</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">HIT RATE (เลขเจาะ *เฉพาะงวดเด่นเข้า)</span>
                    <span class="metric-value" style="color:var(--accent-blue);">${analysis.pairHitRate}% (${analysis.pairHitsInAnchor}/${analysis.totalAnchorHitForPair})</span>
                </div>
            </div>

            <div class="prediction-box">
                <div class="anchor-col">
                    <div class="anchor-title"><span>เด่นหลักที่ 1 (หลักสิบ)</span><span>(หลักหน่วยเรียงน้อยไปมาก)</span></div>
                    <div class="anchor-number">${pred.d1}</div>
                    <div class="pairs-list">${pairs1Str}</div>
                </div>
                <div class="anchor-col">
                    <div class="anchor-title"><span>เด่นหลักที่ 2 (หลักสิบ)</span><span>(หลักหน่วยเรียงน้อยไปมาก)</span></div>
                    <div class="anchor-number">${pred.d2}</div>
                    <div class="pairs-list">${pairs2Str}</div>
                </div>
            </div>

            <div class="section-title" style="margin-top:10px; margin-bottom:4px;">
                <span>STRICT CAUSAL WALK-FORWARD AUDIT LOG (เลื่อนซ้าย-ขวาได้)</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>งวดวันที่</th>
                            <th>บน/ล่าง</th>
                            <th>เลขเด่น</th>
                            <th>ชุดเจาะ 10 คู่ (เด่นหลักสิบ • ไป-กลับ)</th>
                            <th>ผลเลขเด่น</th>
                            <th>ผลเลขเจาะ</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${auditRows}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}
</script>
