<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - ซูเปอร์แอปเหนือระดับ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* เอฟเฟกต์กระจกฝ้าพรีเมียม */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        /* ข้อความไล่เฉดสี */
        .text-gradient {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%, #b34dfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0b0c10] text-gray-200 font-sans h-screen flex justify-center overflow-hidden">

    <!-- กรอบจำลองหน้าจอมือถือ -->
    <div class="w-full max-w-md h-full relative flex flex-col bg-[#0b0c10]">
        
        <!-- ส่วนหัว (Header) -->
        <header class="glass-panel sticky top-0 z-50 px-5 py-4 flex justify-between items-center rounded-b-3xl">
            <h1 class="text-2xl font-extrabold tracking-widest text-gradient">NEXUS</h1>
            <div class="flex space-x-4">
                <!-- ปุ่มวิดีโอคอลด่วน -->
                <button onclick="alert('กำลังเชื่อมต่อระบบวิดีโอคอล...') " class="relative bg-gradient-to-r from-blue-600 to-purple-600 p-2 rounded-full shadow-[0_0_15px_rgba(79,172,254,0.5)] transition hover:scale-110">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                <div class="w-9 h-9 rounded-full bg-gray-700 overflow-hidden border-2 border-blue-500">
                    <img src="https://i.pravatar.cc/100?img=33" alt="โปรไฟล์" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <!-- พื้นที่เนื้อหาหลัก (เลื่อนขึ้นลงได้) -->
        <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6 pb-24">
            
            <!-- ช่องแชร์ความรู้สึก / แปะลิงก์ -->
            <div class="glass-panel rounded-2xl p-4 flex items-center space-x-3">
                <img src="https://i.pravatar.cc/100?img=33" class="w-10 h-10 rounded-full">
                <input type="text" placeholder="คุณกำลังคิดอะไรอยู่ หรืออยากแปะลิงก์ YouTube..." class="bg-transparent w-full outline-none text-sm text-gray-200 placeholder-gray-500">
                <button class="text-blue-400 font-bold text-sm">โพสต์</button>
            </div>

            <!-- ฟีดที่ 1: โพสต์วิดีโอ YouTube ในตัว -->
            <div class="glass-panel rounded-3xl p-4 flex flex-col space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img src="https://i.pravatar.cc/100?img=12" class="w-10 h-10 rounded-full">
                        <div>
                            <h3 class="font-bold text-sm">พี่แดน (ครอบครัว)</h3>
                            <p class="text-[11px] text-gray-500">2 นาทีที่แล้ว • ดูด้วยกันตอนนี้</p>
                        </div>
                    </div>
                </div>
                <p class="text-sm text-gray-300">คลิปนี้ตลกมาก ลองเปิดดูกันเลย ไม่ต้องสลับแอปให้ยุ่งยาก!</p>
                <!-- กล่องวิดีโอ -->
                <div class="relative w-full pb-[56.25%] rounded-2xl overflow-hidden bg-black shadow-lg">
                    <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=0" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <!-- ปุ่มตอบสนอง -->
                <div class="flex justify-between text-gray-400 text-sm pt-2 px-2">
                    <button class="flex items-center space-x-1 hover:text-blue-400 transition"><span class="text-lg">🔥</span> <span>โคตรเจ๋ง</span></button>
                    <button class="flex items-center space-x-1 hover:text-white transition"><span class="text-lg">💬</span> <span>แชทคุยคลิปนี้</span></button>
                    <button class="flex items-center space-x-1 hover:text-white transition"><span class="text-lg">↗️</span> <span>แชร์</span></button>
                </div>
            </div>

            <!-- ฟีดที่ 2: แชทกลุ่มและกิจกรรม -->
            <div class="glass-panel rounded-3xl p-4 flex flex-col space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-[2px]">
                        <div class="w-full h-full bg-gray-900 rounded-full flex items-center justify-center text-xs font-bold">VIP</div>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-purple-400">กลุ่มเพื่อนสนิท</h3>
                        <p class="text-[11px] text-gray-500">ออนไลน์อยู่</p>
                    </div>
                </div>
                <div class="bg-gray-800/50 rounded-xl p-3 text-sm border border-gray-700/50">
                    <span class="font-bold text-blue-400">จอร์น:</span> คืนนี้คอลเปิดกล้องดูบอลกันไหม? กดปุ่มวิดีโอข้างบนมุมขวาได้เลยนะเว้ย
                </div>
            </div>
            
        </main>

        <!-- แถบเมนูด้านล่าง (Navigation Bar) -->
        <nav class="absolute bottom-4 left-4 right-4 glass-panel rounded-full flex justify-around items-center py-3 px-2 z-50">
            <button class="flex flex-col items-center text-blue-400 w-16">
                <svg class="w-6 h-6 mb-1 drop-shadow-[0_0_8px_rgba(79,172,254,0.8)]" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            </button>
            <button class="flex flex-col items-center text-gray-500 hover:text-white transition w-16">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
            <button class="flex flex-col items-center text-gray-500 hover:text-white transition w-16">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
            <button class="flex flex-col items-center text-gray-500 hover:text-white transition w-16">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            </button>
        </nav>
    </div>
</body>
</html>
