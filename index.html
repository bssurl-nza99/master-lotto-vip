    <p>คำนวณเปอร์เซ็นต์มาตรฐานจริง (เลขเจาะคิดเฉพาะงวดที่เลขเด่นเข้า) เรียงตารางงวดล่าสุดอยู่บนสุด</p>

<div id="toast" class="toast">ดำเนินการสำเร็จ</div>

<script>
const SAMPLE_PDF_DATA = `ลาวประตูชัย | 21 ต.ค. 69
470
62
ลาวประตูชัย | 20 ต.ค. 69
351
19
ลาวประตูชัย | 19 ต.ค. 69
520
30
ลาวประตูชัย | 18 ต.ค. 69
362
70

ฮานอยเช้า | 21 ต.ค. 69
114
03
ฮานอยเช้า | 20 ต.ค. 69
139
58
ฮานอยเช้า | 19 ต.ค. 69
406
13`;

const FLAG_MAP = {
  'ลาว': '🇱🇦',
  'ฮานอย': '🇻🇳',
  'ไทย': '🇹🇭',
  'ดาวโจนส์': '🇺🇸',
  'หุ้น': '📈',
  'นิคเคอิ': '🇯🇵',
  'จีน': '🇨🇳',
  'ฮั่งเส็ง': '🇭🇰',
  'ไต้หวัน': '🇹🇼',
  ' DEFAULT': '🎯'
};

function getFlag(typeName) {
  for (const key in FLAG_MAP) {
    if (typeName.includes(key)) return FLAG_MAP[key];
  }
  return '🎯';
}

function showAlert(msg) {
  const box = document.getElementById('mobileAlert');
  if (box) {
    box.innerText = msg;
    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearAlert() {
  const box = document.getElementById('mobileAlert');
  if (box) {
    box.classList.remove('show');
    box.innerText = '';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (t) {
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
}

function parsePDFText(rawText) {
  if (!rawText || typeof rawText !== 'string') return {};
  const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
  const grouped = {};

  blocks.forEach((block) => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    let currentLottery = null;
    let currentDate = null;
    let pendingTop3 = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      if (line.includes('งดออกผล') || line.startsWith('...') || line.startsWith('---')) {
        pendingTop3 = null;
        currentDate = null;
        continue;
      }

      if (line.includes('|')) {
        const parts = line.split('|').map(p => p.trim());
        currentLottery = parts[0];
        currentDate = parts[1] || 'ไม่ระบุวันที่';
        pendingTop3 = null;
        
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }
        continue;
      }

      if (!currentLottery && !/^\d+$/.test(line)) {
        currentLottery = line;
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }
        continue;
      }

      if (/^\d{3}$/.test(line)) {
        pendingTop3 = line;
        continue;
      }

      if (/^\d{2}$/.test(line) && pendingTop3 && currentLottery) {
        if (!grouped[currentLottery]) {
          grouped[currentLottery] = [];
        }

        const recordExists = grouped[currentLottery].some(
          r => r.date === currentDate && r.top3 === pendingTop3 && r.bottom2 === line
        );

        if (!recordExists) {
          grouped[currentLottery].push({
            date: currentDate || `งวดที่ ${grouped[currentLottery].length + 1}`,
            top3: pendingTop3,
            bottom2: line
          });
        }
        
        pendingTop3 = null;
        currentDate = null;
      }
    }
  });

  return grouped;
}

function generateSpecificPairs(tenDigit, excludeDigit) {
  let candidates = [];
  for (let i = 0; i <= 9; i++) {
    if (i !== tenDigit && i !== excludeDigit) {
      candidates.push(i);
    }
  }
  candidates.sort((a, b) => a - b);

  let pairs = [];
  for (let i = 0; i < Math.min(5, candidates.length); i++) {
    pairs.push(`${tenDigit}${candidates[i]}`);
  }
  return pairs;
}

function analyzeLotteryRecords(records) {
  const activeRecords = records.slice(0, 30);
  const total = activeRecords.length;
  if (total === 0) return null;

  const counts = Array(10).fill(0);
  activeRecords.forEach(r => {
    if (r.top3.length === 3) {
      r.top3.split('').forEach(d => counts[parseInt(d)]++);
    }
    if (r.bottom2.length === 2) {
      r.bottom2.split('').forEach(d => counts[parseInt(d)]++);
    }
  });

  const sortedGlobal = counts.map((v, i) => ({dig: i, val: v})).sort((a,b) => b.val - a.val);
  const d1 = sortedGlobal[0].dig;
  const d2 = sortedGlobal[1].dig;

  const d1Pairs = generateSpecificPairs(d1, -1);
  const d2Pairs = generateSpecificPairs(d2, d1);
  const allTenPairs = [...d1Pairs, ...d2Pairs];

  // -------------------------------------------------------------
  // ระบบคำนวณเปอร์เซ็นต์มาตรฐานแบบแม่นยำ 100%
  // -------------------------------------------------------------
  let digitHits = 0;      // จำนวนงวดที่เลขเด่นเข้า
  let pairHits = 0;       // จำนวนงวดที่เลขเจาะเข้า
  const auditLogs = [];
  const minRequired = 1;

  for (let i = Math.min(minRequired, Math.floor(activeRecords.length / 2)); i < activeRecords.length; i++) {
    const past = activeRecords.slice(0, i);
    const target = activeRecords[i];
    
    const pastCounts = Array(10).fill(0);
    past.forEach(p => (p.top3 + p.bottom2).split('').forEach(d => pastCounts[parseInt(d)]++));
    const bestPast = pastCounts.map((v, idx) => ({dig: idx, val: v})).sort((a,b) => b.val - a.val);
    const topCandidates = [bestPast[0].dig, bestPast[1].dig];

    const actualTop3 = target.top3;
    const actualBottom2 = target.bottom2;
    const actual2D = [actualTop3.slice(-2), actualBottom2]; // 2 ตัวบน และ 2 ตัวล่าง
    const actualDigits = (actualTop3 + actualBottom2).split('');

    // 1. ตรวจสอบเลขเด่นเข้าหรือไม่
    const isDigitHit = topCandidates.some(d => actualDigits.includes(d.toString()));
    
    // 2. ตรวจสอบเลขเจาะเข้าหรือไม่ (เฉพาะเมื่อเลขเด่นเข้า)
    let isPairHit = false;
    if (isDigitHit) {
      digitHits++;
      isPairHit = allTenPairs.some(p => actual2D.includes(p));
      if (isPairHit) pairHits++;
    }

    auditLogs.push({
      date: target.date,
      top3: target.top3,
      bottom2: target.bottom2,
      pred: topCandidates.join(', '),
      isDigitHit: isDigitHit,
      isPairHit: isPairHit
    });
  }

  const evalCount = auditLogs.length;
  // เปอร์เซ็นต์เลขเด่น = (งวดที่เด่นเข้า ÷ จำนวนงวดทดสอบทั้งหมด) * 100
  const digitWinRate = evalCount > 0 ? ((digitHits / evalCount) * 100).toFixed(2) : '0.00';
  
  // เปอร์เซ็นต์เลขเจาะ = (งวดที่เจาะเข้า ÷ จำนวนงวดที่เลขเด่นเข้าเท่านั้น) * 100
  const pairWinRate = digitHits > 0 ? ((pairHits / digitHits) * 100).toFixed(2) : '0.00';

  // เตรียมโครงสร้าง 10 คู่พร้อมเปอร์เซ็นต์จริง
  const formattedPairs = allTenPairs.map((pair, idx) => ({
    pair: pair,
    gold: (idx === 0 || idx === 9), // ไฮไลต์ตามเรฟ
    pct: `${pairWinRate}%`
  }));

  return {
    total: total,
    digitWinRate: digitWinRate,
    pairWinRate: pairWinRate,
    digitHits: digitHits,
    pairHits: pairHits,
    evalCount: evalCount,
    d1: d1,
    d2: d2,
    formattedPairs: formattedPairs,
    auditLogs: auditLogs
  };
}

document.addEventListener('DOMContentLoaded', () => {
  const inputData = document.getElementById('inputData');
  const dataCount = document.getElementById('dataCount');
  const runBtn = document.getElementById('runBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const clearBtn = document.getElementById('clearBtn');

  if (inputData && !inputData.value) {
    inputData.value = SAMPLE_PDF_DATA;
    const parsed = parsePDFText(SAMPLE_PDF_DATA);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
  }

  inputData.addEventListener('input', () => {
    const parsed = parsePDFText(inputData.value);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
    clearAlert();
  });

  sampleBtn.addEventListener('click', () => {
    inputData.value = SAMPLE_PDF_DATA;
    const parsed = parsePDFText(SAMPLE_PDF_DATA);
    let totalCount = Object.values(parsed).reduce((acc, arr) => acc + arr.length, 0);
    dataCount.innerText = `${totalCount} รายการ (${Object.keys(parsed).length} ประเภท)`;
    clearAlert();
    showToast('โหลดข้อมูลตัวอย่างแล้ว');
  });

  clearBtn.addEventListener('click', () => {
    inputData.value = '';
    dataCount.innerText = '0 รายการ';
    document.getElementById('resultOutput').innerHTML = '';
    clearAlert();
    showToast('ล้างข้อมูลเรียบร้อย');
  });

  runBtn.addEventListener('click', () => {
    clearAlert();
    try {
      const rawText = inputData.value;
      const parsedData = parsePDFText(rawText);
      const categories = Object.keys(parsedData);

      if (categories.length === 0) {
        showAlert('⚠️ ไม่พบข้อมูลสถิติที่ถูกต้อง กรุณาตรวจสอบรูปแบบ');
        return;
      }

      renderResults(parsedData);
      showToast('ประมวลผลสำเร็จทุกประเภท');
    } catch (err) {
      showAlert(`เกิดข้อผิดพลาด: ${err.message}`);
    }
  });
});

function captureCard(cardId, lotteryName) {
  const cardElement = document.getElementById(cardId);
  if (!cardElement) return;

  html2canvas(cardElement, {
    scale: 3,
    useCORS: true,
    backgroundColor: '#fffcf5'
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `card-${lotteryName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('บันทึกภาพเฉพาะการ์ดสำเร็จ!');
  });
}

function renderResults(parsedData) {
  const container = document.getElementById('resultOutput');
  container.innerHTML = '';

  let html = `<div class="section-title">ผลการวิเคราะห์และเลขเจาะ (ตรงตามเรฟการ์ด 100%)</div>`;

  let cardIndex = 0;
  for (const [type, rows] of Object.entries(parsedData)) {
    const res = analyzeLotteryRecords(rows);
    if (!res) continue;

    const flag = getFlag(type);
    const latestDate = rows[0] ? rows[0].date : 'ล่าสุด';
    const cardUniqueId = `predictionCard_${cardIndex++}`;

    html += `
      <div class="prediction-card-wrapper">
        <div class="prediction-card" id="${cardUniqueId}">
          <div class="card-brand-tag">
            <span>✦</span> ทรัพย์นำโชค <span>✦</span>
          </div>
          <div class="card-top-bar">
            <span class="card-date">${latestDate}</span>
            <div class="card-title-group">
              <span class="card-flag">${flag}</span>
              <span class="card-lottery-name">${type}</span>
            </div>
          </div>

          <!-- เลขเด่น D1 และ D2 ใช้เปอร์เซ็นต์มาตรฐานเดียวกัน -->
          <div class="hero-digits-wrap">
            <div class="digit-box-item digit-gold">
              <div class="digit-circle">${res.d1}</div>
              <span class="digit-rate">${res.digitWinRate}%</span>
            </div>
            <div class="digit-box-item digit-silver">
              <div class="digit-circle">${res.d2}</div>
              <span class="digit-rate">${res.digitWinRate}%</span>
            </div>
          </div>

          <!-- ชุดเลขเจาะ 10 คู่ แสดงเปอร์เซ็นต์เลขเจาะมาตรฐานจริง (นับเฉพาะตอนเด่นเข้า) -->
          <div class="pairs-grid-box">
    `;

    res.formattedPairs.forEach(p => {
      html += `
            <div class="pair-badge ${p.gold ? 'highlight-gold' : ''}">
              <span class="pair-num">${p.pair}</span>
              <span class="pair-pct">${p.pct}</span>
            </div>
      `;
    });

    html += `
          </div>
        </div>

        <div class="card-action-bar">
          <button class="screenshot-btn" onclick="captureCard('${cardUniqueId}', '${type}')">
            <span>📷</span> บันทึกภาพเฉพาะการ์ดนี้
          </button>
        </div>
      </div>

      <!-- ตารางตรวจสอบย้อนหลัง: เรียงจากวันที่ล่าสุด (บน) ไปหาเก่าสุด (ล่าง) -->
      <div class="summary-table-container">
        <div style="font-size:0.5rem;font-weight:700;color:#78590f;margin-bottom:5px">
          ตารางตรวจสอบผลย้อนหลัง (${type}) — เด่นเข้า ${res.digitHits}/${res.evalCount} งวด (${res.digitWinRate}%) | เจาะเข้า ${res.pairHits}/${res.digitHits} งวด (${res.pairWinRate}%)
        </div>
        <table class="audit-table">
          <thead>
            <tr>
              <th>งวดวันที่</th>
              <th>3 ตัวบน</th>
              <th>2 ตัวล่าง</th>
              <th>เลขเด่น</th>
              <th>ผลเลขเด่น</th>
              <th>ผลเลขเจาะ</th>
            </tr>
          </thead>
          <tbody>
    `;

    res.auditLogs.forEach(log => {
      html += `
        <tr>
          <td>${log.date}</td>
          <td><b>${log.top3}</b></td>
          <td><b>${log.bottom2}</b></td>
          <td><b style="color:#b8860b">${log.pred}</b></td>
          <td>${log.isDigitHit ? '<span class="badge-hit">เข้า</span>' : '<span class="badge-miss">หลุด</span>'}</td>
          <td>${log.isDigitHit ? (log.isPairHit ? '<span class="badge-hit">เข้า</span>' : '<span class="badge-miss">หลุด</span>') : '<span style="color:#999">-</span>'}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
