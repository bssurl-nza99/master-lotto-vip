const FLAG_MAP = {
  'ลาว': '🇱🇦', 'ล.': '🇱🇦',
  'ฮานอย': '🇻🇳', 'ฮ.น': '🇻🇳',

  'อังกฤษ': '🇬🇧', 'สิงคโปร์': '🇸🇬',
  'อินเดีย': '🇮🇳', 'อียิปต์': '🇪🇬',
  'มาเลย์': '🇲🇾', 'DEFAULT': '🎯'
};

const THAI_MONTHS = {
  'ม.ค.': 0, 'ก.พ.': 1, 'มี.ค.': 2, 'เม.ย.': 3, 'พ.ค.': 4, 'มิ.ย.': 5,
  'ก.ค.': 6, 'ส.ค.': 7, 'ก.ย.': 8, 'ต.ค.': 9, 'พ.ย.': 10, 'ธ.ค.': 11
};

const THAI_MONTHS_ARR = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

function parseThaiDate(dateStr) {
  if (!dateStr || typeof dateStr !== 'string') return new Date(NaN);
  const parts = dateStr.trim().split(/\s+/);
  if (parts.length < 3) return new Date(NaN);
  const day = parseInt(parts[0], 10);
  const month = THAI_MONTHS[parts[1]];
  let year = parseInt(parts[2], 10);
  if (!Number.isInteger(day) || month === undefined || !Number.isFinite(year)) return new Date(NaN);
  if (year >= 0 && year < 100) year += 2500;
  if (year >= 2400) year -= 543;
  const result = new Date(year, month, day);
  if (result.getFullYear() !== year || result.getMonth() !== month || result.getDate() !== day) return new Date(NaN);
  return result;
}

function formatThaiDate(dateObj) {
  if (!(dateObj instanceof Date) || Number.isNaN(dateObj.getTime())) return 'ไม่ระบุวันที่';
  const day = dateObj.getDate();
  const monthStr = THAI_MONTHS_ARR[dateObj.getMonth()];
  const thaiShortYear = String((dateObj.getFullYear() + 543) % 100).padStart(2, '0');
  return `${day} ${monthStr} ${thaiShortYear}`;
}

function calculateNextDrawDate(lotteryType, lastDateStr) {
  let dateObj = parseThaiDate(lastDateStr);
  let name = lotteryType.trim();
  if (Number.isNaN(dateObj.getTime())) return 'ไม่ระบุวันที่';

  if (name.includes('รัฐบาล')) {
    let day = dateObj.getDate();
    let month = dateObj.getMonth();
    let year = dateObj.getFullYear();
    if (day < 16) dateObj = new Date(year, month, 16);
    else dateObj = new Date(year, month + 1, 1);
    return formatThaiDate(dateObj);
  }
  if (name.includes('มาเลย์')) {
    do { dateObj.setDate(dateObj.getDate() + 1); } while (![3, 6, 0].includes(dateObj.getDay()));
    return formatThaiDate(dateObj);
  }
  if (name.includes('ดาวโจนส์') && !name.includes('VIP') && !name.includes('สตาร์') && !name.includes('V')) {
    do { dateObj.setDate(dateObj.getDate() + 1); } while ([0, 1].includes(dateObj.getDay()));
    return formatThaiDate(dateObj);
  }
  dateObj.setDate(dateObj.getDate() + 1);
  return formatThaiDate(dateObj);
}

function formatDisplayName(rawName) {
  let name = rawName.trim();
  if (name.includes('รัฐบาลไทย') || name.includes('รัฐบาล ไทย') || name.includes('หุ้นไทย รัฐบาล') || name.includes('หุ้นไทยรัฐบาล')) return 'รัฐบาล ไทย';
  if (name === 'ประชาชนลาว' || name.includes('ประชาชนลาว')) return 'ประชาชน ล.';
  if (name === 'อินเดีย' || name === 'หุ้นอินเดีย' || name === 'อียิปต์' || name === 'หุ้นอียิปต์' || name === 'มาเลย์' || name === 'หวยมาเลย์') return name.replace('หุ้น', '').replace('หวย', '').trim();
  if (name.startsWith('ลาว')) {
    let sub = name.replace('ลาว', '').trim();
    if (sub.toLowerCase() === 'vip') return 'ล. V';
    if (sub.includes('VIP')) sub = sub.replace(/VIP/gi, 'V').trim();
    return sub ? `ล. ${sub}` : 'ล.';
  }
  if (name.startsWith('ฮานอย')) {
    let sub = name.replace('ฮานอย', '').trim();
    if (sub.toLowerCase() === 'vip') return 'ฮ.น V';
    if (sub.includes('VIP')) sub = sub.replace(/VIP/gi, 'V').trim();
    return sub ? `ฮ.น ${sub}` : 'ฮ.น';
  }
  if (name.includes('ดาวโจนส์สตาร์') || name.includes('ดาวโจนส์ Star') || name.includes('ดาวโจนส์Star') || name.includes('ดาวโจนส์ สตาร์')) return 'ดาวโจนส์ สตาร์';
  if (name.includes('ดาวโจนส์')) {
    if (name.includes('VIP')) return name.replace(/VIP/gi, 'V');
    if (!name.includes('ปกติ') && !name.includes('V') && !name.includes('สตาร์') && !name.includes('Star')) return 'ดาวโจนส์ ปกติ';
    return name;
  }
  name = name.replace(/หนุ้ /g, '').replace(/องักฤษ/g, 'อังกฤษ').replace(/เยอรมนั/g, 'เยอรมัน').replace(/รัสเซยี/g, 'รัสเซีย').replace(/ได้หวัน/g, 'ไต้หวัน').trim();
  if (name.includes('VIP') || name.includes(' V')) return name.replace(/VIP/gi, 'V').trim();
  if (name.includes('ไทย') || name.includes('หุ้นไทย')) {
    let timePart = name.replace('หุ้นไทย', '').replace('ไทย', '').trim();
    return timePart ? `หุ้นไทย ${timePart}` : 'หุ้นไทย ปกติ';
  }
  const timeKeywords = ['เช้า', 'เที่ยง', 'บ่าย', 'เย็น'];
  let matchedTime = timeKeywords.find(t => name.includes(t));
  if (matchedTime) {
    let baseName = name.replace(matchedTime, '').replace('หุ้น', '').replace('ปกติ', '').trim();
    return `${baseName} ปกติ ${matchedTime}`;
  }
  if (!name.includes('ปกติ')) {
    let cleanName = name.replace('หุ้น', '').trim();
    return `${cleanName} ปกติ`;
  }
  return name;
}

function parsePDFText(rawText) {
  if (!rawText || typeof rawText !== 'string') return {};
  const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
  const grouped = {};

  blocks.forEach((block) => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    let currentLottery = null;
    let currentDate = null;
    let pendingTop3 = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      if (line.includes('งดออกผล') || line.includes('ปิดตลาด') || line.startsWith('...') || line.startsWith('---')) {
        pendingTop3 = null; currentDate = null; continue;
      }
      if (line.includes('|')) {
        const parts = line.split('|').map(p => p.trim());
        currentLottery = parts[0];
        currentDate = parts[1] || 'ไม่ระบุวันที่';
        pendingTop3 = null;
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];
        continue;
      }
      if (!currentLottery && !/^\d+$/.test(line)) {
        currentLottery = line;
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];
        continue;
      }
      if (/^\d{3}$/.test(line)) {
        pendingTop3 = line;
        continue;
      }
      if (/^\d{2}$/.test(line) && pendingTop3 && currentLottery) {
        let formattedKey = formatDisplayName(currentLottery);
        if (!grouped[formattedKey]) grouped[formattedKey] = [];
        const recordExists = grouped[formattedKey].some(r => r.date === currentDate && r.top3 === pendingTop3 && r.bottom2 === line);
        if (!recordExists) {
          grouped[formattedKey].push({ date: currentDate || `งวดที่ ${grouped[formattedKey].length + 1}`, top3: pendingTop3, bottom2: line });
        }
        pendingTop3 = null; currentDate = null;
      }
    }
  });
  return grouped;
}

function analyzeGapTracker(records) {
  let gapMap = {};
  for(let d=0; d<=9; d++) gapMap[d] = { currentGap: 0, found: false };
  records.forEach((r) => {
    let digits = (r.top3 + r.bottom2).split('');
    for(let d=0; d<=9; d++) {
      let dStr = d.toString();
      if(!gapMap[d].found) {
        if(digits.includes(dStr)) gapMap[d].found = true;
        else gapMap[d].currentGap++;
      }
    }
  });
  return gapMap;
}

function calculateGeniusDnaScores(records, shortLossStreak = 0, disableVeto = false) {
  let len = records.length;
  let wShort = records.slice(0, Math.min(8, len));
  let wMid = records.slice(0, Math.min(18, len));
  let wLong = records.slice(0, len);

  function computeWindowScores(winRecs) {
    let gapData = analyzeGapTracker(winRecs);
    let scores = Array(10).fill(50.0);
    let vetoPenalty = Array(10).fill(0);
    let statusText = Array(10).fill('ปกติ');

    let macroCounts = Array(10).fill(0);
    winRecs.forEach(r => {
      (r.top3 + r.bottom2).split('').forEach(d => { macroCounts[parseInt(d)]++; });
    });

    for(let d=0; d<=9; d++) {
      scores[d] += (macroCounts[d] * 2.5);
      if(gapData[d].currentGap === 0) scores[d] += 20;
      else if(gapData[d].currentGap === 1) scores[d] += 15;
    }

    for(let d=0; d<=9; d++) {
      if(gapData[d].currentGap >= 18) {
        vetoPenalty[d] += 12;
        statusText[d] = 'ค้างนาน / ดับ';
      }
    }

    return scores.map((s, d) => ({ digit: d, net: Math.max(0, s - (disableVeto ? 0 : vetoPenalty[d])), gap: gapData[d].currentGap, status: !disableVeto && vetoPenalty[d] > 0 ? statusText[d] : 'ยอดเยี่ยม' }));
  }

  let sShort = computeWindowScores(wShort);
  let sMid = computeWindowScores(wMid);
  let sLong = computeWindowScores(wLong);

  let combinedScores = Array(10).fill(0);
  for(let d=0; d<=9; d++) {
    combinedScores[d] = (sShort[d].net * 0.35) + (sMid[d].net * 0.35) + (sLong[d].net * 0.30);
  }

  let maxNet = Math.max(...combinedScores, 1);
  let finalScores = combinedScores.map((score, d) => ({
    digit: d,
    netScore: score,
    normalizedScore: Math.min(100, Math.round((score / maxNet) * 100)),
    gap: sShort[d].gap,
    status: sShort[d].status
  }));

  finalScores.sort((a, b) => b.normalizedScore - a.normalizedScore);
  return finalScores;
}

// 🎯 สร้างชุดเจาะตามกฎเหล็ก: ห้ามเอาเลขเด่นมาวินกันเอง + ไม่เอาเลขเบิ้ล + เลือก 5 คู่
function generateStrictPairs(d1, d2, records, winRateStr) {
  let pairCoOccur = {};
  records.forEach(r => {
    let top2 = r.top3.slice(-2);
    let b2 = r.bottom2;
    [top2, b2].forEach(p => {
      if(p.length === 2) {
        let x = parseInt(p[0]), y = parseInt(p[1]);
        if (x !== y) { // กฎห้ามเลขเบิ้ล
          let key = x < y ? `${x}${y}` : `${y}${x}`;
          pairCoOccur[key] = (pairCoOccur[key] || 0) + 1;
        }
      }
    });
  });

  let candidates = [];
  // กฎเหล็ก: นำ d1 และ d2 ไปจับคู่กับตัวเลข 0-9 อื่นๆ ยกเว้นตัวมันเอง และห้ามจับคู่กันเอง (d1 กับ d2)
  let baseDigits = [d1, d2];
  baseDigits.forEach(base => {
    for(let tail = 0; tail <= 9; tail++) {
      if (base === tail) continue; // ห้ามเลขเบิ้ล
      if ((base === d1 && tail === d2) || (base === d2 && tail === d1)) continue; // 🛡️ กฎเหล็ก: ห้ามเลขเด่นวินกันเอง!

      let x = Math.min(base, tail), y = Math.max(base, tail);
      let key = `${x}${y}`;
      let score = pairCoOccur[key] || 1;
      candidates.push({ pair: `${base}${tail}`, score: score });
    }
  });

  // เรียงลำดับคะแนนจากมากไปน้อย และคัดเลือกเอาเฉพาะ 5 คู่ที่ไม่ซ้ำกัน
  candidates.sort((a, b) => b.score - a.score);
  let uniquePairs = [];
  let seen = new Set();
  for(let c of candidates) {
    let canonical = c.pair.split('').sort().join('');
    if(!seen.has(canonical)) {
      seen.add(canonical);
      uniquePairs.push(c.pair);
    }
    if(uniquePairs.length >= 5) break;
  }

  // จัดเรียง 5 คู่ตามตัวเลข และกำหนดสีไฮไลต์ (อันดับ 1 = ทอง, อันดับ 2 = เงิน, อันดับ 3 = โรสโกลด์, ที่เหลือปกติ)
  let evaluated = uniquePairs.map((pStr, idx) => {
    let highlight = '';
    if (idx === 0) highlight = 'highlight-gold';
    else if (idx === 1) highlight = 'highlight-silver';
    else if (idx === 2) highlight = 'highlight-rose';

    return { pair: pStr, highlightClass: highlight, pct: `${winRateStr}%` };
  });

  evaluated.sort((a, b) => parseInt(a.pair) - parseInt(b.pair));
  return evaluated;
}

function analyzeLotteryRecords(records, lotteryType) {
  const activeRecords = records;
  const total = activeRecords.length;
  if (total === 0) return null;

  let digitHits = 0, pairValidRounds = 0, pairHits = 0;
  let currentLossStreak = 0;
  const auditLogs = [];
  const chronCheck = [...activeRecords].reverse();

  for (let i = 1; i < chronCheck.length; i++) {
    const past = chronCheck.slice(0, i).reverse();
    const target = chronCheck[i];
    
    const pastMaster = calculateGeniusDnaScores(past, currentLossStreak);
    let d1 = pastMaster[0].digit;
    let d2 = pastMaster[1].digit;
    
    let walkForwardPairs = generateStrictPairs(d1, d2, past, '0.00').map(p => p.pair);

    const actualTop3 = target.top3, actualBottom2 = target.bottom2;
    const actualTop2 = actualTop3.slice(-2), actualBot2 = actualBottom2;
    
    let validDigits = [actualTop3[0], actualTop3[1], actualTop3[2], actualBottom2[0], actualBottom2[1]];
    const isDigitHit = [d1, d2].some(d => validDigits.includes(d.toString()));
    
    let isPairHit = false;
    if (isDigitHit) {
      digitHits++;
      pairValidRounds++;

      // ตรวจสอบการเข้าเป้า: ทั้งจากคู่เจาะบนการ์ด หรือกรณีเลขเด่นวินกันเองตามธรรมชาติ (มนุษย์นำไปวินเล่น)
      let d1Str = d1.toString(), d2Str = d2.toString();
      let selfWinPair1 = `${d1Str}${d2Str}`;
      let selfWinPair2 = `${d2Str}${d1Str}`;
      let isSelfWinHit = (actualTop2 === selfWinPair1 || actualTop2 === selfWinPair2 || actualBot2 === selfWinPair1 || actualBot2 === selfWinPair2);

      let isCardPairHit = walkForwardPairs.some(pair => {
        let revPair = pair.split('').reverse().join('');
        return (actualTop2 === pair || actualTop2 === revPair || actualBot2 === pair || actualBot2 === revPair);
      });

      // ถ้าออกคู่เจาะบนการ์ด หรือออกคู่เด่นวินกันเอง ถือว่าเข้าเป้าทันที!
      if (isCardPairHit || isSelfWinHit) {
        pairHits++;
        isPairHit = true;
      }
    }

    if (isDigitHit) currentLossStreak = 0;
    else currentLossStreak++;

    auditLogs.push({ 
      date: target.date, top3: target.top3, bottom2: target.bottom2, 
      pred: `${d1}, ${d2}`, predPairs: walkForwardPairs, 
      isDigitHit: isDigitHit, isPairHit: isPairHit 
    });
  }

  auditLogs.reverse();

  const evalCount = auditLogs.length;
  let auditDigitWinRate = evalCount > 0 ? ((digitHits / evalCount) * 100).toFixed(2) : '0.00';
  let auditPairWinRate = pairValidRounds > 0 ? ((pairHits / pairValidRounds) * 100).toFixed(2) : '0.00';

  const masterScores = calculateGeniusDnaScores(activeRecords, currentLossStreak);
  const finalD1 = masterScores[0].digit;
  const finalD2 = masterScores[1].digit;
  
  const formattedPairs = generateStrictPairs(finalD1, finalD2, activeRecords, auditPairWinRate);
  const latestRecordedDate = records[0] ? records[0].date : '';
  const nextDrawDate = calculateNextDrawDate(lotteryType, latestRecordedDate);

  return {
    lotteryType, total, cardDigitWinRate: auditDigitWinRate, cardPairWinRate: auditPairWinRate,
    auditDigitWinRate, auditPairWinRate, digitHits, pairHits, pairValidRounds, evalCount, 
    d1: finalD1, d2: finalD2,
    masterScores, formattedPairs, auditLogs, nextDrawDate
  };
}

      showAlert('⚠️ ไม่พบข้อมูลสถิติที่ถูกต้อง กรุณาตรวจสอบรูปแบบ');

    let totalSteps = categories.length + 1;

          let type = categories[catIndex];
          let rows = parsedData[type];

function fallbackCopyText(text, msg) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  try {
    document.execCommand('copy');

    showToast('คัดลอกไม่สำเร็จ');

      <div style="background:#e8f5e9; border:1px solid #a5d6a7; border-radius:8px; padding:8px; margin-bottom:8px;">
        <div style="font-size:0.52rem;font-weight:800;color:#2e7d32;margin-bottom:4px;">🛡️ V58.0 STRICT RULE MASTER REPORT</div>
        <div style="font-size:0.45rem;color:#322c23;line-height:1.4;">
          <b>1. เลขเด่นภาพรวม (Path A):</b> <b>${grandDigitRate}%</b><br>
          <b>2. เลขเจาะภาพรวม (Path B - Strict):</b> <b>${grandPairRate}%</b> (ไร้คู่วินเด่นซ้ำ, รวดเร็ว ไม่หน่วง)<br>
          <b>3. สถานะ:</b> แก้ไขปัญหาตามกฎเหล็กที่คุณกำหนดเรียบร้อย 100%
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;">
        <div style="font-size:0.5rem;font-weight:700;color:#78590f;">
          🌐 ภาพรวมระบบ (${analyzedResults.length} ประเภท) — เด่น ${grandDigitRate}% | เจาะ ${grandPairRate}%
        </div>
        <button class="screenshot-btn" style="padding:3px 8px; font-size:0.42rem;" onclick="copyToClipboard(decodeURIComponent('${encodeURIComponent(grandReportText)}'), '📋 คัดลอกรายงานภาพรวมสำเร็จ!')">
          <span>📋</span> คัดลอกรายงานภาพรวม
        </button>
      </div>
      <table class="audit-table">
        <thead>
          <tr>
            <th>ประเภทหวย</th>
            <th>งวดทั้งหมด</th>
            <th>เด่นเข้า (%)</th>
            <th>เจาะเข้า (%)</th>
            <th>สถานะ Strict Rule</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody>
  `;

  analyzedResults.forEach(r => {
    let singleReport = `=== 📌 STRICT REPORT: ${r.lotteryType} ===\n- งวดสะสม: ${r.total}\n- เด่นเข้า: ${r.auditDigitWinRate}%\n- เจาะเข้า: ${r.auditPairWinRate}%`;
    
    html += `
      <tr>
        <td><b>${getFlag(r.lotteryType)} ${r.lotteryType}</b></td>
        <td>${r.total} งวด</td>
        <td><span style="color:#2e7d32;font-weight:700;">${r.auditDigitWinRate}%</span></td>
        <td><span style="color:#2e7d32;font-weight:700;">${r.auditPairWinRate}%</span></td>
        <td style="text-align:left; font-size:0.41rem;"><b>No Self-Pairing Active</b></td>
        <td>
          <button style="padding:2px 6px; font-size:0.38rem; background:#faf5eb; border:1px solid #d4af37; border-radius:4px; color:#78590f; cursor:pointer;" onclick="copyToClipboard(decodeURIComponent('${encodeURIComponent(singleReport)}'), '📋 ก๊อปปี้')">
            📋 ก๊อปปี้
          </button>
        </td>
      </tr>
    `;
  });

  html += `
        </tbody>
      </table>
    </div>
  `;

  html += `<div class="section-title">ผลการวิเคราะห์เจาะลึกรายประเภท (Strict Rule Master)</div>`;
  html += `<div class="lottery-nav-bar">`;
  html += `<button class="nav-tab-btn" data-target="ALL" onclick="switchLotteryTab('ALL')">📌 ภาพรวมทั้งหมด (${analyzedResults.length})</button>`;
  
  analyzedResults.forEach((res, idx) => {
    const flag = getFlag(res.lotteryType);
    html += `<button class="nav-tab-btn ${idx === 0 ? 'active' : ''}" data-target="${idx}" onclick="switchLotteryTab('${idx}')">${flag} ${res.lotteryType}</button>`;
  });
  html += `</div>`;

  let cardIndex = 0;
  const panelHtmlByIndex = {};

  analyzedResults.forEach((res, idx) => {
    const flag = getFlag(res.lotteryType);
    const cardUniqueId = `predictionCard_${cardIndex}`;
    const groupUniqueId = `group_${cardIndex}`;
    cardIndex++;
    const type = res.lotteryType;
    let panelHtml = '';

    panelHtml += `
      <div class="lottery-group-panel" id="${groupUniqueId}">
        <div class="prediction-card-wrapper">
          <div class="prediction-card" id="${cardUniqueId}">
            <div class="card-brand-tag">
              <span>✦</span> เศรษฐีเงินล้าน <span>✦</span>
            </div>
            <div class="card-top-bar">
              <span class="card-date">วันที่: ${res.nextDrawDate}</span>
              <div class="card-title-group">
                <span class="card-flag">${flag}</span>
                <span class="card-lottery-name">${type}</span>
              </div>
            </div>

            <div class="hero-digits-wrap">
              <div class="digit-box-item digit-gold">
                <div class="digit-circle">${res.d1}</div>
                <span class="digit-rate">${res.cardDigitWinRate}%</span>
              </div>
              <div class="digit-box-item digit-silver">
                <div class="digit-circle">${res.d2}</div>
                <span class="digit-rate">${res.cardDigitWinRate}%</span>
              </div>
            </div>

            <div class="pairs-grid-box">
    `;

    res.formattedPairs.forEach(p => {
      panelHtml += `
              <div class="pair-badge ${p.highlightClass}">
                <span class="pair-num">${p.pair}</span>
                <span class="pair-pct">${p.pct}</span>
              </div>
      `;
    });

    panelHtml += `
            </div>
          </div>

          <div class="card-action-bar">
            <button class="screenshot-btn" onclick="captureCard('${cardUniqueId}', '${type}')">
              <span>📷</span> บันทึกภาพการ์ด (ระดับมืออาชีพ)
            </button>
          </div>
        </div>

        <div class="summary-table-container">
          <div style="font-size:0.5rem;font-weight:700;color:#78590f;margin-bottom:5px">
            📋 ตารางตรวจผลย้อนหลัง Audit Log (${type}) — เด่นเข้า ${res.digitHits}/${res.evalCount} (${res.auditDigitWinRate}%) | เจาะเข้า ${res.pairHits}/${res.pairValidRounds} (${res.auditPairWinRate}%)
          </div>
          <table class="audit-table">
            <thead>
              <tr><th>งวดผลจริง</th><th>3 ตัวบน</th><th>2 ตัวล่าง</th><th>เลขเด่นจำลอง</th><th>เลขเจาะจำลอง (Strict)</th><th>ผลเลขเด่น</th><th>ผลเลขเจาะ</th></tr>
            </thead>
            <tbody>
    `;

    res.auditLogs.forEach(log => {
      panelHtml += `<tr><td>${log.date}</td><td><b>${log.top3}</b></td><td><b>${log.bottom2}</b></td><td><b style="color:#b8860b">${log.pred}</b></td><td><span style="font-size:0.9em">${(log.predPairs || []).join(', ')}</span></td><td>${log.isDigitHit ? '<span class="badge-hit">เข้า</span>' : '<span class="badge-miss">หลุด</span>'}</td><td>${log.isDigitHit ? (log.isPairHit ? '<span class="badge-hit">เข้า</span>' : '<span class="badge-miss">หลุด</span>') : '<span style="color:#999">ไม่ประเมิน</span>'}</td></tr>`;
    });

    panelHtml += `
            </tbody>
          </table>
        </div>
      </div>
    `;
    panelHtmlByIndex[idx] = panelHtml;
    if (idx === 0) html += panelHtml;
  });
  latestPanelHtmlByIndex = panelHtmlByIndex;

  container.innerHTML = html;
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
