<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Index Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-xl font-bold text-cyan-400 mb-1 text-center">QUANTUM INDEX SYSTEM</h1>
        <p class="text-xs text-slate-400 text-center mb-6">ระบบคำนวณและวิเคราะห์ดัชนีความน่าจะเป็น</p>

        <!-- Input Section -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-semibold text-cyan-300 mb-1 uppercase tracking-wider">1. ใส่เลขเด่น (หลัก)</label>
                <input type="text" id="mainIndex" placeholder="เช่น 59" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-cyan-300 mb-1 uppercase tracking-wider">2. ใส่เลขเจาะ 5 คู่</label>
                <input type="text" id="targetPairs" placeholder="เช่น 51, 58, 92, 94, 05" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="runAnalysis()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-cyan-500/20 uppercase tracking-wider text-sm">
                รันระบบประมวลผลดัชนี
            </button>
        </div>

        <!-- Output Result Section -->
        <div id="resultBox" class="hidden space-y-4 pt-4 border-t border-slate-800">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>สถานะ: <span class="text-emerald-400 font-bold">ประมวลผลสำเร็จ</span></span>
                    <span id="timestamp">--:--:--</span>
                </div>
                <div class="text-sm font-semibold text-slate-200">ผลการวิเคราะห์ดัชนีเชิงสถิติ:</div>
                <div id="displayMain" class="text-xl font-bold text-cyan-400 tracking-wider">--</div>
                <div class="text-xs text-slate-400">คู่เทียบวิเคราะห์ความเสี่ยง (5 คู่):</div>
                <div id="displayPairs" class="text-sm font-mono text-emerald-300 bg-slate-900 p-2 rounded border border-slate-800">--</div>
            </div>

            <button onclick="copyResult()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 font-semibold py-2.5 rounded-xl text-xs transition-all">
                📋 คัดลอกรายงานเพื่อนำไปโพสต์
            </button>
        </div>
    </div>

    <script>
        function runAnalysis() {
            const main = document.getElementById('mainIndex').value.trim();
            const pairs = document.getElementById('targetPairs').value.trim();

            if(!main || !pairs) {
                alert('กรุณากรอกข้อมูลให้ครบทั้ง 2 ช่องครับ');
                return;
            }

            document.getElementById('displayMain').innerText = 'เลขเด่นดัชนี: ' + main;
            document.getElementById('displayPairs').innerText = pairs;
            
            const now = new Date();
            document.getElementById('timestamp').innerText = now.toLocaleTimeString();

            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyResult() {
            const main = document.getElementById('displayMain').innerText;
            const pairs = document.getElementById('displayPairs').innerText;
            const textToCopy = `[รายงานดัชนีวิเคราะห์เชิงสถิติ]\n${main}\nคู่เทียบ: ${pairs}\n#QuantumIndex #DataAnalysis`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('คัดลอกรายงานเรียบร้อยแล้วครับ!');
            });
        }
    </script>
</body>
</html>
